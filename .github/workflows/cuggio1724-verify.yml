name: Verify Cuggiò Bullarium 1724 search and publication
on:
  push:
    branches: [agent/cuggio1724-verify-20261127]
    paths: [.cuggio1724-live-plan.json]
permissions:
  contents: read
jobs:
  search-maps:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run build && npm test
      - run: python3 .cuggio1724-verify.py maps && npm run verify:remote-search
      - uses: actions/upload-artifact@v4
        with:
          name: cuggio1724-map-verification
          path: cuggio1724-verification.json
  live-publication:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: python3 .cuggio1724-verify.py live
      - uses: actions/upload-artifact@v4
        with:
          name: cuggio1724-live-readback
          path: cuggio1724-verification.json
