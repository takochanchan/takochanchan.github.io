name: Publish Durán complete Japanese translation

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/publish-duran-20260822.yml"

permissions:
  contents: write

concurrency:
  group: publish-duran-20260822
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: publications-current
      STAGING_BRANCH: agent/duran-public-assets-20260822-v1
      READY_BRANCH: agent/duran-publication-ready-20260822-v1
      STATUS_STARTED: agent/status-duran-20260822-v1-started
      STATUS_PAYLOAD: agent/status-duran-20260822-v1-payload
      STATUS_APPLIED: agent/status-duran-20260822-v1-applied
      STATUS_TESTS: agent/status-duran-20260822-v1-tests
      STATUS_RELEASE: agent/status-duran-20260822-v1-release
      STATUS_SEARCH: agent/status-duran-20260822-v1-search
      PAYLOAD_SHA256: dc3fc4ee4f3f4b4ce123f042fe67233bcd36565d3846ebc61101ad07f112ebaa
      PAYLOAD_SIZE: "82471925"
      PAYLOAD_PARTS: "315"
    steps:
      - name: Check out the publication trigger commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Signal workflow start
        run: git push --force origin "$GITHUB_SHA:refs/heads/$STATUS_STARTED"

      - name: Check out the checksum-locked payload
        uses: actions/checkout@v4
        with:
          ref: ${{ env.STAGING_BRANCH }}
          path: staging
          sparse-checkout: release-staging/duran-20260822
          sparse-checkout-cone-mode: false

      - name: Reconstruct and verify the publication payload
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          source = Path("staging/release-staging/duran-20260822")
          parts = sorted(source.glob("chunk-*"))
          expected_count = int(os.environ["PAYLOAD_PARTS"])
          expected_names = [f"chunk-{index:04d}" for index in range(expected_count)]
          if [part.name for part in parts] != expected_names:
              raise SystemExit("payload part set is incomplete or unexpected")
          output = Path(os.environ["RUNNER_TEMP"]) / "duran-public-release.tar.gz"
          digest = hashlib.sha256()
          size = 0
          with output.open("wb") as destination:
              for part in parts:
                  block = part.read_bytes()
                  destination.write(block)
                  digest.update(block)
                  size += len(block)
          if size != int(os.environ["PAYLOAD_SIZE"]):
              raise SystemExit(f"payload size {size} != {os.environ['PAYLOAD_SIZE']}")
          if digest.hexdigest() != os.environ["PAYLOAD_SHA256"]:
              raise SystemExit("payload SHA-256 mismatch")
          print(f"payload OK: {size} bytes {digest.hexdigest()}")
          PY
          mkdir -p "$RUNNER_TEMP/publication-payload"
          tar -xzf "$RUNNER_TEMP/duran-public-release.tar.gz" \
            -C "$RUNNER_TEMP/publication-payload"

      - name: Validate the exact PDF, EPUB, cover, and figure files
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v pdfinfo >/dev/null || ! command -v pdftotext >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y poppler-utils
          fi
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import zipfile
          from pathlib import Path
          from xml.etree import ElementTree as ET

          root = Path(os.environ["RUNNER_TEMP"]) / "publication-payload/public_release_payload"
          report = json.loads((root / "publication_report.json").read_text(encoding="utf-8"))
          expected_report = {
              "slug": "duran-historia-indias-nueva-espana-1581",
              "source_site_commit": "3f83125369e4c3d4efc4d715d754f33c95ff82b2",
              "archive_commit": "67f3f932348c90a17e358f41a96446a2b4bb70a5",
              "canonical_master": "publications/duran-historia-indias-nueva-espana-1581/master.docx",
          }
          for key, value in expected_report.items():
              if report.get(key) != value:
                  raise SystemExit(f"publication report mismatch: {key}")
          expected_assets = {
              "pdf": (35410793, "8eb122dd176dbd751a405c7f7aa4c7efd2eeda1c5826b50dcf076b8943986a1e"),
              "epub": (48536431, "a87a2085037906faf6206dbe9a481029d90c3a2c7df1ea0ff3a7b0ab6967580a"),
              "cover": (74797, "d8a9a593be6669fac4aa6828c9f3d470641dd056b1695989d8a473d2e4ac4e61"),
          }
          slug = report["slug"]
          paths = {}
          for kind, (expected_size, expected_sha) in expected_assets.items():
              filename = "cover.jpg" if kind == "cover" else report[kind]["filename"]
              path = root / "public" / slug / filename
              data = path.read_bytes()
              if len(data) != expected_size:
                  raise SystemExit(f"{kind}: size mismatch")
              if hashlib.sha256(data).hexdigest() != expected_sha:
                  raise SystemExit(f"{kind}: SHA-256 mismatch")
              if report[kind]["size"] != expected_size or report[kind]["sha256"] != expected_sha:
                  raise SystemExit(f"{kind}: report mismatch")
              paths[kind] = path

          with zipfile.ZipFile(paths["epub"]) as archive:
              if archive.testzip() is not None:
                  raise SystemExit("corrupt EPUB")
              members = archive.namelist()
              if not members or members[0] != "mimetype":
                  raise SystemExit("EPUB mimetype is not first")
              if archive.getinfo("mimetype").compress_type != zipfile.ZIP_STORED:
                  raise SystemExit("EPUB mimetype is compressed")
              if archive.read("mimetype") != b"application/epub+zip":
                  raise SystemExit("invalid EPUB mimetype")

              container = ET.fromstring(archive.read("META-INF/container.xml"))
              rootfile = next(node for node in container.iter() if node.tag.endswith("}rootfile"))
              package = ET.fromstring(archive.read(rootfile.attrib["full-path"]))
              if not package.attrib.get("version", "").startswith("3"):
                  raise SystemExit("EPUB package is not version 3")

              documents = [
                  ET.fromstring(archive.read(name))
                  for name in members
                  if name.endswith(".xhtml")
              ]
              images = []
              markers = []
              captions = []
              all_text = []
              for document in documents:
                  all_text.append("".join(document.itertext()))
                  for node in document.iter():
                      if node.tag.endswith("}img"):
                          images.append(node)
                      if not node.tag.endswith("}p"):
                          continue
                      text = "".join(node.itertext()).strip()
                      if text.startswith("〔自筆稿 f.") and text.endswith("〕"):
                          markers.append(text)
                      if text.startswith("図版（自筆稿 f.") and "スペイン国立図書館（BNE）Vitr/26/11 所蔵" in text:
                          captions.append(text)
              text = "\n".join(all_text)
              if len(markers) != 661:
                  raise SystemExit(f"EPUB source marker mismatch: {len(markers)}")
              if len(images) != 117 or len(captions) != 117:
                  raise SystemExit(
                      f"EPUB figure mismatch: images={len(images)}, captions={len(captions)}"
                  )
              if any(not image.attrib.get("alt", "").strip() for image in images):
                  raise SystemExit("EPUB image without alternative text")
              required = ["底本", "スペイン国立図書館", "CC BY 4.0", "人の皮剥ぎ"]
              if any(value not in text for value in required):
                  raise SystemExit("EPUB front matter or target wording is missing")
              banned = ["剝", "校正刷り", "公開前"]
              if any(value in text for value in banned):
                  raise SystemExit("EPUB contains a banned proof-era string or old glyph")

              media_hashes = {
                  hashlib.sha256(archive.read(name)).hexdigest()
                  for name in members
                  if name.lower().endswith((".jpg", ".jpeg", ".png"))
              }
              expected_figures = {
                  "73cc46a19dbf0906578f3c2d8782ac885bf83850d66f197e60509f285caa5d7c",
                  "0b2b913afdc61c680be281d2f5a17c072aa093bef48a206000194bcbd80d0c89",
              }
              if not expected_figures.issubset(media_hashes):
                  raise SystemExit("f.41v or f.126v exact figure bytes are missing")
          print("payload assets, EPUB structure, and exact figures OK")
          PY
          payload="$RUNNER_TEMP/publication-payload/public_release_payload/public/duran-historia-indias-nueva-espana-1581"
          pdf="$payload/Diego_Duran_Historia_de_las_Indias_Japanese_Complete_Translation.pdf"
          test "$(pdfinfo "$pdf" | awk '/^Pages:/ {print $2}')" = "913"
          pdftotext "$pdf" "$RUNNER_TEMP/duran.txt"
          python3 - <<'PY'
          import os
          from pathlib import Path

          text = (Path(os.environ["RUNNER_TEMP"]) / "duran.txt").read_text(encoding="utf-8")
          for value in ("底本", "スペイン国立図書館", "CC BY 4.0", "人の皮剥ぎ"):
              if value not in text:
                  raise SystemExit(f"PDF required wording missing: {value}")
          if text.count("人の皮剥ぎ") != 8:
              raise SystemExit(f"PDF 人の皮剥ぎ count mismatch: {text.count('人の皮剥ぎ')}")
          for value in ("剝", "校正刷り", "公開前"):
              if value in text:
                  raise SystemExit(f"PDF banned string present: {value}")
          print("PDF front matter and target wording OK")
          PY

      - name: Signal payload validation
        run: git push --force origin "$GITHUB_SHA:refs/heads/$STATUS_PAYLOAD"

      - name: Apply the source changes in a disposable checkout
        shell: bash
        run: |
          set -euo pipefail
          python3 \
            "$RUNNER_TEMP/publication-payload/public_release_payload/apply_public_release.py" \
            "$GITHUB_WORKSPACE" \
            "$RUNNER_TEMP/publication-payload/public_release_payload"
          node scripts/verify-master-archive.mjs
          node --check src/publications.mjs
          python3 -m py_compile scripts/validate-epubs.py
          git diff --check

      - name: Signal source application
        run: git push --force origin "$GITHUB_SHA:refs/heads/$STATUS_APPLIED"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install build dependencies
        run: npm ci

      - name: Build and test before release mutation
        run: |
          npm run build
          npm test

      - name: Signal source tests
        run: git push --force origin "$GITHUB_SHA:refs/heads/$STATUS_TESTS"

      - name: Upload the checksum-locked release assets
        shell: bash
        run: |
          set -euo pipefail
          checksum_dir="$RUNNER_TEMP/release-checksums"
          payload="$RUNNER_TEMP/publication-payload/public_release_payload/public/duran-historia-indias-nueva-espana-1581"
          mkdir -p "$checksum_dir"
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern SHA256SUMS.txt \
            --dir "$checksum_dir"
          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path(os.environ["RUNNER_TEMP"]) / "release-checksums/SHA256SUMS.txt"
          additions = {
              "Diego_Duran_Historia_de_las_Indias_Japanese_Complete_Translation.epub": "a87a2085037906faf6206dbe9a481029d90c3a2c7df1ea0ff3a7b0ab6967580a",
              "Diego_Duran_Historia_de_las_Indias_Japanese_Complete_Translation.pdf": "8eb122dd176dbd751a405c7f7aa4c7efd2eeda1c5826b50dcf076b8943986a1e",
          }
          kept = []
          for line in path.read_text(encoding="utf-8").splitlines():
              fields = line.split()
              if fields and fields[-1] in additions:
                  continue
              kept.append(line)
          kept.extend(f"{digest}  {filename}" for filename, digest in sorted(additions.items()))
          path.write_text("\n".join(kept) + "\n", encoding="utf-8")
          PY
          gh release upload "$RELEASE_TAG" \
            "$payload/Diego_Duran_Historia_de_las_Indias_Japanese_Complete_Translation.pdf" \
            "$payload/Diego_Duran_Historia_de_las_Indias_Japanese_Complete_Translation.epub" \
            "$checksum_dir/SHA256SUMS.txt" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Download the public release assets back and verify them
        shell: bash
        run: |
          set -euo pipefail
          verify_dir="$RUNNER_TEMP/release-verify"
          mkdir -p "$verify_dir"
          for filename in \
            Diego_Duran_Historia_de_las_Indias_Japanese_Complete_Translation.pdf \
            Diego_Duran_Historia_de_las_Indias_Japanese_Complete_Translation.epub \
            SHA256SUMS.txt
          do
            gh release download "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern "$filename" \
              --dir "$verify_dir"
          done
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "release-verify"
          expected = {
              "Diego_Duran_Historia_de_las_Indias_Japanese_Complete_Translation.epub": (48536431, "a87a2085037906faf6206dbe9a481029d90c3a2c7df1ea0ff3a7b0ab6967580a"),
              "Diego_Duran_Historia_de_las_Indias_Japanese_Complete_Translation.pdf": (35410793, "8eb122dd176dbd751a405c7f7aa4c7efd2eeda1c5826b50dcf076b8943986a1e"),
          }
          checksum_lines = set((root / "SHA256SUMS.txt").read_text(encoding="utf-8").splitlines())
          for filename, (size, digest) in expected.items():
              data = (root / filename).read_bytes()
              if len(data) != size or hashlib.sha256(data).hexdigest() != digest:
                  raise SystemExit(f"downloaded release asset mismatch: {filename}")
              if f"{digest}  {filename}" not in checksum_lines:
                  raise SystemExit(f"SHA256SUMS entry mismatch: {filename}")
              print(f"release asset OK: {filename}")
          PY

      - name: Signal release verification
        run: git push --force origin "$GITHUB_SHA:refs/heads/$STATUS_RELEASE"

      - name: Restore the exact final full-text search index
        id: search-index-cache
        uses: actions/cache/restore@v4
        with:
          path: dist/search
          key: fulltext-index-${{ hashFiles('assets-manifest.json', 'master-archive.json', 'src/publications.mjs', 'scripts/search/build-index.mjs', 'scripts/search/create-manifest.mjs', 'scripts/search/extract-corpus.py', 'package-lock.json') }}

      - name: Restore final PDF and EPUB inputs
        if: steps.search-index-cache.outputs.cache-hit != 'true'
        id: search-assets-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .cache/fulltext-assets
            .cache/fulltext-ocr
          key: publish-duran-assets-${{ hashFiles('assets-manifest.json') }}
          restore-keys: |
            fulltext-assets-

      - name: Ensure full-text extraction tools are available
        if: steps.search-index-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v pdftotext >/dev/null || ! command -v tesseract >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y poppler-utils tesseract-ocr
          fi

      - name: Fetch checksum-verified search inputs
        if: steps.search-index-cache.outputs.cache-hit != 'true'
        run: npm run fetch:search-assets

      - name: Save the exact final PDF and EPUB search inputs
        if: steps.search-index-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .cache/fulltext-assets
            .cache/fulltext-ocr
          key: fulltext-assets-${{ hashFiles('assets-manifest.json') }}

      - name: Build the exact final full-text search index
        if: steps.search-index-cache.outputs.cache-hit != 'true'
        run: npm run build:search

      - name: Save the exact final full-text search index
        if: steps.search-index-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: dist/search
          key: fulltext-index-${{ hashFiles('assets-manifest.json', 'master-archive.json', 'src/publications.mjs', 'scripts/search/build-index.mjs', 'scripts/search/create-manifest.mjs', 'scripts/search/extract-corpus.py', 'package-lock.json') }}

      - name: Verify the exact final full-text search index
        run: |
          npm run verify:search
          npm test

      - name: Signal search verification
        run: git push --force origin "$GITHUB_SHA:refs/heads/$STATUS_SEARCH"

      - name: Commit the verified site only to the ready branch
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/publish-duran-20260822.yml
          rm -f "$workflow"
          git diff --check
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git switch -c "$READY_BRANCH"
          git add \
            "$workflow" \
            REVISION_LOG.md \
            assets-manifest.json \
            master-archive.json \
            scripts/search/verify-queries.mjs \
            scripts/validate-epubs.py \
            src/publications.mjs \
            static/publications/duran-historia-indias-nueva-espana-1581/cover.jpg \
            tests/archive.test.mjs
          python3 - <<'PY'
          import subprocess

          expected = sorted([
              ".github/workflows/publish-duran-20260822.yml",
              "REVISION_LOG.md",
              "assets-manifest.json",
              "master-archive.json",
              "scripts/search/verify-queries.mjs",
              "scripts/validate-epubs.py",
              "src/publications.mjs",
              "static/publications/duran-historia-indias-nueva-espana-1581/cover.jpg",
              "tests/archive.test.mjs",
          ])
          actual = sorted(
              subprocess.check_output(
                  ["git", "diff", "--cached", "--name-only"],
                  text=True,
              ).splitlines()
          )
          if actual != expected:
              raise SystemExit(f"unexpected staged paths: {actual}")
          print("verified staged paths:", ", ".join(actual))
          PY
          git commit -m "Publish Durán complete Japanese translation"
          git push origin "HEAD:refs/heads/$READY_BRANCH"
          echo "READY_COMMIT=$(git rev-parse HEAD)"
          git push origin --delete "$STAGING_BRANCH" || true
          for branch in \
            "$STATUS_STARTED" \
            "$STATUS_PAYLOAD" \
            "$STATUS_APPLIED" \
            "$STATUS_TESTS" \
            "$STATUS_RELEASE" \
            "$STATUS_SEARCH"
          do
            git push origin --delete "$branch" || true
          done
