name: Publish Berendt batch 04 release assets

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/publish-berendt-batch-04-assets-20260815-v1.yml"

permissions:
  contents: write

concurrency:
  group: public-release-assets
  cancel-in-progress: false

jobs:
  publish-assets:
    runs-on: ubuntu-latest
    env:
      STAGING_BRANCH: agent/berendt-batch-04-public-assets-20260815-v1
      STAGING_ROOT: .release-staging/berendt-batch-04-public-20260815-v1
      WORKFLOW_PATH: .github/workflows/publish-berendt-batch-04-assets-20260815-v1.yml
      RELEASE_TAG: publications-current
    steps:
      - name: Check out checksum-pinned public assets
        uses: actions/checkout@v4
        with:
          ref: agent/berendt-batch-04-public-assets-20260815-v1

      - name: Restore checksum-pinned public bundle
        shell: bash
        run: |
          set -euo pipefail
          cat "$STAGING_ROOT"/bundle.tar.gz.part-* > /tmp/berendt-batch-04-public.tar.gz
          printf '%s  %s\n' \
            'a1d0c0beda0fad083bdc39efe646dd68ebad7d8ab8603bcbc335a90f811f4f41' \
            '/tmp/berendt-batch-04-public.tar.gz' | sha256sum -c -
          tar -xzf /tmp/berendt-batch-04-public.tar.gz -C "$STAGING_ROOT"

      - name: Ensure PDF inspection tools are available
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v pdfinfo >/dev/null 2>&1 || ! command -v pdftotext >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y poppler-utils
          fi

      - name: Validate all six public files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import pathlib
          import re
          import subprocess
          import zipfile
          from xml.etree import ElementTree as ET

          root = pathlib.Path('.release-staging/berendt-batch-04-public-20260815-v1')
          payload = json.loads((root / 'manifest.json').read_text(encoding='utf-8'))
          expected_slugs = {
              'berendt-ethnologie-nicaragua-1875',
              'berendt-ancient-central-american-civilization-1876',
              'berendt-historical-documents-guatemala-1877',
          }
          banned = ('確認用校正刷', '日本語翻訳版には再利用ライセンス', '日本語版ライセンス')
          assert len(payload) == 3
          assert {entry['slug'] for entry in payload} == expected_slugs
          expected_files = {'manifest.json'}
          for entry in payload:
              slug = entry['slug']
              for kind in ('pdf', 'epub'):
                  asset = entry[kind]
                  path = root / asset['filename']
                  expected_files.add(path.name)
                  data = path.read_bytes()
                  assert len(data) == asset['size'], (slug, kind)
                  assert hashlib.sha256(data).hexdigest() == asset['sha256'], (slug, kind)
              pdf = root / entry['pdf']['filename']
              info = subprocess.check_output(['pdfinfo', str(pdf)], text=True)
              pages = re.search(r'^Pages:\s+(\d+)$', info, re.MULTILINE)
              assert pages and int(pages.group(1)) == entry['page_count']
              text = subprocess.check_output(['pdftotext', str(pdf), '-'], text=True)
              assert entry['title'] in text
              assert len(re.findall(r'〔原刊 p\. [0-9]+〕', text)) == entry['marker_count']
              for phrase in entry['provider_phrases']:
                  assert phrase in text, (slug, phrase)
              for phrase in banned:
                  assert phrase not in text and phrase not in info, (slug, phrase)

              epub = root / entry['epub']['filename']
              with zipfile.ZipFile(epub) as archive:
                  assert archive.testzip() is None
                  first = archive.infolist()[0]
                  assert first.filename == 'mimetype' and first.compress_type == 0
                  assert archive.read('mimetype') == b'application/epub+zip'
                  opf = ET.fromstring(archive.read('EPUB/package.opf'))
                  ns = {'opf': 'http://www.idpf.org/2007/opf'}
                  assert len([item for item in opf.findall('.//opf:item', ns) if 'cover-image' in item.attrib.get('properties', '').split()]) == 1
                  roots = [ET.fromstring(archive.read(name)) for name in archive.namelist() if name.endswith(('.xhtml', '.html'))]
                  epub_text = ' '.join(' '.join(root.itertext()) for root in roots)
                  titles = [' '.join(''.join(element.itertext()).split()) for root_node in roots for element in root_node.iter() if element.attrib.get('data-custom-style') == 'SectionHeading']
                  markers = [' '.join(''.join(element.itertext()).split()) for root_node in roots for element in root_node.iter() if element.attrib.get('data-custom-style') == 'OriginalPage']
                  assert titles == [entry['title']], (slug, titles)
                  assert len(markers) == entry['marker_count']
                  assert len(re.findall(r'[ぁ-んァ-ヶ一-龠々〆ヵヶ]', epub_text)) >= 1000
                  for phrase in banned:
                      assert phrase not in epub_text, (slug, phrase)
          actual = {path.name for path in root.iterdir() if path.is_file() and path.name != 'bundle.tar.gz'}
          assert actual == expected_files, (actual, expected_files)
          PY

      - name: Upload new files without replacing unrelated release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          python - <<'PY' > /tmp/public-asset-names.txt
          import json
          payload = json.load(open('.release-staging/berendt-batch-04-public-20260815-v1/manifest.json'))
          for entry in payload:
              print(entry['pdf']['filename'])
              print(entry['epub']['filename'])
          PY
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[].name' > /tmp/current-assets.txt
          while IFS= read -r name; do
            if grep -Fqx "$name" /tmp/current-assets.txt; then
              mkdir -p /tmp/existing
              gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
                --pattern "$name" --dir /tmp/existing
              cmp "$STAGING_ROOT/$name" "/tmp/existing/$name"
            else
              gh release upload "$RELEASE_TAG" "$STAGING_ROOT/$name" \
                --repo "$GITHUB_REPOSITORY"
            fi
          done < /tmp/public-asset-names.txt

      - name: Re-download and verify every published byte
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/verified-public
          while IFS= read -r name; do
            gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --pattern "$name" --dir /tmp/verified-public
            cmp "$STAGING_ROOT/$name" "/tmp/verified-public/$name"
          done < /tmp/public-asset-names.txt
          python - <<'PY'
          import hashlib
          import json
          import pathlib
          payload = json.load(open('.release-staging/berendt-batch-04-public-20260815-v1/manifest.json'))
          root = pathlib.Path('/tmp/verified-public')
          for entry in payload:
              for kind in ('pdf', 'epub'):
                  asset = entry[kind]
                  data = (root / asset['filename']).read_bytes()
                  assert len(data) == asset['size']
                  assert hashlib.sha256(data).hexdigest() == asset['sha256']
          PY

      - name: Remove one-shot workflow from public main
        uses: actions/checkout@v4
        with:
          ref: main
          path: public-main
          fetch-depth: 0

      - name: Commit workflow cleanup
        shell: bash
        run: |
          set -euo pipefail
          git -C public-main fetch origin main
          test "$(git -C public-main rev-parse origin/main)" = "$GITHUB_SHA"
          git -C public-main config user.name "github-actions[bot]"
          git -C public-main config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C public-main rm "$WORKFLOW_PATH"
          git -C public-main commit -m "Publish Berendt batch 04 release assets"
          git -C public-main push origin HEAD:main

      - name: Remove staging branch
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$STAGING_BRANCH"
