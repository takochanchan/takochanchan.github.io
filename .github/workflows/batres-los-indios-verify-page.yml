name: Verify public Batres Los indios page

on:
  push:
    branches: [agent/batres-los-indios-publish-20261005]
    paths: ['.github/workflows/batres-los-indios-verify-page.yml']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Wait for the approved page deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request
          url = "https://api.github.com/repos/takochanchan/takochanchan.github.io/actions/runs/37248846249"
          for attempt in range(90):
              request = urllib.request.Request(url, headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"], "Accept": "application/vnd.github+json"})
              with urllib.request.urlopen(request, timeout=30) as response:
                  run = json.load(response)
              if run["head_sha"] != "135bb8ddb796b1acc32a34038e3e171c6283fc22":
                  raise SystemExit("Unexpected publication commit")
              if run["status"] == "completed":
                  if run["conclusion"] != "success":
                      raise SystemExit("Page deployment failed: " + str(run["conclusion"]))
                  print("Approved page deployment succeeded.")
                  break
              time.sleep(10)
          else:
              raise SystemExit("Page deployment did not complete within 15 minutes")
          PY
      - name: Confirm public bibliography and download links
        run: |
          python3 - <<'PY'
          import time, urllib.request
          url = "https://takochanchan.github.io/publications/batres-los-indios-1894/"
          stem = "Juan_Batres Los indios_Relacion_del_Espantable_Terremoto_1541_Japanese_Complete_Translation"
          for attempt in range(12):
              try:
                  with urllib.request.urlopen(url + "?published=135bb8dd", timeout=30) as response:
                      status = response.status
                      html = response.read().decode("utf-8")
                  assert status == 200
                  assert "インディオ、その歴史と文明" in html
                  assert stem + ".pdf" in html and stem + ".epub" in html
                  assert "2026-10-05" in html
                  print("Public bibliography is available with the approved PDF and EPUB links: " + url)
                  break
              except Exception:
                  if attempt == 11: raise
                  time.sleep(10)
          PY
      - name: Re-download the public files and cover
        run: |
          python3 - <<'PY'
          import json, hashlib, urllib.request
          from pathlib import Path
          slug = "batres-los-indios-1894"
          manifest = json.loads(Path("assets-manifest.json").read_text())
          assets = [a for a in manifest["assets"] if a["path"].startswith("publications/" + slug + "/")]
          assert len(assets) == 3
          results = []
          for asset in assets:
              with urllib.request.urlopen(asset["url"], timeout=60) as response:
                  data = response.read()
                  assert response.status == 200
              digest = hashlib.sha256(data).hexdigest()
              assert len(data) == asset["size"] and digest == asset["sha256"]
              results.append({"url": asset["url"], "bytes": len(data), "sha256": digest})
              print("Verified final public bytes: " + asset["path"])
          proof = {"public_page": "https://takochanchan.github.io/publications/" + slug + "/", "public_main_commit": "135bb8ddb796b1acc32a34038e3e171c6283fc22", "pages_run_id": 37248846249, "all_three_public_files_verified": True, "assets": results}
          Path("batres-public-page-verification.json").write_text(json.dumps(proof, indent=2) + "\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: batres-public-page-verification
          path: batres-public-page-verification.json
