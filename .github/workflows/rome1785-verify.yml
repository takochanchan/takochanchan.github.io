name: Verify 1785 Rome constitutions search and publication
on:
  push:
    branches: [agent/rome1785-verify-20261127]
    paths: [.rome1785-live-plan.json]
permissions:
  contents: read
jobs:
  search-maps:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run build && npm test
      - run: python3 .rome1785-verify.py maps && npm run verify:remote-search
      - uses: actions/upload-artifact@v4
        with:
          name: rome1785-map-verification
          path: rome1785-verification.json
  live-publication:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: python3 .rome1785-verify.py live
      - uses: actions/upload-artifact@v4
        with:
          name: rome1785-live-readback
          path: rome1785-verification.json
