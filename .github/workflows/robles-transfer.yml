name: Transfer approved Robles two-volume publication files
on:
  push:
    branches: [agent/robles-publish-20261010]
    paths: [.robles-public-request.json]
permissions:
  contents: write
concurrency:
  group: publication-release-transfer
  cancel-in-progress: false
jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run build && npm test
      - name: Upload and verify final PDF and EPUB files
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .robles-transfer.py
      - name: Print verification receipt
        run: cat robles-public-verification.json
      - uses: actions/upload-artifact@v4
        with:
          name: robles-public-verification
          path: robles-public-verification.json
