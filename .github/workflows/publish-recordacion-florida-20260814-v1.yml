name: Publish Recordacion Florida

on:
  push:
    branches: ["main"]
    paths:
      - ".publication-triggers/publish-recordacion-florida-20260814-v1.json"

permissions:
  contents: write

concurrency:
  group: publication-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      ASSET_BRANCH: agent/recordacion-florida-public-assets
      SITE_BRANCH: agent/recordacion-florida-publication
      STAGING_ROOT: .release-staging/fuentes-guzman-recordacion-florida-1882-1883
      WORKFLOW_PATH: .github/workflows/publish-recordacion-florida-20260814-v1.yml
      TRIGGER_PATH: .publication-triggers/publish-recordacion-florida-20260814-v1.json
      RELEASE_TAG: publications-current
      SLUG: fuentes-guzman-recordacion-florida-1882-1883
      EPUB_NAME: Francisco_Antonio_de_Fuentes_y_Guzman_Recordacion_Florida_1882_1883_Japanese_Complete_Translation.epub
      PDF_NAME: Francisco_Antonio_de_Fuentes_y_Guzman_Recordacion_Florida_1882_1883_Japanese_Complete_Translation.pdf
      EPUB_SHA256: 263cdfe3c4d4fe42de89195bd69d617bb27f065e2e53d9519c6893f92f8a9d4f
      PDF_SHA256: 0a33d8129d9903f7b9f3cb5a64a3f9baefaf9d8b7a3fb1ecc522541b8fc46e01
    steps:
      - name: Check out checksum-pinned release bytes
        uses: actions/checkout@v4
        with:
          ref: agent/recordacion-florida-public-assets
          path: assets

      - name: Check out publication source
        uses: actions/checkout@v4
        with:
          ref: agent/recordacion-florida-publication
          path: site
          fetch-depth: 0

      - name: Reassemble and validate PDF and EPUB
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          cat "assets/$STAGING_ROOT/parts/$EPUB_NAME"/part-* > "release/$EPUB_NAME"
          cat "assets/$STAGING_ROOT/parts/$PDF_NAME"/part-* > "release/$PDF_NAME"
          test "$(stat -c %s "release/$EPUB_NAME")" = "1507415"
          test "$(stat -c %s "release/$PDF_NAME")" = "11844307"
          test "$(sha256sum "release/$EPUB_NAME" | cut -d' ' -f1)" = "$EPUB_SHA256"
          test "$(sha256sum "release/$PDF_NAME" | cut -d' ' -f1)" = "$PDF_SHA256"
          unzip -t "release/$EPUB_NAME" >/dev/null
          python - <<'PY'
          import pathlib
          pdf = pathlib.Path("release/Francisco_Antonio_de_Fuentes_y_Guzman_Recordacion_Florida_1882_1883_Japanese_Complete_Translation.pdf").read_bytes()
          assert pdf.startswith(b"%PDF-") and b"%%EOF" in pdf[-2048:]
          PY

      - name: Install build dependencies
        working-directory: site
        run: npm ci

      - name: Validate catalogue, archive gate, site, and EPUB
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "epub-root/publications/$SLUG"
          cp "release/$EPUB_NAME" "epub-root/publications/$SLUG/$EPUB_NAME"
          cd site
          npm run verify:masters
          node scripts/build.mjs
          node --test tests/archive.test.mjs
          python3 -m unittest discover -s tests -p 'test_search_*.py'
          python3 scripts/validate-epubs.py ../epub-root --slug "$SLUG"

      - name: Verify full-text extraction and PDF page mapping
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v pdftotext >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y poppler-utils
          fi
          cd site
          mkdir -p .cache
          python - <<'PY'
          import json
          import pathlib

          root = pathlib.Path.cwd()
          release = (root.parent / "release").resolve()
          epub = release / "Francisco_Antonio_de_Fuentes_y_Guzman_Recordacion_Florida_1882_1883_Japanese_Complete_Translation.epub"
          pdf = release / "Francisco_Antonio_de_Fuentes_y_Guzman_Recordacion_Florida_1882_1883_Japanese_Complete_Translation.pdf"
          manifest = {
              "schemaVersion": 1,
              "archiveCommit": "b6fcfedd1c57ba1e5791359dc2b453f6b1141c79",
              "assetManifestSha256": None,
              "works": [{
                  "slug": "fuentes-guzman-recordacion-florida-1882-1883",
                  "title": "グアテマラ史、またはフロリダの回想",
                  "author": "フランシスコ・アントニオ・デ・フエンテス・イ・グスマン",
                  "recordClass": "major-work",
                  "url": "/publications/fuentes-guzman-recordacion-florida-1882-1883/",
                  "pdfUrl": "https://github.com/takochanchan/takochanchan.github.io/releases/download/publications-current/Francisco_Antonio_de_Fuentes_y_Guzman_Recordacion_Florida_1882_1883_Japanese_Complete_Translation.pdf",
                  "masterPath": "publications/fuentes-guzman-recordacion-florida-1882-1883/master.docx",
                  "source": str(epub),
                  "format": "epub",
                  "sourceMode": "approved-epub-mirror",
                  "sourceSha256": "263cdfe3c4d4fe42de89195bd69d617bb27f065e2e53d9519c6893f92f8a9d4f",
                  "pdf": str(pdf),
                  "pdfSha256": "0a33d8129d9903f7b9f3cb5a64a3f9baefaf9d8b7a3fb1ecc522541b8fc46e01"
              }]
          }
          pathlib.Path(".cache/recordacion-search-manifest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n"
          )
          PY
          python3 scripts/search/extract-corpus.py \
            --manifest .cache/recordacion-search-manifest.json \
            --output .cache/recordacion-search-corpus.json
          python - <<'PY'
          import json

          work = json.load(open(".cache/recordacion-search-corpus.json"))["works"][0]
          assert work["pdfPageCount"] == 992
          assert work["sourceSha256"] == "263cdfe3c4d4fe42de89195bd69d617bb27f065e2e53d9519c6893f92f8a9d4f"
          assert work["pdfSha256"] == "0a33d8129d9903f7b9f3cb5a64a3f9baefaf9d8b7a3fb1ecc522541b8fc46e01"
          assert len(work["chunks"]) == 9416
          assert sum(len(chunk["text"]) for chunk in work["chunks"]) == 754438
          assert work["mappingSummary"]["unmapped"] == 0
          assert work["mappingSummary"]["verifiedRate"] >= 0.999
          assert work["mappingSummary"]["pdfTextMode"] == "embedded"
          PY

      - name: Upload PDF and EPUB and refresh release checksums
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-metadata updated-release-metadata
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern SHA256SUMS.txt \
            --dir release-metadata
          gh release upload "$RELEASE_TAG" \
            "release/$EPUB_NAME" \
            "release/$PDF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
          python - <<'PY'
          import pathlib

          epub = "Francisco_Antonio_de_Fuentes_y_Guzman_Recordacion_Florida_1882_1883_Japanese_Complete_Translation.epub"
          pdf = "Francisco_Antonio_de_Fuentes_y_Guzman_Recordacion_Florida_1882_1883_Japanese_Complete_Translation.pdf"
          path = pathlib.Path("release-metadata/SHA256SUMS.txt")
          lines = [
              line for line in path.read_text().splitlines()
              if not line.endswith("  " + epub) and not line.endswith("  " + pdf)
          ]
          lines.extend([
              "263cdfe3c4d4fe42de89195bd69d617bb27f065e2e53d9519c6893f92f8a9d4f  " + epub,
              "0a33d8129d9903f7b9f3cb5a64a3f9baefaf9d8b7a3fb1ecc522541b8fc46e01  " + pdf,
          ])
          lines.sort(key=lambda line: line.split("  ", 1)[1])
          assert len(lines) == 396
          assert len({line.split("  ", 1)[1] for line in lines}) == 396
          pathlib.Path("updated-release-metadata/SHA256SUMS.txt").write_text("\n".join(lines) + "\n")
          PY
          gh release upload "$RELEASE_TAG" \
            updated-release-metadata/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Re-download and verify public release bytes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verify-release
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$EPUB_NAME" \
            --pattern "$PDF_NAME" \
            --pattern SHA256SUMS.txt \
            --dir verify-release
          cmp "release/$EPUB_NAME" "verify-release/$EPUB_NAME"
          cmp "release/$PDF_NAME" "verify-release/$PDF_NAME"
          grep -Fx "$EPUB_SHA256  $EPUB_NAME" verify-release/SHA256SUMS.txt
          grep -Fx "$PDF_SHA256  $PDF_NAME" verify-release/SHA256SUMS.txt
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > verify-release/release.json
          python - <<'PY'
          import json

          release = json.load(open("verify-release/release.json"))
          assets = {asset["name"]: asset for asset in release["assets"]}
          epub = assets["Francisco_Antonio_de_Fuentes_y_Guzman_Recordacion_Florida_1882_1883_Japanese_Complete_Translation.epub"]
          pdf = assets["Francisco_Antonio_de_Fuentes_y_Guzman_Recordacion_Florida_1882_1883_Japanese_Complete_Translation.pdf"]
          assert epub["size"] == 1507415
          assert epub["digest"] == "sha256:263cdfe3c4d4fe42de89195bd69d617bb27f065e2e53d9519c6893f92f8a9d4f"
          assert pdf["size"] == 11844307
          assert pdf["digest"] == "sha256:0a33d8129d9903f7b9f3cb5a64a3f9baefaf9d8b7a3fb1ecc522541b8fc46e01"
          assert len(release["assets"]) == 397
          PY

      - name: Publish the verified catalogue source
        id: publish-source
        working-directory: site
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          git rebase origin/main
          git push origin HEAD:main
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Remove staging branches and one-shot controls
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$ASSET_BRANCH"
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$SITE_BRANCH"
          workflow_sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/$WORKFLOW_PATH?ref=main" --jq .sha)"
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/contents/$WORKFLOW_PATH" \
            -f message="Remove completed Recordacion Florida publication workflow" \
            -f sha="$workflow_sha" \
            -f branch=main
          trigger_sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/$TRIGGER_PATH?ref=main" --jq .sha)"
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/contents/$TRIGGER_PATH" \
            -f message="Remove completed Recordacion Florida publication trigger" \
            -f sha="$trigger_sha" \
            -f branch=main
