name: Transfer checksum-pinned AGN Hospitales volume 73 assets

on:
  push:
    branches: [agent/agn-hospitales-volume-73-assets-transfer-20261105]
    paths: ['.publication-upload-requests/agn-hospitales-volume-73-1649-1773.json']
permissions:
  contents: write
concurrency:
  group: publication-release-transfer
  cancel-in-progress: false
jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install build dependencies
        run: npm ci --no-audit --no-fund
      - name: Build and test the publication catalogue
        run: npm run build && npm test
      - name: Reconstruct, upload, and verify publication bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .publication-transfer/transfer-agn73.py
      - uses: actions/upload-artifact@v4
        with:
          name: agn73-release-byte-verification
          path: agn73-release-verification.json
