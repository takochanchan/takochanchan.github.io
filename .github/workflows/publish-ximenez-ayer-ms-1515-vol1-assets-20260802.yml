name: Verify Ximenez Ayer MS 1515 volume 1 release assets

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-ximenez-ayer-ms-1515-vol1-assets-20260802.yml

permissions:
  contents: write

concurrency:
  group: publications-current-release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WORKFLOW_PATH: .github/workflows/publish-ximenez-ayer-ms-1515-vol1-assets-20260802.yml
      PDF_NAME: Francisco_Ximenez_Arte_de_las_tres_lenguas_Tratado_segundo_Ayer_MS_1515_Vol_1_Japanese_Complete_Translation.pdf
      PDF_SIZE: "96065095"
      PDF_SHA256: 25b52ae1d3b8f4202cbe13b100435c0df75b39012907cc74b6dda473c0b4b2a2
      EPUB_NAME: Francisco_Ximenez_Arte_de_las_tres_lenguas_Tratado_segundo_Ayer_MS_1515_Vol_1_Japanese_Complete_Translation.epub
      EPUB_SIZE: "74163164"
      EPUB_SHA256: a20a4b2b5850723df460a7ca7acf466d64a596669c58737e21964fc4e3cb8bdc

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install PDF inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Download and verify published release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/verified
          gh release download publications-current --pattern "$PDF_NAME" --dir /tmp/verified --repo "$GITHUB_REPOSITORY"
          gh release download publications-current --pattern "$EPUB_NAME" --dir /tmp/verified --repo "$GITHUB_REPOSITORY"
          gh release download publications-current --pattern SHA256SUMS.txt --dir /tmp/verified --repo "$GITHUB_REPOSITORY"

          test "$(stat -c %s "/tmp/verified/$PDF_NAME")" = "$PDF_SIZE"
          test "$(stat -c %s "/tmp/verified/$EPUB_NAME")" = "$EPUB_SIZE"
          test "$(sha256sum "/tmp/verified/$PDF_NAME" | awk '{print $1}')" = "$PDF_SHA256"
          test "$(sha256sum "/tmp/verified/$EPUB_NAME" | awk '{print $1}')" = "$EPUB_SHA256"
          grep -Fx "$PDF_SHA256  $PDF_NAME" /tmp/verified/SHA256SUMS.txt
          grep -Fx "$EPUB_SHA256  $EPUB_NAME" /tmp/verified/SHA256SUMS.txt

          test "$(pdfinfo "/tmp/verified/$PDF_NAME" | awk '/^Pages:/ {print $2}')" = 619
          pdftotext -layout "/tmp/verified/$PDF_NAME" /tmp/ximenez.txt
          grep -F "三言語文法" /tmp/ximenez.txt
          grep -F "第二論考" /tmp/ximenez.txt
          grep -F "AYER MS 1515" /tmp/ximenez.txt
          if grep -E "GPT|ChatGPT|Markdown|生成AI|制作工程|Proof|公開前校閲用" /tmp/ximenez.txt; then
            echo "Forbidden production wording found in PDF" >&2
            exit 1
          fi

          python3 - <<'PY'
          import os, re, zipfile
          path = '/tmp/verified/' + os.environ['EPUB_NAME']
          with zipfile.ZipFile(path) as z:
              assert z.testzip() is None
              names = z.namelist()
              assert names[0] == 'mimetype'
              opf_name = next(n for n in names if n.endswith('.opf'))
              opf = z.read(opf_name).decode('utf-8')
              assert re.search(r'properties="[^"]*cover-image[^"]*"', opf)
              text = ''.join(
                  z.read(n).decode('utf-8')
                  for n in names
                  if n.endswith(('.xhtml', '.html', '.opf', '.ncx'))
              ).replace('\\xa0', ' ')
          for required in ('三言語文法', '第二論考'):
              assert required in text
          for forbidden in ('GPT', 'ChatGPT', 'Markdown', '生成AI', '制作工程', 'Proof', '公開前校閲用'):
              assert forbidden not in text
          PY

      - name: Remove one-time workflow
        if: success()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -B cleanup origin/main
            if [ ! -f "$WORKFLOW_PATH" ]; then
              exit 0
            fi
            git rm "$WORKFLOW_PATH"
            git commit -m "Remove completed Ximenez Ayer MS 1515 volume 1 release workflow"
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          exit 1

      - name: Record workflow failure
        if: failure()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          failure_path=".github/publication-failures/ximenez-ayer-ms-1515-vol1-${GITHUB_RUN_ID}.txt"
          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -B failure origin/main
            mkdir -p "$(dirname "$failure_path")"
            printf 'run_id=%s\nrun_url=https://github.com/%s/actions/runs/%s\n' "$GITHUB_RUN_ID" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > "$failure_path"
            git add "$failure_path"
            git commit -m "Record failed Ximenez Ayer MS 1515 volume 1 release verification"
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          exit 1
