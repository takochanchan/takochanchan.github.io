    steps:
      - name: Install PDF inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Reassemble and validate release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/ximenez-assets
          for kind in PDF EPUB; do
            name_var="${kind}_NAME"
            size_var="${kind}_SIZE"
            digest_var="${kind}_SHA256"
            blobs_var="${kind}_BLOBS"
            name="${!name_var}"
            target="/tmp/ximenez-assets/$name"
            : > "$target"
            for blob in ${!blobs_var}; do
              gh api -H "Accept: application/vnd.github.raw+json" \
                "repos/$GITHUB_REPOSITORY/git/blobs/$blob" >> "$target"
            done
            echo "${!digest_var}  $target" | sha256sum -c -
            test "$(stat -c %s "$target")" = "${!size_var}"
          done

          test "$(pdfinfo "/tmp/ximenez-assets/$PDF_NAME" | awk '/^Pages:/ {print $2}')" = 619
          pdftotext -layout "/tmp/ximenez-assets/$PDF_NAME" /tmp/ximenez.txt
          grep -F "三言語文法" /tmp/ximenez.txt
          grep -F "第二論考" /tmp/ximenez.txt
          grep -F "AYER MS 1515" /tmp/ximenez.txt
          if grep -E "GPT|ChatGPT|Markdown|生成AI|制作工程|Proof|公開前校閲用" /tmp/ximenez.txt; then
            echo "Forbidden production wording found in PDF" >&2
            exit 1
          fi

          python3 - <<'PY'
          import os, re, zipfile
          path = '/tmp/ximenez-assets/' + os.environ['EPUB_NAME']
          with zipfile.ZipFile(path) as z:
              assert z.testzip() is None
              names = z.namelist()
              assert names[0] == 'mimetype'
              opf_name = next(n for n in names if n.endswith('.opf'))
              opf = z.read(opf_name).decode('utf-8')
              assert re.search(r'properties="[^"]*cover-image[^"]*"', opf)
              text = ''.join(
                  z.read(n).decode('utf-8')
                  for n in names
                  if n.endswith(('.xhtml', '.html', '.opf', '.ncx'))
              ).replace('\xa0', ' ')
          for required in ('三言語文法', '第二論考'):
              assert required in text
          for forbidden in ('GPT', 'ChatGPT', 'Markdown', '生成AI', '制作工程', 'Proof', '公開前校閲用'):
              assert forbidden not in text
          PY

      - name: Replace release assets and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/current /tmp/verified
          gh release download publications-current \
            --pattern SHA256SUMS.txt --dir /tmp/current --repo "$GITHUB_REPOSITORY"
          grep -v -F "  $PDF_NAME" /tmp/current/SHA256SUMS.txt |
            grep -v -F "  $EPUB_NAME" > /tmp/SHA256SUMS.txt
          printf '%s  %s\n' "$PDF_SHA256" "$PDF_NAME" >> /tmp/SHA256SUMS.txt
          printf '%s  %s\n' "$EPUB_SHA256" "$EPUB_NAME" >> /tmp/SHA256SUMS.txt
          gh release upload publications-current \
            "/tmp/ximenez-assets/$PDF_NAME" \
            "/tmp/ximenez-assets/$EPUB_NAME" \
            /tmp/SHA256SUMS.txt \
            --clobber --repo "$GITHUB_REPOSITORY"

          for kind in PDF EPUB; do
            name_var="${kind}_NAME"
            digest_var="${kind}_SHA256"
            size_var="${kind}_SIZE"
            name="${!name_var}"
            gh release download publications-current \
              --pattern "$name" --dir /tmp/verified --repo "$GITHUB_REPOSITORY"
            echo "${!digest_var}  /tmp/verified/$name" | sha256sum -c -
            test "$(stat -c %s "/tmp/verified/$name")" = "${!size_var}"
          done
          gh release download publications-current \
            --pattern SHA256SUMS.txt --dir /tmp/verified --repo "$GITHUB_REPOSITORY"
          grep -F "$PDF_SHA256  $PDF_NAME" /tmp/verified/SHA256SUMS.txt
          grep -F "$EPUB_SHA256  $EPUB_NAME" /tmp/verified/SHA256SUMS.txt

      - name: Remove one-time workflow
        if: success()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -B cleanup origin/main
            if [ ! -f "$WORKFLOW_PATH" ]; then
              exit 0
            fi
            git rm "$WORKFLOW_PATH"
            git commit -m "Remove completed Ximenez Ayer MS 1515 volume 1 release workflow"
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          exit 1

      - name: Record workflow failure
        if: failure()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          failure_path=".github/publication-failures/ximenez-ayer-ms-1515-vol1-${GITHUB_RUN_ID}.txt"
          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -B failure origin/main
            mkdir -p "$(dirname "$failure_path")"
            printf 'run_id=%s\nrun_url=https://github.com/%s/actions/runs/%s\n' "$GITHUB_RUN_ID" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > "$failure_path"
            git add "$failure_path"
            git commit -m "Record failed Ximenez Ayer MS 1515 volume 1 release workflow"
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          exit 1
