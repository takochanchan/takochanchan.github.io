    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install PDF inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Reassemble and validate release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/ximenez-assets
          pdf="/tmp/ximenez-assets/$PDF_NAME"
          epub="/tmp/ximenez-assets/$EPUB_NAME"

          fetch_blob() {
            local sha="$1"
            local out="$2"
            gh api "repos/$GITHUB_REPOSITORY/git/blobs/$sha" --jq '.content' |
              tr -d '\n' |
              base64 --decode >> "$out"
          }

          : > "$pdf"
          for blob in $PDF_BLOBS; do
            fetch_blob "$blob" "$pdf"
          done
          : > "$epub"
          for blob in $EPUB_BLOBS; do
            fetch_blob "$blob" "$epub"
          done

          test "$(stat -c %s "$pdf")" = "$PDF_SIZE"
          test "$(stat -c %s "$epub")" = "$EPUB_SIZE"
          test "$(sha256sum "$pdf" | awk '{print $1}')" = "$PDF_SHA256"
          test "$(sha256sum "$epub" | awk '{print $1}')" = "$EPUB_SHA256"

          test "$(pdfinfo "$pdf" | awk '/^Pages:/ {print $2}')" = 619
          pdftotext -layout "$pdf" /tmp/ximenez.txt
          grep -F "三言語文法" /tmp/ximenez.txt
          grep -F "第二論考" /tmp/ximenez.txt
          grep -F "AYER MS 1515" /tmp/ximenez.txt
          if grep -E "GPT|ChatGPT|Markdown|生成AI|制作工程|Proof|公開前校閲用" /tmp/ximenez.txt; then
            echo "Forbidden production wording found in PDF" >&2
            exit 1
          fi

          python3 - <<'PY'
          import os, re, zipfile
          path = '/tmp/ximenez-assets/' + os.environ['EPUB_NAME']
          with zipfile.ZipFile(path) as z:
              assert z.testzip() is None
              names = z.namelist()
              assert names[0] == 'mimetype'
              opf_name = next(n for n in names if n.endswith('.opf'))
              opf = z.read(opf_name).decode('utf-8')
              assert re.search(r'properties="[^"]*cover-image[^"]*"', opf)
              text = ''.join(
                  z.read(n).decode('utf-8')
                  for n in names
                  if n.endswith(('.xhtml', '.html', '.opf', '.ncx'))
              ).replace('\\xa0', ' ')
          for required in ('三言語文法', '第二論考'):
              assert required in text
          for forbidden in ('GPT', 'ChatGPT', 'Markdown', '生成AI', '制作工程', 'Proof', '公開前校閲用'):
              assert forbidden not in text
          PY

      - name: Replace release assets and verify downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/current /tmp/verified
          gh release download publications-current --pattern SHA256SUMS.txt --dir /tmp/current --repo "$GITHUB_REPOSITORY"
          awk -v pdf="$PDF_NAME" -v epub="$EPUB_NAME" '$2 != pdf && $2 != epub' /tmp/current/SHA256SUMS.txt > /tmp/SHA256SUMS.txt
          printf '%s  %s\n' "$PDF_SHA256" "$PDF_NAME" >> /tmp/SHA256SUMS.txt
          printf '%s  %s\n' "$EPUB_SHA256" "$EPUB_NAME" >> /tmp/SHA256SUMS.txt

          gh release upload publications-current             "/tmp/ximenez-assets/$PDF_NAME"             "/tmp/ximenez-assets/$EPUB_NAME"             /tmp/SHA256SUMS.txt             --clobber --repo "$GITHUB_REPOSITORY"

          gh release download publications-current --pattern "$PDF_NAME" --dir /tmp/verified --repo "$GITHUB_REPOSITORY"
          gh release download publications-current --pattern "$EPUB_NAME" --dir /tmp/verified --repo "$GITHUB_REPOSITORY"
          gh release download publications-current --pattern SHA256SUMS.txt --dir /tmp/verified --repo "$GITHUB_REPOSITORY"
          test "$(stat -c %s "/tmp/verified/$PDF_NAME")" = "$PDF_SIZE"
          test "$(stat -c %s "/tmp/verified/$EPUB_NAME")" = "$EPUB_SIZE"
          test "$(sha256sum "/tmp/verified/$PDF_NAME" | awk '{print $1}')" = "$PDF_SHA256"
          test "$(sha256sum "/tmp/verified/$EPUB_NAME" | awk '{print $1}')" = "$EPUB_SHA256"
          grep -Fx "$PDF_SHA256  $PDF_NAME" /tmp/verified/SHA256SUMS.txt
          grep -Fx "$EPUB_SHA256  $EPUB_NAME" /tmp/verified/SHA256SUMS.txt

      - name: Remove one-time workflow and resolved failure record
        if: success()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -B cleanup origin/main
            if [ -f "$WORKFLOW_PATH" ]; then
              git rm "$WORKFLOW_PATH"
            fi
            if [ -f "$PREVIOUS_FAILURE_PATH" ]; then
              git rm "$PREVIOUS_FAILURE_PATH"
            fi
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m "Remove completed Ximenez Ayer MS 1515 release workflow"
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          exit 1

      - name: Record workflow failure
        if: failure()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          failure_path=".github/publication-failures/ximenez-ayer-ms-1515-vol1-${GITHUB_RUN_ID}.txt"
          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -B failure origin/main
            mkdir -p "$(dirname "$failure_path")"
            printf 'run_id=%s\nrun_url=https://github.com/%s/actions/runs/%s\n' "$GITHUB_RUN_ID" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > "$failure_path"
            git add "$failure_path"
            git commit -m "Record failed Ximenez Ayer MS 1515 release workflow"
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          exit 1
