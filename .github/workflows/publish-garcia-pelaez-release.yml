name: Publish García Peláez release assets

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-garcia-pelaez-release.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Reassemble release assets
