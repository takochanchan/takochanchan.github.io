          EPUB_CHUNKS: "14bb27349f56848a67144bc3293011a8d21e2db3 056d628dbe3bead162d7595f49ff0b0bdcff24b7 737500ed6fc78addb8b8cf808df29263d9136a9f ee99bd8d96744a1666146a1ffe316b603d3a76de 7c6fe306ca76fe84c95f867f99f20bc3ceabc2e9 8f129f05bc84da0f08d13143f20cd77c0b2f74ca 36df08db231673723f9e374000e098fc2e24cbde bb643a45eaac7f5b23a8ac4561f5805a3ecd6412"
          SUMS_CHUNKS: "ecb01b5ac7569b800630b5f6f90af5c8d53896c7"
        run: |
          set -euo pipefail
          pdf=Francisco_de_Paula_Garcia_Pelaez_Memorias_1851_1852_Japanese_Complete_Translation.pdf
          epub=Francisco_de_Paula_Garcia_Pelaez_Memorias_1851_1852_Japanese_Complete_Translation.epub
          sums=SHA256SUMS.txt
          : > "$pdf"
          : > "$epub"
          : > "$sums"
          for chunk in $PDF_CHUNKS; do
            gh api "repos/$GITHUB_REPOSITORY/git/blobs/$chunk" --jq .content | tr -d '\n' | base64 --decode >> "$pdf"
          done
          for chunk in $EPUB_CHUNKS; do
            gh api "repos/$GITHUB_REPOSITORY/git/blobs/$chunk" --jq .content | tr -d '\n' | base64 --decode >> "$epub"
          done
          for chunk in $SUMS_CHUNKS; do
            gh api "repos/$GITHUB_REPOSITORY/git/blobs/$chunk" --jq .content | tr -d '\n' | base64 --decode >> "$sums"
          done
          echo "1ebeb06de8789a6dcca8eebf0d6b7b352172d5ec079d8091b83c4d6ceafa26c2  $pdf" | sha256sum -c -
          echo "691dcefc3611af0c95c06ef50935c2e376142675869437d58dc404337938cc4d  $epub" | sha256sum -c -
          echo "6ce81774c9c8877bd0b0e3dc2205ed16908f12d6ba73e1a1a3a19bc6e4bc1be5  $sums" | sha256sum -c -
          test "$(stat -c %s "$pdf")" = 12792058
          test "$(stat -c %s "$epub")" = 1164384
          test "$(stat -c %s "$sums")" = 14994

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload publications-current \
            Francisco_de_Paula_Garcia_Pelaez_Memorias_1851_1852_Japanese_Complete_Translation.pdf \
            Francisco_de_Paula_Garcia_Pelaez_Memorias_1851_1852_Japanese_Complete_Translation.epub \
            SHA256SUMS.txt \
            --clobber \
            --repo "$GITHUB_REPOSITORY"

      - name: Remove release staging branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api \
            --method DELETE \
            "repos/$GITHUB_REPOSITORY/git/refs/heads/agent/release-assets-garcia-pelaez-memorias-1851-1852-9e83877e"

      - name: Remove one-time workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          path=.github/workflows/publish-garcia-pelaez-release.yml
          sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/$path?ref=main" --jq .sha 2>/dev/null || true)"
          if test -z "$sha"; then
            exit 0
          fi
          gh api \
            --method DELETE \
            "repos/$GITHUB_REPOSITORY/contents/$path" \
            -f message="Remove one-time García Peláez release workflow" \
            -f sha="$sha" \
            -f branch=main
