name: Publish Coronel release assets

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-coronel-assets-20260811.yml

permissions:
  contents: write

concurrency:
  group: publications-current-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      WORKFLOW_PATH: .github/workflows/publish-coronel-assets-20260811.yml
      STAGING_BRANCH: agent/release-upload-coronel-arte-maya-1620-20260811
      STAGING_PATH: .release-upload-staging/coronel-arte-maya-1620-20260811
      ASSET_MANIFEST: |-
          [
            {
              "kind": "pdf",
              "name": "Juan_Coronel_Arte_en_lengua_de_Maya_1620_Japanese_Complete_Translation.pdf",
              "title": "マヤ語文法",
              "author": "フアン・コロネル",
              "marker": "〔原刊旧付番 p. 2〕",
              "pages": 82,
              "imageCount": 1,
              "size": 1948839,
              "sha256": "ecfca166d7ed0c4860af9e890dae0a9940ef6495a8bb601d6643ed09d826146f"
            },
            {
              "kind": "epub",
              "name": "Juan_Coronel_Arte_en_lengua_de_Maya_1620_Japanese_Complete_Translation.epub",
              "title": "マヤ語文法",
              "author": "フアン・コロネル",
              "marker": "〔原刊旧付番 p. 2〕",
              "minJapanese": 27000,
              "imageRefs": 1,
              "size": 119750,
              "sha256": "00e8f554db1f46c582fef28753ab8ca4138c85b438dbf8eab7a2b24a2b619d0e"
            }
          ]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install PDF inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Reassemble and validate release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin "$STAGING_BRANCH"
          export STAGING_COMMIT
          STAGING_COMMIT="$(git rev-parse FETCH_HEAD)"
          mkdir -p /tmp/coronel-assets
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import posixpath
          import re
          import subprocess
          import zipfile
          from pathlib import Path
          from urllib.parse import unquote, urlsplit
          from xml.etree import ElementTree as ET

          assets = json.loads(os.environ["ASSET_MANIFEST"])
          root = Path("/tmp/coronel-assets")
          staging_commit = os.environ["STAGING_COMMIT"]
          staging_path = os.environ["STAGING_PATH"]
          staged = subprocess.check_output(
              ["git", "ls-tree", "-r", "--name-only", staging_commit],
              text=True,
          ).splitlines()
          forbidden = (
              "GPT",
              "ChatGPT",
              "確認用",
              "Proof",
              "未公開",
              "公開承認前",
              "翻訳作業稿",
          )

          for asset in assets:
              prefix = f'{staging_path}/{asset["kind"]}-'
              parts = sorted(
                  path for path in staged
                  if path.startswith(prefix) and path.endswith(".bin")
              )
              assert parts, asset["kind"]
              target = root / asset["name"]
              with target.open("wb") as output:
                  for part in parts:
                      output.write(
                          subprocess.check_output(
                              ["git", "show", f"{staging_commit}:{part}"]
                          )
                      )

              data = target.read_bytes()
              assert len(data) == asset["size"], (asset["name"], len(data))
              assert hashlib.sha256(data).hexdigest() == asset["sha256"]

              if asset["kind"] == "pdf":
                  info = subprocess.check_output(["pdfinfo", str(target)], text=True)
                  pages = int(re.search(r"^Pages:\s+(\d+)$", info, re.M).group(1))
                  assert pages == asset["pages"], (asset["name"], pages)
                  assert re.search(r"^Page size:\s+612 x 792 pts \(letter\)$", info, re.M)
                  assert re.search(r"^Tagged:\s+yes$", info, re.M)

                  fonts = subprocess.check_output(["pdffonts", str(target)], text=True)
                  font_lines = [line for line in fonts.splitlines()[2:] if line.strip()]
                  assert font_lines
                  assert all(line.count("yes") >= 3 for line in font_lines)
                  assert any("NotoSerifJP" in line for line in font_lines)

                  images = subprocess.check_output(
                      ["pdfimages", "-list", str(target)],
                      text=True,
                  )
                  image_lines = [
                      line for line in images.splitlines()
                      if re.match(r"^\s*\d+\s+\d+\s+", line)
                  ]
                  assert len(image_lines) == asset["imageCount"], len(image_lines)

                  text = subprocess.check_output(
                      ["pdftotext", "-layout", str(target), "-"],
                      text=True,
                  )
                  for required in (
                      asset["title"],
                      asset["author"],
                      asset["marker"],
                      "Public domain",
                      "許諾または制限なく",
                  ):
                      assert required in text, required
                  assert not any(term in text for term in forbidden)
                  assert "\ufffd" not in text and "\x00" not in text
              else:
                  with zipfile.ZipFile(target) as archive:
                      assert archive.testzip() is None
                      names = archive.namelist()
                      assert names[0] == "mimetype"
                      assert archive.getinfo("mimetype").compress_type == zipfile.ZIP_STORED
                      assert archive.read("mimetype") == b"application/epub+zip"

                      container = ET.fromstring(
                          archive.read("META-INF/container.xml")
                      )
                      rootfile = container.find(
                          ".//{urn:oasis:names:tc:opendocument:xmlns:container}rootfile"
                      )
                      assert rootfile is not None
                      opf_path = rootfile.attrib["full-path"]
                      opf = ET.fromstring(archive.read(opf_path))
                      assert opf.attrib.get("version", "").startswith("3")
                      ns = {"opf": "http://www.idpf.org/2007/opf"}
                      items = opf.findall(".//opf:manifest/opf:item", ns)
                      assert items
                      by_id = {item.attrib["id"]: item for item in items}
                      nav_items = [
                          item for item in items
                          if "nav" in item.attrib.get("properties", "").split()
                      ]
                      cover_items = [
                          item for item in items
                          if "cover-image" in item.attrib.get("properties", "").split()
                      ]
                      assert len(nav_items) == 1
                      assert len(cover_items) == 1
                      opf_dir = posixpath.dirname(opf_path)
                      for item in items:
                          member = posixpath.normpath(
                              posixpath.join(opf_dir, item.attrib["href"])
                          )
                          assert member in names, member
                      spine = opf.findall(".//opf:spine/opf:itemref", ns)
                      assert spine
                      assert all(item.attrib["idref"] in by_id for item in spine)

                      documents = []
                      document_paths = []
                      for item in items:
                          if item.attrib.get("media-type") == "application/xhtml+xml":
                              member = posixpath.normpath(
                                  posixpath.join(opf_dir, item.attrib["href"])
                              )
                              document_paths.append(member)
                              documents.append(ET.fromstring(archive.read(member)))

                      for member, document in zip(document_paths, documents):
                          member_dir = posixpath.dirname(member)
                          for element in document.iter():
                              for attr in ("href", "src"):
                                  value = element.attrib.get(attr)
                                  if not value:
                                      continue
                                  parsed = urlsplit(value)
                                  if parsed.scheme or parsed.netloc or not parsed.path:
                                      continue
                                  resolved = posixpath.normpath(
                                      posixpath.join(member_dir, unquote(parsed.path))
                                  )
                                  assert resolved in names, (member, value, resolved)

                  text = "\n".join("".join(document.itertext()) for document in documents)
                  image_refs = sum(
                      len(document.findall(".//{http://www.w3.org/1999/xhtml}img"))
                      for document in documents
                  )
                  japanese = len(re.findall(r"[\u3040-\u30ff\u3400-\u9fff]", text))
                  assert japanese >= asset["minJapanese"], japanese
                  assert image_refs == asset["imageRefs"], image_refs
                  for required in (
                      asset["title"],
                      asset["author"],
                      asset["marker"],
                      "Public domain",
                      "許諾または制限なく",
                  ):
                      assert required in text, required
                  assert not any(term in text for term in forbidden)
                  assert "\ufffd" not in text and "\x00" not in text
          PY

      - name: Upload release assets and verify downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/current /tmp/verified
          gh release download publications-current --pattern SHA256SUMS.txt --dir /tmp/current --repo "$GITHUB_REPOSITORY"

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          assets = json.loads(os.environ["ASSET_MANIFEST"])
          names = {asset["name"] for asset in assets}
          current = Path("/tmp/current/SHA256SUMS.txt").read_text(encoding="utf-8").splitlines()
          kept = [
              line for line in current
              if len(line.split(maxsplit=1)) != 2 or line.split(maxsplit=1)[1] not in names
          ]
          kept.extend(f'{asset["sha256"]}  {asset["name"]}' for asset in assets)
          Path("/tmp/SHA256SUMS.txt").write_text("\n".join(kept) + "\n", encoding="utf-8")
          PY

          mapfile -t asset_paths < <(
            python3 - <<'PY'
          import json
          import os
          for asset in json.loads(os.environ["ASSET_MANIFEST"]):
              print("/tmp/coronel-assets/" + asset["name"])
          PY
          )
          gh release upload publications-current "${asset_paths[@]}" /tmp/SHA256SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"

          mapfile -t asset_names < <(
            python3 - <<'PY'
          import json
          import os
          for asset in json.loads(os.environ["ASSET_MANIFEST"]):
              print(asset["name"])
          PY
          )
          for name in "${asset_names[@]}"; do
            gh release download publications-current --pattern "$name" --dir /tmp/verified --repo "$GITHUB_REPOSITORY"
          done
          gh release download publications-current --pattern SHA256SUMS.txt --dir /tmp/verified --repo "$GITHUB_REPOSITORY"

          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          assets = json.loads(os.environ["ASSET_MANIFEST"])
          root = Path("/tmp/verified")
          sums = root.joinpath("SHA256SUMS.txt").read_text(encoding="utf-8").splitlines()
          for asset in assets:
              data = root.joinpath(asset["name"]).read_bytes()
              assert len(data) == asset["size"]
              assert hashlib.sha256(data).hexdigest() == asset["sha256"]
              assert f'{asset["sha256"]}  {asset["name"]}' in sums
          PY

      - name: Remove staging branch and one-time workflow
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$STAGING_BRANCH" || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -B cleanup origin/main
            if [ -f "$WORKFLOW_PATH" ]; then
              git rm "$WORKFLOW_PATH"
            fi
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m "Remove completed Coronel release workflow"
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          exit 1

      - name: Record workflow failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          failure_path=".github/publication-failures/coronel-release-$GITHUB_RUN_ID.txt"
          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -B failure origin/main
            mkdir -p "$(dirname "$failure_path")"
            printf 'run_id=%s\nrun_url=https://github.com/%s/actions/runs/%s\n' "$GITHUB_RUN_ID" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > "$failure_path"
            git add "$failure_path"
            git commit -m "Record failed Coronel release workflow"
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          exit 1
