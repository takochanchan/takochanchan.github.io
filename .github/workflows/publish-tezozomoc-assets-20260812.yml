name: Publish Tezozomoc release assets

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-tezozomoc-assets-20260812.yml

permissions:
  contents: write

concurrency:
  group: publications-current-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      WORKFLOW_PATH: .github/workflows/publish-tezozomoc-assets-20260812.yml
      STAGING_BRANCH: agent/release-upload-tezozomoc-20260812-2220
