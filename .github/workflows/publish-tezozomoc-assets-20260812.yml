    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install PDF inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Reassemble and validate release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/tezozomoc-assets
          python3 - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import posixpath
          import re
          import subprocess
          import zipfile
          from pathlib import Path
          from urllib.parse import unquote, urlsplit
          from xml.etree import ElementTree as ET

          assets = json.loads(os.environ["ASSET_MANIFEST"])
          root = Path("/tmp/tezozomoc-assets")
          repository = os.environ["GITHUB_REPOSITORY"]
          forbidden = (
              "公開前確認版",
              "prepublication proof",
              "従来版",
              "校訂注",
              "翻訳プロジェクト",
              "GPT",
              "ChatGPT",
              "確認用",
              "未公開",
              "公開承認前",
          )

          for asset in assets:
              target = root / asset["name"]
              with target.open("wb") as output:
                  for blob_sha in asset["blobs"]:
                      encoded = subprocess.check_output(
                          [
                              "gh",
                              "api",
                              f"repos/{repository}/git/blobs/{blob_sha}",
                              "--jq",
                              ".content",
                          ],
                          text=True,
                      )
                      output.write(base64.b64decode("".join(encoded.split())))

              data = target.read_bytes()
              assert len(data) == asset["size"], (asset["name"], len(data))
              assert hashlib.sha256(data).hexdigest() == asset["sha256"]

              if asset["kind"] == "pdf":
                  info = subprocess.check_output(["pdfinfo", str(target)], text=True)
                  pages = int(re.search(r"^Pages:\s+(\d+)$", info, re.M).group(1))
                  assert pages == asset["pages"], (asset["name"], pages)
                  assert "612 x 792 pts (letter)" in info
                  assert re.search(r"^Tagged:\s+yes$", info, re.M)
                  assert re.search(r"^JavaScript:\s+no$", info, re.M)
                  assert re.search(r"^Encrypted:\s+no$", info, re.M)

                  fonts = subprocess.check_output(["pdffonts", str(target)], text=True)
                  font_lines = [line for line in fonts.splitlines()[2:] if line.strip()]
                  assert font_lines
                  assert all(line.count("yes") >= 3 for line in font_lines)
                  assert any("NotoSerifJP" in line for line in font_lines)
                  assert any("NotoSansJP" in line for line in font_lines)

                  text = subprocess.check_output(
                      ["pdftotext", "-layout", str(target), "-"],
                      text=True,
                  )
                  normalized = re.sub(r"\s+", "", text)
                  for required in (
                      asset["title"],
                      asset["author"],
                      "独立日本語全訳",
                      "〔クラウス117写本f.160v〕",
                      "〔クラウス117写本f.4r–5v欠葉〕",
                      "写本の物理的要素",
                      "利用・複製に既知の制限なし",
                      "原写本の物理的要素217件",
                  ):
                      assert re.sub(r"\s+", "", required) in normalized, required
                  folios = re.findall(r"〔クラウス117写本f\.\d+[rv]〕", normalized)
                  assert len(folios) == asset["folioMarkers"], len(folios)
                  headings = set(re.findall(r"写本第(\d+)章", normalized))
                  assert len(headings) == asset["chapters"], len(headings)
                  assert not any(term in text for term in forbidden)
                  assert "\ufffd" not in text and "\x00" not in text
              else:
                  with zipfile.ZipFile(target) as archive:
                      assert archive.testzip() is None
                      names = archive.namelist()
                      assert names[0] == "mimetype"
                      assert archive.getinfo("mimetype").compress_type == zipfile.ZIP_STORED
                      assert archive.read("mimetype") == b"application/epub+zip"

                      container = ET.fromstring(archive.read("META-INF/container.xml"))
                      rootfile = container.find(
                          ".//{urn:oasis:names:tc:opendocument:xmlns:container}rootfile"
                      )
                      assert rootfile is not None
                      opf_path = rootfile.attrib["full-path"]
                      opf = ET.fromstring(archive.read(opf_path))
                      assert opf.attrib.get("version", "").startswith("3")
                      ns = {"opf": "http://www.idpf.org/2007/opf"}
                      items = opf.findall(".//opf:manifest/opf:item", ns)
                      assert items
                      by_id = {item.attrib["id"]: item for item in items}
                      assert len([
                          item for item in items
                          if "nav" in item.attrib.get("properties", "").split()
                      ]) == 1
                      assert len([
                          item for item in items
                          if "cover-image" in item.attrib.get("properties", "").split()
                      ]) == 1
                      opf_dir = posixpath.dirname(opf_path)
                      for item in items:
                          member = posixpath.normpath(
                              posixpath.join(opf_dir, item.attrib["href"])
                          )
                          assert member in names, member
                      spine = opf.findall(".//opf:spine/opf:itemref", ns)
                      assert spine
                      assert all(item.attrib["idref"] in by_id for item in spine)

                      documents = []
                      content_documents = []
                      document_paths = []
                      for item in items:
                          if item.attrib.get("media-type") != "application/xhtml+xml":
                              continue
                          member = posixpath.normpath(
                              posixpath.join(opf_dir, item.attrib["href"])
                          )
                          document = ET.fromstring(archive.read(member))
                          document_paths.append(member)
                          documents.append(document)
                          if "nav" not in item.attrib.get("properties", "").split():
                              content_documents.append(document)

                      for member, document in zip(document_paths, documents):
                          member_dir = posixpath.dirname(member)
                          for element in document.iter():
                              for attr in ("href", "src"):
                                  value = element.attrib.get(attr)
                                  if not value:
                                      continue
                                  parsed = urlsplit(value)
                                  if parsed.scheme or parsed.netloc or not parsed.path:
                                      continue
                                  resolved = posixpath.normpath(
                                      posixpath.join(member_dir, unquote(parsed.path))
                                  )
                                  assert resolved in names, (member, value, resolved)

                  text = "\n".join(
                      "".join(document.itertext()) for document in content_documents
                  )
                  normalized = re.sub(r"\s+", "", text)
                  image_refs = sum(
                      len(document.findall(".//{http://www.w3.org/1999/xhtml}img"))
                      for document in content_documents
                  )
                  japanese = len(re.findall(r"[\u3040-\u30ff\u3400-\u9fff]", text))
                  chapter_headings = [
                      "".join(element.itertext())
                      for document in content_documents
                      for element in document.iter()
                      if element.tag.rsplit("}", 1)[-1] == "h1"
                      and re.match(r"^写本第\d+章", "".join(element.itertext()))
                  ]
                  folios = re.findall(r"〔クラウス117写本f\.\d+[rv]〕", normalized)
                  assert japanese >= asset["minJapanese"], japanese
                  assert image_refs == asset["imageRefs"], image_refs
                  assert len(chapter_headings) == asset["chapters"], len(chapter_headings)
                  assert len(folios) == asset["folioMarkers"], len(folios)
                  for required in (
                      asset["title"],
                      asset["author"],
                      "独立日本語全訳",
                      "〔クラウス117写本f.160v〕",
                      "〔クラウス117写本f.4r–5v欠葉〕",
                      "写本の物理的要素",
                      "利用・複製に既知の制限なし",
                      "原写本の物理的要素217件",
                      "日本語翻訳版には再利用ライセンスを設定していません",
                  ):
                      assert re.sub(r"\s+", "", required) in normalized, required
                  assert not any(term in text for term in forbidden)
                  assert "\ufffd" not in text and "\x00" not in text
          PY

      - name: Upload release assets and verify downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/current /tmp/verified
          gh release download publications-current --pattern SHA256SUMS.txt --dir /tmp/current --repo "$GITHUB_REPOSITORY"

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          assets = json.loads(os.environ["ASSET_MANIFEST"])
          names = {asset["name"] for asset in assets}
          current = Path("/tmp/current/SHA256SUMS.txt").read_text(encoding="utf-8").splitlines()
          kept = [
              line for line in current
              if len(line.split(maxsplit=1)) != 2 or line.split(maxsplit=1)[1] not in names
          ]
          kept.extend(f'{asset["sha256"]}  {asset["name"]}' for asset in assets)
          Path("/tmp/SHA256SUMS.txt").write_text("\n".join(kept) + "\n", encoding="utf-8")
          PY

          mapfile -t asset_paths < <(
            python3 - <<'PY'
          import json
          import os
          for asset in json.loads(os.environ["ASSET_MANIFEST"]):
              print("/tmp/tezozomoc-assets/" + asset["name"])
          PY
          )
          gh release upload publications-current "${asset_paths[@]}" /tmp/SHA256SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"

          mapfile -t asset_names < <(
            python3 - <<'PY'
          import json
          import os
          for asset in json.loads(os.environ["ASSET_MANIFEST"]):
              print(asset["name"])
          PY
          )
          for name in "${asset_names[@]}"; do
            gh release download publications-current --pattern "$name" --dir /tmp/verified --repo "$GITHUB_REPOSITORY"
          done
          gh release download publications-current --pattern SHA256SUMS.txt --dir /tmp/verified --repo "$GITHUB_REPOSITORY"

          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          assets = json.loads(os.environ["ASSET_MANIFEST"])
          root = Path("/tmp/verified")
          sums = root.joinpath("SHA256SUMS.txt").read_text(encoding="utf-8").splitlines()
          for asset in assets:
              data = root.joinpath(asset["name"]).read_bytes()
              assert len(data) == asset["size"]
              assert hashlib.sha256(data).hexdigest() == asset["sha256"]
              assert f'{asset["sha256"]}  {asset["name"]}' in sums
          PY

      - name: Remove one-time workflow and staging branch
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -B cleanup origin/main
            if [ -f "$WORKFLOW_PATH" ]; then
              git rm "$WORKFLOW_PATH"
            fi
            git rm -f .github/publication-failures/tezozomoc-release-*.txt 2>/dev/null || true
            if git diff --cached --quiet; then
              break
            fi
            git commit -m "Remove completed Tezozomoc release workflow"
            if git push origin HEAD:main; then
              break
            fi
            if [ "$attempt" = 3 ]; then
              exit 1
            fi
          done
          git push origin --delete "$STAGING_BRANCH" || true

      - name: Record workflow failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          failure_path=".github/publication-failures/tezozomoc-release-$GITHUB_RUN_ID.txt"
          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -B failure origin/main
            mkdir -p "$(dirname "$failure_path")"
            printf 'run_id=%s\nrun_url=https://github.com/%s/actions/runs/%s\n' "$GITHUB_RUN_ID" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > "$failure_path"
            git add "$failure_path"
            git commit -m "Record failed Tezozomoc release workflow"
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          exit 1
