name: Publish Guzman 1883 once

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/publish-guzman-1883-once.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: publication-release
  cancel-in-progress: true

env:
  SLUG: guzman-apuntamientos-topografia-salvador-1883
  PDF_NAME: David_J_Guzman_Apuntamientos_Topografia_Salvador_1883_Japanese_Complete_Translation.pdf
  EPUB_NAME: David_J_Guzman_Apuntamientos_Topografia_Salvador_1883_Japanese_Complete_Translation.epub
  PDF_SHA: 3cb5d25d7306d6d650c5d26c7d8972adeba3147e1cfa871d639472b8f9999022
  EPUB_SHA: a5e4e9066e1eba8f4202c8c0a7600cc2a1c405645f21aea265efac037e0a9990
  COVER_SHA: 085a53cb64ef3fb4ac78c46dee5e0c25ff5de512c3d268a0c7f687f042ea2861
  STAGING_BRANCH: agent/publication-upload-guzman-20260824
  ARCHIVE_COMMIT: da4be82b510b0a6350b71ae25cec82e99b78da9b
  GH_TOKEN: ${{ github.token }}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out publication source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use isolated publication branch
        run: git checkout -B publish-guzman-1883 "$GITHUB_SHA"

      - name: Prepare progress reporting
        run: |
          mkdir -p "$RUNNER_TEMP/publication-bin"
          cat > "$RUNNER_TEMP/publication-bin/report-status" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          status="$1"
          detail="${2:-}"
          path="publication-status-guzman.json"
          endpoint="repos/$GITHUB_REPOSITORY/contents/$path"
          body="$(jq -cn \
            --arg status "$status" \
            --arg detail "$detail" \
            --arg head_sha "$GITHUB_SHA" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg updated_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{status:$status,detail:$detail,head_sha:$head_sha,run_id:$run_id,run_attempt:$run_attempt,updated_at:$updated_at}')"
          encoded="$(printf '%s' "$body" | base64 -w0)"
          sha="$(gh api --method GET "$endpoint" -f ref="$STAGING_BRANCH" --jq .sha 2>/dev/null || true)"
          args=(--method PUT "$endpoint" -f "message=Report Guzman publication: $status" -f "branch=$STAGING_BRANCH" -f "content=$encoded")
          if test -n "$sha"; then
            args+=(-f "sha=$sha")
          fi
          gh api "${args[@]}" >/dev/null
          SH
          chmod +x "$RUNNER_TEMP/publication-bin/report-status"
          "$RUNNER_TEMP/publication-bin/report-status" started

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install PDF inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Restore verified PDF and EPUB cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .cache/fulltext-assets
            .cache/fulltext-ocr
          key: fulltext-assets-${{ hashFiles('assets-manifest.json') }}
          restore-keys: |
            fulltext-assets-

      - name: Reconstruct and verify release payload
        id: payload
        run: |
          bundle="$RUNNER_TEMP/guzman-public-assets.tar.gz"
          : > "$bundle"
          for sha in 3a927eccaffeb470569fff583d31e86a60d80554 54c04b1e553d374013aada7f1454e8ccb4d7d1d1 2ad7a2ca06d881b4aa66e5a4bd364ef9c66cc06a 82c0af89e16cb32025d7f8a1112b025c643ffe2a 7016e68b021cf77d8aca20d80bbac99f58df105d 168c64fc6e3fd613cd6fd8eeabd80678eb4429d4 a7a6107a68cc51bed70f0cd17a429fd90d9d1aa6 c9dd4002f3dc1fe64471628cc421722c605d8733 f1d07d0f5b62be64b02ca149b5e6052f5537ee8a d2222aa9ba3591528cad5ab5ab02121bda81231e 12b0344dda350426d529583c5dc079895330efe7 806f699377b4e4f8e72026c81e19a17686604e1d f68d96436ba09a0bfe9920286f487caacd933ab9 b635dacf822b41e2223b8b301b45b6f575d7bea4 0b335f6ca833eb159cf85bf003b634c10c69976f 4e8bb9b5e29b01c2129dfd06c3fa473fe8442cda; do
            gh api "repos/$GITHUB_REPOSITORY/git/blobs/$sha" --jq .content |
              tr -d '\n' | base64 -d >> "$bundle"
          done
          test "$(stat -c %s "$bundle")" = "4165273"
          echo "6d76d88a7c76d36cc44177bbbac7552602f535a41c146e3380e84ffbc6458860  $bundle" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/guzman-release"
          tar -xzf "$bundle" -C "$RUNNER_TEMP/guzman-release"
          payload="$RUNNER_TEMP/guzman-release/release-payload"
          test "$(stat -c %s "$payload/$PDF_NAME")" = "6450961"
          test "$(stat -c %s "$payload/$EPUB_NAME")" = "586205"
          test "$(stat -c %s "$payload/cover.jpg")" = "115128"
          echo "$PDF_SHA  $payload/$PDF_NAME" | sha256sum -c -
          echo "$EPUB_SHA  $payload/$EPUB_NAME" | sha256sum -c -
          echo "$COVER_SHA  $payload/cover.jpg" | sha256sum -c -
          test "$(pdfinfo "$payload/$PDF_NAME" | awk '/^Pages:/ {print $2}')" = "569"
          unzip -t "$payload/$EPUB_NAME"

      - name: Report verified payload
        run: |
          "$RUNNER_TEMP/publication-bin/report-status" payload_verified

      - name: Update catalogue, archive ledger, and manifests
        id: metadata
        run: |
          python3 - <<'PY'
          import base64
          import json
          from pathlib import Path

          slug = "guzman-apuntamientos-topografia-salvador-1883"
          record = json.loads(base64.b64decode(""))
          metadata = json.loads(base64.b64decode(""))

          publications_path = Path("src/publications.mjs")
          publications = publications_path.read_text(encoding="utf-8")
          if f'"slug": "{slug}"' in publications:
              raise SystemExit(f"{slug} already exists")
          record_text = "\n".join("  " + line for line in json.dumps(record, ensure_ascii=False, indent=2).splitlines())
          record_marker = "const publicationRecords = [\n"
          if record_marker not in publications:
              raise SystemExit("publication record marker missing")
          publications = publications.replace(record_marker, record_marker + record_text + ",\n", 1)

          metadata_text = "\n".join(json.dumps({slug: metadata}, ensure_ascii=False, indent=2).splitlines()[1:-1])
          metadata_marker = "const publicationMetadata = {\n"
          if metadata_marker not in publications:
              raise SystemExit("publication metadata marker missing")
          publications = publications.replace(metadata_marker, metadata_marker + metadata_text + ",\n", 1)
          publications_path.write_text(publications, encoding="utf-8")

          archive_path = Path("master-archive.json")
          archive = json.loads(archive_path.read_text(encoding="utf-8"))
          archive_commit = "da4be82b510b0a6350b71ae25cec82e99b78da9b"
          archive["archive_commit"] = archive_commit
          for fallback in archive.get("release_fallbacks", {}).values():
              fallback["ledger_commit"] = archive_commit
          archive["publications"][slug] = f"publications/{slug}/master.docx"
          archive["publications"] = dict(sorted(archive["publications"].items()))
          archive_path.write_text(json.dumps(archive, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          manifest_path = Path("assets-manifest.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          new_assets = [
              {
                  "path": f"publications/{slug}/David_J_Guzman_Apuntamientos_Topografia_Salvador_1883_Japanese_Complete_Translation.epub",
                  "url": "https://github.com/takochanchan/takochanchan.github.io/releases/download/publications-current/David_J_Guzman_Apuntamientos_Topografia_Salvador_1883_Japanese_Complete_Translation.epub",
                  "size": 586205,
                  "sha256": "a5e4e9066e1eba8f4202c8c0a7600cc2a1c405645f21aea265efac037e0a9990",
              },
              {
                  "path": f"publications/{slug}/David_J_Guzman_Apuntamientos_Topografia_Salvador_1883_Japanese_Complete_Translation.pdf",
                  "url": "https://github.com/takochanchan/takochanchan.github.io/releases/download/publications-current/David_J_Guzman_Apuntamientos_Topografia_Salvador_1883_Japanese_Complete_Translation.pdf",
                  "size": 6450961,
                  "sha256": "3cb5d25d7306d6d650c5d26c7d8972adeba3147e1cfa871d639472b8f9999022",
              },
              {
                  "path": f"publications/{slug}/cover.jpg",
                  "url": f"https://takochanchan.github.io/publications/{slug}/cover.jpg",
                  "size": 115128,
                  "sha256": "085a53cb64ef3fb4ac78c46dee5e0c25ff5de512c3d268a0c7f687f042ea2861",
              },
          ]
          existing = {asset["path"] for asset in manifest["assets"]}
          overlap = existing & {asset["path"] for asset in new_assets}
          if overlap:
              raise SystemExit(f"asset entries already exist: {sorted(overlap)}")
          manifest["assets"].extend(new_assets)
          manifest["assets"].sort(key=lambda asset: asset["path"])
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          epub_builder_path = Path("scripts/build-epubs.py")
          epub_builder = epub_builder_path.read_text(encoding="utf-8")
          source_entry = (
              '    "guzman-apuntamientos-topografia-salvador-1883": SOURCES\n'
              '    / "翻訳サイト"\n'
              '    / "Guzman_Apuntamientos_1883_Japanese_Complete_Translation.docx",\n'
          )
          source_marker = "}\n\nMARKDOWN_SOURCES = {"
          if slug in epub_builder:
              raise SystemExit("EPUB source route already exists")
          if source_marker not in epub_builder:
              raise SystemExit("EPUB source marker missing")
          epub_builder_path.write_text(epub_builder.replace(source_marker, source_entry + "}\n\nMARKDOWN_SOURCES = {", 1), encoding="utf-8")

          validator_path = Path("scripts/validate-epubs.py")
          validator = validator_path.read_text(encoding="utf-8")
          old_validator = 'assert len(items) == 259, f"expected 259 publications, found {len(items)}"'
          new_validator = 'assert len(items) == 260, f"expected 260 publications, found {len(items)}"'
          if validator.count(old_validator) != 1:
              raise SystemExit("EPUB publication count marker missing")
          validator_path.write_text(validator.replace(old_validator, new_validator), encoding="utf-8")

          tests_path = Path("tests/archive.test.mjs")
          tests = tests_path.read_text(encoding="utf-8")
          old_test = "assert.equal(publications.length, 259);"
          if tests.count(old_test) != 1:
              raise SystemExit("catalogue count marker missing")
          tests_path.write_text(tests.replace(old_test, "assert.equal(publications.length, 260);"), encoding="utf-8")

          queries_path = Path("scripts/search/verify-queries.mjs")
          queries = queries_path.read_text(encoding="utf-8")
          old_query_count = 'await verifyCounts("ポ", { books: 51, papers: 11 });'
          new_query_count = 'await verifyCounts("ポ", { books: 52, papers: 11 });'
          if queries.count(old_query_count) != 1:
              raise SystemExit("literal search count marker missing")
          queries_path.write_text(queries.replace(old_query_count, new_query_count), encoding="utf-8")

          revision_path = Path("REVISION_LOG.md")
          revision = revision_path.read_text(encoding="utf-8")
          heading = "# 改訂記録\n"
          entry = base64.b64decode("").decode("utf-8")
          if heading not in revision or slug in revision:
              raise SystemExit("revision log marker missing or duplicate")
          revision_path.write_text(revision.replace(heading, heading + "\n" + entry, 1), encoding="utf-8")
          PY

          payload="$RUNNER_TEMP/guzman-release/release-payload"
          mkdir -p "static/publications/$SLUG"
          cp "$payload/cover.jpg" "static/publications/$SLUG/cover.jpg"
          mkdir -p "$RUNNER_TEMP/release-tree/publications/$SLUG"
          cp "$payload/$PDF_NAME" "$RUNNER_TEMP/release-tree/publications/$SLUG/$PDF_NAME"
          cp "$payload/$EPUB_NAME" "$RUNNER_TEMP/release-tree/publications/$SLUG/$EPUB_NAME"
          cp "$payload/cover.jpg" "$RUNNER_TEMP/release-tree/publications/$SLUG/cover.jpg"
          mkdir -p ".cache/fulltext-assets/publications/$SLUG"
          cp "$payload/$PDF_NAME" ".cache/fulltext-assets/publications/$SLUG/$PDF_NAME"
          cp "$payload/$EPUB_NAME" ".cache/fulltext-assets/publications/$SLUG/$EPUB_NAME"

      - name: Report prepared publication metadata
        run: |
          "$RUNNER_TEMP/publication-bin/report-status" metadata_prepared

      - name: Install build dependencies
        run: npm ci

      - name: Ensure PDF text and OCR tools are available
        run: |
          if ! command -v pdftotext || ! command -v tesseract; then
            sudo apt-get update
            sudo apt-get install -y poppler-utils tesseract-ocr
          fi

      - name: Validate EPUB, site build, and full-text search before release
        id: gate
        run: |
          "$RUNNER_TEMP/publication-bin/report-status" indexing_and_tests
          python3 scripts/validate-epubs.py "$RUNNER_TEMP/release-tree" --slug "$SLUG"
          npm run build
          npm run fetch:search-assets
          npm run build:search
          npm run verify:search
          npm test

      - name: Report passed pre-publication gate
        run: |
          "$RUNNER_TEMP/publication-bin/report-status" prepublication_gate_passed

      - name: Save verified asset cache
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            .cache/fulltext-assets
            .cache/fulltext-ocr
          key: fulltext-assets-${{ hashFiles('assets-manifest.json') }}

      - name: Save verified search index
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: dist/search
          key: fulltext-index-fernandez-historia-costa-rica-v1-${{ hashFiles('assets-manifest.json', 'master-archive.json', 'src/publications.mjs', 'scripts/search/build-index.mjs', 'scripts/search/create-manifest.mjs', 'scripts/search/extract-corpus.py', 'package-lock.json') }}

      - name: Confirm remote main is unchanged
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"

      - name: Upload and re-download verified Release assets
        id: release
        run: |
          payload="$RUNNER_TEMP/guzman-release/release-payload"
          checksum_dir="$RUNNER_TEMP/release-checksums"
          verify_dir="$RUNNER_TEMP/release-verify"
          mkdir -p "$checksum_dir" "$verify_dir"
          gh release download publications-current --pattern SHA256SUMS.txt --dir "$checksum_dir"
          python3 - "$checksum_dir/SHA256SUMS.txt" <<'PY'
          import sys
          from pathlib import Path
          path = Path(sys.argv[1])
          additions = {
              "David_J_Guzman_Apuntamientos_Topografia_Salvador_1883_Japanese_Complete_Translation.pdf":
                  "3cb5d25d7306d6d650c5d26c7d8972adeba3147e1cfa871d639472b8f9999022",
              "David_J_Guzman_Apuntamientos_Topografia_Salvador_1883_Japanese_Complete_Translation.epub":
                  "a5e4e9066e1eba8f4202c8c0a7600cc2a1c405645f21aea265efac037e0a9990",
          }
          kept = []
          for line in path.read_text(encoding="utf-8").splitlines():
              if not line.strip():
                  continue
              name = line.split("  ", 1)[1] if "  " in line else ""
              if name not in additions:
                  kept.append(line)
          kept.extend(f"{digest}  {name}" for name, digest in additions.items())
          kept.sort(key=lambda line: line.split("  ", 1)[1])
          path.write_text("\n".join(kept) + "\n", encoding="utf-8")
          PY
          gh release upload publications-current             "$payload/$PDF_NAME"             "$payload/$EPUB_NAME"             "$checksum_dir/SHA256SUMS.txt"             --clobber
          gh release download publications-current             --pattern "$PDF_NAME"             --pattern "$EPUB_NAME"             --pattern SHA256SUMS.txt             --dir "$verify_dir"
          test "$(stat -c %s "$verify_dir/$PDF_NAME")" = "6450961"
          test "$(stat -c %s "$verify_dir/$EPUB_NAME")" = "586205"
          echo "$PDF_SHA  $verify_dir/$PDF_NAME" | sha256sum -c -
          echo "$EPUB_SHA  $verify_dir/$EPUB_NAME" | sha256sum -c -
          grep -Fx "$PDF_SHA  $PDF_NAME" "$verify_dir/SHA256SUMS.txt"
          grep -Fx "$EPUB_SHA  $EPUB_NAME" "$verify_dir/SHA256SUMS.txt"
          test "$(pdfinfo "$verify_dir/$PDF_NAME" | awk '/^Pages:/ {print $2}')" = "569"
          unzip -t "$verify_dir/$EPUB_NAME"

      - name: Report verified Release assets
        run: |
          "$RUNNER_TEMP/publication-bin/report-status" release_verified

      - name: Commit verified publication
        id: publish
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add             src/publications.mjs             master-archive.json             assets-manifest.json             scripts/build-epubs.py             scripts/validate-epubs.py             scripts/search/verify-queries.mjs             tests/archive.test.mjs             REVISION_LOG.md             "static/publications/$SLUG/cover.jpg"
          git rm .github/workflows/publish-guzman-1883-once.yml
          git commit -m "Publish Guzmán Apuntamientos 1883"
          git push origin HEAD:main
          final_sha="$(git rev-parse HEAD)"
          echo "sha=$final_sha" >> "$GITHUB_OUTPUT"
          encoded_branch="$(python3 -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["STAGING_BRANCH"], safe=""))')"
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$encoded_branch" >/dev/null 2>&1 || true

      - name: Deploy verified site
        env:
          FINAL_SHA: ${{ steps.publish.outputs.sha }}
        run: |
          gh workflow run pages.yml --ref main
          run_id=""
          for attempt in $(seq 1 40); do
            run_id="$(gh run list --workflow pages.yml --branch main --event workflow_dispatch --limit 30               --json databaseId,headSha,createdAt               --jq ".[] | select(.headSha == \"$FINAL_SHA\") | .databaseId" | head -1)"
            test -n "$run_id" && break
            sleep 5
          done
          test -n "$run_id"
          gh run watch "$run_id" --exit-status

      - name: Verify live publication
        id: live
        run: |
          site="https://takochanchan.github.io"
          page="$site/publications/$SLUG/"
          for attempt in $(seq 1 24); do
            if curl -fsSL "$page" -o "$RUNNER_TEMP/live-page.html" &&
               grep -Fq "サルバドル共和国自然地理覚書" "$RUNNER_TEMP/live-page.html"; then
              break
            fi
            sleep 10
          done
          grep -Fq "サルバドル共和国自然地理覚書" "$RUNNER_TEMP/live-page.html"
          curl -fsSL "$site/sitemap-books.xml" | grep -Fq "$site/publications/$SLUG/"
          curl -fsSL "$site/search/search-meta.json" -o "$RUNNER_TEMP/search-meta.json"
          jq -e --arg slug "$SLUG" '.workSlugs | index($slug) != null' "$RUNNER_TEMP/search-meta.json"
          curl -fsSL "$site/search/maps/$SLUG.json" -o "$RUNNER_TEMP/search-map.json"
          jq -e             --arg url "/publications/$SLUG/"             --arg sha "$PDF_SHA"             '.canonicalUrl == $url and .pdfSha256 == $sha and (.blocks | length) > 0'             "$RUNNER_TEMP/search-map.json"
          curl -fsSL "https://github.com/takochanchan/takochanchan.github.io/releases/download/publications-current/SHA256SUMS.txt"             -o "$RUNNER_TEMP/live-SHA256SUMS.txt"
          grep -Fx "$PDF_SHA  $PDF_NAME" "$RUNNER_TEMP/live-SHA256SUMS.txt"
          grep -Fx "$EPUB_SHA  $EPUB_NAME" "$RUNNER_TEMP/live-SHA256SUMS.txt"

      - name: Report pre-publication failure
        if: failure() && steps.publish.outcome != 'success'
        env:
          DETAIL: payload=${{ steps.payload.outcome }},metadata=${{ steps.metadata.outcome }},gate=${{ steps.gate.outcome }},release=${{ steps.release.outcome }}
        run: |
          "$RUNNER_TEMP/publication-bin/report-status" failed "$DETAIL"
