    steps:
      - name: Reassemble and verify ten assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/galindo-assets
          while IFS='|' read -r _key name size digest blobs; do
            test -n "$name" || continue
            target="/tmp/galindo-assets/$name"
            : > "$target"
            for blob_sha in $blobs; do
              gh api "repos/$GITHUB_REPOSITORY/git/blobs/$blob_sha" --jq .content |
                tr -d '\n' | base64 --decode >> "$target"
            done
            echo "$digest  $target" | sha256sum -c -
            test "$(stat -c %s "$target")" = "$size"
          done <<< "$ASSETS"

      - name: Update shared checksums and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/current-release /tmp/verified-release
          gh release download publications-current --pattern SHA256SUMS.txt --dir /tmp/current-release --repo "$GITHUB_REPOSITORY"
          python3 - <<'PY'
          import os
          from pathlib import Path
          source = Path("/tmp/current-release/SHA256SUMS.txt")
          entries = {}
          order = []
          for line in source.read_text(encoding="utf-8").splitlines():
              digest, sep, name = line.partition("  ")
              assert sep and len(digest) == 64 and name and name not in entries
              entries[name] = digest
              order.append(name)
          added = 0
          for line in os.environ["ASSETS"].splitlines():
              if not line.strip():
                  continue
              _, name, _, digest, _ = line.split("|", 4)
              assert name not in entries, name
              entries[name] = digest
              order.append(name)
              added += 1
          assert added == 10
          Path("/tmp/SHA256SUMS.txt").write_text(
              "".join(f"{entries[name]}  {name}\n" for name in order),
              encoding="utf-8",
          )
          PY
          files=()
          while IFS='|' read -r _key name _size _digest _blobs; do
            test -n "$name" || continue
            files+=("/tmp/galindo-assets/$name")
          done <<< "$ASSETS"
          gh release upload publications-current "${files[@]}" /tmp/SHA256SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"
          while IFS='|' read -r _key name size digest _blobs; do
            test -n "$name" || continue
            gh release download publications-current --pattern "$name" --dir /tmp/verified-release --repo "$GITHUB_REPOSITORY"
            echo "$digest  /tmp/verified-release/$name" | sha256sum -c -
            test "$(stat -c %s "/tmp/verified-release/$name")" = "$size"
          done <<< "$ASSETS"
          gh release download publications-current --pattern SHA256SUMS.txt --dir /tmp/verified-release --repo "$GITHUB_REPOSITORY"
          cmp /tmp/SHA256SUMS.txt /tmp/verified-release/SHA256SUMS.txt

      - name: Remove one-time workflow
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          path=.github/workflows/publish-galindo-five-20260801.yml
          sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/$path?ref=main" --jq .sha)"
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/contents/$path"             -f message="Remove completed Galindo five-paper release workflow"             -f sha="$sha" -f branch=main

