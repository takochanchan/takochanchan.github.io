name: Transfer approved Aparicio 1861 publication files
on:
  push:
    branches: [agent/ramirez-aparicio1861-publish-20261120]
    paths: [.aparicio1861-public-request.json]

permissions:
  contents: read
concurrency:
  group: publication-release-transfer
  cancel-in-progress: false

jobs:
  test-and-transfer:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: transfer
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: c4ae178f3d19c9d31d8f936aff65f6b19e3c2a59
          path: candidate
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate candidate ledgers and reconstruct approved bytes
        working-directory: transfer
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .aparicio1861-transfer.py stage "$RUNNER_TEMP/aparicio1861-assets" ../candidate
      - name: Publication build, regression tests and EPUB format check
        working-directory: candidate
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npm test
          python3 ../transfer/.aparicio1861-readback.py --expect ../transfer/.aparicio1861-expectations.json --html dist/publications/ramirez-aparicio-los-conventos-suprimidos-en-mejico-1861/index.html
          target=dist/publications/ramirez-aparicio-los-conventos-suprimidos-en-mejico-1861
          mkdir -p "$target"
          cp "$RUNNER_TEMP/aparicio1861-assets/ramirez-aparicio-los-conventos-suprimidos-en-mejico-1861.epub" "$target/"
          python3 scripts/validate-epubs.py dist --slug ramirez-aparicio-los-conventos-suprimidos-en-mejico-1861
      - name: Upload and re-download approved PDF, EPUB and checksum list
        working-directory: transfer
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .aparicio1861-transfer.py transfer "$RUNNER_TEMP/aparicio1861-assets" ../candidate
      - uses: actions/upload-artifact@v4
        with:
          name: aparicio1861-public-verification
          path: transfer/aparicio1861-public-verification.json
          if-no-files-found: error
