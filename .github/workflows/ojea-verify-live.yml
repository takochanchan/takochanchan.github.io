name: Verify live Ojea publication
on:
  push:
    branches: [main]
    paths: [src/ojea-publication.mjs, .github/workflows/ojea-verify-live.yml]
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Wait for this catalogue deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,os,subprocess,time
          for attempt in range(90):
              result=json.loads(subprocess.check_output(['gh','api','repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs?head_sha='+os.environ['GITHUB_SHA']]))
              runs=[r for r in result['workflow_runs'] if r['name']=='Deploy archive to GitHub Pages']
              if runs and runs[0]['status']=='completed':
                  assert runs[0]['conclusion']=='success', runs[0]['conclusion']
                  print('Pages succeeded',runs[0]['id'])
                  break
              time.sleep(10)
          else: raise SystemExit('Pages deployment timed out')
          PY
      - name: Install PDF inspection dependency
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Verify live bibliography, order, overview, and exact final assets
        run: |
          python3 - <<'PY'
          import json,hashlib,urllib.request,tempfile,pathlib,zipfile,subprocess,re,html as H
          slug='ojea-libro-tercero-historia-religiosa-mexico-1897'
          group='davila-padilla-franco-historia-santiago-mexico'
          url='https://takochanchan.github.io/publications/'+group+'/'
          html=urllib.request.urlopen(url,timeout=60).read().decode()
          for text in ['メキシコ・サンティアゴ管区史','Agustín Dávila Padilla','Hernando Ojea','Alonso Franco','1608','1897','第三書','https://cdigital.cabu.uanl.mx/ffdr/1/1020000364.html','日本語翻訳版 PDF・EPUB（全3分冊）','2340頁']:
              assert text in H.unescape(html), text
          names=['Agustin_Davila_Padilla_Historia_Santiago_Mexico_1596_Japanese_Translation.pdf','Hernando_Ojea_Libro_Tercero_Historia_Religiosa_1897_Japanese_Translation.pdf','Alonso_Franco_Historia_Provincia_Santiago_Mexico_Segunda_Parte_1900_Japanese_Translation.pdf']
          positions=[html.index(name) for name in names]
          assert positions==sorted(positions), positions
          overview=json.load(open('src/publication-overviews.json'))['records'][slug]
          assert 900 <= len(overview) <= 1000
          for para in overview.split('\n\n'): assert para in H.unescape(html), para
          for oldslug in ['davila-padilla-historia-santiago-mexico-1596',slug,'franco-historia-santiago-mexico-segunda-parte-1900']:
              old=urllib.request.urlopen('https://takochanchan.github.io/publications/'+oldslug+'/',timeout=60).read().decode()
              assert '/publications/'+group+'/' in old
          assets=[a for a in json.load(open('assets-manifest.json'))['assets'] if a['path'].startswith('publications/'+slug+'/')]
          root=pathlib.Path(tempfile.mkdtemp())
          for a in assets:
              p=root/pathlib.PurePosixPath(a['path']).name
              with urllib.request.urlopen(a['url'],timeout=120) as response,p.open('wb') as f:
                  while chunk:=response.read(1024*1024): f.write(chunk)
              assert p.stat().st_size==a['size']
              assert hashlib.sha256(p.read_bytes()).hexdigest()==a['sha256']
              if p.suffix=='.epub':
                  with zipfile.ZipFile(p) as z:
                      assert z.testzip() is None
                      assert z.read('mimetype')==b'application/epub+zip'
                      xhtml=''.join(z.read(n).decode() for n in z.namelist() if n.endswith('.xhtml'))
                      assert '本訳について' in xhtml and '1897年12月30日' in xhtml
                      assert 'https://cdigital.cabu.uanl.mx/ffdr/1/1020000364.html' in xhtml
                      assert len(re.findall(r'epub:type="footnote"',xhtml))==317
                      assert len([n for n in z.namelist() if n.lower().endswith(('.jpg','.jpeg','.png','.svg','.gif'))])==1
              if p.suffix=='.pdf':
                  info=subprocess.check_output(['pdfinfo',str(p)],text=True)
                  assert any(line.split()==['Pages:','245'] for line in info.splitlines())
                  images=subprocess.check_output(['pdfimages','-list',str(p)],text=True)
                  assert not any(re.match(r'^\s*\d+\s+\d+\s+',line) for line in images.splitlines())
                  text=subprocess.check_output(['pdftotext',str(p),'-'],text=True)
                  compact=re.sub(r'\s+','',text)
                  assert 'HISTORIARELIGIOSA' in compact
                  assert 'https://cdigital.cabu.uanl.mx/ffdr/1/1020000364.html' in compact
              print('VERIFIED',p.name,a['size'],a['sha256'])
          sums=urllib.request.urlopen('https://github.com/takochanchan/takochanchan.github.io/releases/download/publications-002/SHA256SUMS.txt',timeout=120).read().decode()
          for a in assets:
              if a['path'].endswith(('.pdf','.epub')):
                  name=pathlib.PurePosixPath(a['path']).name
                  assert any(line.split()==[a['sha256'],name] for line in sums.splitlines())
          assert len(assets)==3
          print('Live Ojea bibliography, placement, 955-character overview, PDF, EPUB, and cover verified.')
          PY
