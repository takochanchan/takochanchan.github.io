name: Publish Bancroft three-volume assets

on:
  push:
    branches: [agent/bancroft-assets-20260906]
    paths: ['.publication-transfer/bancroft-volumes.request']

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install pinned production libraries
        run: |
          python -m pip install --disable-pip-version-check \
            Pillow==12.3.0 lxml==6.1.1 pypdf==6.10.0 reportlab==4.4.9

      - name: Restore and verify approved inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p tmp/bancroft/downloads tmp/bancroft/fonts-full tmp/bancroft/epub-src
          gh release download publications-current --repo "$GITHUB_REPOSITORY" \
            --pattern 'Hubert_Howe_Bancroft_History_of_Central_America_1886_1887_Japanese_Complete_Translation.pdf' \
            --pattern 'Hubert_Howe_Bancroft_History_of_Central_America_1886_1887_Japanese_Complete_Translation.epub' \
            --dir tmp/bancroft/downloads
          mv tmp/bancroft/downloads/*.pdf tmp/bancroft/combined.pdf
          mv tmp/bancroft/downloads/*.epub tmp/bancroft/combined.epub
          echo 'dc53bfffb1d60236a866bf1d6ed62bc7d52f63f3f7e65f4df650fddff636de6d  tmp/bancroft/combined.pdf' | sha256sum -c -
          echo '723709d4ab686d69dead17384efbc39f70b435a1ab5e078e5a12c4eb35987442  tmp/bancroft/combined.epub' | sha256sum -c -
          unzip -q tmp/bancroft/combined.epub -d tmp/bancroft/epub-src

          gh release download Sans2.004 --repo notofonts/noto-cjk \
            --pattern '16_NotoSansJP.zip' --dir tmp/bancroft/downloads
          echo '2bbdd2c20f30670b39ca735c96d75f1fdabdb348103e43b820cf17701fd22b18  tmp/bancroft/downloads/16_NotoSansJP.zip' | sha256sum -c -
          unzip -q tmp/bancroft/downloads/16_NotoSansJP.zip -d tmp/bancroft/fonts-full
          echo 'dff723ba59d57d136764a04b9b2d03205544f7cd785a711442d6d2d085ac5073  tmp/bancroft/fonts-full/NotoSansJP-Regular.otf' | sha256sum -c -
          echo '1b0edfb500b73a4fa8a4fcaae1bbbd403994e08e73e3e0da37e70d3853f42c5f  tmp/bancroft/fonts-full/NotoSansJP-Bold.otf' | sha256sum -c -

          gh release download version_2_37 --repo dejavu-fonts/dejavu-fonts \
            --pattern 'dejavu-fonts-ttf-2.37.zip' --dir tmp/bancroft/downloads
          unzip -q tmp/bancroft/downloads/dejavu-fonts-ttf-2.37.zip -d tmp/bancroft/dejavu
          LATIN_FONT=$(find tmp/bancroft/dejavu -name DejaVuSans.ttf -print -quit)
          ITALIC_FONT=$(find tmp/bancroft/dejavu -name DejaVuSerif-Italic.ttf -print -quit)
          test -n "$LATIN_FONT" -a -n "$ITALIC_FONT"
          echo "ae7b7855e115a5966d8b1b3f80f254ccc117ec86f9965e202ee2940453837280  $LATIN_FONT" | sha256sum -c -
          echo "2e39b1d50f90b933b00c7bb54a96afd3f86419b3d717c7cf202e36f2d4973e47  $ITALIC_FONT" | sha256sum -c -
          printf '%s\n' "$LATIN_FONT" > tmp/bancroft/latin-font.path
          printf '%s\n' "$ITALIC_FONT" > tmp/bancroft/italic-font.path

      - name: Generate and validate the three PDF and EPUB pairs
        env:
          BANCROFT_LATIN_FONT: ${{ github.workspace }}/tmp/bancroft/dejavu/dejavu-fonts-ttf-2.37/ttf/DejaVuSans.ttf
          BANCROFT_LATIN_ITALIC_FONT: ${{ github.workspace }}/tmp/bancroft/dejavu/dejavu-fonts-ttf-2.37/ttf/DejaVuSerif-Italic.ttf
        run: |
          set -euo pipefail
          test "$BANCROFT_LATIN_FONT" = "${{ github.workspace }}/$(cat tmp/bancroft/latin-font.path)"
          test "$BANCROFT_LATIN_ITALIC_FONT" = "${{ github.workspace }}/$(cat tmp/bancroft/italic-font.path)"
          python tmp/bancroft/split_publication_volumes.py
          (cd output && sha256sum -c ../tmp/bancroft/public-volume-SHA256SUMS.txt)
          test "$(stat -c %s output/pdf/Hubert_Howe_Bancroft_History_of_Central_America_Volume_I_1886_Japanese_Complete_Translation.pdf)" = 23262511
          test "$(stat -c %s output/pdf/Hubert_Howe_Bancroft_History_of_Central_America_Volume_II_1886_Japanese_Complete_Translation.pdf)" = 22573229
          test "$(stat -c %s output/pdf/Hubert_Howe_Bancroft_History_of_Central_America_Volume_III_1887_Japanese_Complete_Translation.pdf)" = 28303247

          gh release download v5.3.0 --repo w3c/epubcheck \
            --pattern 'epubcheck-5.3.0.zip' --dir tmp/bancroft/downloads
          echo '6c07e68584b2e2ce2f89fe06e1246dfead3eb36b46b340e7d93524f29dcff6c5  tmp/bancroft/downloads/epubcheck-5.3.0.zip' | sha256sum -c -
          unzip -q tmp/bancroft/downloads/epubcheck-5.3.0.zip -d tmp/bancroft/epubcheck
          for epub in output/epub/*.epub; do
            java -jar tmp/bancroft/epubcheck/epubcheck-5.3.0/epubcheck.jar "$epub"
          done

      - name: Upload checksum-approved public assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload publications-current --repo "$GITHUB_REPOSITORY" --clobber \
            output/pdf/Hubert_Howe_Bancroft_History_of_Central_America_Volume_I_1886_Japanese_Complete_Translation.pdf \
            output/epub/Hubert_Howe_Bancroft_History_of_Central_America_Volume_I_1886_Japanese_Complete_Translation.epub \
            output/pdf/Hubert_Howe_Bancroft_History_of_Central_America_Volume_II_1886_Japanese_Complete_Translation.pdf \
            output/epub/Hubert_Howe_Bancroft_History_of_Central_America_Volume_II_1886_Japanese_Complete_Translation.epub \
            output/pdf/Hubert_Howe_Bancroft_History_of_Central_America_Volume_III_1887_Japanese_Complete_Translation.pdf \
            output/epub/Hubert_Howe_Bancroft_History_of_Central_America_Volume_III_1887_Japanese_Complete_Translation.epub

      - name: Redownload and verify every uploaded byte
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p release-check verification
          while read -r digest relative; do
            name=${relative#*/}
            gh release download publications-current --repo "$GITHUB_REPOSITORY" \
              --pattern "$name" --dir release-check
            echo "$digest  release-check/$name" | sha256sum -c -
          done < tmp/bancroft/public-volume-SHA256SUMS.txt
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/publications-current" > release.json
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          release = json.loads(Path('release.json').read_text())
          remote = {asset['name']: asset for asset in release['assets']}
          actual = {}
          for path in sorted(Path('release-check').iterdir()):
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              asset = remote[path.name]
              assert path.stat().st_size == asset['size'], path.name
              assert asset.get('digest') == 'sha256:' + digest, path.name
              actual[path.name] = {'size': path.stat().st_size, 'sha256': digest}
          assert len(actual) == 6
          report = {
              'repository': '${{ github.repository }}',
              'release_tag': 'publications-current',
              'workflow_run': '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}',
              'assets_verified': 6,
              'all_downloaded_bytes_verified': True,
              'epubcheck_5_3_0': '0 errors / 0 warnings for all three volumes',
              'assets': actual,
          }
          Path('verification/bancroft-public-volumes-verification.json').write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + '\n'
          )
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: bancroft-public-volumes-verification
          path: verification/bancroft-public-volumes-verification.json
          if-no-files-found: error
          compression-level: 0
