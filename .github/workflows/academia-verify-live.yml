name: Verify live Academia Guatemalteca 1889 publication

on:
  push:
    branches: [agent/academia-guatemalteca-1889-publish-20261004]
    paths: ['.github/workflows/academia-verify-live.yml']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e6470f8327a726bb24816cbdde94e8e7e5c1d340
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install verification dependencies
        run: npm ci --no-audit --no-fund
      - name: Wait for the pinned site deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request
          url = "https://api.github.com/repos/takochanchan/takochanchan.github.io/actions/runs/37158644690"
          for attempt in range(90):
              request = urllib.request.Request(url, headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"], "Accept": "application/vnd.github+json"})
              with urllib.request.urlopen(request, timeout=30) as response:
                  run = json.load(response)
              if run["head_sha"] != "e6470f8327a726bb24816cbdde94e8e7e5c1d340":
                  raise SystemExit("Unexpected publication commit")
              if run["status"] == "completed":
                  if run["conclusion"] != "success":
                      raise SystemExit("Site deployment failed: " + str(run["conclusion"]))
                  print("Pinned site deployment succeeded.")
                  break
              time.sleep(10)
          else:
              raise SystemExit("Site deployment did not complete within 15 minutes")
          PY
      - name: Verify exact deployed catalogue and final asset checksums
        run: npm run verify:remote-search

      - name: Verify live bibliography, rights, cover, PDF and EPUB bytes
        run: python3 .academia-verify-live.py
      - uses: actions/upload-artifact@v4
        with:
          name: academia-live-verification
          path: academia-live-verification.json
