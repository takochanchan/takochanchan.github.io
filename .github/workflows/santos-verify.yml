name: Verify Santos maps and live publication
on:
  push:
    branches: [agent/santos-verify-20261127]
    paths: [.santos-live-plan.json]
permissions:
  contents: read
jobs:
  search-maps:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run build && npm test
      - run: python3 .santos-verify.py maps && npm run verify:remote-search
      - uses: actions/upload-artifact@v4
        with:
          name: santos-map-verification
          path: santos-verification.json
  live-publication:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: python3 .santos-verify.py live
      - uses: actions/upload-artifact@v4
        with:
          name: santos-live-readback
          path: santos-verification.json
