name: Verify live Bellido publication
on:
  push:
    branches: [agent/bellido-live-verify-20261119]
    paths: [.github/workflows/bellido-verify-live.yml]
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Wait for this catalogue deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,os,subprocess,time
          for attempt in range(90):
              result=json.loads(subprocess.check_output(['gh','api','repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs?head_sha='+"3cf171259f8bfde5f5ecb09aa2f20b29ce70ec91"]))
              runs=[r for r in result['workflow_runs'] if r['name']=='Deploy archive to GitHub Pages']
              if runs and runs[0]['status']=='completed':
                  assert runs[0]['conclusion']=='success', runs[0]['conclusion']
                  print('Pages succeeded',runs[0]['id'])
                  break
              time.sleep(10)
          else: raise SystemExit('Pages deployment timed out')
          PY
      - name: Install PDF inspection dependency
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Verify live Bellido bibliography, complete synopsis and asset bytes
        run: |
          python3 - <<'PY'
          import hashlib,html,json,pathlib,re,subprocess,tempfile,time,urllib.request,zipfile
          slug = 'bellido-vida-maria-ana-agueda-de-san-ignacio-1758'
          root = 'https://takochanchan.github.io/publications/' + slug + '/'
          exact = json.load(open('src/publication-overviews.json'))['records'][slug]
          for attempt in range(18):
              try:
                  page = html.unescape(urllib.request.urlopen(root, timeout=30).read().decode())
                  break
              except OSError:
                  if attempt == 17: raise
                  time.sleep(10)
          for word in ['マリア・アナ・アゲダ・デ・サン・イグナシオ伝', 'José Bellido', '1758', 'Public Domain Mark 1.0']:
              assert word in page, word
          for paragraph in exact.split('\n\n'):
              assert paragraph in page, paragraph
          assets = [a for a in json.load(open('assets-manifest.json'))['assets'] if a['path'].startswith('publications/' + slug + '/')]
          assert len(assets) == 3
          with tempfile.TemporaryDirectory() as td:
              for a in assets:
                  p = pathlib.Path(td, pathlib.PurePosixPath(a['path']).name)
                  p.write_bytes(urllib.request.urlopen(a['url'], timeout=120).read())
                  assert p.stat().st_size == a['size'] and hashlib.sha256(p.read_bytes()).hexdigest() == a['sha256'], p.name
                  if p.suffix == '.epub':
                      with zipfile.ZipFile(p) as z:
                          assert z.testzip() is None and z.read('mimetype') == b'application/epub+zip'
                          xhtml = ''.join(z.read(n).decode() for n in z.namelist() if n.endswith('.xhtml'))
                          assert len(re.findall(r'epub:type="footnote"', xhtml)) == 35
                  if p.suffix == '.pdf':
                      info = subprocess.check_output(['pdfinfo', str(p)], text=True)
                      assert 'Pages: 298' in re.sub(r' +', ' ', info)
                      assert '童貞' not in subprocess.check_output(['pdftotext', str(p), '-'], text=True)
                  print(p.name, a['sha256'])
          print('Live separate Bellido bibliography, exact synopsis and three asset checksums verified.')
          PY
