name: Confirm live Cuevas publication
on:
  push:
    branches: [agent/cuevas-historia-publish-20261010]
    paths: [.cuevas-live-check.json]
permissions:
  contents: read
jobs:
  confirm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Confirm actual published page and download availability
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .cuevas-live-check.py
      - uses: actions/upload-artifact@v4
        with:
          name: cuevas-live-confirmation
          path: cuevas-live-confirmation.json
