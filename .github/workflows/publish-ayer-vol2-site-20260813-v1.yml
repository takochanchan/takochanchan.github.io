name: Publish Ayer volume 2 combined site

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/publish-ayer-vol2-site-20260813-v1.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: publish-ayer-vol2-site-20260813-v1
  cancel-in-progress: false

jobs:
  publish-site:
    runs-on: ubuntu-latest
    env:
      EXPECTED_PARENT: eead25e244201a2e684c6840ee6f1073cd3b404c
      EXPECTED_TARGET_TREE: 6924f795586b1c2b8842df3ea93f87267b364485
      STAGING_BRANCH: publish-staging-ayer-vol2-site-20260813-v1
      STAGING_ROOT: .release-staging/ayer-vol2-site-20260813-v1
      PATCH_SHA256: b66032e69b5556f6da6f245088a6d43572c91a216f3b6ce191f0f5035022450e
      PATCH_SIZE: "440940"
      PATCH_PARTS: "23"
      WORKFLOW_PATH: .github/workflows/publish-ayer-vol2-site-20260813-v1.yml
    steps:
      - name: Check out publication branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Reassemble and verify publication patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git diff --name-only "$EXPECTED_PARENT" HEAD)" = "$WORKFLOW_PATH"
          git fetch origin "$STAGING_BRANCH:refs/remotes/origin/$STAGING_BRANCH"
          patch_dir=/tmp/ayer-vol2-site-publish
          mkdir -p "$patch_dir"
          patch_file="$patch_dir/publication.patch"
          mapfile -t parts < <(git ls-tree -r --name-only "refs/remotes/origin/$STAGING_BRANCH" "$STAGING_ROOT" | LC_ALL=C sort)
          test "${#parts[@]}" = "$PATCH_PARTS"
          : > "$patch_file"
          for part in "${parts[@]}"; do
            git show "refs/remotes/origin/$STAGING_BRANCH:$part" >> "$patch_file"
          done
          test "$(stat -c %s "$patch_file")" = "$PATCH_SIZE"
          printf "%s  %s\n" "$PATCH_SHA256" "$patch_file" | sha256sum -c -

      - name: Apply and structurally verify publication
        shell: bash
        run: |
          set -euo pipefail
          patch_file=/tmp/ayer-vol2-site-publish/publication.patch
          git config user.name "Publication Bot"
          git config user.email "actions@users.noreply.github.com"
          git am --3way "$patch_file"
          actual=/tmp/ayer-vol2-actual.txt
          expected=/tmp/ayer-vol2-expected.txt
          git diff --name-status "$EXPECTED_PARENT" HEAD | LC_ALL=C sort > "$actual"
          printf '%s\n' \
            "A	.github/workflows/publish-ayer-vol2-site-20260813-v1.yml" \
            "A	static/publications/ximenez-ayer-ms-1515-volume-2/cover.jpg" \
            "D	static/publications/ximenez-escolios-ayer-ms-1515/cover.jpg" \
            "M	AGENTS.md" \
            "M	PUBLICATION_WORKFLOW.md" \
            "M	assets-manifest.json" \
            "M	master-archive.json" \
            "M	scripts/build-epubs.py" \
            "M	scripts/search/create-manifest.mjs" \
            "M	scripts/search/verify-index.mjs" \
            "M	scripts/search/verify-queries.mjs" \
            "M	scripts/verify-master-archive.mjs" \
            "M	src/publications.mjs" \
            "M	tests/archive.test.mjs" | LC_ALL=C sort > "$expected"
          cmp "$expected" "$actual"
          verify_dir=/tmp/ayer-vol2-tree-check
          mkdir -p "$verify_dir"
          GIT_INDEX_FILE="$verify_dir/index" git read-tree HEAD
          GIT_INDEX_FILE="$verify_dir/index" git rm --cached --quiet "$WORKFLOW_PATH"
          actual_tree="$(GIT_INDEX_FILE="$verify_dir/index" git write-tree)"
          test "$actual_tree" = "$EXPECTED_TARGET_TREE"

      - name: Install and validate site
        env:
          NPM_CONFIG_CACHE: /tmp/ayer-vol2-npm-cache
        run: |
          npm ci
          npm run build
          npm test

      - name: Publish main
        run: git push origin HEAD:main

      - name: Remove staging branch and one-shot workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$STAGING_BRANCH"
          workflow_sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/$WORKFLOW_PATH?ref=main" --jq .sha)"
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/contents/$WORKFLOW_PATH" \
            -f message="Remove completed Ayer volume 2 site workflow" \
            -f sha="$workflow_sha" -f branch=main
          final_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          final_tree="$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$final_sha" --jq .tree.sha)"
          test "$final_tree" = "$EXPECTED_TARGET_TREE"
          gh workflow run pages.yml --ref main
