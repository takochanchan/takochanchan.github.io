name: Publish revised Galindo Palenque memoir once

on:
  pull_request_target:
    types:
      - opened
      - ready_for_review
      - synchronize
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: publications-current-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.head_ref == 'agent/publish-galindo-palenque-revision-20260801'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_SITE_COMMIT: aedf2ecee01c2705ce102357017d86599fc7cf09
      ARCHIVE_COMMIT: 0c83ad5c0c0bf275fcce1c1f9b0a0bc904a883f5
      MANIFEST_BLOB: 020df355a9207051bcf4a0e561e3cd10f98a6a49
      PAPER_PDF_NAME: Galindo_Palenque_Memoir_1832_Complete_Japanese_Translation.pdf
      PAPER_PDF_SIZE: "1026182"
      PAPER_PDF_SHA: 1a7d6f6d6fd7a1ed1606c21d5d7c7d4ed4c0b7668cbf2ca9fd0468471c3ba619
      PAPER_EPUB_NAME: Galindo_Palenque_Memoir_1832_Complete_Japanese_Translation.epub
      PAPER_EPUB_SIZE: "224590"
      PAPER_EPUB_SHA: 5b65374f6d5419fb59c0853e062595a05ab28e1a04a870073cd78cb2037f0f2d
      SITE_SOURCE_SIZE: "96474"
      SITE_SOURCE_SHA: fb0fdd0ef3be4e35717d5fa50997c3828532f4a908418ee2f8effceb20a2bdca

    steps:
      - name: Check out current site
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install publication inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Reassemble and verify staged files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          manifest=/tmp/galindo-palenque-release-manifest.tsv
          gh api "repos/$GITHUB_REPOSITORY/git/blobs/$MANIFEST_BLOB" \
            --jq .content |
            tr -d '\n' |
            base64 --decode > "$manifest"
          test "$(wc -l < "$manifest")" = 3

          while IFS=$'\t' read -r asset_name expected_size expected_sha blob_list; do
            test -n "$asset_name"
            : > "/tmp/$asset_name"
            for blob_sha in $blob_list; do
              gh api "repos/$GITHUB_REPOSITORY/git/blobs/$blob_sha" \
                --jq .content |
                tr -d '\n' |
                base64 --decode >> "/tmp/$asset_name"
            done
            echo "$expected_sha  /tmp/$asset_name" | sha256sum -c -
            test "$(stat -c %s "/tmp/$asset_name")" = "$expected_size"
          done < "$manifest"

      - name: Validate publication PDF
        run: |
          set -euo pipefail
          pdf="/tmp/$PAPER_PDF_NAME"
          pdfinfo "$pdf" | grep -F "Pages:           25"
          pdfinfo "$pdf" | grep -F "Page size:       612 x 792 pts (letter)"
          pdfinfo "$pdf" | grep -F "Tagged:          yes"
          pdffonts "$pdf" > /tmp/galindo-palenque-fonts.txt
          python3 - <<'PY'
          import re
          from pathlib import Path

          lines = Path("/tmp/galindo-palenque-fonts.txt").read_text(
              encoding="utf-8"
          ).splitlines()[2:]
          assert lines
          for line in lines:
              match = re.match(
                  r"^(.+?)\s{2,}(.+?)\s{2,}(.+?)\s{2,}"
                  r"(yes|no)\s+(yes|no)\s+(yes|no)\s+\d+\s+\d+$",
                  line.strip(),
              )
              assert match is not None, line
              assert match.group(4) == "yes", line
          PY
          test "$(pdfimages -list "$pdf" | awk 'NR > 2 && $3 == "image" { count++ } END { print count+0 }')" = 2
          pdftotext -layout "$pdf" /tmp/galindo-palenque-pdf.txt
          for phrase in \
            "パレンケ遺跡に関する覚書" \
            "フアン・ガリンド" \
            "ペルフェクト・バエソ" \
            "Vocabulario de las lenguas castellana y maia"; do
            grep -F -q "$phrase" /tmp/galindo-palenque-pdf.txt
          done
          if grep -F \
            -e "確認用校正刷り" \
            -e "校閲用" \
            -e "未公開" \
            -e "Proof" \
            -e "Unpublished" \
            /tmp/galindo-palenque-pdf.txt; then
            exit 1
          fi
          python3 - <<'PY'
          import re
          from pathlib import Path

          text = Path("/tmp/galindo-palenque-pdf.txt").read_text(encoding="utf-8")
          markers = [int(value) for value in re.findall(r"〔原刊 p\.\s*(\d+)〕", text)]
          assert markers == list(range(198, 218)), markers
          japanese = len(re.findall(r"[\u3040-\u30ff\u3400-\u9fff]", text))
          assert japanese >= 10_000, japanese
          print(f"PDF OK: {japanese:,} Japanese characters, 20 source-page markers")
          PY

      - name: Validate reflowable EPUB edition
        run: |
          set -euo pipefail
          python3 - "/tmp/$PAPER_EPUB_NAME" <<'PY'
          import posixpath
          import re
          import sys
          import zipfile
          from pathlib import PurePosixPath
          from urllib.parse import unquote
          from xml.etree import ElementTree as ET

          path = sys.argv[1]
          container_ns = {
              "c": "urn:oasis:names:tc:opendocument:xmlns:container"
          }
          opf_ns = {
              "opf": "http://www.idpf.org/2007/opf",
              "dc": "http://purl.org/dc/elements/1.1/",
          }
          xhtml_ns = "http://www.w3.org/1999/xhtml"

          with zipfile.ZipFile(path) as archive:
              assert archive.testzip() is None
              names = archive.namelist()
              assert names[0] == "mimetype"
              assert archive.getinfo("mimetype").compress_type == zipfile.ZIP_STORED
              assert archive.read("mimetype") == b"application/epub+zip"

              container = ET.fromstring(archive.read("META-INF/container.xml"))
              rootfile = container.find(".//c:rootfile", container_ns)
              assert rootfile is not None
              opf_path = rootfile.attrib["full-path"]
              opf = ET.fromstring(archive.read(opf_path))
              assert opf.attrib.get("version", "").startswith("3")

              def dc_text(name):
                  element = opf.find(f".//dc:{name}", opf_ns)
                  assert element is not None, name
                  return "".join(element.itertext())

              assert dc_text("title") == "パレンケ遺跡に関する覚書"
              assert dc_text("creator") == "フアン・ガリンド"
              assert dc_text("language").lower().startswith("ja")
              assert "galindo-palenque-1832" in dc_text("identifier")

              base = posixpath.dirname(opf_path)
              manifest = {}
              for item in opf.findall(".//opf:manifest/opf:item", opf_ns):
                  resolved = posixpath.normpath(
                      posixpath.join(base, unquote(item.attrib["href"].split("#", 1)[0]))
                  )
                  assert resolved in names
                  assert archive.getinfo(resolved).file_size > 0
                  manifest[item.attrib["id"]] = (
                      resolved,
                      item.attrib.get("media-type", ""),
                      set(item.attrib.get("properties", "").split()),
                  )
              assert sum("nav" in item[2] for item in manifest.values()) == 1
              assert sum("cover-image" in item[2] for item in manifest.values()) == 1

              spine = opf.findall(".//opf:spine/opf:itemref", opf_ns)
              assert spine
              assert all(item.attrib["idref"] in manifest for item in spine)
              spine_paths = [manifest[item.attrib["idref"]][0] for item in spine]
              assert len(spine_paths) == 9, spine_paths
              assert PurePosixPath(spine_paths[0]).name == "ch001.xhtml", spine_paths
              excluded = {"cover.xhtml", "title_page.xhtml", "nav.xhtml"}
              assert not any(PurePosixPath(item).name in excluded for item in spine_paths)

              text_parts = []
              table_count = 0
              content_images = []
              for resolved, media_type, _properties in manifest.values():
                  if media_type != "application/xhtml+xml":
                      continue
                  document = ET.fromstring(archive.read(resolved))
                  text_parts.extend(document.itertext())
                  table_count += len(document.findall(f".//{{{xhtml_ns}}}table"))
                  for image in document.findall(f".//{{{xhtml_ns}}}img"):
                      source = image.attrib.get("src", "")
                      if "cover" not in PurePosixPath(source).name.lower():
                          content_images.append(image.attrib.get("alt", "").strip())
                  for viewport in document.findall(
                      f".//{{{xhtml_ns}}}meta[@name='viewport']"
                  ):
                      assert not re.search(
                          r"\bwidth\s*=\s*\d+",
                          viewport.attrib.get("content", ""),
                      )

              text = " ".join(text_parts)
              japanese = len(re.findall(r"[\u3040-\u30ff\u3400-\u9fff]", text))
              assert japanese >= 10_000, japanese
              assert table_count == 8, table_count
              assert len(content_images) == 2, content_images
              assert all(content_images), content_images
              for phrase in (
                  "パレンケ遺跡に関する覚書",
                  "フアン・ガリンド",
                  "ペルフェクト・バエソ",
                  "Vocabulario de las lenguas castellana y maia",
              ):
                  assert phrase in text, phrase
              for phrase in (
                  "確認用校正刷り",
                  "校閲用",
                  "未公開",
                  "Proof",
                  "Unpublished",
              ):
                  assert phrase not in text, phrase
              markers = [
                  int(value)
                  for value in re.findall(r"〔原刊 p\.\s*(\d+)〕", text)
              ]
              assert markers == list(range(198, 218)), markers
              print(
                  f"EPUB 3 OK: {japanese:,} Japanese characters, "
                  f"{len(spine_paths)} article documents, "
                  f"{table_count} tables, {len(content_images)} content images"
              )
          PY

      - name: Apply and verify site source
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$BASE_SITE_COMMIT" HEAD
          git diff --quiet "$BASE_SITE_COMMIT"...HEAD -- \
            assets-manifest.json \
            master-archive.json \
            scripts/build-epubs.py \
            src/publications.mjs \
            tests/archive.test.mjs

          mkdir -p /tmp/galindo-palenque-site-source
          python3 - /tmp/galindo-palenque-site-source <<'PY'
          import sys
          import tarfile
          from pathlib import PurePosixPath

          destination = sys.argv[1]
          expected = {
              "assets-manifest.json",
              "master-archive.json",
              "scripts/build-epubs.py",
              "src/publications.mjs",
              "tests/archive.test.mjs",
          }
          with tarfile.open("/tmp/site-source.tar.gz", "r:gz") as archive:
              members = archive.getmembers()
              files = {member.name for member in members if member.isfile()}
              assert files == expected, (files, expected)
              for member in members:
                  path = PurePosixPath(member.name)
                  assert not path.is_absolute()
                  assert ".." not in path.parts
                  assert not (member.issym() or member.islnk() or member.isdev())
              archive.extractall(destination, members=members, filter="data")
          PY
          cp -a /tmp/galindo-palenque-site-source/. .
          rm -f .release-upload-errors/galindo-palenque-revision-*.txt

          grep -F "$ARCHIVE_COMMIT" master-archive.json
          grep -F '"galindo-palenque-1832": "publications/galindo-palenque-1832/master.docx"' master-archive.json
          grep -F 'slug: "galindo-palenque-1832"' src/publications.mjs
          grep -F '198–217頁' src/publications.mjs
          grep -F 'ペルフェクト・バエソ' src/publications.mjs
          grep -F 'remove_book_front_matter_from_short_work_spine' scripts/build-epubs.py
          grep -F 'revised Galindo Palenque record includes the Baezo appendix' tests/archive.test.mjs
          python3 -m json.tool assets-manifest.json >/dev/null
          python3 -m json.tool master-archive.json >/dev/null
          python3 -m py_compile scripts/build-epubs.py
          node --check src/publications.mjs
          npm run build
          npm test
          grep -F 'ペルフェクト・バエソ' dist/publications/galindo-palenque-1832/index.html
          grep -F '<dt>翻訳版</dt><dd>25頁</dd>' dist/publications/galindo-palenque-1832/index.html

      - name: Prepare release checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/current-release
          gh release download publications-current \
            --pattern SHA256SUMS.txt \
            --dir /tmp/current-release \
            --repo "$GITHUB_REPOSITORY"
          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path("/tmp/current-release/SHA256SUMS.txt")
          lines = path.read_text(encoding="utf-8").splitlines()
          assert len(lines) >= 160
          assert len(lines) % 2 == 0
          updates = {
              os.environ["PAPER_PDF_NAME"]: os.environ["PAPER_PDF_SHA"],
              os.environ["PAPER_EPUB_NAME"]: os.environ["PAPER_EPUB_SHA"],
          }
          found = set()
          rewritten = []
          for line in lines:
              digest, separator, name = line.partition("  ")
              assert separator and len(digest) == 64 and name
              if name in updates:
                  digest = updates[name]
                  found.add(name)
              rewritten.append(f"{digest}  {name}")
          assert found == set(updates), (found, updates)
          Path("/tmp/SHA256SUMS.txt").write_text(
              "\n".join(rewritten) + "\n",
              encoding="utf-8",
          )
          PY
          echo "$PAPER_PDF_SHA  /tmp/$PAPER_PDF_NAME" | sha256sum -c -
          echo "$PAPER_EPUB_SHA  /tmp/$PAPER_EPUB_NAME" | sha256sum -c -

      - name: Upload and verify release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload publications-current \
            "/tmp/$PAPER_PDF_NAME" \
            "/tmp/$PAPER_EPUB_NAME" \
            /tmp/SHA256SUMS.txt \
            --clobber \
            --repo "$GITHUB_REPOSITORY"

          mkdir -p /tmp/verified-release
          gh release download publications-current \
            --pattern "$PAPER_PDF_NAME" \
            --pattern "$PAPER_EPUB_NAME" \
            --pattern SHA256SUMS.txt \
            --dir /tmp/verified-release \
            --repo "$GITHUB_REPOSITORY"
          echo "$PAPER_PDF_SHA  /tmp/verified-release/$PAPER_PDF_NAME" | sha256sum -c -
          echo "$PAPER_EPUB_SHA  /tmp/verified-release/$PAPER_EPUB_NAME" | sha256sum -c -
          cmp /tmp/SHA256SUMS.txt /tmp/verified-release/SHA256SUMS.txt

      - name: Commit and push catalogue
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            assets-manifest.json \
            master-archive.json \
            scripts/build-epubs.py \
            src/publications.mjs \
            tests/archive.test.mjs
          git add -A .release-upload-errors
          git diff --cached --check
          git commit -m "Revise Galindo Palenque translation"
          pushed=false
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            npm run build
            npm test
            if git push origin HEAD:main; then
              pushed=true
              break
            fi
            sleep 3
          done
          test "$pushed" = true

      - name: Verify remote repository state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/contents/master-archive.json?ref=main" \
            --jq .content |
            tr -d '\n' |
            base64 --decode |
            grep -F "$ARCHIVE_COMMIT"
          gh api "repos/$GITHUB_REPOSITORY/contents/src/publications.mjs?ref=main" \
            --jq .content |
            tr -d '\n' |
            base64 --decode > /tmp/remote-publications.mjs
          grep -F 'slug: "galindo-palenque-1832"' /tmp/remote-publications.mjs
          grep -F '198–217頁' /tmp/remote-publications.mjs
          grep -F 'ペルフェクト・バエソ' /tmp/remote-publications.mjs
          gh api "repos/$GITHUB_REPOSITORY/contents/assets-manifest.json?ref=main" \
            --jq .content |
            tr -d '\n' |
            base64 --decode > /tmp/remote-assets-manifest.json
          grep -F "$PAPER_PDF_SHA" /tmp/remote-assets-manifest.json
          grep -F "$PAPER_EPUB_SHA" /tmp/remote-assets-manifest.json

      - name: Remove one-time workflow and temporary refs
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          path=.github/workflows/publish-galindo-palenque-revision-20260801.yml
          sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/$path?ref=main" --jq .sha)"
          gh api --method DELETE \
            "repos/$GITHUB_REPOSITORY/contents/$path" \
            -f message="Remove completed Galindo Palenque revision workflow" \
            -f sha="$sha" \
            -f branch=main
          gh pr close "${{ github.event.pull_request.number }}" \
            --repo "$GITHUB_REPOSITORY" --delete-branch || true
          for branch in \
            agent/release-upload-galindo-palenque-revision-20260801 \
            agent/publish-galindo-palenque-revision-20260801; do
            encoded="${branch//\//%2F}"
            gh api --method DELETE \
              "repos/$GITHUB_REPOSITORY/git/refs/heads/$encoded" \
              >/dev/null 2>&1 || true
          done

      - name: Record public diagnostic on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s\n' \
            "Galindo Palenque revision workflow failed. Inspect this run before retrying." \
            "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            > /tmp/galindo-palenque-publication-error.txt
          content="$(base64 -w0 /tmp/galindo-palenque-publication-error.txt)"
          gh api --method PUT \
            "repos/$GITHUB_REPOSITORY/contents/.release-upload-errors/galindo-palenque-revision-${GITHUB_RUN_ID}.txt" \
            -f message="Record Galindo Palenque revision failure" \
            -f content="$content" \
            -f branch=main
