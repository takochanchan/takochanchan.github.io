name: Publish Montufar memoirs once

on:
  pull_request_target:
    types:
      - opened
      - ready_for_review
      - synchronize
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: publications-current-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.head_ref == 'agent/publish-montufar-20260801'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_SITE_COMMIT: d5ada1305b3d51556e4ee649635da5980b584a0b
      ARCHIVE_COMMIT: 4be9df81f8df7d6d0f793363e3c49b75e255b07d
      MANIFEST_BLOB: 566f98a42db50851bd04c45dfbc7a78d18b4025d
      MONTUFAR_PDF_NAME: Manuel_Montufar_Memorias_para_la_historia_de_la_revolucion_de_Centro_America_1832_Japanese_Complete_Translation.pdf
      MONTUFAR_PDF_SIZE: "3048031"
      MONTUFAR_PDF_SHA: 8efe000f65c35509237b5ffce39b3fbdc0f5e5fc8fed98e969657cfac8f37d1c
      MONTUFAR_EPUB_NAME: Manuel_Montufar_Memorias_para_la_historia_de_la_revolucion_de_Centro_America_1832_Japanese_Complete_Translation.epub
      MONTUFAR_EPUB_SIZE: "810496"
      MONTUFAR_EPUB_SHA: 2db0914f2b4066fa384cd89f17d07b2a32cefcab78c8008f21dca455ea658031
      SITE_SOURCE_SIZE: "141379"
      SITE_SOURCE_SHA: 16adfbbfac250d47c6ca063c7e238da58aa1a70559c88ddb463982546bdf2cf2
      MONTUFAR_COVER_SIZE: "57860"
      MONTUFAR_COVER_SHA: 06c4a70a14e9664aa7de246646533e42f01a70c46676a6e2fd5ac3939d7cb9ab

    steps:
      - name: Check out current site
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install publication inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils imagemagick

      - name: Reassemble and verify staged files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          manifest=/tmp/montufar-release-manifest.tsv
          gh api "repos/$GITHUB_REPOSITORY/git/blobs/$MANIFEST_BLOB" \
            --jq .content |
            tr -d '\n' |
            base64 --decode > "$manifest"
          test "$(wc -l < "$manifest")" = 3

          while IFS=$'\t' read -r asset_name expected_size expected_sha blob_list; do
            test -n "$asset_name"
            : > "/tmp/$asset_name"
            for blob_sha in $blob_list; do
              gh api "repos/$GITHUB_REPOSITORY/git/blobs/$blob_sha" \
                --jq .content |
                tr -d '\n' |
                base64 --decode >> "/tmp/$asset_name"
            done
            echo "$expected_sha  /tmp/$asset_name" | sha256sum -c -
            test "$(stat -c %s "/tmp/$asset_name")" = "$expected_size"
          done < "$manifest"

      - name: Validate publication PDF
        run: |
          set -euo pipefail
          pdf="/tmp/$MONTUFAR_PDF_NAME"
          pdfinfo "$pdf" | grep -F "Pages:           267"
          pdfinfo "$pdf" | grep -F "Page size:       612 x 792 pts (letter)"
          pdfinfo "$pdf" | grep -F "Tagged:          yes"
          pdffonts "$pdf" > /tmp/montufar-fonts.txt
          python3 - <<'PY'
          import re
          from pathlib import Path

          lines = Path("/tmp/montufar-fonts.txt").read_text(
              encoding="utf-8"
          ).splitlines()[2:]
          assert lines
          for line in lines:
              match = re.match(
                  r"^(.+?)\s{2,}(.+?)\s{2,}(.+?)\s{2,}"
                  r"(yes|no)\s+(yes|no)\s+(yes|no)\s+\d+\s+\d+$",
                  line.strip(),
              )
              assert match is not None, line
              assert match.group(4) == "yes", line
          PY
          test "$(pdfimages -list "$pdf" | awk 'NR > 2 && $3 == "image" { count++ } END { print count+0 }')" = 1
          pdftotext "$pdf" /tmp/montufar-pdf.txt
          for phrase in \
            "中央アメリカ革命史のための回想録" \
            "マヌエル・モントゥファル" \
            "第五章" \
            "証拠文書" \
            "第5号"; do
            grep -F -q "$phrase" /tmp/montufar-pdf.txt
          done
          if grep -F \
            -e "外部翻訳サービス" \
            -e "外部翻訳API" \
            -e "ローカルLLM" \
            -e "ローカル翻訳モデル" \
            -e "確認用校正刷り" \
            -e "校閲用" \
            -e "未公開" \
            -e "元資料を読もう" \
            /tmp/montufar-pdf.txt; then
            exit 1
          fi

      - name: Validate reflowable EPUB edition
        run: |
          set -euo pipefail
          python3 - "/tmp/$MONTUFAR_EPUB_NAME" <<'PY'
          import posixpath
          import re
          import sys
          import zipfile
          from urllib.parse import unquote
          from xml.etree import ElementTree as ET

          path = sys.argv[1]
          container_ns = {
              "c": "urn:oasis:names:tc:opendocument:xmlns:container"
          }
          opf_ns = {
              "opf": "http://www.idpf.org/2007/opf",
              "dc": "http://purl.org/dc/elements/1.1/",
          }
          xhtml_ns = "http://www.w3.org/1999/xhtml"
          epub_ns = "http://www.idpf.org/2007/ops"

          with zipfile.ZipFile(path) as archive:
              assert archive.testzip() is None
              names = archive.namelist()
              assert names[0] == "mimetype"
              assert archive.getinfo("mimetype").compress_type == zipfile.ZIP_STORED
              assert archive.read("mimetype") == b"application/epub+zip"

              container = ET.fromstring(archive.read("META-INF/container.xml"))
              rootfile = container.find(".//c:rootfile", container_ns)
              assert rootfile is not None
              opf_path = rootfile.attrib["full-path"]
              opf = ET.fromstring(archive.read(opf_path))
              assert opf.attrib.get("version", "").startswith("3")
              title = opf.find(".//dc:title", opf_ns)
              language = opf.find(".//dc:language", opf_ns)
              identifier = opf.find(".//dc:identifier", opf_ns)
              assert title is not None
              assert "".join(title.itertext()) == "中央アメリカ革命史のための回想録"
              assert language is not None
              assert "".join(language.itertext()).lower().startswith("ja")
              assert identifier is not None
              assert "montufar-memorias-revolucion-centro-america-1832" in "".join(
                  identifier.itertext()
              )
              for meta in opf.findall(".//opf:meta", opf_ns):
                  if meta.attrib.get("property") == "rendition:layout":
                      assert (meta.text or "").strip() != "pre-paginated"

              base = posixpath.dirname(opf_path)
              manifest = {}
              for item in opf.findall(".//opf:manifest/opf:item", opf_ns):
                  resolved = posixpath.normpath(
                      posixpath.join(
                          base,
                          unquote(item.attrib["href"].split("#", 1)[0]),
                      )
                  )
                  assert resolved in names
                  assert archive.getinfo(resolved).file_size > 0
                  manifest[item.attrib["id"]] = (
                      resolved,
                      item.attrib.get("media-type", ""),
                      set(item.attrib.get("properties", "").split()),
                  )
              assert sum("nav" in item[2] for item in manifest.values()) == 1
              assert sum(
                  "cover-image" in item[2] for item in manifest.values()
              ) == 1
              assert sum(
                  item[1].startswith("image/") for item in manifest.values()
              ) == 2

              spine = opf.findall(".//opf:spine/opf:itemref", opf_ns)
              assert spine
              assert all(item.attrib["idref"] in manifest for item in spine)
              spine_paths = [manifest[item.attrib["idref"]][0] for item in spine]

              nav_path = next(
                  item[0] for item in manifest.values() if "nav" in item[2]
              )
              nav = ET.fromstring(archive.read(nav_path))
              toc = next(
                  (
                      element
                      for element in nav.iter(f"{{{xhtml_ns}}}nav")
                      if "toc"
                      in element.attrib.get(
                          f"{{{epub_ns}}}type", ""
                      ).split()
                  ),
                  None,
              )
              assert toc is not None
              assert list(toc.iter(f"{{{xhtml_ns}}}a"))

              text_parts = []
              images = []
              headings = []
              footnotes = []
              noterefs = []
              for resolved, media_type, _properties in manifest.values():
                  if media_type != "application/xhtml+xml":
                      continue
                  document = ET.fromstring(archive.read(resolved))
                  text_parts.extend(document.itertext())
                  images.extend(document.iter(f"{{{xhtml_ns}}}img"))
                  for element in document.iter():
                      if re.fullmatch(
                          rf"\{{{re.escape(xhtml_ns)}\}}h[1-6]",
                          element.tag,
                      ):
                          headings.append(element)
                      types = set(
                          element.attrib.get(
                              f"{{{epub_ns}}}type", ""
                          ).split()
                      )
                      if "footnote" in types:
                          footnotes.append(element)
                      if "noteref" in types:
                          noterefs.append(element)

                  for viewport in document.findall(
                      f".//{{{xhtml_ns}}}meta[@name='viewport']"
                  ):
                      assert not re.search(
                          r"\bwidth\s*=\s*\d+",
                          viewport.attrib.get("content", ""),
                      )

              text = " ".join(text_parts)
              japanese = len(
                  re.findall(r"[\u3040-\u30ff\u3400-\u9fff]", text)
              )
              assert japanese >= 190_000, japanese
              assert len(headings) == 52, len(headings)
              assert len(images) == 1, len(images)
              assert all(image.attrib.get("alt", "").strip() for image in images)
              assert len(footnotes) == 35, len(footnotes)
              assert len(noterefs) == 35, len(noterefs)
              for phrase in (
                  "中央アメリカ革命史のための回想録",
                  "マヌエル・モントゥファル",
                  "第五章",
                  "証拠文書",
                  "第5号",
              ):
                  assert phrase in text, phrase
              for phrase in (
                  "外部翻訳サービス",
                  "外部翻訳API",
                  "ローカルLLM",
                  "ローカル翻訳モデル",
                  "確認用校正刷り",
                  "校閲用",
                  "未公開",
                  "元資料を読もう",
              ):
                  assert phrase not in text, phrase
              print(
                  f"EPUB 3 OK: {japanese:,} Japanese characters, "
                  f"{len(headings)} headings, {len(footnotes)} footnotes"
              )
          PY

      - name: Apply and verify site source
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$BASE_SITE_COMMIT" HEAD
          git diff --quiet "$BASE_SITE_COMMIT"...HEAD -- \
            assets-manifest.json \
            master-archive.json \
            scripts/build-epubs.py \
            scripts/validate-epubs.py \
            src/publications.mjs \
            tests/archive.test.mjs \
            static/publications/montufar-memorias-revolucion-centro-america-1832/cover.jpg

          mkdir -p /tmp/montufar-site-source
          python3 - /tmp/montufar-site-source <<'PY'
          import sys
          import tarfile
          from pathlib import PurePosixPath

          destination = sys.argv[1]
          expected = {
              "assets-manifest.json",
              "master-archive.json",
              "scripts/build-epubs.py",
              "scripts/validate-epubs.py",
              "src/publications.mjs",
              "tests/archive.test.mjs",
              "static/publications/montufar-memorias-revolucion-centro-america-1832/cover.jpg",
          }
          with tarfile.open("/tmp/site-source.tar.gz", "r:gz") as archive:
              members = archive.getmembers()
              files = {member.name for member in members if member.isfile()}
              assert files == expected, (files, expected)
              for member in members:
                  path = PurePosixPath(member.name)
                  assert not path.is_absolute()
                  assert ".." not in path.parts
                  assert not (
                      member.issym()
                      or member.islnk()
                      or member.isdev()
                  )
              archive.extractall(
                  destination,
                  members=members,
                  filter="data",
              )
          PY
          cp -a /tmp/montufar-site-source/. .

          cover=static/publications/montufar-memorias-revolucion-centro-america-1832/cover.jpg
          echo "$MONTUFAR_COVER_SHA  $cover" | sha256sum -c -
          test "$(stat -c %s "$cover")" = "$MONTUFAR_COVER_SIZE"
          identify "$cover" | grep -F "1224x1584"
          grep -F "$ARCHIVE_COMMIT" master-archive.json
          grep -F 'slug: "montufar-memorias-revolucion-centro-america-1832"' src/publications.mjs
          grep -F 'assert.equal(publications.length, 79)' tests/archive.test.mjs
          python3 -m json.tool assets-manifest.json >/dev/null
          python3 -m json.tool master-archive.json >/dev/null
          node --check src/publications.mjs
          npm run build
          npm test

      - name: Prepare release checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/current-release
          gh release download publications-current \
            --pattern SHA256SUMS.txt \
            --dir /tmp/current-release \
            --repo "$GITHUB_REPOSITORY"
          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path("/tmp/current-release/SHA256SUMS.txt")
          lines = path.read_text(encoding="utf-8").splitlines()
          assert len(lines) >= 156
          assert len(lines) % 2 == 0
          entries = {}
          for line in lines:
              digest, separator, name = line.partition("  ")
              assert separator and len(digest) == 64 and name
              assert name not in entries
              entries[name] = digest
          additions = [
              (
                  os.environ["MONTUFAR_PDF_NAME"],
                  os.environ["MONTUFAR_PDF_SHA"],
              ),
              (
                  os.environ["MONTUFAR_EPUB_NAME"],
                  os.environ["MONTUFAR_EPUB_SHA"],
              ),
          ]
          for name, digest in additions:
              if name in entries:
                  assert entries[name] == digest
              else:
                  entries[name] = digest
                  lines.append(f"{digest}  {name}")
          Path("/tmp/SHA256SUMS.txt").write_text(
              "\n".join(lines) + "\n",
              encoding="utf-8",
          )
          PY
          echo "$MONTUFAR_PDF_SHA  /tmp/$MONTUFAR_PDF_NAME" | sha256sum -c -
          echo "$MONTUFAR_EPUB_SHA  /tmp/$MONTUFAR_EPUB_NAME" | sha256sum -c -

      - name: Upload and verify release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload publications-current \
            "/tmp/$MONTUFAR_PDF_NAME" \
            "/tmp/$MONTUFAR_EPUB_NAME" \
            /tmp/SHA256SUMS.txt \
            --clobber \
            --repo "$GITHUB_REPOSITORY"

          mkdir -p /tmp/verified-release
          gh release download publications-current \
            --pattern "$MONTUFAR_PDF_NAME" \
            --pattern "$MONTUFAR_EPUB_NAME" \
            --pattern SHA256SUMS.txt \
            --dir /tmp/verified-release \
            --repo "$GITHUB_REPOSITORY"
          echo "$MONTUFAR_PDF_SHA  /tmp/verified-release/$MONTUFAR_PDF_NAME" | sha256sum -c -
          echo "$MONTUFAR_EPUB_SHA  /tmp/verified-release/$MONTUFAR_EPUB_NAME" | sha256sum -c -
          cmp /tmp/SHA256SUMS.txt /tmp/verified-release/SHA256SUMS.txt

      - name: Commit and push catalogue
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            assets-manifest.json \
            master-archive.json \
            scripts/build-epubs.py \
            scripts/validate-epubs.py \
            src/publications.mjs \
            tests/archive.test.mjs \
            static/publications/montufar-memorias-revolucion-centro-america-1832/cover.jpg
          git diff --cached --check
          git commit -m "Publish Montufar memoirs"
          pushed=false
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            npm run build
            npm test
            if git push origin HEAD:main; then
              pushed=true
              break
            fi
            sleep 3
          done
          test "$pushed" = true

      - name: Verify remote repository state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/contents/master-archive.json?ref=main" \
            --jq .content |
            tr -d '\n' |
            base64 --decode |
            grep -F "$ARCHIVE_COMMIT"
          gh api "repos/$GITHUB_REPOSITORY/contents/src/publications.mjs?ref=main" \
            --jq .content |
            tr -d '\n' |
            base64 --decode > /tmp/remote-publications.mjs
          grep -F 'slug: "montufar-memorias-revolucion-centro-america-1832"' /tmp/remote-publications.mjs
          gh api "repos/$GITHUB_REPOSITORY/contents/assets-manifest.json?ref=main" \
            --jq .content |
            tr -d '\n' |
            base64 --decode > /tmp/remote-assets-manifest.json
          grep -F "$MONTUFAR_PDF_SHA" /tmp/remote-assets-manifest.json
          grep -F "$MONTUFAR_EPUB_SHA" /tmp/remote-assets-manifest.json

      - name: Remove one-time workflow and temporary refs
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          path=.github/workflows/publish-montufar-20260801.yml
          sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/$path?ref=main" --jq .sha)"
          gh api --method DELETE \
            "repos/$GITHUB_REPOSITORY/contents/$path" \
            -f message="Remove completed Montufar publishing workflow" \
            -f sha="$sha" \
            -f branch=main
          gh pr close "${{ github.event.pull_request.number }}" \
            --repo "$GITHUB_REPOSITORY" --delete-branch || true
          for branch in \
            agent/release-upload-montufar-20260801 \
            agent/publish-montufar-20260801; do
            encoded="${branch//\//%2F}"
            gh api --method DELETE \
              "repos/$GITHUB_REPOSITORY/git/refs/heads/$encoded" \
              >/dev/null 2>&1 || true
          done

      - name: Record public diagnostic on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s\n' \
            "Montufar publication workflow failed. Inspect this run before retrying." \
            "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            > /tmp/montufar-publication-error.txt
          content="$(base64 -w0 /tmp/montufar-publication-error.txt)"
          gh api --method PUT \
            "repos/$GITHUB_REPOSITORY/contents/.release-upload-errors/montufar-${GITHUB_RUN_ID}.txt" \
            -f message="Record Montufar publication failure" \
            -f content="$content" \
            -f branch=main
