name: Transfer checksum-pinned Florencia 1694 assets
on:
  push:
    branches: ["agent/florencia-transfer-20261124"]
    paths: [".publication-upload-requests/florencia-provincia-nueva-espana-1694.json"]
permissions:
  contents: write
concurrency:
  group: publication-release-transfer
  cancel-in-progress: false
jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install build dependencies
        run: npm ci --no-audit --no-fund
      - name: Build and test the publication catalogue
        run: npm run build && npm test
      - name: Reconstruct, upload, and verify publication PDF and EPUB
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .publication-transfer/transfer-florencia-provincia-nueva-espana-1694.py
      - uses: actions/upload-artifact@v4
        with:
          name: florencia-transfer-release-verification
          path: florencia-transfer-release-verification.json

