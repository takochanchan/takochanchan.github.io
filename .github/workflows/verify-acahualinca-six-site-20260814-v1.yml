name: Verify six Acahualinca paper site publications

on:
  push:
    branches: ["agent/acahualinca-six-site-20260814-v1"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out candidate site tree
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build archive pages
        run: npm run build

      - name: Restore generated full-text index
        id: search-index-cache
        uses: actions/cache@v4
        with:
          path: dist/search
          key: fulltext-index-${{ hashFiles('assets-manifest.json', 'master-archive.json', 'src/publications.mjs', 'scripts/search/build-index.mjs', 'scripts/search/create-manifest.mjs', 'scripts/search/extract-corpus.py', 'package-lock.json') }}

      - name: Restore final PDF and EPUB inputs
        if: steps.search-index-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: |
            .cache/fulltext-assets
            .cache/fulltext-ocr
          key: fulltext-assets-${{ hashFiles('assets-manifest.json') }}
          restore-keys: |
            fulltext-assets-

      - name: Ensure PDF text and OCR tools are available
        if: steps.search-index-cache.outputs.cache-hit != 'true'
        run: |
          if ! command -v pdftotext || ! command -v tesseract; then
            sudo apt-get update
            sudo apt-get install -y poppler-utils tesseract-ocr
          fi

      - name: Fetch checksum-verified search inputs
        if: steps.search-index-cache.outputs.cache-hit != 'true'
        run: npm run fetch:search-assets

      - name: Generate full-text search index
        if: steps.search-index-cache.outputs.cache-hit != 'true'
        run: npm run build:search

      - name: Save generated full-text index
        if: steps.search-index-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: dist/search
          key: fulltext-index-${{ hashFiles('assets-manifest.json', 'master-archive.json', 'src/publications.mjs', 'scripts/search/build-index.mjs', 'scripts/search/create-manifest.mjs', 'scripts/search/extract-corpus.py', 'package-lock.json') }}

      - name: Verify full-text index and catalogue tests
        run: |
          set -euo pipefail
          npm run verify:search
          npm test

      - name: Download and checksum-verify the six new EPUBs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import pathlib
          import urllib.request

          slugs = {
              "putnam-antiquity-man-america-1884",
              "mca-pre-adamite-track-1885",
              "unsigned-nicaragua-footprints-again-1886",
              "brinton-ancient-human-footprint-nicaragua-1887",
              "editorial-age-nicaragua-footprints-1889",
              "crawford-neolithic-man-nicaragua-1891",
          }
          manifest = json.load(open("assets-manifest.json"))
          assets = [
              asset for asset in manifest["assets"]
              if asset["path"].endswith(".epub")
              and asset["path"].split("/")[1] in slugs
          ]
          assert len(assets) == 6
          root = pathlib.Path(".cache/acahualinca-six-public-assets")
          for asset in assets:
              destination = root / asset["path"]
              destination.parent.mkdir(parents=True, exist_ok=True)
              request = urllib.request.Request(asset["url"], headers={"User-Agent": "takochan-publication-verifier/1.0"})
              with urllib.request.urlopen(request) as response:
                  data = response.read()
              assert len(data) == asset["size"], asset["path"]
              assert hashlib.sha256(data).hexdigest() == asset["sha256"], asset["path"]
              destination.write_bytes(data)
          PY

      - name: Validate all six reflowable EPUB 3 editions
        run: >-
          python3 scripts/validate-epubs.py .cache/acahualinca-six-public-assets
          --slug putnam-antiquity-man-america-1884
          --slug mca-pre-adamite-track-1885
          --slug unsigned-nicaragua-footprints-again-1886
          --slug brinton-ancient-human-footprint-nicaragua-1887
          --slug editorial-age-nicaragua-footprints-1889
          --slug crawford-neolithic-man-nicaragua-1891

      - name: Verify all six publication pages and provider notices
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib

          expected = {
              "putnam-antiquity-man-america-1884": ("アメリカにおける人類の古さ", 171922, ("American Antiquarian Society", "Proceedings of the American Antiquarian Society")),
              "mca-pre-adamite-track-1885": ("アダム以前の足跡", 134909, ("Internet Archive", "The American Antiquarian and Oriental Journal")),
              "unsigned-nicaragua-footprints-again-1886": ("ニカラグアの人足跡、ふたたび", 143638, ("Internet Archive", "The American Antiquarian and Oriental Journal")),
              "brinton-ancient-human-footprint-nicaragua-1887": ("ニカラグアの古代人足跡について", 155198, ("Biodiversity Heritage Library", "Proceedings of the American Philosophical Society", "JSTOR")),
              "editorial-age-nicaragua-footprints-1889": ("ニカラグアの人足跡の年代", 143515, ("Internet Archive", "The American Antiquarian and Oriental Journal")),
              "crawford-neolithic-man-nicaragua-1891": ("ニカラグアの新石器時代人", 144037, ("Biodiversity Heritage Library", "The American Geologist")),
          }
          for slug, (title, cover_size, phrases) in expected.items():
              page = pathlib.Path("dist/publications") / slug / "index.html"
              text = page.read_text(encoding="utf-8")
              for required in (title, "権利・利用条件", *phrases):
                  assert required in text, (slug, required)
              for banned in ("日本語翻訳版には再利用ライセンス", "日本語版ライセンス"):
                  assert banned not in text, (slug, banned)
              cover = pathlib.Path("dist/publications") / slug / "cover.jpg"
              assert cover.stat().st_size == cover_size, slug
          PY
