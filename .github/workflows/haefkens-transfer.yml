name: Transfer approved Haefkens publication
on:
  push:
    branches: [agent/haefkens-publish-20260919]
    paths: ['.publication-upload-requests/haefkens-1827-1832.json']
permissions:
  contents: write
concurrency:
  group: haefkens-publication-transfer
  cancel-in-progress: false
jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm test
      - name: Upload and verify approved files
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .publication-transfer/transfer-haefkens.py
      - uses: actions/upload-artifact@v4
        with:
          name: haefkens-release-byte-verification
          path: release-byte-verification.json
