name: Publish Tozzer release assets

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-tozzer-release.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

