        run: |
          set -euo pipefail
          pdf=Tozzer_A_Comparative_Study_of_the_Mayas_and_the_Lacandones_1907_Japanese_Complete_Translation.pdf
          epub=Tozzer_A_Comparative_Study_of_the_Mayas_and_the_Lacandones_1907_Japanese_Complete_Translation.epub
          : > "$pdf"
          : > "$epub"
          for chunk in $PDF_CHUNKS; do
            gh api "repos/$GITHUB_REPOSITORY/git/blobs/$chunk" --jq .content | tr -d '\n' | base64 --decode >> "$pdf"
          done
          for chunk in $EPUB_CHUNKS; do
            gh api "repos/$GITHUB_REPOSITORY/git/blobs/$chunk" --jq .content | tr -d '\n' | base64 --decode >> "$epub"
          done
          echo "9a79c14e4ccc3d68e412159f99bc9baa0a11fa2caf4dd3547f40fc187d933d47  $pdf" | sha256sum -c -
          echo "18b4802ec2418742999e1bfb2dfcb7d2c56ca2639ca4bfad36110df39794fdb3  $epub" | sha256sum -c -
          test "$(stat -c %s "$pdf")" = 14524459
          test "$(stat -c %s "$epub")" = 47371701

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload publications-current \
            Tozzer_A_Comparative_Study_of_the_Mayas_and_the_Lacandones_1907_Japanese_Complete_Translation.pdf \
            Tozzer_A_Comparative_Study_of_the_Mayas_and_the_Lacandones_1907_Japanese_Complete_Translation.epub \
            --clobber

      - name: Remove one-time workflow
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/publish-tozzer-release.yml
          git commit -m "Remove one-time Tozzer release workflow"
          git push origin HEAD:main
