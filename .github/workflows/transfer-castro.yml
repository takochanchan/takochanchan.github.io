name: Transfer approved Castro Santa-Anna publication files
on:
  push:
    branches: [agent/castro-diario-publish-20261009]
    paths: [.castro-public-request.json]
permissions:
  contents: write
concurrency:
  group: publication-release-transfer
  cancel-in-progress: false
jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run build && npm test
      - name: Upload and verify final PDF and EPUB files
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .castro-transfer.py
      - uses: actions/upload-artifact@v4
        with:
          name: castro-public-verification
          path: castro-public-verification.json
