          : > "$pdf"
          : > "$epub"
          for chunk in $PDF_CHUNKS; do
            gh api "repos/$GITHUB_REPOSITORY/git/blobs/$chunk" --jq .content | tr -d '\n' | base64 --decode >> "$pdf"
          done
          for chunk in $EPUB_CHUNKS; do
            gh api "repos/$GITHUB_REPOSITORY/git/blobs/$chunk" --jq .content | tr -d '\n' | base64 --decode >> "$epub"
          done
          echo "f490086a1160d72a8d19a6e3a29ffd2d712024053ff1d7f2ac8160f5fed7b175  $pdf" | sha256sum -c -
          echo "2483eefb99c4c859397c66aea11cb99334db5c47a2b8090c2b0baba73d0b86da  $epub" | sha256sum -c -
          test "$(stat -c %s "$pdf")" = 55452637
          test "$(stat -c %s "$epub")" = 54531859

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload publications-current \
