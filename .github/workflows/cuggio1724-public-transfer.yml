name: Transfer verified Cuggiò Bullarium 1724 publication assets
on:
  push:
    branches: [agent/cuggio1724-public-transfer-20261127]
    paths: [.cuggio1724-public-request.json]
permissions:
  contents: write
concurrency:
  group: publication-release-transfer
  cancel-in-progress: false
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run build && npm test
      - name: Transfer and read back the two approved PDF and EPUB files
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .cuggio1724-public-transfer.py
      - uses: actions/upload-artifact@v4
        with:
          name: cuggio1724-public-verification
          path: cuggio1724-public-verification.json
