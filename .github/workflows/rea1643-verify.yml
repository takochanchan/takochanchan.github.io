name: Verify La Rea 1643 search and publication
on:
  push:
    branches: [agent/rea1643-verify-20261128]
    paths: [.rea1643-live-plan.json]
permissions:
  contents: read
jobs:
  search-maps:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run build && npm test
      - run: python3 .rea1643-verify.py maps && npm run verify:remote-search
      - uses: actions/upload-artifact@v4
        with:
          name: rea1643-map-verification
          path: rea1643-verification.json
  live-publication:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: python3 .rea1643-verify.py live
      - uses: actions/upload-artifact@v4
        with:
          name: rea1643-live-readback
          path: rea1643-verification.json
