name: Transfer checksum-pinned Brasseur volumes I–IV assets
on:
  push:
    branches: ["agent/brasseur-histoire-publication-20261116"]
    paths: [".publication-upload-requests/brasseur-histoire-nations-civilisees-1857-1859.json", ".github/workflows/brasseur-transfer.yml", "static/publications/brasseur-histoire-nations-civilisees-volume-*/cover.jpg", "scripts/build.mjs", "src/publication-overviews.json"]
permissions:
  contents: write
concurrency:
  group: publication-release-transfer
  cancel-in-progress: false
jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install build dependencies
        run: npm ci --no-audit --no-fund
      - name: Build and test the publication catalogue
        run: npm run build && npm test
      - name: Reconstruct, upload, and verify publication PDF and EPUB
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .publication-transfer/transfer-brasseur.py
      - uses: actions/upload-artifact@v4
        with:
          name: brasseur-release-verification
          path: brasseur-release-verification.json
