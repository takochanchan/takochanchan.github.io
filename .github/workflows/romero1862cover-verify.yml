name: Verify Romero 1862 cover search and publication
on:
  push:
    branches: [agent/romero1862cover-verify-20261128]
    paths: [.romero1862cover-live-plan.json]
permissions:
  contents: read
jobs:
  search-maps:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run build && npm test
      - run: python3 .romero1862cover-verify.py maps && npm run verify:remote-search
      - uses: actions/upload-artifact@v4
        with:
          name: romero1862cover-map-verification
          path: romero1862cover-verification.json
  live-publication:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: python3 .romero1862cover-verify.py live
      - uses: actions/upload-artifact@v4
        with:
          name: romero1862cover-live-readback
          path: romero1862cover-verification.json
