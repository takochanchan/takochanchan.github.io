name: Transfer checksum-pinned Galicia 1766 assets
on:
  push:
    branches: [agent/galicia-manual-1766-publication-assets-20261106]
    paths: ['.publication-upload-requests/galicia-manual-1766.json']
permissions:
  contents: write
concurrency:
  group: publication-release-transfer
  cancel-in-progress: false
jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install build dependencies
        run: npm ci --no-audit --no-fund
      - name: Build and test the publication catalogue
        run: npm run build && npm test
      - name: Reconstruct, upload, and verify publication bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .publication-transfer/transfer-galicia-1766.py
      - uses: actions/upload-artifact@v4
        with:
          name: galicia-1766-release-byte-verification
          path: galicia1766-release-verification.json
