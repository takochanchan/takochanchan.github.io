name: Transfer checksum-pinned Zodiaco Mariano 1755 assets
on:
  push:
    branches: ["agent/zodiaco-1755-transfer"]
    paths: [".publication-upload-requests/florencia-oviedo-zodiaco-mariano-1755.json"]
permissions:
  contents: write
concurrency:
  group: publication-release-transfer
  cancel-in-progress: false
jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install build dependencies
        run: npm ci --no-audit --no-fund
      - name: Build and test the publication catalogue
        run: npm run build && npm test
      - name: Reconstruct, upload, and verify publication PDF and EPUB
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .publication-transfer/transfer-zodiaco-1755.py
      - uses: actions/upload-artifact@v4
        with:
          name: zodiaco-1755-release-verification
          path: zodiaco-1755-release-verification.json
