name: Transfer the approved Scherzer Ximenez study
on:
  push:
    branches: [agent/transfer-scherzer-ximenez-1856-20261125]
    paths: [.scherzer-xm-public-request.json]
permissions:
  contents: write
concurrency:
  group: publication-release-transfer
  cancel-in-progress: false
jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run build && npm test
      - name: Upload and verify final PDF and EPUB files
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .scherzer-xm-transfer.py
      - uses: actions/upload-artifact@v4
        with:
          name: scherzer-xm-public-verification
          path: scherzer-xm-public-verification.json