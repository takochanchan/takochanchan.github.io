name: Verify Cano catalogue reclassification
on:
  push:
    branches: ["agent/cano-1696-class-verify"]
    paths: [".cano-verify.json"]
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read requested gate
        id: mode
        run: echo "kind=$(jq -r .mode .cano-verify.json)" >> "$GITHUB_OUTPUT"
      - name: Build and test classification and unchanged asset manifest
        run: |
          if [ "$(jq -r .mode .cano-verify.json)" = build ]; then
            npm ci --no-audit --no-fund
            npm run build && npm test
          fi
      - name: Await exact pinned Pages deployment
        if: ${{ steps.mode.outputs.kind != 'build' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,subprocess,time
          v=json.load(open(".cano-verify.json"))
          import re
          assert v["mode"] in ("search", "live")
          assert v["repo"] == (
              "takochanchan/takochan-search-index-003" if v["mode"] == "search" else
              "takochanchan/takochanchan.github.io"
          )
          assert re.fullmatch(r"[0-9a-f]{40}", v["head"]) and type(v["id"]) is int and v["id"] > 0
          endpoint=f"repos/{v['repo']}/actions/runs/{v['id']}"
          for attempt in range(90):
              run=json.loads(subprocess.check_output(["gh","api",endpoint]))
              assert run["head_sha"]==v["head"], (run["head_sha"],v["head"])
              if run["status"]=="completed":
                  assert run["conclusion"]=="success", run["conclusion"]
                  print("Pages input verified:",run["html_url"])
                  break
              time.sleep(10)
          else: raise SystemExit("Pinned Pages deployment was not verified")
          PY
      - name: Verify total search shard coverage
        run: |
          if [ "$(jq -r .mode .cano-verify.json)" = search ]; then npm run verify:remote-search; fi
      - name: Verify Cano literal search hits with physical pages and manuscript folia
        run: |
          if [ "$(jq -r .mode .cano-verify.json)" = search ]; then node .cano-search-live.mjs; fi
      - name: Check live bibliography and every exact file
        run: |
          if [ "$(jq -r .mode .cano-verify.json)" = live ]; then
            if ! command -v pdfinfo >/dev/null; then sudo apt-get update && sudo apt-get install -y poppler-utils; fi
            python3 .cano-verify-live.py
          fi
