          lg_epub|Galindo_Copan_Literary_Gazette_1835_Japanese_Complete_Translation.epub|103949|0d8615d8c32f6c9f8d047c79895e842c92a6cc8fd5aef604175753476f453637|fd3d99f2c3c13ae3dea266001ad2951be44437a3 adea24f05171f707ad5e25fbd81ff326cd45a223
          aas_pdf|Galindo_Ruins_of_Copan_AAS_1836_Japanese_Complete_Translation.pdf|321043|e22938c9ca4a0970a9ddd9313df8efe5d5b92f3cc3f79ea1b598f79c6827fb82|56d0c3f613604d68d959ebcede27d0ce42bb623a fe16000ef754de012d560c36b35d599e4ef71472 c11e281cdc5c0436fb1004cd4ae2ea5c9793c530 b4a0ac35023e98f6819fe23d29319fbd8e60f0ec
          aas_epub|Galindo_Ruins_of_Copan_AAS_1836_Japanese_Complete_Translation.epub|196884|592eebad494de23e6267fb614362aca8e93db06ae09c66f8dba59048dbe976ee|ca3e711a8969f410c4a23dcd7c9b5bbc35303a83 b689b67b3f21b75b756b8d83cb6b4e5e13b8ab8b d0e0f2672604888da3ef3a9e821ce6e6d2f46616

    steps:
      - name: Install PDF inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Reassemble and verify staged assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/galindo-assets
          while IFS='|' read -r key name size digest blobs; do
            test -n "$name"
            target="/tmp/galindo-assets/$name"
            : > "$target"
            for blob_sha in $blobs; do
              gh api "repos/$GITHUB_REPOSITORY/git/blobs/$blob_sha" \
                --jq .content | tr -d '\n' | base64 --decode >> "$target"
            done
            echo "$digest  $target" | sha256sum -c -
            test "$(stat -c %s "$target")" = "$size"
          done <<< "$ASSETS"

      - name: Validate four publication PDFs
        run: |
          set -euo pipefail
          validate_pdf() {
            local name="$1" pages="$2" images="$3" minimum="$4" title="$5" markers="$6"
            local pdf="/tmp/galindo-assets/$name"
            local stem="/tmp/${name%.pdf}"
            pdfinfo "$pdf" | grep -F "Pages:           $pages"
            pdfinfo "$pdf" | grep -F "Page size:       612 x 792 pts (letter)"
            pdfinfo "$pdf" | grep -F "Tagged:          yes"
            pdffonts "$pdf" > "${stem}-fonts.txt"
            python3 - "${stem}-fonts.txt" <<'PY'
          import re
          import sys
          from pathlib import Path

          lines = Path(sys.argv[1]).read_text(encoding="utf-8").splitlines()[2:]
          assert lines
          for line in lines:
              match = re.match(
                  r"^(.+?)\s{2,}(.+?)\s{2,}(.+?)\s{2,}"
                  r"(yes|no)\s+(yes|no)\s+(yes|no)\s+\d+\s+\d+$",
                  line.strip(),
              )
              assert match is not None, line
              assert match.group(4) == "yes", line
          PY
            actual_images="$(pdfimages -list "$pdf" | awk 'NR > 2 && $3 == "image" { count++ } END { print count+0 }')"
            test "$actual_images" = "$images"
            pdftotext -layout "$pdf" "${stem}.txt"
            python3 - "${stem}.txt" "$minimum" "$title" "$markers" <<'PY'
          import re
          import sys
          from pathlib import Path

          text = Path(sys.argv[1]).read_text(encoding="utf-8")
          minimum = int(sys.argv[2])
          title = sys.argv[3]
          markers = [int(value) for value in sys.argv[4].split(",")]
          compact = re.sub(r"\s+", "", text)
          assert title in compact, title
          assert "フアン・ガリンド" in compact
          for marker in markers:
              expected = f"〔原刊p.{marker}〕"
              assert expected in compact, expected
          for phrase in ("確認用", "校閲用", "未公開", "Proof"):
              assert phrase not in compact, phrase
          japanese = len(re.findall(r"[\u3040-\u30ff\u3400-\u9fff]", text))
          assert japanese >= minimum, (japanese, minimum)
          print(f"{Path(sys.argv[1]).name}: {japanese:,} Japanese characters")
          PY
          }

          validate_pdf \
            Galindo_Notice_of_the_Caribs_Central_America_1833_Japanese_Complete_Translation.pdf \
            3 0 900 "中央アメリカのカリブ人についての報告" "290,291"
          validate_pdf \
            Galindo_Antiquities_Peten_1834_Japanese_Complete_Translation.pdf \
            5 2 1400 "ペテン管区で発見された若干の古物についての短報" "570,571"
          validate_pdf \
            Galindo_Copan_Literary_Gazette_1835_Japanese_Complete_Translation.pdf \
            7 0 4300 "中央アメリカ――コパン遺跡通信" "456,457"
          validate_pdf \
            Galindo_Ruins_of_Copan_AAS_1836_Japanese_Complete_Translation.pdf \
            9 1 4800 "中央アメリカのコパン遺跡" "543,544,545,546,547,548,549,550"

          peten=/tmp/Galindo_Antiquities_Peten_1834_Japanese_Complete_Translation.txt
          grep -F "ヤショー湖" "$peten"
          ! grep -F "ヤシャ湖" "$peten"
          ! grep -F "Yaxh" "$peten"

      - name: Validate four reflowable EPUB editions
        run: |
          set -euo pipefail
          python3 - /tmp/galindo-assets <<'PY'
          import posixpath
          import re
          import sys
          import zipfile
          from pathlib import Path
          from urllib.parse import unquote
          from xml.etree import ElementTree as ET

          root = Path(sys.argv[1])
          specs = {
              "Galindo_Notice_of_the_Caribs_Central_America_1833_Japanese_Complete_Translation.epub": {
                  "title": "中央アメリカのカリブ人についての報告",
                  "slug": "galindo-caribs-central-america-1833",
                  "docs": 5, "images": 0, "tables": 2,
                  "minimum": 900, "markers": (290, 291),
              },
              "Galindo_Antiquities_Peten_1834_Japanese_Complete_Translation.epub": {
                  "title": "中央アメリカ、ペテン管区で発見された若干の古物についての短報",
                  "slug": "galindo-antiquities-peten-1834",
                  "docs": 6, "images": 2, "tables": 0,
                  "minimum": 1400, "markers": (570, 571),
                  "must": ("ヤショー湖",),
                  "must_not": ("ヤシャ湖", "Yaxh"),
              },
              "Galindo_Copan_Literary_Gazette_1835_Japanese_Complete_Translation.epub": {
                  "title": "中央アメリカ――コパン遺跡通信",
                  "slug": "galindo-copan-literary-gazette-1835",
                  "docs": 6, "images": 0, "tables": 0,
                  "minimum": 4300, "markers": (456, 457),
              },
              "Galindo_Ruins_of_Copan_AAS_1836_Japanese_Complete_Translation.epub": {
                  "title": "中央アメリカのコパン遺跡",
                  "slug": "galindo-ruins-copan-aas-1836",
                  "docs": 8, "images": 1, "tables": 0,
                  "minimum": 4800,
                  "markers": tuple(range(543, 551)),
              },
          }
          container_ns = {
              "c": "urn:oasis:names:tc:opendocument:xmlns:container"
          }
          opf_ns = {
              "opf": "http://www.idpf.org/2007/opf",
              "dc": "http://purl.org/dc/elements/1.1/",
          }
          xhtml_ns = "http://www.w3.org/1999/xhtml"

          for filename, spec in specs.items():
              path = root / filename
              with zipfile.ZipFile(path) as archive:
                  assert archive.testzip() is None
                  names = archive.namelist()
                  assert names[0] == "mimetype"
                  assert archive.getinfo("mimetype").compress_type == zipfile.ZIP_STORED
                  assert archive.read("mimetype") == b"application/epub+zip"

                  container = ET.fromstring(archive.read("META-INF/container.xml"))
                  rootfile = container.find(".//c:rootfile", container_ns)
                  assert rootfile is not None
                  opf_path = rootfile.attrib["full-path"]
                  opf = ET.fromstring(archive.read(opf_path))
                  assert opf.attrib.get("version", "").startswith("3")

                  def dc_text(name):
                      element = opf.find(f".//dc:{name}", opf_ns)
                      assert element is not None, name
                      return "".join(element.itertext())

                  assert dc_text("title") == spec["title"]
                  assert dc_text("creator") == "フアン・ガリンド"
                  assert dc_text("language").lower().startswith("ja")
                  assert spec["slug"] in dc_text("identifier")

                  base = posixpath.dirname(opf_path)
                  manifest = {}
                  for item in opf.findall(".//opf:manifest/opf:item", opf_ns):
                      resolved = posixpath.normpath(
                          posixpath.join(
                              base,
                              unquote(item.attrib["href"].split("#", 1)[0]),
                          )
                      )
                      assert resolved in names
                      assert archive.getinfo(resolved).file_size > 0
                      manifest[item.attrib["id"]] = (
                          resolved,
                          item.attrib.get("media-type", ""),
                          set(item.attrib.get("properties", "").split()),
                      )
                  assert sum("nav" in item[2] for item in manifest.values()) == 1
                  assert sum("cover-image" in item[2] for item in manifest.values()) == 1

                  spine = [
                      manifest[item.attrib["idref"]]
                      for item in opf.findall(".//opf:spine/opf:itemref", opf_ns)
                  ]
                  assert len(spine) == spec["docs"], (filename, len(spine))
                  assert all(
                      token not in spine[0][0].lower()
                      for token in ("cover", "title", "nav")
                  )

                  text_parts = []
                  images = []
                  tables = []
                  for resolved, media_type, _properties in spine:
                      assert media_type == "application/xhtml+xml"
                      document = ET.fromstring(archive.read(resolved))
                      text_parts.extend(document.itertext())
                      images.extend(document.iter(f"{{{xhtml_ns}}}img"))
                      tables.extend(document.iter(f"{{{xhtml_ns}}}table"))
                      for viewport in document.findall(
                          f".//{{{xhtml_ns}}}meta[@name='viewport']"
                      ):
                          assert not re.search(
                              r"\bwidth\s*=\s*\d+",
                              viewport.attrib.get("content", ""),
                          )

                  text = " ".join(text_parts)
                  compact = re.sub(r"\s+", "", text)
                  japanese = len(
                      re.findall(r"[\u3040-\u30ff\u3400-\u9fff]", text)
                  )
                  assert japanese >= spec["minimum"], (filename, japanese)
                  assert len(images) == spec["images"], (filename, len(images))
                  assert len(tables) == spec["tables"], (filename, len(tables))
                  assert all(image.attrib.get("alt", "").strip() for image in images)
                  for marker in spec["markers"]:
                      expected = f"〔原刊p.{marker}〕"
                      assert expected in compact, (filename, expected)
                  for phrase in spec.get("must", ()):
                      assert phrase in compact, (filename, phrase)
                  for phrase in spec.get("must_not", ()):
                      assert phrase not in compact, (filename, phrase)
                  for phrase in ("確認用", "校閲用", "未公開", "Proof"):
                      assert phrase not in compact, (filename, phrase)
                  print(
                      f"{filename}: EPUB 3 OK; {japanese:,} Japanese characters, "
                      f"{len(images)} content images, {len(tables)} tables"
                  )
          PY

      - name: Prepare shared checksum file
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/current-release
          gh release download publications-current \
            --pattern SHA256SUMS.txt \
            --dir /tmp/current-release \
            --repo "$GITHUB_REPOSITORY"
          python3 - <<'PY'
          import os
          from pathlib import Path

          current = Path("/tmp/current-release/SHA256SUMS.txt")
          lines = current.read_text(encoding="utf-8").splitlines()
          entries = {}
          for line in lines:
              digest, separator, name = line.partition("  ")
              assert separator and len(digest) == 64 and name
              assert name not in entries
              entries[name] = digest
          assert len(entries) >= 162 and len(entries) % 2 == 0, len(entries)

          added = 0
          for record in os.environ["ASSETS"].splitlines():
              if not record.strip():
                  continue
              _key, name, _size, digest, _blobs = record.split("|", 4)
              assert name not in entries, name
              entries[name] = digest
              lines.append(f"{digest}  {name}")
              added += 1
          assert added == 8
          assert len(lines) == len(entries)
          Path("/tmp/SHA256SUMS.txt").write_text(
              "\n".join(lines) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload and verify eight release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          upload_args=()
          while IFS='|' read -r key name size digest blobs; do
            upload_args+=("/tmp/galindo-assets/$name")
          done <<< "$ASSETS"
          gh release upload publications-current \
            "${upload_args[@]}" \
            /tmp/SHA256SUMS.txt \
            --clobber \
            --repo "$GITHUB_REPOSITORY"

          mkdir -p /tmp/verified-release
          while IFS='|' read -r key name size digest blobs; do
            gh release download publications-current \
              --pattern "$name" \
              --dir /tmp/verified-release \
              --repo "$GITHUB_REPOSITORY"
            echo "$digest  /tmp/verified-release/$name" | sha256sum -c -
            test "$(stat -c %s "/tmp/verified-release/$name")" = "$size"
          done <<< "$ASSETS"
          gh release download publications-current \
            --pattern SHA256SUMS.txt \
            --dir /tmp/verified-release \
            --repo "$GITHUB_REPOSITORY"
          cmp /tmp/SHA256SUMS.txt /tmp/verified-release/SHA256SUMS.txt

      - name: Remove one-time workflow and staging branch
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          path=.github/workflows/publish-galindo-short-papers-20260801.yml
          if sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/$path?ref=main" --jq .sha 2>/dev/null)"; then
            gh api --method DELETE \
              "repos/$GITHUB_REPOSITORY/contents/$path" \
              -f message="Remove completed Galindo short-paper release workflow" \
              -f sha="$sha" \
              -f branch=main
          fi
          gh api --method DELETE \
            "repos/$GITHUB_REPOSITORY/git/refs/heads/agent%2Frelease-upload-galindo-short-papers-20260801" \
            >/dev/null 2>&1 || true

      - name: Record public diagnostic on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s\n' \
            "Galindo short-paper release workflow failed. Inspect this run before retrying." \
            "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            > /tmp/galindo-short-papers-release-error.txt
          content="$(base64 -w0 /tmp/galindo-short-papers-release-error.txt)"
          gh api --method PUT \
            "repos/$GITHUB_REPOSITORY/contents/.release-upload-errors/galindo-short-papers-${GITHUB_RUN_ID}.txt" \
            -f message="Record Galindo short-paper release failure" \
            -f content="$content" \
            -f branch=main
