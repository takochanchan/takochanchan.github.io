name: Publish four Galindo short papers once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-galindo-short-papers-20260801.yml

permissions:
  contents: write

concurrency:
  group: publications-current-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
