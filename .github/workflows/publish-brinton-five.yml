name: Publish Brinton five-paper release assets

on:
  push:
    branches:
      - agent/brinton-five-publication-20260904
    paths:
      - .github/workflows/publish-brinton-five.yml
      - _release-chunks/**
      - assets-manifest.json

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Reassemble and verify staged assets
        run: |
          set -euo pipefail
          mkdir -p _release-staging
          for dir in _release-chunks/*; do
            name="$(basename "$dir")"
            find "$dir" -maxdepth 1 -type f -name '[0-9][0-9][0-9][0-9]' -print0 \
              | sort -z \
              | xargs -0 cat > "_release-staging/$name"
          done
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path

          manifest = json.loads(Path("assets-manifest.json").read_text())
          entries = {Path(item["path"]).name: item for item in manifest["assets"]}
          staged = sorted(Path("_release-staging").iterdir())
          if len(staged) != 10:
              raise SystemExit(f"expected 10 assets, found {len(staged)}")
          for path in staged:
              item = entries.get(path.name)
              if not item:
                  raise SystemExit(f"manifest entry missing: {path.name}")
              data = path.read_bytes()
              digest = hashlib.sha256(data).hexdigest()
              if len(data) != item["size"] or digest != item["sha256"]:
                  raise SystemExit(f"manifest mismatch: {path.name}")
              print(path.name, len(data), digest)
          PY

      - name: Update shared checksum ledger
        run: |
          set -euo pipefail
          mkdir -p _release-ledger/current _release-ledger/next
          if gh release download publications-current -p SHA256SUMS.txt -D _release-ledger/current; then
            cp _release-ledger/current/SHA256SUMS.txt _release-ledger/next/SHA256SUMS.txt
          else
            : > _release-ledger/next/SHA256SUMS.txt
          fi
          python3 - <<'PY'
          import hashlib
          from pathlib import Path

          ledger = Path("_release-ledger/next/SHA256SUMS.txt")
          staged = sorted(Path("_release-staging").iterdir())
          names = {path.name for path in staged}
          kept = []
          for line in ledger.read_text().splitlines():
              parts = line.split(maxsplit=1)
              if len(parts) == 2 and parts[1].lstrip(" *") not in names:
                  kept.append(line)
          added = [f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}" for path in staged]
          ledger.write_text("\n".join(kept + added) + "\n")
          PY

      - name: Upload release assets
        run: |
          set -euo pipefail
          gh release upload publications-current _release-staging/* --clobber
          gh release upload publications-current _release-ledger/next/SHA256SUMS.txt --clobber

      - name: Re-download and verify release bytes
        run: |
          set -euo pipefail
          mkdir -p _release-verify
          for file in _release-staging/*; do
            gh release download publications-current -p "$(basename "$file")" -D _release-verify --clobber
          done
          gh release download publications-current -p SHA256SUMS.txt -D _release-verify --clobber
          python3 - <<'PY'
          import hashlib
          from pathlib import Path

          expected = {path.name: (len(path.read_bytes()), hashlib.sha256(path.read_bytes()).hexdigest())
                      for path in Path("_release-staging").iterdir()}
          for name, (size, digest) in expected.items():
              data = (Path("_release-verify") / name).read_bytes()
              if (len(data), hashlib.sha256(data).hexdigest()) != (size, digest):
                  raise SystemExit(f"release mismatch: {name}")
          ledger = (Path("_release-verify") / "SHA256SUMS.txt").read_text()
          for name, (_, digest) in expected.items():
              if f"{digest}  {name}" not in ledger:
                  raise SystemExit(f"checksum ledger mismatch: {name}")
          print("verified", len(expected), "release assets")
          PY
