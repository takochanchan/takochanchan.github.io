name: Update Vicente Pineda EPUB cover

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/update-pineda-epub-cover-20260814-v2.yml"

permissions:
  contents: write

concurrency:
  group: publications-current-release
  cancel-in-progress: false

jobs:
  publish-epub:
    runs-on: ubuntu-latest
    env:
      TAG: publications-current
      EXPECTED_STAGE: ae790995e5d6a7fc1f89e5acd8f142f8f7de2cad
      STAGING_BRANCH: release-staging-pineda-epub-cover-20260814-v2
      STAGING_ROOT: .release-staging/pineda-epub-cover-20260814-v2
      WORKFLOW_PATH: .github/workflows/update-pineda-epub-cover-20260814-v2.yml
      EPUB_NAME: Vicente_Pineda_Historia_de_las_sublevaciones_indigenas_1888_Japanese_Complete_Translation.epub
      EPUB_SHA256: 31d47ac1a8a48671a23e1b27d00fe8c9fadadc723073fff4a09b3e146c21decb
    steps:
      - name: Check out staged EPUB
        uses: actions/checkout@v4
        with:
          ref: release-staging-pineda-epub-cover-20260814-v2

      - name: Reassemble and validate EPUB
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_STAGE"
          mkdir -p release
          cat "$STAGING_ROOT/$EPUB_NAME"/part-* > "release/$EPUB_NAME"
          test "$(stat -c %s "release/$EPUB_NAME")" = 119425
          test "$(sha256sum "release/$EPUB_NAME" | cut -d' ' -f1)" = "$EPUB_SHA256"
          unzip -t "release/$EPUB_NAME" >/dev/null
          test "$(unzip -p "release/$EPUB_NAME" mimetype)" = "application/epub+zip"
          test "$(unzip -lv "release/$EPUB_NAME" | awk '$NF=="mimetype"{print $2,$3}')" = "Stored 20"
          python3 - <<'PY'
          import re
          import zipfile
          from xml.etree import ElementTree as ET

          filename = "release/Vicente_Pineda_Historia_de_las_sublevaciones_indigenas_1888_Japanese_Complete_Translation.epub"
          with zipfile.ZipFile(filename) as archive:
              assert archive.namelist()[0] == "mimetype"
              opf = ET.fromstring(archive.read("EPUB/content.opf"))
              ns = {"opf": "http://www.idpf.org/2007/opf"}
              covers = [
                  item for item in opf.findall(".//opf:item", ns)
                  if "cover-image" in item.attrib.get("properties", "").split()
              ]
              assert len(covers) == 1
              cover_path = "EPUB/" + covers[0].attrib["href"]
              assert cover_path in archive.namelist()
              assert archive.getinfo(cover_path).file_size == 32334
              texts = []
              image_refs = 0
              for member in archive.namelist():
                  if member.endswith((".xml", ".opf", ".ncx", ".xhtml")):
                      root = ET.fromstring(archive.read(member))
                      if member.endswith(".xhtml"):
                          texts.append("".join(root.itertext()))
                          for image in root.iter("{http://www.w3.org/1999/xhtml}img"):
                              assert image.attrib.get("alt", "").strip()
                              image_refs += 1
              text = "".join(texts)
              assert text.count("原刊 p.") == 131
              assert not re.search("公開前|確認用|公開作業は行っていない|review", text)
              assert "pineda_public_cover.jpg" in archive.read("EPUB/text/cover.xhtml").decode("utf-8")
          print("Pineda EPUB 3 cover and content validation OK")
          PY

      - name: Build updated release checksum manifest
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p current
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS.txt --dir current
          awk -v name="$EPUB_NAME" '$2 != name' current/SHA256SUMS.txt > release/SHA256SUMS.txt
          printf '%s  %s\n' "$EPUB_SHA256" "$EPUB_NAME" >> release/SHA256SUMS.txt
          LC_ALL=C sort -k2,2 -o release/SHA256SUMS.txt release/SHA256SUMS.txt
          test "$(grep -Fc "  $EPUB_NAME" release/SHA256SUMS.txt)" = 1

      - name: Replace EPUB and checksum manifest
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fxq "$EPUB_NAME"
          gh release upload "$TAG" "release/$EPUB_NAME" --repo "$GITHUB_REPOSITORY" --clobber
          gh release upload "$TAG" release/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber

      - name: Re-download and byte-verify
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verify
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "$EPUB_NAME" --pattern SHA256SUMS.txt --dir verify
          cmp "release/$EPUB_NAME" "verify/$EPUB_NAME"
          grep -F "  $EPUB_NAME" verify/SHA256SUMS.txt > verify/PINEDA_EPUB_SHA256SUMS.txt
          test "$(wc -l < verify/PINEDA_EPUB_SHA256SUMS.txt)" = 1
          (cd verify && sha256sum -c PINEDA_EPUB_SHA256SUMS.txt)

      - name: Remove staging branch and one-shot workflow
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$STAGING_BRANCH"
          workflow_sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/$WORKFLOW_PATH?ref=main" --jq .sha)"
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/contents/$WORKFLOW_PATH" \
            -f message="Remove completed Pineda EPUB cover workflow" \
            -f sha="$workflow_sha" \
            -f branch=main
