name: Transfer checksum-pinned María de San José parts I–XII assets
on:
  push:
    branches: ["agent/maria-transfer-20261124"]
    paths: [".publication-upload-requests/maria-de-san-jose-spiritual-autobiography.json"]
permissions:
  contents: write
concurrency:
  group: publication-release-transfer
  cancel-in-progress: false
jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install build dependencies
        run: npm ci --no-audit --no-fund
      - name: Build and test the publication catalogue
        run: npm run build && npm test
      - name: Reconstruct, upload, and verify publication PDF and EPUB
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .publication-transfer/transfer-maria-transfer.py
      - uses: actions/upload-artifact@v4
        with:
          name: maria-transfer-release-verification
          path: maria-transfer-release-verification.json
