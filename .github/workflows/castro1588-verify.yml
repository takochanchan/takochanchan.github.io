name: Verify Castro 1588 search and publication
on:
  push:
    branches: [agent/castro1588-verify-20261127-r2]
    paths: [.castro1588-live-plan.json]
permissions:
  contents: read
jobs:
  search-maps:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run build && npm test
      - run: python3 .castro1588-verify.py maps && npm run verify:remote-search
      - uses: actions/upload-artifact@v4
        with:
          name: castro1588-map-verification
          path: castro1588-verification.json
  live-publication:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: python3 .castro1588-verify.py live
      - uses: actions/upload-artifact@v4
        with:
          name: castro1588-live-readback
          path: castro1588-verification.json
