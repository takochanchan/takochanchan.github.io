name: Verify remote search for Francisco Sosa 1877-1879
on:
  push:
    branches: ["agent/sosa-publish-20261112"]
    paths: [".github/workflows/sosa-verify-remote.yml"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run build && npm test
      - name: Wait for the pinned search shard deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'CHECK'
          import json, os, time, urllib.request
          url = "https://api.github.com/repos/takochanchan/takochan-search-index-003/actions/runs/43104658801"
          for attempt in range(120):
              request = urllib.request.Request(url, headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"], "Accept": "application/vnd.github+json"})
              with urllib.request.urlopen(request, timeout=30) as response:
                  run = json.load(response)
              assert run["head_sha"] == "b320c472a92e4a79a41b5d9eea65dedc302eabbe"
              if run["status"] == "completed":
                  assert run["conclusion"] == "success", run["conclusion"]
                  print("Pinned search deployment succeeded.")
                  break
              time.sleep(10)
          else:
              raise SystemExit("Pinned search deployment has not completed within 20 minutes")
          CHECK
      - run: npm run verify:remote-search


