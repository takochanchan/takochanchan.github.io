name: Publish G59 and Cantares Mexicanos cached gate

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/publish-g59-cantares-20260821-v2.yml"

permissions:
  contents: write

concurrency:
  group: publish-g59-cantares-20260821-v2
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: publications-current
      STAGING_BRANCH: codex-release-g59-cantares-20260821-v1
      READY_BRANCH: codex-ready-g59-cantares-20260821-v2
      PAYLOAD_SHA256: 8e20a5334a9383aad2d6b7da58d7e53c4c5f32d5f7005332b283f7b68d626adc
      PAYLOAD_SIZE: "2199215"
      PAYLOAD_PARTS: "9"
    steps:
      - name: Check out the publication trigger commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Check out the checksum-locked payload
        uses: actions/checkout@v4
        with:
          ref: ${{ env.STAGING_BRANCH }}
          path: staging
          sparse-checkout: release-staging/g59-cantares-20260821
          sparse-checkout-cone-mode: false

      - name: Reconstruct and verify the publication payload
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          parts = sorted(
              Path("staging/release-staging/g59-cantares-20260821").glob(
                  "payload.tar.gz.part-*"
              )
          )
          expected_count = int(os.environ["PAYLOAD_PARTS"])
          if len(parts) != expected_count:
              raise SystemExit(f"payload part count {len(parts)} != {expected_count}")
          output = Path(os.environ["RUNNER_TEMP"]) / "public-release-payload.tar.gz"
          digest = hashlib.sha256()
          size = 0
          with output.open("wb") as destination:
              for part in parts:
                  block = part.read_bytes()
                  destination.write(block)
                  digest.update(block)
                  size += len(block)
          if size != int(os.environ["PAYLOAD_SIZE"]):
              raise SystemExit(f"payload size {size} != {os.environ['PAYLOAD_SIZE']}")
          if digest.hexdigest() != os.environ["PAYLOAD_SHA256"]:
              raise SystemExit("payload SHA-256 mismatch")
          print(f"payload OK: {size} bytes {digest.hexdigest()}")
          PY
          mkdir -p "$RUNNER_TEMP/publication-payload"
          tar -xzf "$RUNNER_TEMP/public-release-payload.tar.gz" \
            -C "$RUNNER_TEMP/publication-payload"

      - name: Validate the exact PDF, EPUB, and cover files
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v pdfinfo >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y poppler-utils
          fi
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import zipfile
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "publication-payload/public_release_payload"
          report = json.loads((root / "publication_report.json").read_text(encoding="utf-8"))
          expected_slugs = [
              "g59-romances-senores-nueva-espana",
              "cantares-mexicanos-ms-1628-bis",
          ]
          if [row["slug"] for row in report["publications"]] != expected_slugs:
              raise SystemExit("unexpected publication report slugs")
          if report["fancourt_mother_sha256"] != "4192b835548fb2a87ed54a65df45054fcaf3e3aa704bc4ec3a4c10a5a775dc0e":
              raise SystemExit("wrong locked Fancourt mother hash")
          for row in report["publications"]:
              slug = row["slug"]
              for kind in ("pdf", "epub", "cover"):
                  filename = "cover.jpg" if kind == "cover" else Path(row["publication"][kind]).name
                  path = root / "public" / slug / filename
                  data = path.read_bytes()
                  if len(data) != row[kind]["size"]:
                      raise SystemExit(f"{slug} {kind}: size mismatch")
                  digest = hashlib.sha256(data).hexdigest()
                  if digest != row[kind]["sha256"]:
                      raise SystemExit(f"{slug} {kind}: SHA-256 mismatch")
                  if kind == "epub":
                      with zipfile.ZipFile(path) as archive:
                          if archive.testzip() is not None:
                              raise SystemExit(f"{slug}: corrupt EPUB")
                          if archive.read("mimetype") != b"application/epub+zip":
                              raise SystemExit(f"{slug}: invalid EPUB mimetype")
              print(f"payload assets OK: {slug}")
          PY
          payload="$RUNNER_TEMP/publication-payload/public_release_payload/public"
          test "$(pdfinfo "$payload/g59-romances-senores-nueva-espana/G59_Romances_de_los_senores_Japanese_Complete_Translation.pdf" | awk '/^Pages:/ {print $2}')" = "37"
          test "$(pdfinfo "$payload/cantares-mexicanos-ms-1628-bis/Cantares_Mexicanos_Japanese_Complete_Translation.pdf" | awk '/^Pages:/ {print $2}')" = "309"

      - name: Apply the source changes in a disposable worktree
        shell: bash
        run: |
          set -euo pipefail
          python3 \
            "$RUNNER_TEMP/publication-payload/public_release_payload/apply_public_release.py" \
            "$GITHUB_WORKSPACE" \
            "$RUNNER_TEMP/publication-payload/public_release_payload"
          node --check src/publications.mjs
          git diff --check

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install build dependencies
        run: npm ci

      - name: Build and test before release mutation
        run: |
          npm run build
          npm test

      - name: Upload the four checksum-locked release assets
        shell: bash
        run: |
          set -euo pipefail
          checksum_dir="$RUNNER_TEMP/release-checksums"
          payload="$RUNNER_TEMP/publication-payload/public_release_payload/public"
          mkdir -p "$checksum_dir"
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern SHA256SUMS.txt \
            --dir "$checksum_dir"
          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path(os.environ["RUNNER_TEMP"]) / "release-checksums/SHA256SUMS.txt"
          additions = {
              "Cantares_Mexicanos_Japanese_Complete_Translation.epub": "7a37a6e3ee146250ba7876f1b600fb43e7105805ccbaeffd36a595317572b76a",
              "Cantares_Mexicanos_Japanese_Complete_Translation.pdf": "3081c4f2eaa4552956904347820ad664121033d10a78597059b8e327b4dc1a58",
              "G59_Romances_de_los_senores_Japanese_Complete_Translation.epub": "2a4d10f3aa2e4eec325d620b51339231ec7ef9d18a9dbeb98fd37c0794f5e09f",
              "G59_Romances_de_los_senores_Japanese_Complete_Translation.pdf": "fd214c9be5ea1e355098153077ad21b407a892cbaeafd60b4bc2568a7319171a",
          }
          kept = []
          for line in path.read_text(encoding="utf-8").splitlines():
              fields = line.split()
              if fields and fields[-1] in additions:
                  continue
              kept.append(line)
          kept.extend(f"{digest}  {filename}" for filename, digest in sorted(additions.items()))
          path.write_text("\n".join(kept) + "\n", encoding="utf-8")
          PY
          gh release upload "$RELEASE_TAG" \
            "$payload/g59-romances-senores-nueva-espana/G59_Romances_de_los_senores_Japanese_Complete_Translation.pdf" \
            "$payload/g59-romances-senores-nueva-espana/G59_Romances_de_los_senores_Japanese_Complete_Translation.epub" \
            "$payload/cantares-mexicanos-ms-1628-bis/Cantares_Mexicanos_Japanese_Complete_Translation.pdf" \
            "$payload/cantares-mexicanos-ms-1628-bis/Cantares_Mexicanos_Japanese_Complete_Translation.epub" \
            "$checksum_dir/SHA256SUMS.txt" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Download the public release assets back and verify them
        shell: bash
        run: |
          set -euo pipefail
          verify_dir="$RUNNER_TEMP/release-verify"
          mkdir -p "$verify_dir"
          for filename in \
            G59_Romances_de_los_senores_Japanese_Complete_Translation.pdf \
            G59_Romances_de_los_senores_Japanese_Complete_Translation.epub \
            Cantares_Mexicanos_Japanese_Complete_Translation.pdf \
            Cantares_Mexicanos_Japanese_Complete_Translation.epub \
            SHA256SUMS.txt
          do
            gh release download "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern "$filename" \
              --dir "$verify_dir"
          done
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "release-verify"
          expected = {
              "Cantares_Mexicanos_Japanese_Complete_Translation.epub": (291494, "7a37a6e3ee146250ba7876f1b600fb43e7105805ccbaeffd36a595317572b76a"),
              "Cantares_Mexicanos_Japanese_Complete_Translation.pdf": (2714348, "3081c4f2eaa4552956904347820ad664121033d10a78597059b8e327b4dc1a58"),
              "G59_Romances_de_los_senores_Japanese_Complete_Translation.epub": (77631, "2a4d10f3aa2e4eec325d620b51339231ec7ef9d18a9dbeb98fd37c0794f5e09f"),
              "G59_Romances_de_los_senores_Japanese_Complete_Translation.pdf": (593978, "fd214c9be5ea1e355098153077ad21b407a892cbaeafd60b4bc2568a7319171a"),
          }
          checksum_lines = set((root / "SHA256SUMS.txt").read_text(encoding="utf-8").splitlines())
          for filename, (size, digest) in expected.items():
              data = (root / filename).read_bytes()
              if len(data) != size or hashlib.sha256(data).hexdigest() != digest:
                  raise SystemExit(f"downloaded release asset mismatch: {filename}")
              if f"{digest}  {filename}" not in checksum_lines:
                  raise SystemExit(f"SHA256SUMS entry mismatch: {filename}")
              print(f"release asset OK: {filename}")
          PY

      - name: Restore final PDF and EPUB inputs
        id: search-assets-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .cache/fulltext-assets
            .cache/fulltext-ocr
          key: publish-g59-cantares-assets-${{ hashFiles('assets-manifest.json') }}
          restore-keys: |
            fulltext-assets-

      - name: Ensure full-text extraction tools are available
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v pdftotext >/dev/null || ! command -v tesseract >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y poppler-utils tesseract-ocr
          fi

      - name: Restore the exact final full-text search index
        id: search-index-cache
        uses: actions/cache/restore@v4
        with:
          path: dist/search
          key: fulltext-index-${{ hashFiles('assets-manifest.json', 'master-archive.json', 'src/publications.mjs', 'scripts/search/build-index.mjs', 'scripts/search/create-manifest.mjs', 'scripts/search/extract-corpus.py', 'package-lock.json') }}

      - name: Build the exact final full-text search index
        if: steps.search-index-cache.outputs.cache-hit != 'true'
        run: |
          npm run fetch:search-assets
          npm run build:search

      - name: Save the exact final full-text search index
        if: steps.search-index-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: dist/search
          key: fulltext-index-${{ hashFiles('assets-manifest.json', 'master-archive.json', 'src/publications.mjs', 'scripts/search/build-index.mjs', 'scripts/search/create-manifest.mjs', 'scripts/search/extract-corpus.py', 'package-lock.json') }}

      - name: Verify the exact final full-text search index
        run: |
          npm run verify:search
          npm test

      - name: Commit the verified site only to the ready branch
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/publish-g59-cantares-20260821-v2.yml
          legacy_workflow=.github/workflows/publish-g59-cantares-20260821.yml
          rm -f "$workflow" "$legacy_workflow"
          git diff --check
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$READY_BRANCH"
          git add \
            "$workflow" \
            "$legacy_workflow" \
            REVISION_LOG.md \
            assets-manifest.json \
            master-archive.json \
            scripts/search/verify-queries.mjs \
            src/publications.mjs \
            static/publications/g59-romances-senores-nueva-espana/cover.jpg \
            static/publications/cantares-mexicanos-ms-1628-bis/cover.jpg \
            tests/archive.test.mjs
          python3 - <<'PY'
          import subprocess

          expected = sorted([
              ".github/workflows/publish-g59-cantares-20260821-v2.yml",
              ".github/workflows/publish-g59-cantares-20260821.yml",
              "REVISION_LOG.md",
              "assets-manifest.json",
              "master-archive.json",
              "scripts/search/verify-queries.mjs",
              "src/publications.mjs",
              "static/publications/cantares-mexicanos-ms-1628-bis/cover.jpg",
              "static/publications/g59-romances-senores-nueva-espana/cover.jpg",
              "tests/archive.test.mjs",
          ])
          actual = sorted(
              subprocess.check_output(
                  ["git", "diff", "--cached", "--name-only"],
                  text=True,
              ).splitlines()
          )
          if actual != expected:
              raise SystemExit(f"unexpected staged paths: {actual}")
          print("verified staged paths:", ", ".join(actual))
          PY
          git commit -m "Publish G59 and Cantares Mexicanos translations"
          git push origin "HEAD:refs/heads/$READY_BRANCH"
          echo "READY_COMMIT=$(git rev-parse HEAD)"
          git push origin --delete "$STAGING_BRANCH" || true
