name: Verify the live 1585 Granada constitutions
on:
  push:
    branches: [agent/sjd-1585-live-verify-20261126]
    paths: [.sjd-1585-live-manifest.json]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Verify live catalogue, PDF, EPUB, cover and search
        run: |
          command -v pdfinfo || { sudo apt-get update && sudo apt-get install -y poppler-utils; }
          python3 .sjd-1585-live-check.py
      - uses: actions/upload-artifact@v4
        with:
          name: sjd-1585-live-verification
          path: sjd-1585-live-verification.json
