name: Verify deployed search coverage for Sosa 1884
on:
  push:
    branches: ["agent/sosa-biografias-transfer-20261119"]
    paths: [".github/workflows/sosa-biografias-verify-remote.yml"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run verify:remote-search
