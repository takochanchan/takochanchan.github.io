name: Publish approved Mendieta assets
on:
  push:
    branches: [agent/publish-mendieta-1870-20260913]
    paths: ['.publication-upload-requests/mendieta-1870.json']
permissions:
  contents: write
concurrency:
  group: mendieta-publication-transfer
  cancel-in-progress: false
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm test
      - name: Transfer and verify PDF and EPUB
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .publication-transfer/transfer-mendieta.py
      - uses: actions/upload-artifact@v4
        with:
          name: mendieta-release-byte-verification
          path: release-byte-verification.json
