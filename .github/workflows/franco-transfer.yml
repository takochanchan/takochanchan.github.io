# Group overview is supplied by the catalogue definition; unit overview remains in the overview registry.
name: Transfer checksum-pinned Alonso Franco 1900 assets

on:
  push:
    branches: ["agent/franco-publish-20261111"]
    paths: [".publication-upload-requests/franco-historia-santiago-mexico-segunda-parte-1900.json"]
permissions:
  contents: write
concurrency:
  group: publication-release-transfer
  cancel-in-progress: false
jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install build dependencies
        run: npm ci --no-audit --no-fund
      - name: Build and test the publication catalogue
        run: npm run build && npm test
      - name: Reconstruct, upload, and verify publication PDF and EPUB
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .publication-transfer/transfer-franco.py
      - uses: actions/upload-artifact@v4
        with:
          name: franco-release-verification
          path: franco-release-verification.json
