        scripts/validate-epubs.py|10646|b3ffe08a001fe97e7ea92930cf876cba8431344237498cfa67873ccf0e764825|11003d9f074f0be64a3c4cf8ced1b170de4e1b02
        src/publications.mjs|325452|e064d9a6692364b7eac70937f64c7097b6eb730247f023987c152e4bff6fee32|d871222d2033e59d781c7c8dbd436ba872b3c02f 59916f17c6ef98bd55462762a49016babad57289 05055aac84cbc9b3259ffa684a0743f8668f0908 694a0ab36418f0a64bd1aa890ad14a8c8d5a75f9
        tests/archive.test.mjs|27795|2ab8e1cdebec8913aa607d0909e9aba893314d972c7fb850cc0ec194dd6a5030|973f6e3204bc22f7e984f6bf720dfe1635f63b3a
        static/publications/romero-bosquejo-chiapas-soconusco-1877/cover.jpg|86485|580b845125da70db19cd2557d5aa61d5af5382f779b2dd1537dcdd11fb0fd42e|ba1ab47277ded9b3f51993235bd794bbb79df6d5

    steps:
      - name: Check out the publication site
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install PDF inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Reassemble and verify staged assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/romero-assets
          while IFS='|' read -r key name size digest blobs; do
            test -n "$name" || continue
            target="/tmp/romero-assets/$name"
            : > "$target"
            for blob_sha in $blobs; do
              gh api "repos/$GITHUB_REPOSITORY/git/blobs/$blob_sha" \
                --jq .content | tr -d '\n' | base64 --decode >> "$target"
            done
            echo "$digest  $target" | sha256sum -c -
            test "$(stat -c %s "$target")" = "$size"
          done <<< "$ASSETS"

      - name: Validate the approved PDF and EPUB container
        run: |
          set -euo pipefail
          pdf=/tmp/romero-assets/Matias_Romero_Bosquejo_historico_1877_Japanese_Complete_Translation.pdf
          epub=/tmp/romero-assets/Matias_Romero_Bosquejo_historico_1877_Japanese_Complete_Translation.epub
          pdfinfo "$pdf" > /tmp/romero-pdfinfo.txt
          grep -E '^Creator:[[:space:]]+Writer$' /tmp/romero-pdfinfo.txt
          grep -E '^Producer:[[:space:]]+LibreOffice' /tmp/romero-pdfinfo.txt
          grep -E '^Tagged:[[:space:]]+yes$' /tmp/romero-pdfinfo.txt
          grep -E '^Pages:[[:space:]]+1568$' /tmp/romero-pdfinfo.txt
          grep -F 'Page size:       612 x 792 pts (letter)' /tmp/romero-pdfinfo.txt
          pdffonts "$pdf" > /tmp/romero-fonts.txt
          pdftotext -layout "$pdf" /tmp/romero-pdf.txt
          python3 - /tmp/romero-fonts.txt /tmp/romero-pdf.txt "$epub" <<'PY'
          import re
          import sys
          import zipfile
          from pathlib import Path

          font_lines = Path(sys.argv[1]).read_text(
              encoding="utf-8"
          ).splitlines()[2:]
          assert font_lines
          for line in font_lines:
              match = re.match(
                  r"^(.+?)\s{2,}(.+?)\s{2,}(.+?)\s{2,}"
                  r"(yes|no)\s+(yes|no)\s+(yes|no)\s+\d+\s+\d+$",
                  line.strip(),
              )
              assert match is not None, line
              assert match.group(4) == "yes", line
              assert "Noto" in match.group(1), line

          text = Path(sys.argv[2]).read_text(encoding="utf-8")
          compact = re.sub(r"\s+", "", text)
          for phrase in (
              "チアパスおよびソコヌスコのメキシコ編入史概説",
              "メキシコと中央アメリカ・グアテマラとの国境交渉",
              "マティアス・ロメロ",
              "ColumbiaUniversityLibraries",
              "GoogleBooks",
              "〔原刊p.i〕",
              "〔原刊p.xxiv〕",
              "〔原刊p.3〕",
              "〔原刊p.798〕",
              "正誤表",
          ):
              assert phrase in compact, phrase
          for phrase in ("確認用", "校閲用", "未公開", "Proof"):
              assert phrase not in compact, phrase
          japanese = len(
              re.findall(r"[\u3040-\u30ff\u3400-\u9fff]", text)
          )
          assert japanese >= 1_000_000, japanese

          with zipfile.ZipFile(sys.argv[3]) as archive:
              assert archive.testzip() is None
              assert archive.namelist()[0] == "mimetype"
              assert archive.getinfo("mimetype").compress_type == zipfile.ZIP_STORED
              assert archive.read("mimetype") == b"application/epub+zip"
          print(f"PDF and EPUB container OK: {japanese:,} Japanese characters")
          PY


      - name: Prepare shared checksum file
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/current-release
          gh release download publications-current \
            --pattern SHA256SUMS.txt \
            --dir /tmp/current-release \
            --repo "$GITHUB_REPOSITORY"
          python3 - <<'PY'
          import os
          from pathlib import Path

          current = Path("/tmp/current-release/SHA256SUMS.txt")
          lines = current.read_text(encoding="utf-8").splitlines()
          entries = {}
          for line in lines:
              digest, separator, name = line.partition("  ")
              assert separator and len(digest) == 64 and name
              assert name not in entries
              entries[name] = digest
          assert len(entries) >= 234 and len(entries) % 2 == 0, len(entries)

          targets = []
          for record in os.environ["ASSETS"].splitlines():
              if not record.strip():
                  continue
              _key, name, _size, digest, _blobs = record.split("|", 4)
              entries[name] = digest
              targets.append((name, digest))
          assert len(targets) == 2

          target_names = {name for name, _digest in targets}
          lines = [
              line
              for line in lines
              if line.partition("  ")[2] not in target_names
          ]
          lines.extend(f"{digest}  {name}" for name, digest in targets)
          assert len(lines) == len(entries)
          Path("/tmp/SHA256SUMS.txt").write_text(
              "\n".join(lines) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload and verify two release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          upload_args=()
          while IFS='|' read -r key name size digest blobs; do
            test -n "$name" || continue
            upload_args+=("/tmp/romero-assets/$name")
          done <<< "$ASSETS"
          gh release upload publications-current \
            "${upload_args[@]}" \
            /tmp/SHA256SUMS.txt \
            --clobber \
            --repo "$GITHUB_REPOSITORY"

          mkdir -p /tmp/verified-release
          while IFS='|' read -r key name size digest blobs; do
            test -n "$name" || continue
            gh release download publications-current \
              --pattern "$name" \
              --dir /tmp/verified-release \
              --repo "$GITHUB_REPOSITORY"
            echo "$digest  /tmp/verified-release/$name" | sha256sum -c -
            test "$(stat -c %s "/tmp/verified-release/$name")" = "$size"
          done <<< "$ASSETS"
          gh release download publications-current \
            --pattern SHA256SUMS.txt \
            --dir /tmp/verified-release \
            --repo "$GITHUB_REPOSITORY"
          cmp /tmp/SHA256SUMS.txt /tmp/verified-release/SHA256SUMS.txt

      - name: Reassemble and verify site files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/romero-site
          while IFS='|' read -r path size digest blobs; do
            test -n "$path" || continue
            target="/tmp/romero-site/$path"
            mkdir -p "$(dirname "$target")"
            : > "$target"
            for blob_sha in $blobs; do
              gh api "repos/$GITHUB_REPOSITORY/git/blobs/$blob_sha" \
                --jq .content | tr -d '\n' | base64 --decode >> "$target"
            done
            echo "$digest  $target" | sha256sum -c -
            test "$(stat -c %s "$target")" = "$size"
          done <<< "$SITE_FILES"

      - name: Validate and publish the site
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          while IFS='|' read -r path _size _digest _blobs; do
            test -n "$path" || continue
            mkdir -p "$(dirname "$path")"
            cp "/tmp/romero-site/$path" "$path"
            git add -- "$path"
          done <<< "$SITE_FILES"

          workflow=.github/workflows/publish-romero-assets-20260811.yml
          git rm -- "$workflow"
          git diff --cached --check
          npm run build
          npm test

          slug=romero-bosquejo-chiapas-soconusco-1877
          mkdir -p "/tmp/romero-public-root/publications/$slug"
          cp /tmp/romero-assets/*.epub \
            "/tmp/romero-public-root/publications/$slug/"
          python3 scripts/validate-epubs.py \
            /tmp/romero-public-root \
            --slug "$slug"

          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Publish Romero Chiapas and Soconusco translation"
          git push origin HEAD:main

          gh api --method DELETE \
            "repos/$GITHUB_REPOSITORY/git/refs/heads/agent%2Frelease-upload-romero-20260811" \
            >/dev/null 2>&1 || true

      - name: Record public diagnostic on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s\n' \
            "Romero release workflow failed. Inspect this run before retrying." \
            "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            > /tmp/romero-release-error.txt
          content="$(base64 -w0 /tmp/romero-release-error.txt)"
          gh api --method PUT \
            "repos/$GITHUB_REPOSITORY/contents/.release-upload-errors/romero-bosquejo-chiapas-soconusco-1877-${GITHUB_RUN_ID}.txt" \
            -f message="Record Romero release failure" \
            -f content="$content" \
            -f branch=main
