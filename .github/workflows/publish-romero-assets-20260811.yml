name: Publish Romero edition once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-romero-assets-20260811.yml

permissions:
  contents: write

concurrency:
  group: publications-current-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ASSETS: |
