name: Publish Historia Tolteca-Chichimeca v1

on:
  push:
    branches: ["main"]
    paths:
      - ".publication-triggers/publish-historia-tolteca-chichimeca-20260814-v1.json"

permissions:
  contents: write

concurrency:
  group: publication-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      ASSET_BRANCH: agent/historia-tolteca-chichimeca-public-assets-20260814-v1
      SITE_BRANCH: agent/historia-tolteca-chichimeca-publication-20260814-v1
      STAGING_ROOT: .release-staging/historia-tolteca-chichimeca-public-20260814-v1
      WORKFLOW_PATH: .github/workflows/publish-historia-tolteca-chichimeca-20260814-v1.yml
      TRIGGER_PATH: .publication-triggers/publish-historia-tolteca-chichimeca-20260814-v1.json
      RELEASE_TAG: publications-current
      SLUG: historia-tolteca-chichimeca
      PDF_NAME: Historia_Tolteca_Chichimeca_Japanese_Complete_Translation.pdf
      EPUB_NAME: Historia_Tolteca_Chichimeca_Japanese_Complete_Translation.epub
    steps:
      - name: Check out checksum-pinned release bytes
        uses: actions/checkout@v4
        with:
          ref: agent/historia-tolteca-chichimeca-public-assets-20260814-v1
          path: assets

      - name: Check out publication source
        uses: actions/checkout@v4
        with:
          ref: agent/historia-tolteca-chichimeca-publication-20260814-v1
          path: site
          fetch-depth: 0

      - name: Reconstruct and validate PDF and EPUB bytes
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v pdfinfo >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y poppler-utils
          fi
          python - <<'PY'
          import hashlib
          import json
          import pathlib
          import re
          import subprocess
          import zipfile
          from xml.etree import ElementTree as ET

          staging = pathlib.Path("assets/.release-staging/historia-tolteca-chichimeca-public-20260814-v1")
          payload = json.loads((staging / "manifest.json").read_text(encoding="utf-8"))
          assert payload["slug"] == "historia-tolteca-chichimeca"
          assets = payload["assets"]
          assert len(assets) == 2
          assert {pathlib.PurePosixPath(asset["filename"]).suffix for asset in assets} == {".pdf", ".epub"}
          release = pathlib.Path("release")
          release.mkdir()
          for asset in assets:
              filename = asset["filename"]
              target = release / filename
              with target.open("wb") as output:
                  for relative in asset["parts"]:
                      output.write((staging / relative).read_bytes())
              data = target.read_bytes()
              assert len(data) == asset["size"], filename
              assert hashlib.sha256(data).hexdigest() == asset["sha256"], filename

          credit = "Source gallica.bnf.fr / Bibliothèque nationale de France"
          forbidden = ("日本語全訳", "匿名", "1976年版", "復元葉順", "葉順を採用", "確認用")
          pdf = release / "Historia_Tolteca_Chichimeca_Japanese_Complete_Translation.pdf"
          epub = release / "Historia_Tolteca_Chichimeca_Japanese_Complete_Translation.epub"
          data = pdf.read_bytes()
          assert data.startswith(b"%PDF-") and b"%%EOF" in data[-2048:]
          info = subprocess.check_output(["pdfinfo", str(pdf)], text=True)
          assert re.search(r"^Pages:\s+190$", info, re.MULTILINE), info
          font_rows = subprocess.check_output(["pdffonts", str(pdf)], text=True).splitlines()[2:]
          assert len(font_rows) == 16, len(font_rows)
          assert all(row.split()[3] == "yes" and row.split()[5] == "yes" for row in font_rows)
          pdf_text = subprocess.check_output(["pdftotext", "-layout", str(pdf), "-"], text=True)
          assert credit in pdf_text
          sections = [int(value) for value in re.findall(r"(?m)^§\s*(\d+)", pdf_text)]
          assert len(sections) == 442 and set(sections) == set(range(1, 443))
          special = [282, *range(288, 296), *range(283, 288), 296]
          positions = [sections.index(value) for value in special]
          assert positions == sorted(positions)
          for phrase in forbidden:
              assert phrase not in pdf_text, phrase

          with zipfile.ZipFile(epub) as archive:
              assert archive.testzip() is None
              first = archive.infolist()[0]
              assert first.filename == "mimetype" and first.compress_type == 0
              assert archive.read("mimetype") == b"application/epub+zip"
              opf = ET.fromstring(archive.read("EPUB/content.opf"))
              ns = {"o": "http://www.idpf.org/2007/opf"}
              cover_items = [
                  item for item in opf.findall(".//o:manifest/o:item", ns)
                  if "cover-image" in item.attrib.get("properties", "").split()
              ]
              assert len(cover_items) == 1
              assert cover_items[0].attrib["href"] == "media/cover.jpg"
              assert "EPUB/media/cover.jpg" in archive.namelist()
              roots = [
                  ET.fromstring(archive.read(name))
                  for name in archive.namelist()
                  if name.endswith((".xhtml", ".html"))
              ]
              epub_text = " ".join(" ".join(root.itertext()) for root in roots)
              images = [
                  name for name in archive.namelist()
                  if pathlib.PurePosixPath(name).suffix.lower() in {".jpg", ".jpeg", ".png", ".gif", ".webp"}
              ]
              assert len(images) == 102, len(images)
              assert credit in epub_text
              title_page = archive.read("EPUB/text/title_page.xhtml").decode("utf-8")
              assert title_page.index("トルテカ・チチメカ史") < title_page.index("Historia Tolteca-Chichimeca")
              assert title_page.index("Historia Tolteca-Chichimeca") < title_page.index("編者不詳")
              for phrase in forbidden:
                  assert phrase not in epub_text, phrase
          PY

      - name: Install build dependencies
        working-directory: site
        run: npm ci

      - name: Validate catalogue, archive gate, site, and EPUB
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "epub-root/publications/$SLUG"
          cp "release/$EPUB_NAME" "epub-root/publications/$SLUG/$EPUB_NAME"
          cd site
          npm run verify:masters
          node scripts/build.mjs
          node --test tests/archive.test.mjs
          python3 -m unittest discover -s tests -p 'test_search_*.py'
          node --test tests/fulltext-search.test.mjs
          python3 scripts/validate-epubs.py ../epub-root --slug "$SLUG"
          node --input-type=module - <<'NODE'
          import assert from "node:assert/strict";
          import { publications } from "./src/publications.mjs";
          const item = publications.find((entry) => entry.slug === "historia-tolteca-chichimeca");
          assert.ok(item);
          assert.equal(item.recordClass, "major-work");
          assert.equal(item.title, "トルテカ・チチメカ史");
          assert.equal(item.originalTitle, "Historia Tolteca-Chichimeca");
          assert.equal(item.author, "編者不詳");
          assert.equal(item.pageCount, 190);
          assert.equal(item.figureCount, 100);
          assert.equal(item.plateCount, 0);
          assert.match(item.description, /本文図版に数えず.*付属別資料/);
          assert.match(item.sourceProvider, /ガリカ公開.*本文と絵文書の底本/);
          assert.match(item.sourceProvider, /アモシュカリ公開.*付属別資料/);
          assert.match(item.sourceProvider, /補助資料は内部検証に限定/);
          assert.match(item.rights, /Source gallica\.bnf\.fr \/ Bibliothèque nationale de France/);
          assert.doesNotMatch(JSON.stringify(item), /日本語全訳|匿名|1976年版|復元葉順|原冊順/);
          NODE

      - name: Verify full-text extraction and physical PDF mapping
        shell: bash
        run: |
          set -euo pipefail
          cd site
          mkdir -p .cache
          python - <<'PY'
          import hashlib
          import json
          import pathlib

          release = (pathlib.Path.cwd().parent / "release").resolve()
          archive_commit = json.load(open("master-archive.json"))["archive_commit"]
          epub = release / "Historia_Tolteca_Chichimeca_Japanese_Complete_Translation.epub"
          pdf = release / "Historia_Tolteca_Chichimeca_Japanese_Complete_Translation.pdf"
          manifest = {
              "schemaVersion": 1,
              "archiveCommit": archive_commit,
              "assetManifestSha256": None,
              "works": [{
                  "slug": "historia-tolteca-chichimeca",
                  "title": "トルテカ・チチメカ史",
                  "author": "編者不詳",
                  "recordClass": "major-work",
                  "url": "/publications/historia-tolteca-chichimeca/",
                  "pdfUrl": "https://github.com/takochanchan/takochanchan.github.io/releases/download/publications-current/Historia_Tolteca_Chichimeca_Japanese_Complete_Translation.pdf",
                  "masterPath": "publications/historia-tolteca-chichimeca/master.docx",
                  "source": str(epub),
                  "format": "epub",
                  "sourceMode": "approved-epub-mirror",
                  "sourceSha256": hashlib.sha256(epub.read_bytes()).hexdigest(),
                  "pdf": str(pdf),
                  "pdfSha256": hashlib.sha256(pdf.read_bytes()).hexdigest(),
              }],
          }
          pathlib.Path(".cache/htc-release-search-manifest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
          python3 scripts/search/extract-corpus.py \
            --manifest .cache/htc-release-search-manifest.json \
            --output .cache/htc-release-search-corpus.json
          python - <<'PY'
          import json

          work = json.load(open(".cache/htc-release-search-corpus.json"))["works"][0]
          assert work["pdfPageCount"] == 190
          assert len(work["chunks"]) == 876
          assert sum(len(chunk["text"]) for chunk in work["chunks"]) == 58627
          assert work["mappingSummary"] == {
              "exact": 671,
              "fingerprint": 44,
              "fuzzy": 2,
              "sourcePage": 153,
              "inherited": 6,
              "unmapped": 0,
              "verifiedRate": 1.0,
              "pdfTextMode": "embedded",
          }
          locations = {chunk["originalPage"] for chunk in work["chunks"]}
          assert any("第 34 葉表（欠葉）" in location for location in locations)
          assert any("第 52 葉表（欠葉）" in location for location in locations)
          PY

      - name: Upload PDF and EPUB and refresh release checksums
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-metadata updated-release-metadata
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern SHA256SUMS.txt \
            --dir release-metadata
          gh release upload "$RELEASE_TAG" "release/$PDF_NAME" "release/$EPUB_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
          python - <<'PY'
          import hashlib
          import pathlib

          expected = {}
          for path in pathlib.Path("release").iterdir():
              expected[path.name] = hashlib.sha256(path.read_bytes()).hexdigest()
          assert len(expected) == 2
          previous = {}
          path = pathlib.Path("release-metadata/SHA256SUMS.txt")
          for line in path.read_text(encoding="utf-8").splitlines():
              digest, filename = line.split("  ", 1)
              assert filename not in previous
              previous[filename] = digest
          previous.update(expected)
          lines = [f"{digest}  {filename}" for filename, digest in sorted(previous.items())]
          pathlib.Path("updated-release-metadata/SHA256SUMS.txt").write_text(
              "\n".join(lines) + "\n",
              encoding="utf-8",
          )
          PY
          gh release upload "$RELEASE_TAG" updated-release-metadata/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Re-download and verify public release bytes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir verify-release
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$PDF_NAME" \
            --pattern "$EPUB_NAME" \
            --pattern SHA256SUMS.txt \
            --dir verify-release
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > verify-release/release.json
          python - <<'PY'
          import hashlib
          import json
          import pathlib

          names = [
              "Historia_Tolteca_Chichimeca_Japanese_Complete_Translation.pdf",
              "Historia_Tolteca_Chichimeca_Japanese_Complete_Translation.epub",
          ]
          sums = pathlib.Path("verify-release/SHA256SUMS.txt").read_text(encoding="utf-8").splitlines()
          release = json.load(open("verify-release/release.json"))
          remote = {asset["name"]: asset for asset in release["assets"]}
          for filename in names:
              original = pathlib.Path("release") / filename
              downloaded = pathlib.Path("verify-release") / filename
              assert original.read_bytes() == downloaded.read_bytes(), filename
              digest = hashlib.sha256(original.read_bytes()).hexdigest()
              assert f"{digest}  {filename}" in sums
              assert remote[filename]["size"] == original.stat().st_size
              assert remote[filename]["digest"] == f"sha256:{digest}"
          PY

      - name: Publish the verified catalogue source
        id: publish-source
        working-directory: site
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          git rebase origin/main
          git push origin HEAD:main
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Remove staging branches and one-shot controls
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$ASSET_BRANCH"
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$SITE_BRANCH"
          workflow_sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/$WORKFLOW_PATH?ref=main" --jq .sha)"
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/contents/$WORKFLOW_PATH" \
            -f message="Remove completed Historia Tolteca-Chichimeca publication workflow" \
            -f sha="$workflow_sha" \
            -f branch=main
          trigger_sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/$TRIGGER_PATH?ref=main" --jq .sha)"
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/contents/$TRIGGER_PATH" \
            -f message="Remove completed Historia Tolteca-Chichimeca publication trigger" \
            -f sha="$trigger_sha" \
            -f branch=main
