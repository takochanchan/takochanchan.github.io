name: Publish Alva complete Japanese translation

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/publish-alva-20260822.yml"

permissions:
  contents: write

concurrency:
  group: publish-alva-20260822
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: publications-current
      STAGING_BRANCH: agent/alva-public-assets-20260822-v1
      READY_BRANCH: agent/alva-publication-ready-20260822-v1
      SLUG: alva-confessionario-mayor-menor-1634
      PDF_FILENAME: Bartolome_de_Alva_Confessionario_1634_Japanese_Complete_Translation.pdf
      EPUB_FILENAME: Bartolome_de_Alva_Confessionario_1634_Japanese_Complete_Translation.epub
      PAYLOAD_SHA256: a7d8e7921d5628b6ec1eac21dd99cedf2f67d838be2560f8a2c7661c887d873a
      PAYLOAD_SIZE: "5859405"
      PAYLOAD_PARTS: "23"
      PDF_SHA256: 57cf5994043e06a906e01347a39ec902c37fbaa02824727e8d5f1d9e33cfe1db
      PDF_SIZE: "2075065"
      EPUB_SHA256: 9a5b76305efa07b6fae75945d27e534960e2475002ed7b39b7be28829603f9d0
      EPUB_SIZE: "4113148"
      COVER_SHA256: 65228c4c6080339315fbf8c465042146d05110e527a938826d538223bb17cdba
      COVER_SIZE: "68454"
    steps:
      - name: Check out the publication trigger commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Check out the checksum-locked payload
        uses: actions/checkout@v4
        with:
          ref: ${{ env.STAGING_BRANCH }}
          path: staging
          sparse-checkout: release-staging/alva-20260822
          sparse-checkout-cone-mode: false

      - name: Reconstruct and verify the publication payload
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          source = Path("staging/release-staging/alva-20260822")
          parts = sorted(source.glob("chunk-*"))
          count = int(os.environ["PAYLOAD_PARTS"])
          expected = [f"chunk-{index:04d}" for index in range(count)]
          if [part.name for part in parts] != expected:
              raise SystemExit("payload part set is incomplete or unexpected")
          output = Path(os.environ["RUNNER_TEMP"]) / "alva-public-release.tar.gz"
          digest = hashlib.sha256()
          size = 0
          with output.open("wb") as destination:
              for part in parts:
                  block = part.read_bytes()
                  destination.write(block)
                  digest.update(block)
                  size += len(block)
          if size != int(os.environ["PAYLOAD_SIZE"]):
              raise SystemExit(f"payload size {size} is not expected")
          if digest.hexdigest() != os.environ["PAYLOAD_SHA256"]:
              raise SystemExit("payload SHA-256 mismatch")
          print(f"payload OK: {size} bytes {digest.hexdigest()}")
          PY
          mkdir -p "$RUNNER_TEMP/publication-payload"
          tar -xzf "$RUNNER_TEMP/alva-public-release.tar.gz" \
            -C "$RUNNER_TEMP/publication-payload"

      - name: Validate the exact PDF, EPUB, cover, and report
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v pdfinfo >/dev/null || ! command -v pdftotext >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y poppler-utils
          fi
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          import subprocess
          import zipfile
          from pathlib import Path
          from xml.etree import ElementTree as ET

          payload = Path(os.environ["RUNNER_TEMP"]) / "publication-payload/public_release_payload"
          report = json.loads((payload / "publication_report.json").read_text(encoding="utf-8"))
          expected_report = {
              "slug": "alva-confessionario-mayor-menor-1634",
              "source_site_commit": "2abf8e5df92c6281617bf2aedd508c364e3d9d6b",
              "archive_commit": "ffbbe7c9359c3a9878d64b65bbc74e55fe7f2670",
              "canonical_master": "publications/alva-confessionario-mayor-menor-1634/master.docx",
          }
          for key, value in expected_report.items():
              if report.get(key) != value:
                  raise SystemExit(f"publication report mismatch: {key}")

          expected_assets = {
              "pdf": (2075065, "57cf5994043e06a906e01347a39ec902c37fbaa02824727e8d5f1d9e33cfe1db"),
              "epub": (4113148, "9a5b76305efa07b6fae75945d27e534960e2475002ed7b39b7be28829603f9d0"),
              "cover": (68454, "65228c4c6080339315fbf8c465042146d05110e527a938826d538223bb17cdba"),
          }
          asset_root = payload / "public" / report["slug"]
          paths = {}
          for kind, (size, digest) in expected_assets.items():
              filename = report[kind]["filename"]
              path = asset_root / filename
              data = path.read_bytes()
              if len(data) != size or hashlib.sha256(data).hexdigest() != digest:
                  raise SystemExit(f"{kind}: exact-byte validation failed")
              if report[kind]["size"] != size or report[kind]["sha256"] != digest:
                  raise SystemExit(f"{kind}: report validation failed")
              paths[kind] = path

          pages = subprocess.check_output(["pdfinfo", str(paths["pdf"])], text=True)
          match = re.search(r"^Pages:\s+(\d+)$", pages, flags=re.MULTILINE)
          if not match or int(match.group(1)) != 66:
              raise SystemExit("PDF page count mismatch")
          pdf_text = subprocess.check_output(["pdftotext", str(paths["pdf"]), "-"], text=True)
          markers = re.findall(r"〔(?:原冊 f\. \d+[rv]|底本画像 \d+)〕", pdf_text)
          if len(markers) != 57:
              raise SystemExit(f"PDF source marker mismatch: {len(markers)}")
          required = [
              "ナワトル語大・小告解問答",
              "翡翠の小像が現世の財を与える",
              "Courtesy of the John Carter Brown Library",
          ]
          if any(value not in pdf_text for value in required):
              raise SystemExit("PDF required wording is missing")
          banned = ["校正用", "公開版ではない", "日本語全訳"]
          if any(value in pdf_text for value in banned):
              raise SystemExit("PDF contains a proof-era or forbidden cover string")
          fonts = subprocess.check_output(["pdffonts", str(paths["pdf"])], text=True)
          font_rows = [line.split() for line in fonts.splitlines()[2:] if line.strip()]
          if not font_rows or any(row[3] != "yes" or row[5] != "yes" for row in font_rows):
              raise SystemExit("PDF fonts are not all embedded with Unicode maps")
          if not all("Noto" in row[0] for row in font_rows):
              raise SystemExit("PDF contains a non-Noto embedded font")

          with zipfile.ZipFile(paths["epub"]) as archive:
              if archive.testzip() is not None:
                  raise SystemExit("corrupt EPUB")
              infos = archive.infolist()
              if not infos or infos[0].filename != "mimetype":
                  raise SystemExit("EPUB mimetype is not first")
              if infos[0].compress_type != zipfile.ZIP_STORED:
                  raise SystemExit("EPUB mimetype is compressed")
              if archive.read("mimetype") != b"application/epub+zip":
                  raise SystemExit("invalid EPUB mimetype")
              container = ET.fromstring(archive.read("META-INF/container.xml"))
              rootfile = next(node for node in container.iter() if node.tag.endswith("rootfile"))
              package = ET.fromstring(archive.read(rootfile.attrib["full-path"]))
              if not package.attrib.get("version", "").startswith("3"):
                  raise SystemExit("EPUB package is not version 3")
              item_nodes = [node for node in package.iter() if node.tag.endswith("item")]
              if not any("cover-image" in node.attrib.get("properties", "").split() for node in item_nodes):
                  raise SystemExit("EPUB cover-image property is missing")
              if not any("nav" in node.attrib.get("properties", "").split() for node in item_nodes):
                  raise SystemExit("EPUB navigation document is missing")
              texts = []
              marker_count = 0
              images = []
              source_classes = 0
              for name in archive.namelist():
                  if not name.endswith((".xhtml", ".html")):
                      continue
                  document = ET.fromstring(archive.read(name))
                  text = " ".join("".join(document.itertext()).split())
                  texts.append(text)
                  marker_count += len(re.findall(r"〔(?:原冊 f\. \d+[rv]|底本画像 \d+)〕", text))
                  for node in document.iter():
                      classes = node.attrib.get("class", "").split()
                      if "source-page" in classes or "page-marker" in classes:
                          source_classes += 1
                      if node.tag.endswith("img"):
                          images.append(node)
              full_text = "\n".join(texts)
              if marker_count != 57 or source_classes < 57:
                  raise SystemExit("EPUB source-location policy mismatch")
              if len(images) != 12:
                  raise SystemExit(f"EPUB embedded source-image count mismatch: {len(images)}")
              if any(not image.attrib.get("alt", "").strip() for image in images):
                  raise SystemExit("EPUB image without alternative text")
              if any(value not in full_text for value in required):
                  raise SystemExit("EPUB required wording is missing")
              if any(value in full_text for value in banned):
                  raise SystemExit("EPUB contains a proof-era string")
              css_members = [name for name in archive.namelist() if name.endswith(".css")]
              if not css_members or not any(
                  "text-align: left" in archive.read(name).decode("utf-8")
                  for name in css_members
              ):
                  raise SystemExit("EPUB left-aligned body rule is missing")
          print("PDF, EPUB, cover, and publication report are exact and valid")
          PY

      - name: Apply the source changes
        shell: bash
        run: |
          set -euo pipefail
          python3 \
            "$RUNNER_TEMP/publication-payload/public_release_payload/apply_public_release.py" \
            "$GITHUB_WORKSPACE" \
            "$RUNNER_TEMP/publication-payload/public_release_payload"
          mkdir -p "static/publications/$SLUG"
          mv \
            "public/$SLUG/cover.jpg" \
            "static/publications/$SLUG/cover.jpg"
          node scripts/verify-master-archive.mjs
          node --check src/publications.mjs
          node --check scripts/search/verify-queries.mjs
          python3 -m py_compile scripts/validate-epubs.py
          git diff --check

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install build dependencies
        run: npm ci

      - name: Build and test source before release mutation
        run: |
          npm run build
          npm test

      - name: Upload the checksum-locked release assets
        shell: bash
        run: |
          set -euo pipefail
          checksum_dir="$RUNNER_TEMP/release-checksums"
          asset_dir="$RUNNER_TEMP/publication-payload/public_release_payload/public/$SLUG"
          mkdir -p "$checksum_dir"
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern SHA256SUMS.txt \
            --dir "$checksum_dir"
          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path(os.environ["RUNNER_TEMP"]) / "release-checksums/SHA256SUMS.txt"
          additions = {
              os.environ["EPUB_FILENAME"]: os.environ["EPUB_SHA256"],
              os.environ["PDF_FILENAME"]: os.environ["PDF_SHA256"],
          }
          kept = []
          for line in path.read_text(encoding="utf-8").splitlines():
              fields = line.split()
              if fields and fields[-1] in additions:
                  continue
              kept.append(line)
          kept.extend(f"{digest}  {filename}" for filename, digest in sorted(additions.items()))
          path.write_text("\n".join(kept) + "\n", encoding="utf-8")
          PY
          gh release upload "$RELEASE_TAG" \
            "$asset_dir/$PDF_FILENAME" \
            "$asset_dir/$EPUB_FILENAME" \
            "$checksum_dir/SHA256SUMS.txt" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Download the public release assets back and verify
        shell: bash
        run: |
          set -euo pipefail
          verify_dir="$RUNNER_TEMP/release-verify"
          mkdir -p "$verify_dir"
          for filename in "$PDF_FILENAME" "$EPUB_FILENAME" SHA256SUMS.txt
          do
            gh release download "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern "$filename" \
              --dir "$verify_dir"
          done
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "release-verify"
          expected = {
              os.environ["PDF_FILENAME"]: (int(os.environ["PDF_SIZE"]), os.environ["PDF_SHA256"]),
              os.environ["EPUB_FILENAME"]: (int(os.environ["EPUB_SIZE"]), os.environ["EPUB_SHA256"]),
          }
          checksums = set((root / "SHA256SUMS.txt").read_text(encoding="utf-8").splitlines())
          for filename, (size, digest) in expected.items():
              data = (root / filename).read_bytes()
              if len(data) != size or hashlib.sha256(data).hexdigest() != digest:
                  raise SystemExit(f"downloaded release asset mismatch: {filename}")
              if f"{digest}  {filename}" not in checksums:
                  raise SystemExit(f"SHA256SUMS entry mismatch: {filename}")
              print(f"release asset OK: {filename}")
          PY

      - name: Restore the exact final full-text search index
        id: search-index-cache
        uses: actions/cache/restore@v4
        with:
          path: dist/search
          key: fulltext-index-${{ hashFiles('assets-manifest.json', 'master-archive.json', 'src/publications.mjs', 'scripts/search/build-index.mjs', 'scripts/search/create-manifest.mjs', 'scripts/search/extract-corpus.py', 'package-lock.json') }}

      - name: Restore PDF and EPUB search inputs
        if: steps.search-index-cache.outputs.cache-hit != 'true'
        id: search-assets-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .cache/fulltext-assets
            .cache/fulltext-ocr
          key: publish-alva-assets-${{ hashFiles('assets-manifest.json') }}
          restore-keys: |
            fulltext-assets-

      - name: Ensure full-text extraction tools are available
        if: steps.search-index-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v pdftotext >/dev/null || ! command -v tesseract >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y poppler-utils tesseract-ocr
          fi

      - name: Fetch checksum-verified full-text inputs
        if: steps.search-index-cache.outputs.cache-hit != 'true'
        run: npm run fetch:search-assets

      - name: Save the exact PDF and EPUB search inputs
        if: steps.search-index-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .cache/fulltext-assets
            .cache/fulltext-ocr
          key: fulltext-assets-${{ hashFiles('assets-manifest.json') }}

      - name: Build the exact final full-text search index
        if: steps.search-index-cache.outputs.cache-hit != 'true'
        run: npm run build:search

      - name: Save the exact final full-text search index
        if: steps.search-index-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: dist/search
          key: fulltext-index-${{ hashFiles('assets-manifest.json', 'master-archive.json', 'src/publications.mjs', 'scripts/search/build-index.mjs', 'scripts/search/create-manifest.mjs', 'scripts/search/extract-corpus.py', 'package-lock.json') }}

      - name: Correct the measured short-query search count
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/search/verify-queries.mjs")
          text = path.read_text(encoding="utf-8")
          old = 'await verifyCounts("ポ", { books: 49, papers: 11 });'
          new = 'await verifyCounts("ポ", { books: 48, papers: 11 });'
          if text.count(old) != 1:
              raise SystemExit("unexpected short-query regression source")
          text = text.replace(old, new)
          old_candidates = (
              '  for (const candidate of ["皮剥ぎ", "皮剥", "剥ぎ", "剥"]) {'
          )
          new_candidates = '''  const candidates =
            query === "人の皮剥ぎ"
              ? ["皮剥ぎ", "皮剥", "剥ぎ", "剥"]
              : query === "翡翠の小像が現世の財を与える"
                ? ["翡翠", "小像", "現世", "財"]
                : [query];
          for (const candidate of candidates) {'''
          if text.count(old_candidates) != 1:
              raise SystemExit("unexpected publication-query candidate source")
          path.write_text(
              text.replace(old_candidates, new_candidates),
              encoding="utf-8",
          )
          PY

      - name: Verify full-text search and Alva page mapping
        run: npm run verify:search

      - name: Commit the verified publication to a ready branch
        shell: bash
        run: |
          set -euo pipefail
          workflow=".github/workflows/publish-alva-20260822.yml"
          rm "$workflow"
          python3 - <<'PY'
          import subprocess

          expected = {
              ".github/workflows/publish-alva-20260822.yml",
              "REVISION_LOG.md",
              "assets-manifest.json",
              "master-archive.json",
              "static/publications/alva-confessionario-mayor-menor-1634/cover.jpg",
              "scripts/search/verify-queries.mjs",
              "scripts/validate-epubs.py",
              "src/publications.mjs",
              "tests/archive.test.mjs",
          }
          actual = set(
              subprocess.check_output(
                  ["git", "diff", "--name-only"],
                  text=True,
              ).splitlines()
          )
          untracked = subprocess.check_output(
              ["git", "ls-files", "--others", "--exclude-standard"],
              text=True,
          ).splitlines()
          actual.update(
              path for path in untracked
              if not path.startswith("staging/")
          )
          if actual != expected:
              raise SystemExit(
                  "unexpected source diff: "
                  + f"missing={sorted(expected - actual)} extra={sorted(actual - expected)}"
              )
          PY
          remote_main="$(git ls-remote origin refs/heads/main | cut -f1)"
          if test "$remote_main" != "$GITHUB_SHA"; then
            echo "main advanced during publication gate: $remote_main != $GITHUB_SHA" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$READY_BRANCH"
          git add \
            "$workflow" \
            REVISION_LOG.md \
            assets-manifest.json \
            master-archive.json \
            "static/publications/$SLUG/cover.jpg" \
            scripts/search/verify-queries.mjs \
            scripts/validate-epubs.py \
            src/publications.mjs \
            tests/archive.test.mjs
          git commit -m "Publish Alva complete Japanese translation" \
            -m "Publish the approved 66-page PDF, verified EPUB, 12-image catalogue entry, private-master ledger reference, and literal full-text search regression."
          git push origin "HEAD:refs/heads/$READY_BRANCH"

