name: Validate publication reliability changes
on:
  push:
    branches: ["agent/publication-reliability-20260925"]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm run build
      - run: npm test
