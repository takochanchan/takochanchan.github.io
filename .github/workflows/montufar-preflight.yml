name: Validate Montufar concurrent publication
on:
  push:
    branches: [agent/montufar-prision-integrated-20261018]
    paths: [.github/workflows/montufar-preflight.yml]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run build && npm test
