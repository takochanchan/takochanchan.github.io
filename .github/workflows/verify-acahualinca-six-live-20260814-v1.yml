name: Verify six Acahualinca live publications

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/verify-acahualinca-six-live-20260814-v1.yml"

permissions:
  contents: write

concurrency:
  group: live-publication-verification
  cancel-in-progress: false

jobs:
  verify-live:
    runs-on: ubuntu-latest
    env:
      WORKFLOW_PATH: .github/workflows/verify-acahualinca-six-live-20260814-v1.yml
      CANDIDATE_BRANCH: agent/acahualinca-six-site-20260814-v1
    steps:
      - name: Check out the published source commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify all six live pages and navigation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib
          import time
          import urllib.error
          import urllib.request

          base = "https://takochanchan.github.io"
          expected = {
              "putnam-antiquity-man-america-1884": ("アメリカにおける人類の古さ", "Proceedings of the American Antiquarian Society", "Frederick_W_Putnam_Remarks_on_the_Antiquity_of_Man_in_America_1884_Japanese_Complete_Translation.pdf", "Frederick_W_Putnam_Remarks_on_the_Antiquity_of_Man_in_America_1884_Japanese_Complete_Translation.epub", 171922),
              "mca-pre-adamite-track-1885": ("アダム以前の足跡", "The American Antiquarian and Oriental Journal", "A_McA_The_Pre_Adamite_Track_1885_Japanese_Complete_Translation.pdf", "A_McA_The_Pre_Adamite_Track_1885_Japanese_Complete_Translation.epub", 134909),
              "unsigned-nicaragua-footprints-again-1886": ("ニカラグアの人足跡、ふたたび", "The American Antiquarian and Oriental Journal", "Unsigned_The_Nicaragua_Foot_Prints_Again_1886_Japanese_Complete_Translation.pdf", "Unsigned_The_Nicaragua_Foot_Prints_Again_1886_Japanese_Complete_Translation.epub", 143638),
              "brinton-ancient-human-footprint-nicaragua-1887": ("ニカラグアの古代人足跡について", "Proceedings of the American Philosophical Society", "Daniel_G_Brinton_On_an_Ancient_Human_Footprint_from_Nicaragua_1887_Japanese_Complete_Translation.pdf", "Daniel_G_Brinton_On_an_Ancient_Human_Footprint_from_Nicaragua_1887_Japanese_Complete_Translation.epub", 155198),
              "editorial-age-nicaragua-footprints-1889": ("ニカラグアの人足跡の年代", "The American Antiquarian and Oriental Journal", "Editorial_The_Age_of_the_Nicaragua_Foot_Prints_1889_Japanese_Complete_Translation.pdf", "Editorial_The_Age_of_the_Nicaragua_Foot_Prints_1889_Japanese_Complete_Translation.epub", 143515),
              "crawford-neolithic-man-nicaragua-1891": ("ニカラグアの新石器時代人", "The American Geologist", "John_Crawford_Neolithic_Man_in_Nicaragua_1891_Japanese_Complete_Translation.pdf", "John_Crawford_Neolithic_Man_in_Nicaragua_1891_Japanese_Complete_Translation.epub", 144037),
          }

          def fetch(path, binary=False):
              request = urllib.request.Request(base + path, headers={"User-Agent": "takochan-live-publication-verifier/1.0"})
              with urllib.request.urlopen(request, timeout=30) as response:
                  assert response.status == 200, (path, response.status)
                  data = response.read()
              return data if binary else data.decode("utf-8")

          last_error = None
          for attempt in range(20):
              try:
                  home = fetch("/")
                  assert 'id="book-match-count">103</strong>件' in home
                  assert 'id="paper-match-count">123</strong>件' in home
                  sitemap = fetch("/sitemap-papers.xml")
                  for slug, (title, journal, pdf, epub, cover_size) in expected.items():
                      path = f"/publications/{slug}/"
                      page = fetch(path)
                      for required in (title, journal, pdf, epub, "権利・利用条件"):
                          assert required in page, (slug, required)
                      assert f"https://takochanchan.github.io{path}" in sitemap, slug
                      cover = fetch(f"/publications/{slug}/cover.jpg", binary=True)
                      assert len(cover) == cover_size, (slug, len(cover), cover_size)
                  last_error = None
                  break
              except (AssertionError, UnicodeDecodeError, urllib.error.URLError) as error:
                  last_error = error
                  if attempt == 19:
                      raise
                  time.sleep(15)
          assert last_error is None
          print("LIVE_SIX_PUBLICATIONS_OK")
          PY

      - name: Remove this verifier from main and delete the candidate branch
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm "$WORKFLOW_PATH"
          git commit -m "Remove completed Acahualinca live verifier"
          git push origin HEAD:main
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$CANDIDATE_BRANCH"
