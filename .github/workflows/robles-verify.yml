name: Verify Robles two-volume publication candidate
on:
  push:
    branches: [agent/robles-publish-20261010]
    paths: [.robles-build-request.json]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run build && npm test
