name: Publish verified Galvao 1563 assets
on:
  push:
    branches: [agent/galvao-publish-20260912]
    paths: ['.publication-upload-requests/galvao-tratado-descobrimentos-1563.json']
permissions:
  contents: write
concurrency:
  group: publication-release-assets
  cancel-in-progress: false
jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm test
      - name: Validate EPUB and transfer checksum-pinned assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .publication-transfer/transfer-galvao.py
      - uses: actions/upload-artifact@v4
        with:
          name: galvao-release-byte-verification
          path: release-byte-verification.json
