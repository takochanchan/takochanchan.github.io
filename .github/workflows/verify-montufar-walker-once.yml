name: Verify Montúfar Walker publication once

on:
  push:
    branches:
      - agent/verify-montufar-walker-centro-america-1887-20260831

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 80d4f6215f4f562726732f436d468a4f65f45ea1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run verify:remote-search
