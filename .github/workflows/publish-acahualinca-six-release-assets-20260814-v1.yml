name: Publish six Acahualinca paper release assets

on:
  push:
    branches: ["agent/acahualinca-six-public-assets-20260814-v1"]
    paths:
      - ".release-staging/acahualinca-six-public-20260814-v1/**"

permissions:
  contents: write

concurrency:
  group: publication-release-assets
  cancel-in-progress: false

jobs:
  publish-assets:
    runs-on: ubuntu-latest
    env:
      STAGING_BRANCH: agent/acahualinca-six-public-assets-20260814-v1
      STAGING_ROOT: .release-staging/acahualinca-six-public-20260814-v1
      RELEASE_TAG: publications-current
    steps:
      - name: Check out checksum-pinned staging bytes
        uses: actions/checkout@v4

      - name: Restore checksum-pinned public payload
        shell: bash
        run: |
          set -euo pipefail
          cat "$STAGING_ROOT"/bundle.tar.gz.part-* > /tmp/acahualinca-six-public.tar.gz
          test "$(sha256sum /tmp/acahualinca-six-public.tar.gz | cut -d' ' -f1)" = "823b54c9069c20a06c6399ca30adba08646a9c5c53aae0becf417540916ca0e1"
          tar -xzf /tmp/acahualinca-six-public.tar.gz -C "$STAGING_ROOT"

      - name: Ensure PDF inspection tools are available
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v pdfinfo >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y poppler-utils
          fi

      - name: Validate all twelve public files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import pathlib
          import re
          import subprocess
          import zipfile
          from xml.etree import ElementTree as ET

          root = pathlib.Path(".release-staging/acahualinca-six-public-20260814-v1")
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          assert len(manifest) == 6
          assert len({item["slug"] for item in manifest}) == 6
          expected_names = {"manifest.json"}
          for item in manifest:
              expected_names.update((item["pdf"]["filename"], item["epub"]["filename"]))
          actual_names = {
              path.name
              for path in root.iterdir()
              if path.is_file() and not path.name.startswith("bundle.tar.gz.part-")
          }
          assert actual_names == expected_names, (actual_names, expected_names)

          for item in manifest:
              for kind in ("pdf", "epub"):
                  asset = item[kind]
                  data = (root / asset["filename"]).read_bytes()
                  assert len(data) == asset["size"], (item["slug"], kind)
                  assert hashlib.sha256(data).hexdigest() == asset["sha256"], (item["slug"], kind)

              pdf_path = root / item["pdf"]["filename"]
              pdf_data = pdf_path.read_bytes()
              assert pdf_data.startswith(b"%PDF-") and b"%%EOF" in pdf_data[-2048:]
              info = subprocess.check_output(["pdfinfo", str(pdf_path)], text=True)
              pages = re.search(r"^Pages:\s+(\d+)$", info, re.MULTILINE)
              assert pages and int(pages.group(1)) == item["page_count"], item["slug"]

              with zipfile.ZipFile(root / item["epub"]["filename"]) as archive:
                  assert archive.testzip() is None
                  first = archive.infolist()[0]
                  assert first.filename == "mimetype" and first.compress_type == 0
                  assert archive.read("mimetype") == b"application/epub+zip"
                  documents = [
                      ET.fromstring(archive.read(name))
                      for name in archive.namelist()
                      if name.endswith((".xhtml", ".html"))
                  ]
                  text = " ".join(" ".join(document.itertext()) for document in documents)
                  h1 = [
                      " ".join("".join(element.itertext()).split())
                      for document in documents
                      for element in document.iter()
                      if element.tag.endswith("}h1") or element.tag == "h1"
                  ]
                  assert h1[:2] == [item["title"], item["title"]], (item["slug"], h1[:4])
                  assert "日本語全訳" not in h1, (item["slug"], h1)
                  assert all(phrase in text for phrase in item["provider_phrases"]), item["slug"]
                  assert len(re.findall(r"[ぁ-んァ-ヶ一-龠々〆ヵヶ]", text)) >= 1000, item["slug"]
          PY

      - name: Require all twelve public asset names to be new
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' > /tmp/existing-assets.txt
          python - <<'PY'
          import json
          import pathlib

          root = pathlib.Path(".release-staging/acahualinca-six-public-20260814-v1")
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          expected = {item[kind]["filename"] for item in manifest for kind in ("pdf", "epub")}
          existing = set(pathlib.Path("/tmp/existing-assets.txt").read_text().splitlines())
          collision = sorted(expected & existing)
          assert not collision, f"Refusing to overwrite existing release assets: {collision}"
          PY

      - name: Upload assets and extend checksum inventory
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir current
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS.txt --dir current
          python - <<'PY'
          import json
          import pathlib

          root = pathlib.Path(".release-staging/acahualinca-six-public-20260814-v1")
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          checksum = pathlib.Path("current/SHA256SUMS.txt")
          rows = [line for line in checksum.read_text(encoding="utf-8").splitlines() if line.strip()]
          parsed = [line.split("  ", 1) for line in rows]
          assert all(len(row) == 2 for row in parsed)
          names = [row[1] for row in parsed]
          assert len(names) == len(set(names)), "Duplicate names in current checksum inventory"
          additions = {
              item[kind]["filename"]: item[kind]["sha256"]
              for item in manifest
              for kind in ("pdf", "epub")
          }
          assert not (set(additions) & set(names)), "New filenames already occur in checksum inventory"
          rows.extend(f"{digest}  {name}" for name, digest in additions.items())
          checksum.write_text("\n".join(sorted(rows, key=lambda line: line.split("  ", 1)[1])) + "\n", encoding="utf-8")
          PY
          gh release upload "$RELEASE_TAG" "$STAGING_ROOT"/*.pdf "$STAGING_ROOT"/*.epub --repo "$GITHUB_REPOSITORY"
          gh release upload "$RELEASE_TAG" current/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber

      - name: Re-download and byte-verify all twelve public files
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir verify
          python - <<'PY' > /tmp/public-asset-names.txt
          import json
          manifest = json.load(open(".release-staging/acahualinca-six-public-20260814-v1/manifest.json"))
          for item in manifest:
              for kind in ("pdf", "epub"):
                  print(item[kind]["filename"])
          PY
          while IFS= read -r name; do
            gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$name" --dir verify
            cmp "$STAGING_ROOT/$name" "verify/$name"
          done < /tmp/public-asset-names.txt
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS.txt --dir verify
          python - <<'PY'
          import hashlib
          import json
          import pathlib

          manifest = json.load(open(".release-staging/acahualinca-six-public-20260814-v1/manifest.json"))
          sums = {}
          for line in pathlib.Path("verify/SHA256SUMS.txt").read_text(encoding="utf-8").splitlines():
              if line.strip():
                  digest, name = line.split("  ", 1)
                  sums[name] = digest
          for item in manifest:
              for kind in ("pdf", "epub"):
                  asset = item[kind]
                  data = pathlib.Path("verify", asset["filename"]).read_bytes()
                  assert len(data) == asset["size"], asset["filename"]
                  assert hashlib.sha256(data).hexdigest() == asset["sha256"] == sums[asset["filename"]], asset["filename"]
          PY

      - name: Remove checksum-pinned staging branch
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$STAGING_BRANCH"
