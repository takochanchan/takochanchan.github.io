name: Publish US Senate Document 27 release assets

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-us-senate-doc27-assets-20260802.yml'

permissions:
  contents: write

concurrency:
  group: publications-current-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      WORKFLOW_PATH: .github/workflows/publish-us-senate-doc27-assets-20260802.yml
      PDF_NAME: US_Senate_Executive_Document_27_Central_America_Correspondence_1853_Japanese_Complete_Translation.pdf
      EPUB_NAME: US_Senate_Executive_Document_27_Central_America_Correspondence_1853_Japanese_Complete_Translation.epub
      PDF_SHA256: 28a8ee41eb098095d0a390e96f3f1eacd34225888be61357c01000592e09f1c9
      EPUB_SHA256: 1a2f003b522066def638d9ccd65d83fdb488312059536716ffb43895fb9775b6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reassemble, verify, and upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          pdf="/tmp/$PDF_NAME"
          epub="/tmp/$EPUB_NAME"
          fetch_blob() {
            local sha="$1"
            local out="$2"
            gh api "repos/$GITHUB_REPOSITORY/git/blobs/$sha" --jq '.content' |
              tr -d '\n' |
              base64 --decode >> "$out"
          }

          : > "$pdf"
          fetch_blob "26a9e2bf31f5ae048c445b1cbc8a3df5273cda9e" "$pdf"
          fetch_blob "f70f218d2008728de48e698ac107a0536b57a5f8" "$pdf"
          fetch_blob "b40270c0871d6cddbfc1132cabc575953746267c" "$pdf"
          fetch_blob "5278dc682dccb9270922e69340e4ac7ccee96ef0" "$pdf"
          fetch_blob "9606af7d71e35dd4765e4508b2dc17bf049b8998" "$pdf"
          fetch_blob "513ad3f529089e8a37f0863473e33bf74d150748" "$pdf"
          fetch_blob "2c596b8a59dd3db16252da42c3b9ccd9387ee8d6" "$pdf"
          fetch_blob "362b6eeb35dcb7d05bb00b4ebf78548442f60730" "$pdf"
          fetch_blob "07f82f1d887095f049f681632e3318a5c12457cd" "$pdf"
          fetch_blob "6eaa14c4069438e13978e8801b20bdd4beae4cef" "$pdf"
          fetch_blob "a1527eaa57730e40d37457ce00003b1f6c7d8cb5" "$pdf"
          fetch_blob "f29c3644c0778073079a3d35e107e9eb8e3ecc7a" "$pdf"
          fetch_blob "398ebdcf994d979e7cf35552fd7ba1ca969355a5" "$pdf"
          fetch_blob "094152ac2442398e414168a060efabc6cb2e058a" "$pdf"
          fetch_blob "6f19425eb8e4d11789147f1b98a4c4f5acdf173f" "$pdf"
          fetch_blob "22f74bb0ff8fa8694870939999ae7759db546164" "$pdf"
          fetch_blob "1545ce12d5676a41d3dce412d969127d477279e3" "$pdf"
          fetch_blob "f479a7d6c8e916d696208012ca2144581c51f7ab" "$pdf"
          fetch_blob "ddbfabc0041ba3b2b06a4e89c909130c3b7d23e9" "$pdf"
          fetch_blob "12617424fd2c05864d1263c1d2178640c153363d" "$pdf"
          fetch_blob "f90f7692b3f8354fb497a1293ae9c93a8a17a605" "$pdf"
          fetch_blob "6adaf4c87fe893ddb5c5468e92be6a7ad7441b28" "$pdf"
          fetch_blob "c665644f2ca1fd737090e3df95708b63eebd7a07" "$pdf"
          fetch_blob "53c3594d92151c12490d369b65de0270311e8333" "$pdf"
          fetch_blob "c2287dae4d168933f9a56be1d6b7f619fac8e944" "$pdf"
          fetch_blob "c2b9a55b4896b99841f39e1320a83474db8a8d6f" "$pdf"
          fetch_blob "ee79248bacd46a9c86c69fc090902a0848040941" "$pdf"
          : > "$epub"
          fetch_blob "84c1ae736acdbc73a7a4673c2dd8e4bb8707bd36" "$epub"
          fetch_blob "5b7f892cd99843b126b14c72aecf7a461114e474" "$epub"
          fetch_blob "b7c50dca5a94a39913a2624d02f9d7064aa10da0" "$epub"
          fetch_blob "1a5e7acab3b54b20d6727bee5ffd74bcbbbc85b4" "$epub"
          fetch_blob "fb9e161d18b046e16f27640f1a874e4c0f6ce55d" "$epub"
          fetch_blob "40758598174c140d43f8af175b818a434f9828f6" "$epub"
          fetch_blob "8a66c08ae11696c9ef2921ac81b15f5bd27a0159" "$epub"

          test "$(stat -c%s "$pdf")" -eq 1592953
          test "$(stat -c%s "$epub")" -eq 361661
          test "$(sha256sum "$pdf" | awk '{print $1}')" = "$PDF_SHA256"
          test "$(sha256sum "$epub" | awk '{print $1}')" = "$EPUB_SHA256"

          mkdir -p /tmp/release-current
          gh release download publications-current --pattern SHA256SUMS.txt --dir /tmp/release-current --repo "$GITHUB_REPOSITORY"
          awk -v pdf="$PDF_NAME" -v epub="$EPUB_NAME" '$2 != pdf && $2 != epub' /tmp/release-current/SHA256SUMS.txt > /tmp/SHA256SUMS.txt
          printf '%s  %s\n' "$PDF_SHA256" "$PDF_NAME" >> /tmp/SHA256SUMS.txt
          printf '%s  %s\n' "$EPUB_SHA256" "$EPUB_NAME" >> /tmp/SHA256SUMS.txt

          gh release upload publications-current "$pdf" "$epub" /tmp/SHA256SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"

          mkdir -p /tmp/verified
          gh release download publications-current --pattern "$PDF_NAME" --dir /tmp/verified --repo "$GITHUB_REPOSITORY"
          gh release download publications-current --pattern "$EPUB_NAME" --dir /tmp/verified --repo "$GITHUB_REPOSITORY"
          gh release download publications-current --pattern SHA256SUMS.txt --dir /tmp/verified --repo "$GITHUB_REPOSITORY"
          test "$(stat -c%s "/tmp/verified/$PDF_NAME")" -eq 1592953
          test "$(stat -c%s "/tmp/verified/$EPUB_NAME")" -eq 361661
          test "$(sha256sum "/tmp/verified/$PDF_NAME" | awk '{print $1}')" = "$PDF_SHA256"
          test "$(sha256sum "/tmp/verified/$EPUB_NAME" | awk '{print $1}')" = "$EPUB_SHA256"
          grep -Fx "$PDF_SHA256  $PDF_NAME" /tmp/verified/SHA256SUMS.txt
          grep -Fx "$EPUB_SHA256  $EPUB_NAME" /tmp/verified/SHA256SUMS.txt

      - name: Remove one-time workflow
        if: success()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -B cleanup origin/main
            if [ ! -f "$WORKFLOW_PATH" ]; then
              exit 0
            fi
            git rm "$WORKFLOW_PATH"
            git commit -m "Remove completed US Senate Document 27 release workflow"
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          exit 1

      - name: Record workflow failure
        if: failure()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          failure_path=".github/publication-failures/us-senate-doc27-${GITHUB_RUN_ID}.txt"
          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -B failure origin/main
            mkdir -p "$(dirname "$failure_path")"
            printf 'run_id=%s\nrun_url=https://github.com/%s/actions/runs/%s\n' "$GITHUB_RUN_ID" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > "$failure_path"
            git add "$failure_path"
            git commit -m "Record failed US Senate Document 27 release workflow"
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          exit 1
