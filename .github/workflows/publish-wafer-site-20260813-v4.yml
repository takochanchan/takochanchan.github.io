name: Publish Lionel Wafer translation v4

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/publish-wafer-site-20260813-v4.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: publish-wafer-site-20260813-v4
  cancel-in-progress: false

jobs:
  publish-site:
    runs-on: ubuntu-latest
    env:
      EXPECTED_PARENT: 72bc92024d12af0754b0b9b4b923385c04946f78
      EXPECTED_STAGE_COMMIT: e3767adab8515dd7432d18df66512374b0c13a09
      EXPECTED_TARGET_TREE: 3bff0f9987cb50e03aeb8b7f21a1b4a8bd3610f6
      STAGING_BRANCH: publish-staging-wafer-site-20260813-v4
      WORKFLOW_PATH: .github/workflows/publish-wafer-site-20260813-v4.yml
    steps:
      - name: Check out publication branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import checksum-pinned catalogue files
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git diff --name-only "$EXPECTED_PARENT" HEAD)" = "$WORKFLOW_PATH"
          git fetch origin "$STAGING_BRANCH:refs/remotes/origin/$STAGING_BRANCH"
          test "$(git rev-parse "refs/remotes/origin/$STAGING_BRANCH")" = "$EXPECTED_STAGE_COMMIT"
          actual=/tmp/wafer-stage-files-v4.txt
          expected=/tmp/wafer-expected-files-v4.txt
          git diff --name-status "$EXPECTED_PARENT" "refs/remotes/origin/$STAGING_BRANCH" | LC_ALL=C sort > "$actual"
          printf '%s\n' \
            "A	static/publications/wafer-new-voyage-isthmus-america-1699/cover.jpg" \
            "M	REVISION_LOG.md" \
            "M	assets-manifest.json" \
            "M	scripts/search/verify-queries.mjs" \
            "M	scripts/validate-epubs.py" \
            "M	src/publications.mjs" \
            "M	tests/archive.test.mjs" | LC_ALL=C sort > "$expected"
          cmp "$expected" "$actual"
          while IFS= read -r target; do
            mkdir -p "$(dirname "$target")"
            git show "refs/remotes/origin/$STAGING_BRANCH:$target" > "$target"
          done < <(cut -f2 "$expected")
          git rm "$WORKFLOW_PATH"
          git add REVISION_LOG.md assets-manifest.json scripts/search/verify-queries.mjs scripts/validate-epubs.py src/publications.mjs tests/archive.test.mjs static/publications/wafer-new-voyage-isthmus-america-1699/cover.jpg

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate archive gate and catalogue
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
          node --test tests/archive.test.mjs

      - name: Restore final PDF and EPUB inputs
        uses: actions/cache@v4
        with:
          path: |
            .cache/fulltext-assets
            .cache/fulltext-ocr
          key: fulltext-assets-${{ hashFiles('assets-manifest.json') }}
          restore-keys: |
            fulltext-assets-

      - name: Install text extraction tools
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v pdftotext || ! command -v tesseract; then
            sudo apt-get update
            sudo apt-get install -y poppler-utils tesseract-ocr
          fi

      - name: Fetch full-text inputs
        shell: bash
        run: |
          set -euo pipefail
          npm run fetch:search-assets

      - name: Cache current search inputs
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            .cache/fulltext-assets
            .cache/fulltext-ocr
          key: fulltext-assets-${{ hashFiles('assets-manifest.json') }}

      - name: Build full-text search
        shell: bash
        run: |
          set -euo pipefail
          npm run build:search

      - name: Cache current full-text index
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: dist/search
          key: fulltext-index-${{ hashFiles('assets-manifest.json', 'master-archive.json', 'src/publications.mjs', 'scripts/search/build-index.mjs', 'scripts/search/create-manifest.mjs', 'scripts/search/extract-corpus.py', 'package-lock.json') }}

      - name: Verify full publication
        shell: bash
        run: |
          set -euo pipefail
          npm run verify:search
          npm test

      - name: Commit and publish validated site
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Publication Bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Publish Lionel Wafer Japanese translation"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TARGET_TREE"
          git push origin HEAD:main

      - name: Remove staging branches and start Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for branch in \
            publish-staging-wafer-site-20260813-v1 \
            publish-staging-wafer-site-20260813-v2 \
            publish-staging-wafer-site-20260813-v3 \
            "$STAGING_BRANCH"; do
            gh api --silent --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch" || true
          done
          final_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          final_tree="$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$final_sha" --jq .tree.sha)"
          test "$final_tree" = "$EXPECTED_TARGET_TREE"
          gh workflow run pages.yml --ref main
