name: Transfer approved How Eads publication
on:
  push:
    branches: [agent/how-eads-cover-20260919]
    paths: ['.publication-upload-requests/how-james-b-eads-1900.json']
permissions:
  contents: write
concurrency:
  group: how-eads-publication-transfer
  cancel-in-progress: false
jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm test
      - name: Upload and verify approved files
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .publication-transfer/transfer-how-eads.py
      - uses: actions/upload-artifact@v4
        with:
          name: how-eads-release-byte-verification
          path: release-byte-verification.json

