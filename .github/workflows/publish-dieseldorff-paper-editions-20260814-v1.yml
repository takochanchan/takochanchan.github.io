name: Publish Dieseldorff paper editions

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/publish-dieseldorff-paper-editions-20260814-v1.yml"

permissions:
  contents: write

concurrency:
  group: publications-current-release
  cancel-in-progress: false

jobs:
  publish-paper-editions:
    runs-on: ubuntu-latest
    env:
      STAGING_BRANCH: agent/dieseldorff-paper-public-release-20260814-v1
      STAGING_ROOT: .release-staging/dieseldorff-paper-public-release-20260814-v1
      WORKFLOW_PATH: .github/workflows/publish-dieseldorff-paper-editions-20260814-v1.yml
      RELEASE_TAG: publications-current
      BUNDLE_SHA256: 83f55767646ada3f4a6d572c5f97fcf35d303d67b21fdb316cbe6ad978fd0c36
      OVERRIDE_SHA256: 611c8168084892c25fb3a31cc03018d90b160881b755ef23f1348b2cec52bd26
      ARCHIVE_COMMIT: c03f92a4916767bdb635fb4039a517465d5a8f19
    steps:
      - name: Check out checksum-pinned staging bytes
        uses: actions/checkout@v4
        with:
          ref: agent/dieseldorff-paper-public-release-20260814-v1
          path: staging

      - name: Restore checksum-pinned publication bundle
        shell: bash
        run: |
          set -euo pipefail
          cat "staging/$STAGING_ROOT"/bundle.tar.gz.part-* > /tmp/dieseldorff-public.tar.gz
          echo "$BUNDLE_SHA256  /tmp/dieseldorff-public.tar.gz" | sha256sum -c -
          mkdir -p /tmp/dieseldorff-public
          tar -xzf /tmp/dieseldorff-public.tar.gz -C /tmp/dieseldorff-public
          cp "staging/$STAGING_ROOT/site-overrides-v2.tar.gz" /tmp/site-overrides-v2.tar.gz
          echo "$OVERRIDE_SHA256  /tmp/site-overrides-v2.tar.gz" | sha256sum -c -
          tar -xzf /tmp/site-overrides-v2.tar.gz -C /tmp/dieseldorff-public

      - name: Validate paper PDFs, EPUBs, covers, and metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import pathlib
          import re
          import zipfile

          root = pathlib.Path("/tmp/dieseldorff-public")
          payload = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          assets = payload["assets"]
          assert payload["schema_version"] == 1
          assert payload["release_tag"] == "publications-current"
          assert len(assets) == 4
          expected = {
              "Dieseldorff_Kunst_und_Religion_Band_I_1926_Japanese_Complete_Translation.epub":
                  (43619660, "f9d88ef3b2357e06592d3f01ccf25bf30f0fcf581466f8e75184187ef089f10c"),
              "Dieseldorff_Kunst_und_Religion_Band_I_1926_Japanese_Complete_Translation.pdf":
                  (46499132, "3062fb7c6002c6c8cc06d19e01ceb554d0463caea61a76f587220f6090b6ab81"),
              "Dieseldorff_Kunst_und_Religion_Band_II_1931_Japanese_Complete_Translation.epub":
                  (30833367, "0c2ee650f9bde3d2b8fdcaac48dda17926c2837a7b5d3cd03b5fd757cca32610"),
              "Dieseldorff_Kunst_und_Religion_Band_II_1931_Japanese_Complete_Translation.pdf":
                  (35218045, "e5f2b1025c11520abe02af13f596c3c59b337ef96d7737036f8875bdcd504343"),
          }
          assert {item["filename"] for item in assets} == set(expected)
          banned = (
              "Springer Nature",
              "Reprints and Permissions",
              "日本語翻訳版には再利用ライセンスを設定していません",
              "確認用校正刷",
          )
          title_pairs = {
              "dieseldorff-kunst-religion-band-i-1926": (
                  "古代および現代中央アメリカのマヤ諸民族の芸術と宗教",
                  "Kunst und Religion der Mayavölker im alten und heutigen Mittelamerika",
              ),
              "dieseldorff-kunst-religion-band-ii-1931": (
                  "マヤ諸民族の芸術と宗教 II――コパンの記念物",
                  "Kunst und Religion der Mayavölker II: Die Copaner Denkmäler",
              ),
          }
          for item in assets:
              path = root / "assets" / item["filename"]
              data = path.read_bytes()
              assert (len(data), hashlib.sha256(data).hexdigest()) == expected[item["filename"]]
              if item["kind"] == "pdf":
                  assert data.startswith(b"%PDF-")
                  assert len(re.findall(rb"/Type\s*/Page\b", data)) == item["pages"]
                  continue
              with zipfile.ZipFile(path) as archive:
                  assert archive.testzip() is None
                  assert archive.read("mimetype") == b"application/epub+zip"
                  names = archive.namelist()
                  images = [
                      name for name in names
                      if name.startswith("EPUB/media/")
                      and name.lower().endswith((".jpg", ".jpeg", ".png", ".webp", ".gif", ".svg"))
                      and not name.lower().endswith("/cover.jpg")
                  ]
                  assert len(images) == item["content_images"], (item["slug"], len(images))
                  chapters = [name for name in names if name.startswith("EPUB/text/") and name.endswith(".xhtml")]
                  combined = "\n".join(archive.read(name).decode("utf-8") for name in chapters)
                  first = archive.read("EPUB/text/ch001.xhtml").decode("utf-8")
                  japanese, german = title_pairs[item["slug"]]
                  assert first.index(japanese) < first.index(german)
                  assert len(re.findall(r"〔原刊\s+p\.\s*(?:[0-9]+|無頁)〕", combined)) == item["source_page_markers"]
                  for phrase in ("CC BY-NC-SA 4.0", "digi-hub", "Humboldt-Universität zu Berlin"):
                      assert phrase in combined, (item["slug"], phrase)
                  for phrase in banned:
                      assert phrase not in combined, (item["slug"], phrase)

          site = root / "site"
          site_files = payload["site_files"]
          assert len(site_files) == 7
          assert all((site / path).is_file() for path in site_files)
          manifest = json.loads((site / "assets-manifest.json").read_text(encoding="utf-8"))
          manifest_entries = {entry["path"]: entry for entry in manifest["assets"]}
          for item in assets:
              suffix = f"/{item['filename']}"
              matches = [entry for path, entry in manifest_entries.items() if path.endswith(suffix)]
              assert len(matches) == 1, item["filename"]
              assert matches[0]["size"] == item["size"]
              assert matches[0]["sha256"] == item["sha256"]
          cover_expected = {
              "static/publications/dieseldorff-kunst-religion-band-i-1926/cover.jpg":
                  (153746, "bb5513413816701188076a3d4270f8c0e5396bf6b2cdf054eb82aa2e1e0dba01"),
              "static/publications/dieseldorff-kunst-religion-band-ii-1931/cover.jpg":
                  (161921, "ffd547b3737903b0a15ddf8985f88eacd09a819cdf9a5751841b34a8166cc002"),
          }
          for relative, expected_cover in cover_expected.items():
              data = (site / relative).read_bytes()
              assert (len(data), hashlib.sha256(data).hexdigest()) == expected_cover
          archive = json.loads((site / "master-archive.json").read_text(encoding="utf-8"))
          assert archive["archive_commit"] == "c03f92a4916767bdb635fb4039a517465d5a8f19"
          for slug, size, digest in (
              ("dieseldorff-kunst-religion-band-i-1926", 43469439, "650cd4e959917a754d36781acc8478f544c469c8cf6902e891c10cede93bb0b4"),
              ("dieseldorff-kunst-religion-band-ii-1931", 30669208, "694c06a3705a16df148c71ea802831dccb2bfa3a15b3334b3acecced6183d905"),
          ):
              assert slug not in archive["publications"]
              fallback = archive["release_fallbacks"][slug]
              assert fallback["status"] == "pending_lfs"
              assert fallback["ledger_commit"] == archive["archive_commit"]
              assert fallback["master_size"] == size
              assert fallback["master_sha256"] == digest
          source = (site / "src/publications.mjs").read_text(encoding="utf-8")
          assert source.count('types: ["考古学論文"') >= 2
          assert 'slug: "dieseldorff-kunst-religion-band-i-1926"' in source
          assert 'slug: "dieseldorff-kunst-religion-band-ii-1931"' in source
          assert "digi-hub" in source and "CC BY-NC-SA 4.0" in source
          PY

      - name: Check out current public main
        uses: actions/checkout@v4
        with:
          ref: main
          path: site
          fetch-depth: 0

      - name: Stage source changes and pass the complete local gate
        shell: bash
        run: |
          set -euo pipefail
          git -C site fetch origin main
          test "$(git -C site rev-parse origin/main)" = "$GITHUB_SHA"
          python - <<'PY'
          import json
          import pathlib
          import shutil

          root = pathlib.Path("/tmp/dieseldorff-public")
          payload = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          for relative in payload["site_files"]:
              source = root / "site" / relative
              destination = pathlib.Path("site") / relative
              destination.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(source, destination)
          PY
          npm --prefix site ci
          npm --prefix site run build
          npm --prefix site test

      - name: Prepare updated release checksum ledger
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/current-checksums
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS.txt --dir /tmp/current-checksums
          python - <<'PY'
          import json
          import pathlib

          root = pathlib.Path("/tmp/dieseldorff-public")
          payload = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          names = {item["filename"] for item in payload["assets"]}
          old = pathlib.Path("/tmp/current-checksums/SHA256SUMS.txt").read_text(encoding="utf-8").splitlines()
          kept = []
          for line in old:
              parts = line.split(maxsplit=1)
              filename = parts[1].lstrip("*") if len(parts) == 2 else ""
              if filename not in names:
                  kept.append(line)
          additions = [f"{item['sha256']}  {item['filename']}" for item in payload["assets"]]
          pathlib.Path("/tmp/SHA256SUMS.txt").write_text("\n".join(kept + additions) + "\n", encoding="utf-8")
          PY

      - name: Replace four publication release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          gh release upload "$RELEASE_TAG" /tmp/dieseldorff-public/assets/* --repo "$GITHUB_REPOSITORY" --clobber
          gh release upload "$RELEASE_TAG" /tmp/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber

      - name: Re-download and verify every replaced byte
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/release-verify
          python - <<'PY' > /tmp/dieseldorff-asset-names.txt
          import json
          payload = json.load(open("/tmp/dieseldorff-public/manifest.json", encoding="utf-8"))
          for item in payload["assets"]:
              print(item["filename"])
          PY
          while IFS= read -r filename; do
            gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$filename" --dir /tmp/release-verify
            cmp "/tmp/dieseldorff-public/assets/$filename" "/tmp/release-verify/$filename"
          done < /tmp/dieseldorff-asset-names.txt
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS.txt --dir /tmp/release-verify
          cmp /tmp/SHA256SUMS.txt /tmp/release-verify/SHA256SUMS.txt
          python - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import subprocess

          payload = json.load(open("/tmp/dieseldorff-public/manifest.json", encoding="utf-8"))
          rows = {}
          for line in pathlib.Path("/tmp/release-verify/SHA256SUMS.txt").read_text(encoding="utf-8").splitlines():
              parts = line.split(maxsplit=1)
              if len(parts) == 2:
                  rows[parts[1].lstrip("*")] = parts[0]
          release = json.loads(subprocess.check_output([
              "gh", "api", f"repos/{os.environ['GITHUB_REPOSITORY']}/releases/tags/publications-current"
          ], text=True))
          remote = {asset["name"]: asset for asset in release["assets"]}
          for item in payload["assets"]:
              name = item["filename"]
              data = pathlib.Path("/tmp/release-verify", name).read_bytes()
              assert len(data) == item["size"]
              assert hashlib.sha256(data).hexdigest() == item["sha256"]
              assert rows[name] == item["sha256"]
              assert remote[name]["size"] == item["size"]
              digest = remote[name].get("digest")
              assert digest in (None, f"sha256:{item['sha256']}")
          PY

      - name: Commit paper classification, manifests, and covers
        shell: bash
        run: |
          set -euo pipefail
          git -C site fetch origin main
          test "$(git -C site rev-parse origin/main)" = "$GITHUB_SHA"
          git -C site config user.name "github-actions[bot]"
          git -C site config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          while IFS= read -r relative; do
            git -C site add "$relative"
          done < <(python - <<'PY'
          import json
          payload = json.load(open("/tmp/dieseldorff-public/manifest.json", encoding="utf-8"))
          print("\n".join(payload["site_files"]))
          PY
          )
          git -C site rm "$WORKFLOW_PATH"
          git -C site diff --cached --check
          git -C site commit -m "Publish Dieseldorff volumes as paper editions"
          git -C site push origin HEAD:main

      - name: Remove staging branch
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$STAGING_BRANCH"
