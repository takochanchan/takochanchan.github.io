name: Verify Haefkens publication delivery
on:
  push:
    branches: [agent/haefkens-publish-20260919]
    paths: ['.publication-checks/haefkens-ready.json']
permissions:
  contents: write
concurrency:
  group: haefkens-publication-verification
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Verify deployed search against final bibliography and asset ledgers
        run: npm run verify:remote-search
      - name: Read verification phase
        id: phase
        run: |
          echo "value=$(python3 -c 'import json;print(json.load(open(".publication-checks/haefkens-ready.json"))["phase"])')" >> "$GITHUB_OUTPUT"
      - name: Verify actual public pages and downloadable bytes
        if: steps.phase.outputs.value == 'live'
        run: python3 .publication-transfer/verify-live-haefkens.py
      - uses: actions/upload-artifact@v4
        if: steps.phase.outputs.value == 'live'
        with:
          name: haefkens-live-verification
          path: haefkens-live-verification.json
      - name: Remove completed temporary publication branch
        if: steps.phase.outputs.value == 'live'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method DELETE repos/$GITHUB_REPOSITORY/git/refs/heads/agent%2Fhaefkens-publish-20260919
