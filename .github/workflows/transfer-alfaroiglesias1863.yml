name: Transfer approved Alfaro 1863 publication files
on:
  push:
    branches: [agent/alfaropina-iglesias1863-publish-20261121]
    paths: [.alfaroiglesias1863-public-request.json]

permissions:
  contents: read
concurrency:
  group: publication-release-transfer
  cancel-in-progress: false

jobs:
  test-and-transfer:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: transfer
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 08cc558a37cdc077b539dab839d7f326729eeceb
          path: candidate
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate candidate ledgers and reconstruct approved bytes
        working-directory: transfer
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .alfaroiglesias1863-transfer.py stage "$RUNNER_TEMP/alfaroiglesias1863-assets" ../candidate
      - name: Publication build, regression tests and EPUB format check
        working-directory: candidate
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npm test
          python3 ../transfer/.alfaroiglesias1863-readback.py --expect ../transfer/.alfaroiglesias1863-expectations.json --html dist/publications/alfaro-pina-iglesias-conventos-mexico-1863/index.html
          target=dist/publications/alfaro-pina-iglesias-conventos-mexico-1863
          mkdir -p "$target"
          cp "$RUNNER_TEMP/alfaroiglesias1863-assets/alfaro-pina-iglesias-conventos-mexico-1863.epub" "$target/"
          python3 scripts/validate-epubs.py dist --slug alfaro-pina-iglesias-conventos-mexico-1863
      - name: Upload and re-download approved PDF, EPUB and checksum list
        working-directory: transfer
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .alfaroiglesias1863-transfer.py transfer "$RUNNER_TEMP/alfaroiglesias1863-assets" ../candidate
      - uses: actions/upload-artifact@v4
        with:
          name: alfaroiglesias1863-public-verification
          path: transfer/alfaroiglesias1863-public-verification.json
          if-no-files-found: error

