name: Transfer approved Sahagun Matritenses publication
on:
  push:
    branches: [agent/sahagun-publish-20260909]
    paths: ['.publication-upload-requests/sahagun-20260909-067.json']
permissions:
  contents: write
concurrency:
  group: publication-release-checksums
  cancel-in-progress: false
jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm test
      - name: Upload and re-download checksum-verified PDF and EPUB
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .publication-transfer/transfer-sahagun.py
      - uses: actions/upload-artifact@v4
        with:
          name: sahagun-release-byte-verification
          path: sahagun-release-verification.json
