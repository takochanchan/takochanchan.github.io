name: Transfer checksum-pinned California volumes I–III assets
on:
  push:
    branches: ["agent/california-publish-20261115"]
    paths: [".publication-upload-requests/venegas-noticia-california-1757.json", ".github/workflows/california-transfer.yml", "static/publications/venegas-noticia-california-volume-*/cover.jpg", "scripts/build.mjs", "src/publication-overviews.json"]
permissions:
  contents: write
concurrency:
  group: publication-release-transfer
  cancel-in-progress: false
jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install build dependencies
        run: npm ci --no-audit --no-fund
      - name: Build and test the publication catalogue
        run: npm run build && npm test
      - name: Reconstruct, upload, and verify publication PDF and EPUB
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .publication-transfer/transfer-california.py
      - uses: actions/upload-artifact@v4
        with:
          name: california-release-verification
          path: california-release-verification.json
