name: Verify deployed Robles two-volume publication
on:
  push:
    branches: [agent/robles-publish-20261010]
    paths: [.robles-post-request.json]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Independently verify all deployed full-text shards
        run: npm run verify:remote-search
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pypdf
      - name: Verify actual public HTML, PDFs, EPUBs, covers and search maps
        run: python .robles-postcheck.py
      - uses: actions/upload-artifact@v4
        with:
          name: robles-actual-postpublication-verification
          path: robles-postcheck-result.json
          if-no-files-found: error
