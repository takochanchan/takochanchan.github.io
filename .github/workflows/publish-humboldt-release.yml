        run: |
          set -euo pipefail
          pdf=Humboldt_Vues_des_Cordilleres_1810_1813_ja.pdf
          epub=Humboldt_Vues_des_Cordilleres_1810_1813_ja.epub
          : > "$pdf"
          : > "$epub"
          for chunk in $PDF_CHUNKS; do
            gh api "repos/$GITHUB_REPOSITORY/git/blobs/$chunk" --jq .content | tr -d '\n' | base64 --decode >> "$pdf"
          done
          for chunk in $EPUB_CHUNKS; do
            gh api "repos/$GITHUB_REPOSITORY/git/blobs/$chunk" --jq .content | tr -d '\n' | base64 --decode >> "$epub"
          done
          echo "7819c76019baf258b45ef222cfc21404e70102c5895e7456000f4b40171923ff  $pdf" | sha256sum -c -
          echo "9cc0bc4e1c77486798182bdfb6811bca2037058386543c178d180fb466c37858  $epub" | sha256sum -c -
          test "$(stat -c %s "$pdf")" = 38627388
          test "$(stat -c %s "$epub")" = 35762170

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload publications-current \
            Humboldt_Vues_des_Cordilleres_1810_1813_ja.pdf \
            Humboldt_Vues_des_Cordilleres_1810_1813_ja.epub \
            --clobber

      - name: Remove one-time workflow
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/publish-humboldt-release.yml
          git commit -m "Remove one-time Humboldt release workflow"
          git push origin HEAD:main

