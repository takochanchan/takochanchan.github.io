name: Transfer checksum-pinned CEHM Cordoba 1778 assets

on:
  push:
    branches: ["agent/cehm-cordoba-hospital-memorial-1778-transfer-20261106"]
    paths: [".publication-upload-requests/cehm-cordoba-hospital-memorial-1778.json"]
permissions:
  contents: write
concurrency:
  group: publication-release-transfer
  cancel-in-progress: false
jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install build dependencies
        run: npm ci --no-audit --no-fund
      - name: Build and test the publication catalogue
        run: npm run build && npm test
      - name: Reconstruct, upload, and verify publication bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .publication-transfer/transfer-cehm-cordoba.py
      - uses: actions/upload-artifact@v4
        with:
          name: cehm-cordoba-release-byte-verification
          path: cehm-cordoba-release-verification.json
