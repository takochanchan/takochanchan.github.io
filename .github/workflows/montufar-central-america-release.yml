name: Replace Montufar Central America release assets

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/montufar-central-america-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - name: Check out control branch
        uses: actions/checkout@v4

      - name: Restore staged bundle
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin agent/release-upload-montufar-central-america-20260831
          git checkout FETCH_HEAD -- .release-upload-staging/montufar-central-america
          cat .release-upload-staging/montufar-central-america/part-* > "$RUNNER_TEMP/montufar-central-america-release.tar.gz"
          test "$(stat -c '%s' "$RUNNER_TEMP/montufar-central-america-release.tar.gz")" = "9695674"
          echo "5d0e71295bc198b2abb450a9b16c1a98104a55eca845c314f3a9a5c3ee7d61fd  $RUNNER_TEMP/montufar-central-america-release.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/release"
          tar -xzf "$RUNNER_TEMP/montufar-central-america-release.tar.gz" -C "$RUNNER_TEMP/release"
          echo "ded6b843a85849c3f460f23ec62be11f6ce79cbc532ffe331e70b16df30af9a7  $RUNNER_TEMP/release/Lorenzo_Montufar_Walker_en_Centro_America_1887_Japanese_Complete_Translation.pdf" | sha256sum -c -
          echo "488c3c4d00f4693b9e215b40576ada419d92b86759c4ed1268535d59e885809e  $RUNNER_TEMP/release/Lorenzo_Montufar_Walker_en_Centro_America_1887_Japanese_Complete_Translation.epub" | sha256sum -c -

      - name: Replace release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload publications-current             "$RUNNER_TEMP/release/Lorenzo_Montufar_Walker_en_Centro_America_1887_Japanese_Complete_Translation.pdf"             "$RUNNER_TEMP/release/Lorenzo_Montufar_Walker_en_Centro_America_1887_Japanese_Complete_Translation.epub"             --clobber

      - name: Re-download and verify release bytes
        shell: bash
        run: |
          set -euo pipefail
          base="https://github.com/takochanchan/takochanchan.github.io/releases/download/publications-current"
          for attempt in 1 2 3 4 5; do
            rm -rf "$RUNNER_TEMP/verify"
            mkdir -p "$RUNNER_TEMP/verify"
            curl --fail --location --retry 3 --header "Cache-Control: no-cache"               "$base/Lorenzo_Montufar_Walker_en_Centro_America_1887_Japanese_Complete_Translation.pdf?run=$GITHUB_RUN_ID&attempt=$attempt"               -o "$RUNNER_TEMP/verify/Lorenzo_Montufar_Walker_en_Centro_America_1887_Japanese_Complete_Translation.pdf"
            curl --fail --location --retry 3 --header "Cache-Control: no-cache"               "$base/Lorenzo_Montufar_Walker_en_Centro_America_1887_Japanese_Complete_Translation.epub?run=$GITHUB_RUN_ID&attempt=$attempt"               -o "$RUNNER_TEMP/verify/Lorenzo_Montufar_Walker_en_Centro_America_1887_Japanese_Complete_Translation.epub"
            if echo "ded6b843a85849c3f460f23ec62be11f6ce79cbc532ffe331e70b16df30af9a7  $RUNNER_TEMP/verify/Lorenzo_Montufar_Walker_en_Centro_America_1887_Japanese_Complete_Translation.pdf" | sha256sum -c - &&
               echo "488c3c4d00f4693b9e215b40576ada419d92b86759c4ed1268535d59e885809e  $RUNNER_TEMP/verify/Lorenzo_Montufar_Walker_en_Centro_America_1887_Japanese_Complete_Translation.epub" | sha256sum -c -; then
              exit 0
            fi
            sleep 5
          done
          exit 1
