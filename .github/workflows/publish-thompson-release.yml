name: Publish Thompson release assets

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-thompson-release.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Reassemble release assets
        env:
          GH_TOKEN: ${{ github.token }}
          PDF_CHUNKS: "862fee3a4919e24fb57507e378740ff4c93777d2 0a0a816c88db22b39b666b6470e6da742e5a304f d01fe8ee13ec35a802c384919f6f14de119d39b6 636a0e9bb52468424fc3e914fc75e942bffb3ab9 bff8d02e0163f5e1bf16876220ebd7c7332d7805 09ca3b3e460b7c87f36895d0c5fafbeaa422aae3 d7981de02e308f90882556e4860c9c4ab74f8e53 229beddf2c9c962cb48046a48d74d2600d484392 c7152bd4913bcccb769bd08998986f2fd6e2ac65 541128f1fd52e7f5348620ab7dbd7c1fd8e373b1 cd2d3bf802fb517b07e6a4667fdde2d0d248a3a6 ae38c5dbc01cb3f800a7e69e45b13e2d5a5134e0 51aeb9e648ae76bd7841c0dd40b209e20549b65a 32573ea132923c3284198a75d88d4060b7515c98 13275524781248a5386eefdb37011a10d0f809be 1a3ce54d4a7aac71cbf1233fd456b4298140faa0 c2c0e1f5ac4cfb411b3aaffbe612726d3a8b60d3 9ede837bb1d7be0f56a27aed3e217d850a66be18 adfd0f753c16adde221c630e25b1f99da5c454b6 ba51ad518e96b4bd3ef2c86eb6b3c8224ac17186 3aed3bbc18a43d7a6b77f2e6b354f292d86c37ab cbd1224136df6f47f1e306c38d3be0d7a1012c07 303ccb65ce15923e7697d30c196f7aca2b9eb4c8 13c2927068de29fbd63763f08a54b7e300a75903 9ecb1b0689523668c2d52cafb7132eeaeab562b2"
          EPUB_CHUNKS: "1eee9767cbdcf95fd92a2531130587ed2ea6d069 124d7ae1fb439a62e6a2b645473f0ed65d336e4f dd6396e7fba34a4f37634ab49959eb68a55401d9 349a067e9e4402161e55363dda51a933c4864eae 91c40a936dced3e3198a6f21492e28945dca38ad 7dfd4e415168ec661a629d90efae68be87f06264 c2992909d867ee247c915defad49fc9824c323cf 3b1782f10b884405ee8462be6e3444bffad754cb 3cc94b77b5d9459ba6543b0ff9ef2c9cea72378b e03370aa8bf9914131d10711df81c7270c4b96fa f621845c55e7330f48ff123529535d6276a0d86e 6c06a47965c8dcacca044b0fc6101e60d94db2d5 0ffafa4af25659706270c9f24ebeb22bc7c2e9a0 7b14f7bbd0ddcc80fd50e0ca04733d95792ebb1d 74a426f4e891c74bcc8eb6721e9901a1a0de4d51 2660595f0daa8e0cd2b3eae420408ec8f9d6b2eb 11f5f694cb8e8aaeca54479fa8c40c57604df99c"
          SUMS_CHUNKS: "2b93caf0654edbab5ad0267447a4a71faf7b2649"
        run: |
          set -euo pipefail
          pdf=J_Eric_S_Thompson_Ethnology_of_the_Mayas_1930_Japanese_Complete_Translation.pdf
          epub=J_Eric_S_Thompson_Ethnology_of_the_Mayas_1930_Japanese_Complete_Translation.epub
          sums=SHA256SUMS.txt
          : > "$pdf"
          : > "$epub"
          : > "$sums"
          for chunk in $PDF_CHUNKS; do
            gh api "repos/$GITHUB_REPOSITORY/git/blobs/$chunk" --jq .content | tr -d '\n' | base64 --decode >> "$pdf"
          done
          for chunk in $EPUB_CHUNKS; do
            gh api "repos/$GITHUB_REPOSITORY/git/blobs/$chunk" --jq .content | tr -d '\n' | base64 --decode >> "$epub"
          done
          for chunk in $SUMS_CHUNKS; do
            gh api "repos/$GITHUB_REPOSITORY/git/blobs/$chunk" --jq .content | tr -d '\n' | base64 --decode >> "$sums"
          done
          echo "bd035c3a2dfe7e71f8bfc67559193b4507f07bb00e76eb63cdc44636f0d98236  $pdf" | sha256sum -c -
          echo "455ce1a276fffdf8aff31f0ddfc860d4418b1979549dbcda711a6bdd0a62cd74  $epub" | sha256sum -c -
          echo "4ced2fdac10ee75c8363a8ba9435271098371b69542a1db27c145b5fe35cc647  $sums" | sha256sum -c -
          test "$(stat -c %s "$pdf")" = 12668639
          test "$(stat -c %s "$epub")" = 8905550
          test "$(stat -c %s "$sums")" = 14352

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload publications-current \
            J_Eric_S_Thompson_Ethnology_of_the_Mayas_1930_Japanese_Complete_Translation.pdf \
            J_Eric_S_Thompson_Ethnology_of_the_Mayas_1930_Japanese_Complete_Translation.epub \
            SHA256SUMS.txt \
            --clobber \
            --repo "$GITHUB_REPOSITORY"

      - name: Remove release staging branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api \
            --method DELETE \
            "repos/$GITHUB_REPOSITORY/git/refs/heads/agent/release-assets-thompson-ethnology-mayas-1930"

      - name: Remove one-time workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          path=.github/workflows/publish-thompson-release.yml
          sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/$path?ref=main" --jq .sha 2>/dev/null || true)"
          if test -z "$sha"; then
            exit 0
          fi
          gh api \
            --method DELETE \
            "repos/$GITHUB_REPOSITORY/contents/$path" \
            -f message="Remove one-time Thompson release workflow" \
            -f sha="$sha" \
            -f branch=main
