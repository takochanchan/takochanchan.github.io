name: Verify Caltzin f.126v search and publication
on:
  push:
    branches: [agent/caltzin126v-verify-20261128]
    paths: [.caltzin126v-live-plan.json]
permissions:
  contents: read
jobs:
  search-maps:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run build && npm test
      - run: python3 .caltzin126v-verify.py maps && npm run verify:remote-search
      - uses: actions/upload-artifact@v4
        with:
          name: caltzin126v-map-verification
          path: caltzin126v-verification.json
  live-publication:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: python3 .caltzin126v-verify.py live
      - uses: actions/upload-artifact@v4
        with:
          name: caltzin126v-live-readback
          path: caltzin126v-verification.json
