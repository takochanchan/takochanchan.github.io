name: Verify deployed Mencos 1894 publication search

on:
  push:
    branches: [agent/mencos-1894-publish-20261015]
    paths: ['.github/workflows/mencos-1894-verify-remote.yml']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install verification dependencies
        run: npm ci --no-audit --no-fund
      - name: Wait for the pinned search deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request
          url = "https://api.github.com/repos/takochanchan/takochan-search-index-002/actions/runs/38808389830"
          for attempt in range(90):
              request = urllib.request.Request(url, headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"], "Accept": "application/vnd.github+json"})
              with urllib.request.urlopen(request, timeout=30) as response:
                  run = json.load(response)
              if run["head_sha"] != "4d002cf11d5a0ff40a19a7d7b7e8cab86be06e7c":
                  raise SystemExit("Unexpected search controller commit")
              if run["status"] == "completed":
                  if run["conclusion"] != "success":
                      raise SystemExit("Search deployment failed: " + str(run["conclusion"]))
                  print("Pinned search deployment succeeded.")
                  break
              time.sleep(10)
          else:
              raise SystemExit("Search deployment did not complete within 15 minutes")
          PY
      - name: Verify exact deployed catalogue and final asset checksums
        run: npm run verify:remote-search
