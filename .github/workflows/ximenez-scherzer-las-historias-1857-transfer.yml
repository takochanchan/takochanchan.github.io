name: Transfer verified ximenez-scherzer-las-historias-1857
on:
  push:
    branches: [agent/transfer-ximenez-scherzer-las-historias-1857-20261125]
    paths: [.ximenez-scherzer-las-historias-1857-public-request.json]
permissions:
  contents: write
concurrency:
  group: publication-release-transfer
  cancel-in-progress: false
jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run build && npm test
      - name: Upload and verify final PDF and EPUB files
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .ximenez-scherzer-las-historias-1857-transfer.py
      - uses: actions/upload-artifact@v4
        with:
          name: ximenez-scherzer-las-historias-1857-public-verification
          path: ximenez-scherzer-las-historias-1857-public-verification.json