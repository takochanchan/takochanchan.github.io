name: Transfer checksum-pinned Robertson History of America assets

on:
  push:
    branches: [agent/robertson-history-america-20260912]
    paths:
      - ".publication-upload-requests/robertson-history-america-1777-1796.json"

permissions:
  contents: write

concurrency:
  group: robertson-publication-transfer
  cancel-in-progress: false

jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install build dependencies
        run: npm ci --no-audit --no-fund
      - name: Build archive pages and verify catalogue
        run: npm run build
      - name: Test archive and search code
        run: npm test
      - name: Reconstruct, verify, upload, and redownload final assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .publication-transfer/transfer-robertson.py
      - uses: actions/upload-artifact@v4
        with:
          name: robertson-release-byte-verification
          path: release-byte-verification.json

