name: Publish Otis Panama Railroad history once
# Temporary contents for the already-registered pages.yml workflow.

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/pages.yml"
      - ".publication-requests/otis-isthmus-panama-railroad-1867-v1.json"

permissions:
  contents: write
  actions: write

concurrency:
  group: publication-release
  cancel-in-progress: false

