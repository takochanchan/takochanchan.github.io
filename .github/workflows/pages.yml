name: Deploy archive to GitHub Pages

on:
  push:
    branches: ["agent/deploy-squier-spanish-pages-20260827-v2"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install build dependencies
        run: npm ci

      - name: Build archive pages
        run: npm run build

      - name: Validate archive
        run: npm test

      - name: Verify deployed full-text search shards
        run: npm run verify:remote-search

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Let repository initialization finish
        run: sleep 45

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Remove temporary deployment branch
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          encoded="${GITHUB_REF_NAME//\//%2F}"
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$encoded"
