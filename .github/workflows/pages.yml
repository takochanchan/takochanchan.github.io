name: Deploy archive to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install build dependencies
        run: npm ci

      - name: Build archive pages
        run: npm run build

      - name: Restore generated full-text index
        id: search-index-cache
        uses: actions/cache@v4
        with:
          path: dist/search
          key: fulltext-index-${{ hashFiles('assets-manifest.json', 'master-archive.json', 'src/publications.mjs', 'scripts/search/**', 'package-lock.json') }}

      - name: Restore final PDF and EPUB inputs
        if: steps.search-index-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: |
            .cache/fulltext-assets
            .cache/fulltext-ocr
          key: fulltext-assets-${{ hashFiles('assets-manifest.json') }}
          restore-keys: |
            fulltext-assets-

      - name: Ensure PDF text and OCR tools are available
        if: steps.search-index-cache.outputs.cache-hit != 'true'
        run: |
          if ! command -v pdftotext || ! command -v tesseract; then
            sudo apt-get update
            sudo apt-get install -y poppler-utils tesseract-ocr
          fi

      - name: Fetch checksum-verified search inputs
        if: steps.search-index-cache.outputs.cache-hit != 'true'
        run: npm run fetch:search-assets

      - name: Generate full-text search index
        if: steps.search-index-cache.outputs.cache-hit != 'true'
        run: npm run build:search

      - name: Verify full-text index coverage and page maps
        run: npm run verify:search

      - name: Validate archive
        run: npm test

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Let repository initialization finish
        run: sleep 45

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
