name: Publish Infortunios 1690 through Pages once
# Temporary contents for the already-registered pages.yml workflow.

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/pages.yml"
      - ".publication-requests/infortunios-1690-v1.json"

permissions:
  contents: write
  actions: write

concurrency:
  group: publication-release
  cancel-in-progress: false

env:
  SLUG: siguenza-infortunios-alonso-ramirez-1690
  PDF_NAME: Carlos_de_Siguenza_y_Gongora_Infortunios_de_Alonso_Ramirez_1690_Japanese_Complete_Translation.pdf
  EPUB_NAME: Carlos_de_Siguenza_y_Gongora_Infortunios_de_Alonso_Ramirez_1690_Japanese_Complete_Translation.epub
  PDF_SHA: 2ade2a89d573d8b850189e29fa3753a8695fd896c64eeb064c2875a6ba05f639
  EPUB_SHA: 30aa06077eedf62a5b852e449b2c924ceccfc2cac9f5b6f36938ed271a4c202a
  COVER_SHA: 8b2f3e552b00acbf91b6fd0d55a8968952efaad39f5efeb3465d316e47370b24
  STAGING_BRANCH: agent/publication-upload-infortunios-20260824-v1
  ARCHIVE_COMMIT: f59aedd50e973ae9d521c94f18086c9519420e0e
  GH_TOKEN: ${{ github.token }}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out publication source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use isolated publication branch
        run: git checkout -B publish-infortunios-1690 "$GITHUB_SHA"

      - name: Prepare progress reporting
        run: |
          mkdir -p "$RUNNER_TEMP/publication-bin"
          cat > "$RUNNER_TEMP/publication-bin/report-status" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          status="$1"
          detail="${2:-}"
          path="publication-status-infortunios.json"
          endpoint="repos/$GITHUB_REPOSITORY/contents/$path"
          body="$(jq -cn \
            --arg status "$status" \
            --arg detail "$detail" \
            --arg head_sha "$GITHUB_SHA" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg updated_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{status:$status,detail:$detail,head_sha:$head_sha,run_id:$run_id,updated_at:$updated_at}')"
          encoded="$(printf '%s' "$body" | base64 -w0)"
          sha="$(gh api --method GET "$endpoint" -f ref="$STAGING_BRANCH" --jq .sha 2>/dev/null || true)"
          args=(--method PUT "$endpoint" -f "message=Report Infortunios publication: $status" -f "branch=$STAGING_BRANCH" -f "content=$encoded")
          if test -n "$sha"; then
            args+=(-f "sha=$sha")
          fi
          gh api "${args[@]}" >/dev/null
          SH
          chmod +x "$RUNNER_TEMP/publication-bin/report-status"
          "$RUNNER_TEMP/publication-bin/report-status" started

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install PDF inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Restore verified PDF and EPUB cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .cache/fulltext-assets
            .cache/fulltext-ocr
          key: fulltext-assets-${{ hashFiles('assets-manifest.json') }}
          restore-keys: |
            fulltext-assets-

      - name: Reconstruct and verify release payload and site patch
        run: |
          bundle="$RUNNER_TEMP/infortunios-public-assets.tar.gz"
          : > "$bundle"
          for sha in \
            e66671d016ec16a158b66458b6755714300a6dfb \
            d2799a3fdcf43c55ccccd56a3e050d5c2b5ab5d4 \
            a8f0f73c619415071b9455c0a1ce26bdae3516f6 \
            df4e31a7f525854731de27dada88acd91f175880; do
            gh api "repos/$GITHUB_REPOSITORY/git/blobs/$sha" --jq .content |
              tr -d '\n' | base64 -d >> "$bundle"
          done
          test "$(stat -c %s "$bundle")" = "1759715"
          echo "3d4a3ef214f9520ce5a533729bd72f497d642c549f9e99c77567b74b40def9d3  $bundle" | sha256sum -c -

          mkdir -p "$RUNNER_TEMP/infortunios-release"
          tar -xzf "$bundle" -C "$RUNNER_TEMP/infortunios-release"
          payload="$RUNNER_TEMP/infortunios-release/release-payload"
          test "$(stat -c %s "$payload/$PDF_NAME")" = "1098931"
          test "$(stat -c %s "$payload/$EPUB_NAME")" = "804001"
          test "$(stat -c %s "$payload/cover.jpg")" = "89464"
          echo "$PDF_SHA  $payload/$PDF_NAME" | sha256sum -c -
          echo "$EPUB_SHA  $payload/$EPUB_NAME" | sha256sum -c -
          echo "$COVER_SHA  $payload/cover.jpg" | sha256sum -c -
          test "$(pdfinfo "$payload/$PDF_NAME" | awk '/^Pages:/ {print $2}')" = "64"
          unzip -t "$payload/$EPUB_NAME"

          site_patch="$RUNNER_TEMP/infortunios-site.patch"
          gh api "repos/$GITHUB_REPOSITORY/git/blobs/b5a82ec93692c8d89019aecba61ab0b02e6562f0" --jq .content |
            tr -d '\n' | base64 -d > "$site_patch"
          echo "a9c83506799ec67834d48c6b7fc2ec605615f908d1b9bcb369d3568abfa7275f  $site_patch" | sha256sum -c -
          git apply --check --binary "$site_patch"
          git apply --index --binary "$site_patch"
          grep -Fq "$SLUG" src/publications.mjs
          grep -Fq "$ARCHIVE_COMMIT" master-archive.json

          mkdir -p "$RUNNER_TEMP/release-tree/publications/$SLUG"
          cp "$payload/$PDF_NAME" "$RUNNER_TEMP/release-tree/publications/$SLUG/$PDF_NAME"
          cp "$payload/$EPUB_NAME" "$RUNNER_TEMP/release-tree/publications/$SLUG/$EPUB_NAME"
          cp "$payload/cover.jpg" "$RUNNER_TEMP/release-tree/publications/$SLUG/cover.jpg"
          mkdir -p ".cache/fulltext-assets/publications/$SLUG"
          cp "$payload/$PDF_NAME" ".cache/fulltext-assets/publications/$SLUG/$PDF_NAME"
          cp "$payload/$EPUB_NAME" ".cache/fulltext-assets/publications/$SLUG/$EPUB_NAME"

      - name: Report verified payload
        run: "$RUNNER_TEMP/publication-bin/report-status payload_verified"

      - name: Install build dependencies
        run: npm ci

      - name: Ensure PDF text and OCR tools are available
        run: |
          if ! command -v pdftotext || ! command -v tesseract; then
            sudo apt-get update
            sudo apt-get install -y poppler-utils tesseract-ocr
          fi

      - name: Validate EPUB, site build, and full-text search before release
        run: |
          "$RUNNER_TEMP/publication-bin/report-status" indexing_and_tests
          python3 scripts/validate-epubs.py "$RUNNER_TEMP/release-tree" --slug "$SLUG"
          npm run build
          npm run fetch:search-assets
          npm run build:search
          npm run verify:search
          npm test

      - name: Report passed pre-publication gate
        run: "$RUNNER_TEMP/publication-bin/report-status prepublication_gate_passed"

      - name: Save verified asset cache
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            .cache/fulltext-assets
            .cache/fulltext-ocr
          key: fulltext-assets-${{ hashFiles('assets-manifest.json') }}

      - name: Save verified search index
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: dist/search
          key: fulltext-index-fernandez-historia-costa-rica-v1-${{ hashFiles('assets-manifest.json', 'master-archive.json', 'src/publications.mjs', 'scripts/search/build-index.mjs', 'scripts/search/create-manifest.mjs', 'scripts/search/extract-corpus.py', 'package-lock.json') }}

      - name: Confirm remote main is unchanged
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"

      - name: Upload and re-download verified Release assets
        run: |
          payload="$RUNNER_TEMP/infortunios-release/release-payload"
          checksum_dir="$RUNNER_TEMP/release-checksums"
          verify_dir="$RUNNER_TEMP/release-verify"
          mkdir -p "$checksum_dir" "$verify_dir"
          gh release download publications-current --pattern SHA256SUMS.txt --dir "$checksum_dir"
          python3 - "$checksum_dir/SHA256SUMS.txt" <<'PY'
          import os
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          additions = {
              os.environ["PDF_NAME"]: os.environ["PDF_SHA"],
              os.environ["EPUB_NAME"]: os.environ["EPUB_SHA"],
          }
          kept = []
          for line in path.read_text(encoding="utf-8").splitlines():
              if not line.strip():
                  continue
              name = line.split("  ", 1)[1] if "  " in line else ""
              if name not in additions:
                  kept.append(line)
          kept.extend(f"{digest}  {name}" for name, digest in additions.items())
          kept.sort(key=lambda line: line.split("  ", 1)[1])
          path.write_text("\n".join(kept) + "\n", encoding="utf-8")
          PY
          gh release upload publications-current \
            "$payload/$PDF_NAME" \
            "$payload/$EPUB_NAME" \
            "$checksum_dir/SHA256SUMS.txt" \
            --clobber
          gh release download publications-current \
            --pattern "$PDF_NAME" \
            --pattern "$EPUB_NAME" \
            --pattern SHA256SUMS.txt \
            --dir "$verify_dir"
          test "$(stat -c %s "$verify_dir/$PDF_NAME")" = "1098931"
          test "$(stat -c %s "$verify_dir/$EPUB_NAME")" = "804001"
          echo "$PDF_SHA  $verify_dir/$PDF_NAME" | sha256sum -c -
          echo "$EPUB_SHA  $verify_dir/$EPUB_NAME" | sha256sum -c -
          grep -Fx "$PDF_SHA  $PDF_NAME" "$verify_dir/SHA256SUMS.txt"
          grep -Fx "$EPUB_SHA  $EPUB_NAME" "$verify_dir/SHA256SUMS.txt"
          test "$(pdfinfo "$verify_dir/$PDF_NAME" | awk '/^Pages:/ {print $2}')" = "64"
          unzip -t "$verify_dir/$EPUB_NAME"

      - name: Report verified Release assets
        run: "$RUNNER_TEMP/publication-bin/report-status release_verified"

      - name: Commit verified publication
        id: publish
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git checkout c76976e3bb49d30cd8e6fb4a1e14a2cc53107d2b -- .github/workflows/pages.yml
          git rm .github/workflows/publish-infortunios-1690-once.yml
          git rm .publication-requests/infortunios-1690-v1.json
          git commit -m "Publish Infortunios de Alonso Ramírez 1690"
          git push origin HEAD:main
          final_sha="$(git rev-parse HEAD)"
          echo "sha=$final_sha" >> "$GITHUB_OUTPUT"
          "$RUNNER_TEMP/publication-bin/report-status" published_commit "$final_sha"
