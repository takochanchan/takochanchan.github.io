name: Transfer checksum-pinned Viana Relación de Vera Paz assets
on:
  push:
    branches: ["agent/viana-1574-transfer"]
    paths: [".publication-upload-requests/viana-relacion-de-vera-paz-1574.json"]
permissions:
  contents: write
concurrency:
  group: publication-release-transfer
  cancel-in-progress: false
jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install build dependencies
        run: npm ci --no-audit --no-fund
      - name: Build and test the publication catalogue
        run: npm run build && npm test
      - name: Reconstruct, upload, and verify publication PDF and EPUB
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .publication-transfer/transfer-viana-1574.py
      - uses: actions/upload-artifact@v4
        with:
          name: viana-1574-release-verification
          path: viana-1574-release-verification.json
