name: Transfer checksum-pinned publication batch assets
on:
  push:
    branches: ["agent/nov24-batch-transfer"]
    paths: [".publication-upload-requests/nov24-batch.json"]
permissions:
  contents: write
concurrency:
  group: publication-release-transfer
  cancel-in-progress: false
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install build dependencies
        run: npm ci --no-audit --no-fund
      - name: Build and test the publication catalogue
        run: npm run build && npm test
      - name: Reconstruct, upload, and verify publication PDF and EPUB
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .publication-transfer/transfer-nov24-batch.py
      - uses: actions/upload-artifact@v4
        with:
          name: nov24-batch-transfer-verification
          path: nov24-batch-transfer-verification.json

