name: Transfer checksum-pinned Hipólito 1749 assets
on:
  push:
    branches: [agent/hipolito-1749-publication-20261105]
    paths: ['.publication-upload-requests/hipolito-regla-constituciones-1749.json']
permissions:
  contents: write
concurrency:
  group: publication-release-transfer
  cancel-in-progress: false
jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install build dependencies
        run: npm ci --no-audit --no-fund
      - name: Build and test the publication catalogue
        run: npm run build && npm test
      - name: Reconstruct, upload, and verify publication bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .publication-transfer/transfer-hipolito-1749.py
      - uses: actions/upload-artifact@v4
        with:
          name: hipolito-1749-release-byte-verification
          path: hipolito1749-release-verification.json

