name: Publish Brinton Fancourt-layout revision

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-brinton-fancourt-layout.yml

permissions:
  contents: write

concurrency:
  group: publications-current-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      PDF_NAME: Daniel_G_Brinton_The_Books_of_Chilan_Balam_1882_Japanese_Complete_Translation.pdf
      PDF_SIZE: "2726342"
      PDF_SHA: ee5d935613b75c847c9003ed058db219a8560afe06d9add2fac5f142d0dc9bae
      COVER_SIZE: "72180"
      COVER_SHA: d39023a025ac84a1339ab45fb4c71c847bf1e822391c7d5d41d4e7315e8125c0
      MANIFEST_BLOB: 00a97788d47ecf83c2ff7390b8c54f148023e373
      ARCHIVE_COMMIT: c4eb3e32c850c45fc720843592f0d17979f99baa

    steps:
      - name: Check out current site
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Reassemble and verify revised assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          manifest=/tmp/brinton-release-manifest.tsv
          gh api "repos/$GITHUB_REPOSITORY/git/blobs/$MANIFEST_BLOB" \
            --jq .content |
            tr -d '\n' |
            base64 --decode > "$manifest"
          test "$(wc -l < "$manifest")" = 2

          while IFS=$'\t' read -r asset_name expected_size expected_sha blob_list; do
            test -n "$asset_name"
            : > "/tmp/$asset_name"
            for blob_sha in $blob_list; do
              gh api "repos/$GITHUB_REPOSITORY/git/blobs/$blob_sha" \
                --jq .content |
                tr -d '\n' |
                base64 --decode >> "/tmp/$asset_name"
            done
            echo "$expected_sha  /tmp/$asset_name" | sha256sum -c -
            test "$(stat -c %s "/tmp/$asset_name")" = "$expected_size"
          done < "$manifest"

      - name: Prepare catalogue, cover, and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cover_path=static/publications/brinton-chilan-balam-1882/cover.jpg
          cp /tmp/cover.jpg "$cover_path"

          mkdir -p /tmp/current-release
          gh release download publications-current \
            --pattern SHA256SUMS.txt \
            --dir /tmp/current-release \
            --repo "$GITHUB_REPOSITORY"

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          pdf_name = os.environ["PDF_NAME"]
          pdf_size = int(os.environ["PDF_SIZE"])
          pdf_sha = os.environ["PDF_SHA"]
          cover_size = int(os.environ["COVER_SIZE"])
          cover_sha = os.environ["COVER_SHA"]
          archive_commit = os.environ["ARCHIVE_COMMIT"]

          checksum_path = Path("/tmp/current-release/SHA256SUMS.txt")
          lines = checksum_path.read_text(encoding="utf-8").splitlines()
          suffix = "  " + pdf_name
          matches = [index for index, line in enumerate(lines) if line.endswith(suffix)]
          assert len(matches) == 1, matches
          assert lines[matches[0]].startswith(
              "0ed4b8aff98516e8dbc3769ce6dcf44f78e649bc798c61fdf21efe7e55e5f0c2  "
          ), lines[matches[0]]
          lines[matches[0]] = pdf_sha + suffix
          Path("/tmp/SHA256SUMS.txt").write_text(
              "\n".join(lines) + "\n", encoding="utf-8"
          )

          manifest_path = Path("assets-manifest.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          pdf_path = (
              "publications/brinton-chilan-balam-1882/"
              + pdf_name
          )
          cover_path = "publications/brinton-chilan-balam-1882/cover.jpg"
          seen = set()
          for asset in manifest["assets"]:
              if asset["path"] == pdf_path:
                  assert asset["size"] == 2810560
                  assert asset["sha256"] == (
                      "0ed4b8aff98516e8dbc3769ce6dcf44f78e649bc798c61fdf21efe7e55e5f0c2"
                  )
                  asset["size"] = pdf_size
                  asset["sha256"] = pdf_sha
                  seen.add("pdf")
              elif asset["path"] == cover_path:
                  assert asset["size"] == 76186
                  assert asset["sha256"] == (
                      "c0d7eb728f06d262e1c4f5f9cba68bf2ae9a9e46a0850f8adb8bd791bba8a2ec"
                  )
                  asset["size"] = cover_size
                  asset["sha256"] = cover_sha
                  seen.add("cover")
          assert seen == {"pdf", "cover"}, seen
          manifest_path.write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          archive_path = Path("master-archive.json")
          archive = json.loads(archive_path.read_text(encoding="utf-8"))
          assert archive["archive_commit"] in {
              "138071fcc113cb37ce565ce73f591232602904f7",
              archive_commit,
          }, archive["archive_commit"]
          archive["archive_commit"] = archive_commit
          archive_path.write_text(
              json.dumps(archive, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          publications_path = Path("src/publications.mjs")
          text = publications_path.read_text(encoding="utf-8")
          marker = 'slug: "brinton-chilan-balam-1882",'
          start = text.index(marker)
          end = text.index("\n  },\n  {", start)
          block = text[start:end]
          old_extent = (
              '"PDF 19頁・原刊標題紙・はしがき・本文5–19頁・'
              '原注13件・暦および日名記号図3点"'
          )
          new_extent = old_extent.replace("PDF 19頁", "PDF 16頁")
          assert block.count(old_extent) == 1
          assert block.count("pageCount: 19,") == 1
          block = block.replace(old_extent, new_extent)
          block = block.replace("pageCount: 19,", "pageCount: 16,")
          text = text[:start] + block + text[end:]
          publications_path.write_text(text, encoding="utf-8")
          PY

          sha256sum -c <(printf '%s  %s\n' "$PDF_SHA" "/tmp/$PDF_NAME")
          sha256sum -c <(printf '%s  %s\n' "$COVER_SHA" "$cover_path")
          cmp <(wc -l < /tmp/current-release/SHA256SUMS.txt) \
              <(wc -l < /tmp/SHA256SUMS.txt)

      - name: Validate site changes
        run: |
          set -euo pipefail
          python -m json.tool assets-manifest.json >/dev/null
          python -m json.tool master-archive.json >/dev/null
          node --check src/publications.mjs
          npm test

      - name: Upload and verify release files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload publications-current \
            "/tmp/$PDF_NAME" \
            /tmp/SHA256SUMS.txt \
            --clobber \
            --repo "$GITHUB_REPOSITORY"

          mkdir -p /tmp/verified-release
          gh release download publications-current \
            --pattern "$PDF_NAME" \
            --pattern SHA256SUMS.txt \
            --dir /tmp/verified-release \
            --repo "$GITHUB_REPOSITORY"
          echo "$PDF_SHA  /tmp/verified-release/$PDF_NAME" | sha256sum -c -
          cmp /tmp/SHA256SUMS.txt /tmp/verified-release/SHA256SUMS.txt

      - name: Commit site metadata and cover
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            assets-manifest.json \
            master-archive.json \
            src/publications.mjs \
            static/publications/brinton-chilan-balam-1882/cover.jpg
          git commit -m "Align Brinton layout with Fancourt"
          pushed=false
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              pushed=true
              break
            fi
            sleep 3
          done
          test "$pushed" = true

      - name: Verify published site state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          path=static/publications/brinton-chilan-balam-1882/cover.jpg
          gh api "repos/$GITHUB_REPOSITORY/contents/$path?ref=main" \
            --jq .content |
            tr -d '\n' |
            base64 --decode > /tmp/remote-cover.jpg
          echo "$COVER_SHA  /tmp/remote-cover.jpg" | sha256sum -c -
          gh api "repos/$GITHUB_REPOSITORY/contents/assets-manifest.json?ref=main" \
            --jq .content |
            tr -d '\n' |
            base64 --decode |
            grep -F "$PDF_SHA"
          gh api "repos/$GITHUB_REPOSITORY/contents/master-archive.json?ref=main" \
            --jq .content |
            tr -d '\n' |
            base64 --decode |
            grep -F "$ARCHIVE_COMMIT"

      - name: Remove staging branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method DELETE \
            "repos/$GITHUB_REPOSITORY/git/refs/heads/agent/brinton-fancourt-layout-release-20260731"

      - name: Remove one-time workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          path=.github/workflows/publish-brinton-fancourt-layout.yml
          sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/$path?ref=main" --jq .sha)"
          gh api --method DELETE \
            "repos/$GITHUB_REPOSITORY/contents/$path" \
            -f message="Remove completed Brinton release workflow" \
            -f sha="$sha" \
            -f branch=main
