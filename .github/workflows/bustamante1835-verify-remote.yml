name: Verify remote search and printed page locations for Bustamante 1835–1836
on:
  push:
    branches: ["agent/bustamante1835-remote-20261120"]
    paths: [".github/workflows/bustamante1835-verify-remote.yml"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run build && npm test
      - name: Wait for the pinned search shard deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'CHECK'
          import json, os, time, urllib.request
          url = "https://api.github.com/repos/takochanchan/takochan-search-index-003/actions/runs/44641058029"
          for attempt in range(120):
              request = urllib.request.Request(url, headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"], "Accept": "application/vnd.github+json"})
              with urllib.request.urlopen(request, timeout=30) as response:
                  run = json.load(response)
              assert run["head_sha"] == "75227f8ed67f74c4d63d98bafd572ab8e2ef75b2"
              if run["status"] == "completed":
                  assert run["conclusion"] == "success", run["conclusion"]
                  print("Pinned search deployment succeeded.")
                  break
              time.sleep(10)
          else:
              raise SystemExit("Pinned search deployment has not completed within 20 minutes")
          CHECK
      - run: npm run verify:remote-search



      - name: Verify both public search maps and printed-page coordinates
        run: |
          python3 - <<'PY'
          import json, re, urllib.request
          from pathlib import Path
          base="https://takochanchan.github.io/takochan-search-index-003/"
          prefix="bustamante-mananas-de-la-alameda-de-mexico"
          parent="/publications/"+prefix+"-1835-1836/"
          checks=(
            ("volume-1-1835",395,"335a8d38b65df17699d83e74fc9df0136a6ae4570e2b325b09425e1a1d6faef3",{"510a7a509d93d21389551eab9147346d75efe12f801599eed9316d7fa8f59373","792ef5d0ae0f510aad8c862dabfecae4490b401d52189a9b021788e9e5a2ca0d"}, [(94,116),(167,212),(200,250),(325,395)]),
            ("volume-2-1836",392,"138bd1a0aaf5bbbb8298a01d15989421d56a3fa2e17e2d0b46cefa3502088184",{"b60b4b736cfc44b496fcdcd0d00dca2a4efcdd5131b5d9fc9f2b33e10782afe5","5c2e6832be49dde7b9f0f444f38d2c43f73b85151b9273a9e90abad71edc5a39"}, [(94,134),(167,226),(200,266),(309,391)])
          )
          for suffix, pages, pdf, source, points in checks:
              slug=prefix+"-"+suffix
              with urllib.request.urlopen(base+"maps/"+slug+".json",timeout=60) as f:
                  obj=json.load(f)
              assert obj["slug"]==slug and obj["canonicalUrl"]=="/publications/"+slug+"/",(slug,obj.get("canonicalUrl"))
              homepage=Path("dist/index.html").read_text()
              match=re.search(r"window\.BIBLIOGRAPHIC_ALIASES=(\{[^;]+\});",homepage)
              assert match and "/publications/"+json.loads(match.group(1))[slug]+"/"==parent,slug
              redirect=Path("dist/publications",slug,"index.html").read_text()
              assert parent in redirect,slug
              assert "bibliographyUrlFor(result.meta?.slug)" in Path("src/fulltext-search.js").read_text()
              assert obj["pdfSha256"]==pdf and obj["sourceSha256"] in source,slug
              assert len(obj["blocks"])>100 and all(1<=int(a[1])<=pages for a in obj["blocks"].values())
              found={(label,int(a[1])) for a in obj["blocks"].values() for label in a[0].split("／")}
              for original, page in points:
                  assert (f"原刊 p. {original}",page) in found,(slug,original,page)
              print(slug, "linked to the canonical group with verified PDF coordinates")
          PY

