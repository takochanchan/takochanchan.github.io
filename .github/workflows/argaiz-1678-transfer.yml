name: Transfer checksum-pinned Argaiz 1678 assets
on:
  push:
    branches: [agent/argaiz-1678-publication-20261106]
    paths: ['.publication-upload-requests/argaiz-vida-escritos-1678.json']
permissions:
  contents: write
concurrency:
  group: publication-release-transfer
  cancel-in-progress: false
jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install build dependencies
        run: npm ci --no-audit --no-fund
      - name: Build and test the publication catalogue
        run: npm run build && npm test
      - name: Reconstruct, upload, and verify publication bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .publication-transfer/transfer-argaiz-1678.py
      - uses: actions/upload-artifact@v4
        with:
          name: argaiz-1678-release-byte-verification
          path: argaiz-1678-release-verification.json

