name: Deploy cache-safe Romero cover once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-romero-japanese-cover-pages-20260811.yml

permissions:
  contents: write

jobs:
  remove-trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the publication site
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remove this one-time Pages trigger
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          git rm -- .github/workflows/deploy-romero-japanese-cover-pages-20260811.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Remove cache-safe Romero Pages trigger"
          git push origin HEAD:main
