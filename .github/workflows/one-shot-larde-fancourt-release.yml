name: One-shot Larde Fancourt release

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/one-shot-larde-fancourt-release.yml"

permissions:
  contents: write

concurrency:
  group: one-shot-larde-fancourt-release
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    env:
      STAGING_BRANCH: agent/release-larde-fancourt-20260831
      STAGING_PREFIX: .release-staging/larde-fancourt-20260831
    steps:
      - name: Check out publication repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify staged assets
        run: |
          git fetch origin "$STAGING_BRANCH:refs/remotes/origin/$STAGING_BRANCH"
          mkdir -p "$RUNNER_TEMP/release-assets"
          earth_pdf="Jorge_Larde_El_terremoto_del_6_de_septiembre_de_1915_1916_Japanese_Complete_Translation.pdf"
          earth_epub="Jorge_Larde_El_terremoto_del_6_de_septiembre_de_1915_1916_Japanese_Complete_Translation.epub"
          cuz_pdf="Jorge_Larde_Origenes_de_San_Salvador_Cuzcatlan_hoy_capital_de_El_Salvador_1925_Japanese_Complete_Translation.pdf"
          cuz_epub="Jorge_Larde_Origenes_de_San_Salvador_Cuzcatlan_hoy_capital_de_El_Salvador_1925_Japanese_Complete_Translation.epub"
          git ls-tree -r --name-only "origin/$STAGING_BRANCH" "$STAGING_PREFIX/earth-pdf-parts" |
            sort |
            while IFS= read -r part; do git show "origin/$STAGING_BRANCH:$part"; done             > "$RUNNER_TEMP/release-assets/$earth_pdf"
          git ls-tree -r --name-only "origin/$STAGING_BRANCH" "$STAGING_PREFIX/cuz-pdf-parts" |
            sort |
            while IFS= read -r part; do git show "origin/$STAGING_BRANCH:$part"; done             > "$RUNNER_TEMP/release-assets/$cuz_pdf"
          git show "origin/$STAGING_BRANCH:$STAGING_PREFIX/$earth_epub" > "$RUNNER_TEMP/release-assets/$earth_epub"
          git show "origin/$STAGING_BRANCH:$STAGING_PREFIX/$cuz_epub" > "$RUNNER_TEMP/release-assets/$cuz_epub"
          cd "$RUNNER_TEMP/release-assets"
          sha256sum -c <<'CHECKSUMS'
          ce6541f1b0dd342e741cc0465d7a3c66bce9825cca6c6fa333bf0557c1de4911  Jorge_Larde_El_terremoto_del_6_de_septiembre_de_1915_1916_Japanese_Complete_Translation.pdf
          757f4df2c0c6d870269394e4bddf1a03281bb96824bafeb666f53714323a558e  Jorge_Larde_El_terremoto_del_6_de_septiembre_de_1915_1916_Japanese_Complete_Translation.epub
          75d2557c9c2536db1f9e7c8ec8edac41d70b89a37eeac5cbcc91536ad7844872  Jorge_Larde_Origenes_de_San_Salvador_Cuzcatlan_hoy_capital_de_El_Salvador_1925_Japanese_Complete_Translation.pdf
          6b04589c22b84ac9de355ecc07349c4ddce0a785908746a7c00e119724b714b9  Jorge_Larde_Origenes_de_San_Salvador_Cuzcatlan_hoy_capital_de_El_Salvador_1925_Japanese_Complete_Translation.epub
          CHECKSUMS

      - name: Replace release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload publications-current "$RUNNER_TEMP/release-assets/"* --clobber --repo "$GITHUB_REPOSITORY"

      - name: Download and verify release bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/release-verify"
          for file in "$RUNNER_TEMP/release-assets/"*; do
            name="${file##*/}"
            gh release download publications-current --pattern "$name" --dir "$RUNNER_TEMP/release-verify" --repo "$GITHUB_REPOSITORY"
          done
          cd "$RUNNER_TEMP/release-verify"
          sha256sum -c <<'CHECKSUMS'
          ce6541f1b0dd342e741cc0465d7a3c66bce9825cca6c6fa333bf0557c1de4911  Jorge_Larde_El_terremoto_del_6_de_septiembre_de_1915_1916_Japanese_Complete_Translation.pdf
          757f4df2c0c6d870269394e4bddf1a03281bb96824bafeb666f53714323a558e  Jorge_Larde_El_terremoto_del_6_de_septiembre_de_1915_1916_Japanese_Complete_Translation.epub
          75d2557c9c2536db1f9e7c8ec8edac41d70b89a37eeac5cbcc91536ad7844872  Jorge_Larde_Origenes_de_San_Salvador_Cuzcatlan_hoy_capital_de_El_Salvador_1925_Japanese_Complete_Translation.pdf
          6b04589c22b84ac9de355ecc07349c4ddce0a785908746a7c00e119724b714b9  Jorge_Larde_Origenes_de_San_Salvador_Cuzcatlan_hoy_capital_de_El_Salvador_1925_Japanese_Complete_Translation.epub
          CHECKSUMS

      - name: Remove staging branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/agent%2Frelease-larde-fancourt-20260831"
