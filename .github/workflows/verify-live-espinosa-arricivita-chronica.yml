name: Verify the live Franciscan chronicle
on:
  push:
    branches: ["agent/verify-live-espinosa-arricivita-chronica-20261125"]
    paths: [".github/workflows/verify-live-espinosa-arricivita-chronica.yml"]
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Wait for the pinned Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,os,subprocess,time
          repo=os.environ['GITHUB_REPOSITORY']
          for _ in range(90):
              data=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/runs?head_sha=8244e3ef781fd00015f6e39f7589dcec285955fe']))
              runs=[run for run in data['workflow_runs'] if run['name']=='Deploy archive to GitHub Pages']
              if runs and runs[0]['status']=='completed':
                  assert runs[0]['conclusion']=='success',runs[0]['conclusion']
                  print('Pages succeeded',runs[0]['id'])
                  break
              time.sleep(10)
          else: raise SystemExit('Pages deployment timed out')
          PY
      - name: Install PDF inspection
        run: command -v pdftotext >/dev/null || (sudo apt-get update && sudo apt-get install -y poppler-utils)
      - name: Verify public bibliography, assets, checksum ledger and search page maps
        run: |
          python3 - <<'PY'
          import hashlib,html,json,pathlib,re,subprocess,tempfile,time,urllib.request,zipfile
          group="espinosa-arricivita-chronica-1746-1792"
          rows=json.loads("[{\"slug\":\"espinosa-arricivita-chronica-1746-1792-part-1\",\"title\":\"ヌエバ・エスパーニャ布教学院年代記 第1部\",\"pages\":1078,\"cover\":\"publications/espinosa-arricivita-chronica-1746-1792-part-1/cover.jpg\"},{\"slug\":\"espinosa-arricivita-chronica-1746-1792-part-2\",\"title\":\"ヌエバ・エスパーニャ布教学院年代記 第2部\",\"pages\":874,\"cover\":\"publications/espinosa-arricivita-chronica-1746-1792-part-2/cover.jpg\"}]")
          def get(url):
              for i in range(12):
                  try:
                      with urllib.request.urlopen(url,timeout=120) as stream:
                          return stream.read()
                  except OSError:
                      if i==11: raise
                      time.sleep(4)
          site='https://takochanchan.github.io/'
          biburl=site+'publications/'+group+'/'
          for i in range(15):
              try:
                  page=html.unescape(get(biburl).decode())
                  if 'ヌエバ・エスパーニャ布教学院年代記' in page: break
              except OSError:
                  if i==14: raise
              time.sleep(5)
          for v in ('ヌエバ・エスパーニャ布教学院年代記','第1部','第2部','全体の詳細概要','アントニオ・リナス','フランシスコ・ガルセス','chronicaapostoli01espi','chronicaapostoli02espi'):
              assert v in page,v
          R='https://github.com/takochanchan/takochanchan.github.io/releases/download/publications-002/'
          ledger=get(R+'SHA256SUMS.txt').decode().splitlines()
          assets=json.load(open('assets-manifest.json'))['assets']
          markers=[714,634]
          for i,row in enumerate(rows):
              found=[x for x in assets if x['path'].startswith('publications/'+row['slug']+'/')]
              assert len(found)==3
              pdfsha=next(x['sha256'] for x in found if x['url'].endswith('.pdf'))
              pm=json.loads(get(site+'takochan-search-index-003/maps/'+row['slug']+'.json'))
              assert pm['pdfSha256']==pdfsha and pm['blocks'],row['slug']
              assert any('原刊 p.' in str(v[0]) for v in pm['blocks'].values())
              with tempfile.TemporaryDirectory() as work:
                  for x in found:
                      f=pathlib.Path(work,pathlib.PurePosixPath(x['path']).name);v=get(x['url']);f.write_bytes(v)
                      assert len(v)==x['size'] and hashlib.sha256(v).hexdigest()==x['sha256'],f.name
                      if f.suffix in ('.pdf','.epub'):
                          assert f.name in page and any(a.split()==[x['sha256'],f.name] for a in ledger),f.name
                      if f.suffix=='.pdf':
                          pinfo=subprocess.check_output(['pdfinfo',str(f)],text=True)
                          assert re.search(r'^Pages:\s+'+str(row['pages'])+r'$',pinfo,re.M),pinfo
                          ims=subprocess.check_output(['pdfimages','-list',str(f)],text=True)
                          assert not any(re.search(r'^\s*\d+\s+\d+\s+image\b',a) for a in ims.splitlines())
                          txt=re.sub(r'\s+','',subprocess.check_output(['pdftotext','-raw',str(f),'-'],text=True))
                          assert len(re.findall(r'〔原刊(?:p\.\d+(?:［\d+］)?|(?:前付|後付)第\d+頁)〕',txt))==markers[i]
                      if f.suffix=='.epub':
                          with zipfile.ZipFile(f) as z:
                              assert z.testzip() is None and z.read('mimetype')==b'application/epub+zip'
                              assert sum(bool(re.search(r'\.(?:png|jpe?g)$',n,re.I)) for n in z.namelist())==1
          print('Verified one public bibliography with two parts, both PDFs and EPUBs, four release checksums, and both exact source-page maps.')
          PY
