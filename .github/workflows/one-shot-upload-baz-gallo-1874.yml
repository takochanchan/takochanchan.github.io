name: One-shot upload Baz and Gallo release assets

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/one-shot-upload-baz-gallo-1874.yml"

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Reconstruct, upload, and verify release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p transfer verify
          pdf="Gustavo_Baz_Eduardo_L_Gallo_Historia_del_Ferrocarril_Mexicano_1874_Japanese_Complete_Translation.pdf"
          epub="Gustavo_Baz_Eduardo_L_Gallo_Historia_del_Ferrocarril_Mexicano_1874_Japanese_Complete_Translation.epub"

          fetch_blob() {
            local sha="$1"
            local output="$2"
            gh api "repos/${GITHUB_REPOSITORY}/git/blobs/${sha}" --jq '.content' |
              tr -d '\n' | base64 --decode >> "$output"
          }

          : > "transfer/${pdf}"
          while read -r sha; do
            fetch_blob "$sha" "transfer/${pdf}"
          done <<'PDF_SHAS'
          a764b6f54e70d45058df5575e4822bb1763eead8
          91233450f01f937c8ac2449c3109146a31052c82
          fd1d84cdd0452372a892897c4c12b2aa07d819c6
          2fa1b69f05e26f3b779bf41e207b772e81635a25
          e3e4dd087150d0548f8cb2a3dbfc3d3540c19397
          a7780b54466beee4f3ecf4fac315642c0442353e
          b9216d1beb7f16602f5cb8fd2faad1a562a3d0c0
          0fc66e73d8d4800fb41e0760c6f706d2500a1582
          37400cff0f13029d26bfd0ecdf6520ed3156b4d2
          4423fdfb43e5e6cc1dbaabab866b19f1e76ab78e
          047498be9f67083cac03215670d19c2df12f1501
          a86396515b7992086854485fd831fcf16581bc49
          f7d6757d01ffaf083c414e1b5c36d8e4a6579d89
          41de9d28c96682ab6c94b523105cabcbd476b6de
          620bb6b2a053fa189de785928db3e3a06cf9af23
          5ffea5e2297d94c65d207ec0dcde83d7b2af3da8
          d8c2252260d902c6bf0972890eb797c9016817dc
          2d609b9c845869619c8f2e75813b4e39f745373d
          87084f03f0d8fd930a2d6651e81cb4babb047d00
          4994fdc5f667ab508f669cc30d58348323eb887a
          048106ab93309b196d9b8d82210c47d1e0d77b7a
          1f1e4e7f6285cde08d7e4896e2f363f89687932b
          a7f83b62b64c882374ef8666f426e35e02be4796
          PDF_SHAS

          : > "transfer/${epub}"
          while read -r sha; do
            fetch_blob "$sha" "transfer/${epub}"
          done <<'EPUB_SHAS'
          8e1160c21dd226825c51260fa4d4448113adabe4
          c905b36484572ff76d39ed7bf6a3640eb8026a19
          9b9458cb2b73d0de5050489bde6460a6e7494660
          1df8c4ea32d6aa78ad7ae17508d2c56941789639
          acd1c94635ae18646b7a33ea44aa70d204922616
          ec430078fcdda515af7ba0376a8a8f6d3564204d
          918a99371c349ac2d427e03073a30dc43ba7208a
          a6736edc3e00fa7d7d58ca70fb98fcf2baf56457
          6563802333d2eb242a9ab0d9f87236e06c85816a
          6fc413c2b9209bfc7d0560c7398958bbc6f7fd65
          d309b68e98f27aa95a33a0722a4dec126684b463
          332f73c7b26e3746cd00c72cee8f02848976d5e5
          209b2b4824157238c4450e422f65ccfcfbf1b278
          5179cfcc43b416ba4d976d0118d6b5b435d3f25b
          65efc9025bb5ca2b0e380429982d865a117f9030
          6480fe6dce30f775a097fea7aa38c5f92037f6c2
          8abcafdcae12e1d7b69f1b47d4b1e3c70c1fcb6e
          1fe67180fc83f0004870b7033395a1dd435de6af
          4a84ec0be422bf53bf05cef2e094031d1065bea8
          23fafff479031f76daa155d7ef6f7390c9bddc8c
          EPUB_SHAS

          test "$(stat -c '%s' "transfer/${pdf}")" = "16039764"
          test "$(stat -c '%s' "transfer/${epub}")" = "13961911"
          (cd transfer && sha256sum -c -) <<CHECKS
          da1cbef53de8d9a51d25a3d01125a02c5288d39d9fd6b564821754d014c54abd  ${pdf}
          186e1c54b2e002bb0bad9445e988c8b7259a35643d4318b1243370387bc07a03  ${epub}
          CHECKS

          gh release view publications-current --repo "${GITHUB_REPOSITORY}" >/dev/null
          gh release upload publications-current \
            "transfer/${pdf}" "transfer/${epub}" \
            --clobber --repo "${GITHUB_REPOSITORY}"

          gh release download publications-current \
            --pattern "${pdf}" --pattern "${epub}" \
            --dir verify --repo "${GITHUB_REPOSITORY}"
          (cd verify && sha256sum -c -) <<CHECKS
          da1cbef53de8d9a51d25a3d01125a02c5288d39d9fd6b564821754d014c54abd  ${pdf}
          186e1c54b2e002bb0bad9445e988c8b7259a35643d4318b1243370387bc07a03  ${epub}
          CHECKS
