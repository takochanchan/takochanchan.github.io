name: Publish Bonaparte Nicaragua canal translation

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/bonaparte-nicaragua-canal-publication.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bonaparte-nicaragua-canal-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out staged publication data
        uses: actions/checkout@v4
        with:
          ref: agent/bonaparte-nicaragua-canal-publication-20260828-v1
          path: staged
          lfs: false

      - name: Check out current site
        uses: actions/checkout@v4
        with:
          ref: main
          path: site
          fetch-depth: 0

      - name: Apply the verified site patch
        run: |
          git -C site merge-base --is-ancestor "24db9702b5cc9725baa066d7583c1cbadcc099c6" HEAD
          test "$(git -C site diff --name-only 24db9702b5cc9725baa066d7583c1cbadcc099c6 HEAD)" = ".github/workflows/bonaparte-nicaragua-canal-publication.yml"
          git -C site apply --check ../staged/publication-staging/site-changes.patch
          git -C site apply ../staged/publication-staging/site-changes.patch
          mkdir -p site/static/publications/bonaparte-nicaragua-canal-1846
          cp staged/publication-staging/cover.jpg site/static/publications/bonaparte-nicaragua-canal-1846/cover.jpg
          rm site/.github/workflows/bonaparte-nicaragua-canal-publication.yml

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        working-directory: site
        run: npm ci

      - name: Build the publication site
        working-directory: site
        run: npm run build

      - name: Test publication metadata and site behavior
        working-directory: site
        run: npm test

      - name: Reconstruct and verify approved release files
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { mkdirSync, readFileSync, writeFileSync } from "node:fs";
          import { basename, join } from "node:path";
          const root = "staged/publication-staging/release";
          const manifest = JSON.parse(readFileSync(join(root, "manifest.json"), "utf8"));
          mkdirSync("release-assets", { recursive: true });
          for (const asset of manifest.assets) {
            if (basename(asset.name) !== asset.name) throw new Error("Invalid asset name: " + asset.name);
            const bytes = Buffer.concat(asset.chunks.map((part) => readFileSync(join(root, part))));
            const digest = createHash("sha256").update(bytes).digest("hex");
            if (bytes.length !== asset.size || digest !== asset.sha256) {
              throw new Error("Checksum mismatch: " + asset.name);
            }
            writeFileSync(join("release-assets", asset.name), bytes);
          }
          NODE

      - name: Update release checksum index
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir current-checksum
          gh release download publications-current --pattern SHA256SUMS.txt --dir current-checksum --repo "$GITHUB_REPOSITORY"
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";
          const manifest = JSON.parse(readFileSync("staged/publication-staging/release/manifest.json", "utf8"));
          const names = new Set(manifest.assets.map((asset) => asset.name));
          const existing = readFileSync("current-checksum/SHA256SUMS.txt", "utf8")
            .split(/\r?\n/)
            .filter(Boolean)
            .filter((line) => !names.has(line.trim().split(/\s+/).at(-1).replace(/^\*/, "")));
          for (const asset of manifest.assets) {
            existing.push(asset.sha256 + "  " + asset.name);
          }
          writeFileSync("release-assets/SHA256SUMS.txt", existing.join("\n") + "\n");
          NODE

      - name: Upload approved release files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while IFS= read -r name; do
            gh release upload publications-current "release-assets/$name" --clobber --repo "$GITHUB_REPOSITORY"
          done < <(node -e 'for (const asset of require("./staged/publication-staging/release/manifest.json").assets) console.log(asset.name)')
          gh release upload publications-current release-assets/SHA256SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"

      - name: Download and verify published release files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir verified
          while IFS= read -r name; do
            gh release download publications-current --pattern "$name" --dir verified --repo "$GITHUB_REPOSITORY"
          done < <(node -e 'for (const asset of require("./staged/publication-staging/release/manifest.json").assets) console.log(asset.name)')
          gh release download publications-current --pattern SHA256SUMS.txt --dir verified --repo "$GITHUB_REPOSITORY"
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { readFileSync } from "node:fs";
          import { join } from "node:path";
          const manifest = JSON.parse(readFileSync("staged/publication-staging/release/manifest.json", "utf8"));
          const sums = readFileSync("verified/SHA256SUMS.txt", "utf8");
          for (const asset of manifest.assets) {
            const bytes = readFileSync(join("verified", asset.name));
            const digest = createHash("sha256").update(bytes).digest("hex");
            if (bytes.length !== asset.size || digest !== asset.sha256) {
              throw new Error("Downloaded asset mismatch: " + asset.name);
            }
            if (!sums.split(/\r?\n/).includes(asset.sha256 + "  " + asset.name)) {
              throw new Error("SHA256SUMS entry missing: " + asset.name);
            }
          }
          NODE

      - name: Commit and publish the site source
        id: site_commit
        working-directory: site
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "N・L・B『ニカラグア運河』全訳を公開" -m "承認済みPDF・EPUB・非公開正本・検索 shard 002 の書誌を確定する。"
          pushed=false
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              pushed=true
              break
            fi
            sleep 3
          done
          test "$pushed" = true
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Verify the published main commit
        working-directory: site
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "${{ steps.site_commit.outputs.sha }}"

      - name: Remove staging branch
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/agent%2Fbonaparte-nicaragua-canal-publication-20260828-v1"

