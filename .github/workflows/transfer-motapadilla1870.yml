name: Transfer approved Mota Padilla 1870 publication files
on:
  push:
    branches: [agent/motapadilla1870-publish-20261122]
    paths: [.motapadilla1870-public-request.json]

permissions:
  contents: read
concurrency:
  group: publication-release-transfer
  cancel-in-progress: false

jobs:
  test-and-transfer:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: transfer
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: aad63ddd38f79f240bb94ad32759b3084c598ee6
          path: candidate
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate candidate ledgers and reconstruct approved bytes
        working-directory: transfer
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .motapadilla1870-transfer.py stage "$RUNNER_TEMP/motapadilla1870-assets" ../candidate
      - name: Publication build, regression tests and EPUB format check
        working-directory: candidate
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npm test
          python3 ../transfer/.motapadilla1870-readback.py --expect ../transfer/.motapadilla1870-expectations.json --html dist/publications/mota-padilla-conquista-nueva-galicia-1870/index.html
          target=dist/publications/mota-padilla-conquista-nueva-galicia-1870
          mkdir -p "$target"
          cp "$RUNNER_TEMP/motapadilla1870-assets/mota-padilla-conquista-nueva-galicia-1870-ja.epub" "$target/"
          python3 scripts/validate-epubs.py dist --slug mota-padilla-conquista-nueva-galicia-1870
      - name: Upload and re-download approved PDF, EPUB and checksum list
        working-directory: transfer
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .motapadilla1870-transfer.py transfer "$RUNNER_TEMP/motapadilla1870-assets" ../candidate
      - uses: actions/upload-artifact@v4
        with:
          name: motapadilla1870-public-verification
          path: transfer/motapadilla1870-public-verification.json
          if-no-files-found: error

