name: Verify search shard 003 allocation

on:
  push:
    branches: ["codex/search-shard-003"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publication-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm test
      - run: npm run verify:remote-search

