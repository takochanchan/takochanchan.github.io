name: Transfer checksum-pinned Francisco Sosa 1877-1879 assets

on:
  push:
    branches: ["agent/sosa-publish-20261112"]
    paths: [".publication-upload-requests/sosa-el-episcopado-mexicano-1877-1879.json", ".github/workflows/sosa-transfer.yml"]
permissions:
  contents: write
concurrency:
  group: publication-release-transfer
  cancel-in-progress: false
jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install build dependencies
        run: npm ci --no-audit --no-fund
      - name: Build and test the publication catalogue
        run: npm run build && npm test
      - name: Reconstruct, upload, and verify publication PDF and EPUB
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .publication-transfer/transfer-sosa.py
      - uses: actions/upload-artifact@v4
        with:
          name: sosa-release-verification
          path: sosa-release-verification.json


