name: Publish approved Williams assets once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-williams-approved-assets-20260802.yml

permissions:
  contents: write

concurrency:
  group: publications-current-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PDF_NAME: Mary_Wilhelmine_Williams_Anglo_American_Isthmian_Diplomacy_1916_Japanese_Complete_Translation.pdf
      PDF_SIZE: "5701507"
      PDF_SHA256: 14433b99cb5654cda5388ff54d73c3e81f680025b3fcf1b4a701510772ba181f
      PDF_BLOBS: >-
        c752d3f93bd800c20f0d6e38a1c2c7ed4cd9ffcd
        c80ed3ff9711cdf7f892e2447408a3408440617e
        401aef49630c8f75668402c813598a455a506c92
        d61c2d48e34a851e7a3c32abf0b4fcdaa5ed317c
        21df74665821e2a343289ba6005fe5cb5cecf56c
        1d278225da6fec6996857ad126fb114eb82f63cb
        4fd6570bbec1caf158ce8c5facec722af04515a8
        ac7e9056fd5304d26086693a0dd713676540bb77
        a3db45c8865aab1e76b04897bb4088c31e84b63b
        65f99c63e03fc6622c14276b0b27048b0d62044b
        a8883947ba5791824915402fe99a352ab7b5c67e
      EPUB_NAME: Mary_Wilhelmine_Williams_Anglo_American_Isthmian_Diplomacy_1916_Japanese_Complete_Translation.epub
      EPUB_SIZE: "1707365"
      EPUB_SHA256: 457ac54e64d54de4cc55df94ecec0f003b80513afcd212ed252a6e54ad97fd09
      EPUB_BLOBS: >-
        f1cd6bbde6ffd093f1ee5e6c13e54580361b7a26
        bc167209e69a8b9f45079ea7a7076ea55408435e
        948dfaa6aa0c3ae74158c0f7ec66822b3ba4ee9d
        fde411bb68a60acb6e435a4906f18bc713e8650d

    steps:
      - name: Install PDF inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Reassemble and validate approved assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/williams-assets
          for kind in PDF EPUB; do
            name_var="${kind}_NAME"
            size_var="${kind}_SIZE"
            digest_var="${kind}_SHA256"
            blobs_var="${kind}_BLOBS"
            name="${!name_var}"
            target="/tmp/williams-assets/$name"
            : > "$target"
            for blob in ${!blobs_var}; do
              gh api -H "Accept: application/vnd.github.raw+json" \
                "repos/$GITHUB_REPOSITORY/git/blobs/$blob" >> "$target"
            done
            echo "${!digest_var}  $target" | sha256sum -c -
            test "$(stat -c %s "$target")" = "${!size_var}"
          done

          test "$(pdfinfo "/tmp/williams-assets/$PDF_NAME" | awk '/^Pages:/ {print $2}')" = 318
          pdftotext -layout "/tmp/williams-assets/$PDF_NAME" /tmp/williams.txt
          grep -F "中米地峡をめぐる英米外交" /tmp/williams.txt
          grep -F "クレイトン＝ブルワー条約" /tmp/williams.txt
          grep -F "〔原刊 p. 356〕" /tmp/williams.txt

          python3 - <<'PY'
          import os, re, zipfile
          path = '/tmp/williams-assets/' + os.environ['EPUB_NAME']
          with zipfile.ZipFile(path) as z:
              assert z.testzip() is None
              names = z.namelist()
              assert names[0] == 'mimetype'
              opf_name = next(n for n in names if n.endswith('.opf'))
              opf = z.read(opf_name).decode('utf-8')
              assert re.search(r'properties="[^"]*cover-image[^"]*"', opf)
              text = ''.join(
                  z.read(n).decode('utf-8')
                  for n in names
                  if n.endswith(('.xhtml', '.html', '.opf', '.ncx'))
              ).replace('\xa0', ' ')
          assert '中米地峡をめぐる英米外交' in text
          assert 'クレイトン＝ブルワー条約' in text
          assert '〔原刊 p. 356〕' in text
          PY

      - name: Replace release assets and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/current /tmp/verified
          gh release download publications-current \
            --pattern SHA256SUMS.txt --dir /tmp/current --repo "$GITHUB_REPOSITORY"
          grep -v -F "  $PDF_NAME" /tmp/current/SHA256SUMS.txt |
            grep -v -F "  $EPUB_NAME" > /tmp/SHA256SUMS.txt
          printf '%s  %s\n' "$PDF_SHA256" "$PDF_NAME" >> /tmp/SHA256SUMS.txt
          printf '%s  %s\n' "$EPUB_SHA256" "$EPUB_NAME" >> /tmp/SHA256SUMS.txt
          gh release upload publications-current \
            "/tmp/williams-assets/$PDF_NAME" \
            "/tmp/williams-assets/$EPUB_NAME" \
            /tmp/SHA256SUMS.txt \
            --clobber --repo "$GITHUB_REPOSITORY"

          for kind in PDF EPUB; do
            name_var="${kind}_NAME"
            digest_var="${kind}_SHA256"
            size_var="${kind}_SIZE"
            name="${!name_var}"
            gh release download publications-current \
              --pattern "$name" --dir /tmp/verified --repo "$GITHUB_REPOSITORY"
            echo "${!digest_var}  /tmp/verified/$name" | sha256sum -c -
            test "$(stat -c %s "/tmp/verified/$name")" = "${!size_var}"
          done
          gh release download publications-current \
            --pattern SHA256SUMS.txt --dir /tmp/verified --repo "$GITHUB_REPOSITORY"
          grep -F "$PDF_SHA256  $PDF_NAME" /tmp/verified/SHA256SUMS.txt
          grep -F "$EPUB_SHA256  $EPUB_NAME" /tmp/verified/SHA256SUMS.txt

      - name: Remove one-time workflow
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          path=.github/workflows/publish-williams-approved-assets-20260802.yml
          sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/$path?ref=main" --jq .sha)"
          gh api --method DELETE \
            "repos/$GITHUB_REPOSITORY/contents/$path" \
            -f message="Remove completed Williams approved-assets workflow" \
            -f sha="$sha" -f branch=main
