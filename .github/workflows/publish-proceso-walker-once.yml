name: Publish Proceso Walker assets once

on:
  push:
    branches:
      - "agent/publish-proceso-contra-william-walker-1860-20260831"

permissions:
  contents: write

concurrency:
  group: publish-proceso-contra-william-walker-1860
  cancel-in-progress: false

jobs:
  validate-and-upload:
    runs-on: ubuntu-latest
    env:
      TAG: publications-current
      SLUG: proceso-contra-william-walker-1860
      PDF_NAME: Anonymous_Proceso_contra_el_filibustero_William_Walker_1860_Japanese_Complete_Translation.pdf
      EPUB_NAME: Anonymous_Proceso_contra_el_filibustero_William_Walker_1860_Japanese_Complete_Translation.epub
      PDF_SHA256: 101a797b0a5a9c3ef168ac8ca869bfc7667c57a942cbd38f825b7f8017955e22
      EPUB_SHA256: af6682dd6b4565f84293acc522567ea8a074e2783ac1941e3522e6fde9903392
      PDF_SIZE: "637303"
      EPUB_SIZE: "109651"
    steps:
      - name: Check out publication branch
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Reconstruct and verify staged assets
        run: |
          mkdir -p "$RUNNER_TEMP/release-assets"
          cat ".release-staging/$SLUG/pdf/"chunk-* > "$RUNNER_TEMP/release-assets/$PDF_NAME"
          cat ".release-staging/$SLUG/epub/"chunk-* > "$RUNNER_TEMP/release-assets/$EPUB_NAME"
          test "$(stat -c %s "$RUNNER_TEMP/release-assets/$PDF_NAME")" = "$PDF_SIZE"
          test "$(stat -c %s "$RUNNER_TEMP/release-assets/$EPUB_NAME")" = "$EPUB_SIZE"
          printf '%s  %s\n' "$PDF_SHA256" "$PDF_NAME" | (cd "$RUNNER_TEMP/release-assets" && sha256sum -c -)
          printf '%s  %s\n' "$EPUB_SHA256" "$EPUB_NAME" | (cd "$RUNNER_TEMP/release-assets" && sha256sum -c -)
          unzip -t "$RUNNER_TEMP/release-assets/$EPUB_NAME"

      - name: Upload PDF and EPUB
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" \
            "$RUNNER_TEMP/release-assets/$PDF_NAME" \
            "$RUNNER_TEMP/release-assets/$EPUB_NAME" \
            --clobber

      - name: Verify release round trip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/roundtrip"
          gh release download "$TAG" \
            --pattern "$PDF_NAME" \
            --pattern "$EPUB_NAME" \
            --dir "$RUNNER_TEMP/roundtrip" \
            --clobber
          test "$(stat -c %s "$RUNNER_TEMP/roundtrip/$PDF_NAME")" = "$PDF_SIZE"
          test "$(stat -c %s "$RUNNER_TEMP/roundtrip/$EPUB_NAME")" = "$EPUB_SIZE"
          printf '%s  %s\n' "$PDF_SHA256" "$PDF_NAME" | (cd "$RUNNER_TEMP/roundtrip" && sha256sum -c -)
          printf '%s  %s\n' "$EPUB_SHA256" "$EPUB_NAME" | (cd "$RUNNER_TEMP/roundtrip" && sha256sum -c -)

      - name: Update release checksum manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/checksums"
          gh release download "$TAG" \
            --pattern SHA256SUMS.txt \
            --dir "$RUNNER_TEMP/checksums" \
            --clobber
          python3 - "$RUNNER_TEMP/checksums/SHA256SUMS.txt" <<'PY'
          from pathlib import Path
          import os
          import sys

          path = Path(sys.argv[1])
          expected = {
              os.environ["PDF_NAME"]: os.environ["PDF_SHA256"],
              os.environ["EPUB_NAME"]: os.environ["EPUB_SHA256"],
          }
          kept = []
          for line in path.read_text(encoding="utf-8").splitlines():
              parts = line.split(maxsplit=1)
              if len(parts) == 2 and parts[1].lstrip("*") in expected:
                  continue
              if line.strip():
                  kept.append(line)
          kept.extend(f"{digest}  {name}" for name, digest in expected.items())
          kept.sort(key=lambda line: line.split(maxsplit=1)[1].lstrip("*"))
          path.write_text("\n".join(kept) + "\n", encoding="utf-8")
          PY
          gh release upload "$TAG" "$RUNNER_TEMP/checksums/SHA256SUMS.txt" --clobber
          mkdir -p "$RUNNER_TEMP/checksums-verify"
          gh release download "$TAG" \
            --pattern SHA256SUMS.txt \
            --dir "$RUNNER_TEMP/checksums-verify" \
            --clobber
          grep -Fqx "$PDF_SHA256  $PDF_NAME" "$RUNNER_TEMP/checksums-verify/SHA256SUMS.txt"
          grep -Fqx "$EPUB_SHA256  $EPUB_NAME" "$RUNNER_TEMP/checksums-verify/SHA256SUMS.txt"
