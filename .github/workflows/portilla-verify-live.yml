name: Verify live Portilla publication
on:
  push:
    branches: [main]
    paths: [src/portilla-publication.mjs, .github/workflows/portilla-verify-live.yml]
permissions:
  contents: write
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Wait for this catalogue deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,os,subprocess,time
          for attempt in range(90):
              result=json.loads(subprocess.check_output(['gh','api','repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs?head_sha='+os.environ['GITHUB_SHA']]))
              runs=[r for r in result['workflow_runs'] if r['name']=='Deploy archive to GitHub Pages']
              if runs and runs[0]['status']=='completed':
                  assert runs[0]['conclusion']=='success', runs[0]['conclusion']
                  print('Pages succeeded',runs[0]['id'])
                  break
              time.sleep(10)
          else: raise SystemExit('Pages deployment timed out')
          PY
      - name: Install PDF inspection dependency
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Verify live bibliography and exact final assets
        run: |
          python3 - <<'PY'
          import json,hashlib,urllib.request,tempfile,pathlib,zipfile,subprocess
          slug='portilla-mejico-1856-1857-1858'
          url='https://takochanchan.github.io/publications/'+slug+'/'
          html=urllib.request.urlopen(url,timeout=60).read().decode()
          for text in ['1856年および1857年のメキシコ','Méjico en 1856 y 1857','Internet Archive','公開機関の権利表示','Anselmo_de_la_Portilla_Mejico_1856_1857_1858_Japanese_Translation.pdf','Anselmo_de_la_Portilla_Mejico_1856_1857_1858_Japanese_Translation.epub']:
              assert text in html, text
          assets=[a for a in json.load(open('assets-manifest.json'))['assets'] if a['path'].startswith('publications/'+slug+'/')]
          root=pathlib.Path(tempfile.mkdtemp())
          for a in assets:
              p=root/pathlib.PurePosixPath(a['path']).name
              with urllib.request.urlopen(a['url'],timeout=120) as response,p.open('wb') as f:
                  while chunk:=response.read(1024*1024): f.write(chunk)
              assert p.stat().st_size==a['size']
              assert hashlib.sha256(p.read_bytes()).hexdigest()==a['sha256']
              if p.suffix=='.epub':
                  with zipfile.ZipFile(p) as z:
                      assert z.testzip() is None
                      assert z.read('mimetype')==b'application/epub+zip'
              if p.suffix=='.pdf':
                  info=subprocess.check_output(['pdfinfo',str(p)],text=True)
                  assert any(line.split()==['Pages:','272'] for line in info.splitlines())
              print('VERIFIED',p.name,a['size'],a['sha256'])
          sums=urllib.request.urlopen('https://github.com/takochanchan/takochanchan.github.io/releases/download/publications-current/SHA256SUMS.txt',timeout=120).read().decode()
          for a in assets:
              if a['path'].endswith(('.pdf','.epub')):
                  name=pathlib.PurePosixPath(a['path']).name
                  assert any(line.split() == [a['sha256'],name] for line in sums.splitlines())
          assert len(assets)==3
          print('Live Portilla bibliography, PDF 272 pages, EPUB, and cover verified.')
          PY
      - name: Remove this publication's verified transfer branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,os,subprocess,urllib.parse
          repo=os.environ['GITHUB_REPOSITORY']
          targets={'agent/portilla-assets-20261021':'4e9d62b0552e7ae463e57e40d67c16a6df6145ab','agent/portilla-publish-20261021':os.environ['GITHUB_SHA']}
          for branch,expected in targets.items():
              endpoint='repos/'+repo+'/git/refs/heads/'+urllib.parse.quote(branch,safe='')
              result=subprocess.run(['gh','api',endpoint],capture_output=True,text=True)
              if result.returncode:
                  print('Branch already absent or unavailable:',branch)
                  continue
              actual=json.loads(result.stdout)['object']['sha']
              if actual != expected:
                  print('Preserved branch with concurrent update:',branch)
                  continue
              subprocess.run(['gh','api','--method','DELETE',endpoint],check=True)
              print('Removed own completed transfer branch:',branch)
          PY
