name: Publish Elorza Ytza release assets

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-elorza-ytza-release.yml

permissions:
  contents: write

concurrency:
  group: publications-current-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Reassemble and verify release assets
        env:
          GH_TOKEN: ${{ github.token }}
          MANIFEST_BLOB: bb0cf2ad5281d75eb323c26a5227ecd6711efd8e
        run: |
          set -euo pipefail
          manifest=release-manifest.tsv
          gh api "repos/$GITHUB_REPOSITORY/git/blobs/$MANIFEST_BLOB" \
            --jq .content |
            tr -d '\n' |
            base64 --decode > "$manifest"
          test "$(wc -l < "$manifest")" = 2

          while IFS=$'\t' read -r asset_name expected_size expected_sha blob_list; do
            test -n "$asset_name"
            : > "$asset_name"
            for blob_sha in $blob_list; do
              gh api "repos/$GITHUB_REPOSITORY/git/blobs/$blob_sha" \
                --jq .content |
                tr -d '\n' |
                base64 --decode >> "$asset_name"
            done
            echo "$expected_sha  $asset_name" | sha256sum -c -
            test "$(stat -c %s "$asset_name")" = "$expected_size"
          done < "$manifest"

      - name: Extend the current checksum file
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir current-release
          gh release download publications-current \
            --pattern SHA256SUMS.txt \
            --dir current-release \
            --repo "$GITHUB_REPOSITORY"
          cp current-release/SHA256SUMS.txt SHA256SUMS.txt
          current_lines="$(wc -l < SHA256SUMS.txt)"

          while IFS=$'\t' read -r asset_name expected_size expected_sha blob_list; do
            if grep -Fq "  $asset_name" SHA256SUMS.txt; then
              echo "Checksum entry already exists: $asset_name" >&2
              exit 1
            fi
            echo "$expected_sha  $asset_name" >> SHA256SUMS.txt
          done < release-manifest.tsv

          test "$(wc -l < SHA256SUMS.txt)" = "$((current_lines + 2))"

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload publications-current \
            Francisco_de_Elorza_y_Rada_Conquista_de_la_Provincia_del_Ytza_1714_Japanese_Complete_Translation.pdf \
            Francisco_de_Elorza_y_Rada_Conquista_de_la_Provincia_del_Ytza_1714_Japanese_Complete_Translation.epub \
            SHA256SUMS.txt \
            --clobber \
            --repo "$GITHUB_REPOSITORY"

      - name: Verify published release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir verified-release
          while IFS=$'\t' read -r asset_name expected_size expected_sha blob_list; do
            gh release download publications-current \
              --pattern "$asset_name" \
              --dir verified-release \
              --repo "$GITHUB_REPOSITORY"
            published="verified-release/$asset_name"
            echo "$expected_sha  $published" | sha256sum -c -
            test "$(stat -c %s "$published")" = "$expected_size"
          done < release-manifest.tsv

          gh release download publications-current \
            --pattern SHA256SUMS.txt \
            --dir verified-release \
            --repo "$GITHUB_REPOSITORY"
          cmp SHA256SUMS.txt verified-release/SHA256SUMS.txt

      - name: Remove release staging branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api \
            --method DELETE \
            "repos/$GITHUB_REPOSITORY/git/refs/heads/agent/release-assets-elorza-ytza-20260731"

      - name: Remove one-time workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          path=.github/workflows/publish-elorza-ytza-release.yml
          sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/$path?ref=main" --jq .sha)"
          gh api \
            --method DELETE \
            "repos/$GITHUB_REPOSITORY/contents/$path" \
            -f message="Remove completed Elorza Ytza release workflow" \
            -f sha="$sha" \
            -f branch=main
