name: Read complete overview source text for short extracts
on:
  push:
    branches: [work/detailed-overviews-20261016]
    paths: ['.github/workflows/read-overview-supplement.yml', 'detailed-summary-work/supplement-input.json']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Extract complete EPUB body text
        run: |
          python3 - <<'PY'
          import json,urllib.request,zipfile,io,xml.etree.ElementTree as ET,concurrent.futures,re,pathlib,hashlib,posixpath
          out=pathlib.Path('overview-supplement');out.mkdir()
          def extract(v):
              data=urllib.request.urlopen(v['epubUrl'],timeout=180).read()
              assert hashlib.sha256(data).hexdigest()==v['sha256'],v['slug']
              z=zipfile.ZipFile(io.BytesIO(data))
              container=ET.fromstring(z.read('META-INF/container.xml'))
              opf=next(e.attrib['full-path'] for e in container.iter() if e.tag.rsplit('}',1)[-1]=='rootfile')
              package=ET.fromstring(z.read(opf));manifest={e.attrib['id']:e.attrib['href'] for e in package.iter() if e.tag.rsplit('}',1)[-1]=='item'}
              files=[posixpath.normpath(posixpath.join(posixpath.dirname(opf),manifest[e.attrib['idref']])) for e in package.iter() if e.tag.rsplit('}',1)[-1]=='itemref']
              chapters=[]
              for name in files:
                  root=ET.fromstring(z.read(name));body=next((e for e in root.iter() if e.tag.rsplit('}',1)[-1]=='body'),None)
                  if body is None:continue
                  text=re.sub(r'\s+',' ',' '.join(body.itertext())).strip()
                  if text:chapters.append({'file':name,'text':text})
              result={**v,'chapters':chapters,'textCharacters':sum(len(c['text']) for c in chapters)}
              (out/(v['slug']+'.json')).write_text(json.dumps(result,ensure_ascii=False))
              return {'slug':v['slug'],'characters':result['textCharacters']}
          records=json.load(open('detailed-summary-work/supplement-input.json'))
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as pool:results=list(pool.map(extract,records))
          print(json.dumps(results,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: detailed-overview-supplement
          path: overview-supplement
