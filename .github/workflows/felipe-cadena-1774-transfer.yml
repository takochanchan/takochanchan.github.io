name: Transfer checksum-pinned Felipe Cadena 1774 asset

on:
  push:
    branches: ["agent/felipe-cadena-master-pin-20261108"]
    paths: [".publication-upload-requests/felipe-cadena-guatemala-earthquake-1774.json"]
permissions:
  contents: write
concurrency:
  group: publication-release-transfer
  cancel-in-progress: false
jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install build dependencies
        run: npm ci --no-audit --no-fund
      - name: Build and test the publication catalogue
        run: npm run build && npm test
      - name: Reconstruct, upload, and verify one publication asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .publication-transfer/transfer-felipe-cadena-guatemala-earthquake-1774.py
      - uses: actions/upload-artifact@v4
        with:
          name: cadena-release-verification
          path: cadena-release-verification.json
