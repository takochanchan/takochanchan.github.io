name: Transfer verified Parra y Cote 1756–1757 publication assets
on:
  push:
    branches: [agent/parrabulario-public-transfer-20261128]
    paths: [.parrabulario-public-request.json]
permissions:
  contents: write
concurrency:
  group: publication-release-transfer
  cancel-in-progress: false
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run build && npm test
      - name: Transfer and read back the four approved PDF and EPUB files
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .parrabulario-public-transfer.py
      - uses: actions/upload-artifact@v4
        with:
          name: parrabulario-public-verification
          path: parrabulario-public-verification.json
