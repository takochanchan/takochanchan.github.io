name: Verify unchanged existing search for Vazquez publication
on:
  push:
    branches: ["agent/vazquez-publish-20261109"]
    paths: [".publication-transfer/verify-vazquez-search-regression.py"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run build && npm test
      - name: Restore search inputs
        uses: actions/cache/restore@v4
        with:
          path: |
            .cache/fulltext-assets
            .cache/fulltext-ocr
          key: vazquez-regression-${{ github.sha }}
          restore-keys: |
            search-003-
      - name: Ensure PDF tools
        run: |
          if ! command -v pdftotext; then sudo apt-get update && sudo apt-get install -y poppler-utils; fi
      - name: Fetch final verified assets and prepare manifest
        env:
          SEARCH_SHARD: "003"
        run: npm run fetch:search-assets && npm run prepare:search-manifest
      - name: Compare every existing work and verify all four new volumes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .publication-transfer/verify-vazquez-search-regression.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vazquez-search-regression
          path: vazquez-search-regression.json
