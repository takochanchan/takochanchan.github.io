name: Transfer approved Larrainzar 1873 PDF and EPUB
on:
  push:
    branches: [agent/larrainzar-publication-20261025]
    paths: [.larrainzar-public-request-final.json]
permissions:
  contents: write
concurrency:
  group: publication-release-transfer
  cancel-in-progress: false
jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run build && npm test
      - name: Upload and verify final PDF and EPUB files
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .larrainzar-transfer.py
      - uses: actions/upload-artifact@v4
        with:
          name: larrainzar-public-verification
          path: larrainzar-public-verification.json
