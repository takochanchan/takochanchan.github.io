name: Transfer checksum-pinned Cabrera 1746 volumes I–IV assets
on:
  push:
    branches: ["agent/cabrera-1746-transfer-20261122"]
    paths: [".publication-upload-requests/cabrera-escudo-de-armas-de-mexico-1746.json"]
permissions:
  contents: write
concurrency:
  group: publication-release-transfer
  cancel-in-progress: false
jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install build dependencies
        run: npm ci --no-audit --no-fund
      - name: Build and test the publication catalogue
        run: npm run build && npm test
      - name: Reconstruct, upload, and verify publication PDF and EPUB
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .publication-transfer/transfer-cabrera-1746.py
      - uses: actions/upload-artifact@v4
        with:
          name: cabrera-1746-release-verification
          path: cabrera-1746-release-verification.json
