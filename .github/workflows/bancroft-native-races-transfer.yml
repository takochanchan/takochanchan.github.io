name: Transfer checksum-pinned Bancroft Native Races assets

on:
  push:
    branches: [agent/bancroft-native-races-20260906]
    paths:
      - ".publication-upload-requests/bancroft-native-races-pacific-states-1883.json"

permissions:
  contents: write

concurrency:
  group: bancroft-native-races-publication-transfer
  cancel-in-progress: false

jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install build dependencies
        run: npm ci --no-audit --no-fund
      - name: Build archive pages and verify catalogue
        run: npm run build
      - name: Test archive and search code
        run: npm test
      - name: Reconstruct, verify, upload, and redownload final assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .publication-transfer/transfer-bancroft-native-races.py
      - uses: actions/upload-artifact@v4
        with:
          name: bancroft-native-races-release-byte-verification
          path: release-byte-verification.json
