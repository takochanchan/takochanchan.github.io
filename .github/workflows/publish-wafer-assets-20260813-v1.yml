name: Publish Lionel Wafer PDF and EPUB assets

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/publish-wafer-assets-20260813-v1.yml"

permissions:
  contents: write

concurrency:
  group: publications-current-release
  cancel-in-progress: false

jobs:
  publish-assets:
    runs-on: ubuntu-latest
    env:
      TAG: publications-current
      STAGING_BRANCH: release-staging-wafer-20260813-v1
      STAGING_ROOT: .release-staging/wafer-20260813-v1
      WORKFLOW_PATH: .github/workflows/publish-wafer-assets-20260813-v1.yml
    steps:
      - name: Check out staged release bytes
        uses: actions/checkout@v4
        with:
          ref: release-staging-wafer-20260813-v1

      - name: Install PDF validation tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Reassemble and verify publication assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          while IFS=$'\t' read -r filename kind size digest pages; do
            cat "$STAGING_ROOT/$filename"/part-* > "release/$filename"
            test "$(stat -c %s "release/$filename")" = "$size"
            test "$(sha256sum "release/$filename" | cut -d' ' -f1)" = "$digest"
            if [ "$kind" = pdf ]; then
              pdfinfo "release/$filename" | grep -Eq "^Pages:[[:space:]]+$pages$"
              pdfinfo "release/$filename" | grep -Eq '^Tagged:[[:space:]]+yes$'
              pdfinfo "release/$filename" | grep -Eq '^Page size:[[:space:]]+612 x 792 pts \(letter\)$'
              if pdftotext "release/$filename" - | grep -Eq '公開前|確認用|公開作業は行っていない|review'; then
                echo "Pre-publication wording remains in $filename" >&2
                exit 1
              fi
            else
              unzip -t "release/$filename" >/dev/null
              test "$(unzip -p "release/$filename" mimetype)" = "application/epub+zip"
              test "$(unzip -lv "release/$filename" | awk '$NF=="mimetype"{print $2,$3}')" = "Stored 20"
              if while IFS= read -r member; do unzip -p "release/$filename" "$member"; done                 < <(unzip -Z1 "release/$filename" | grep -E '\.(xhtml|html)$')                 | grep -Eq '公開前|確認用|公開作業は行っていない|review'; then
                echo "Pre-publication wording remains in $filename" >&2
                exit 1
              fi
            fi
          done < "$STAGING_ROOT/assets.tsv"

      - name: Build updated release checksum manifest
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p current
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS.txt --dir current
          cp current/SHA256SUMS.txt release/SHA256SUMS.txt
          while IFS=$'\t' read -r filename kind size digest pages; do
            awk -v name="$filename" '$2 != name' release/SHA256SUMS.txt > release/SHA256SUMS.next
            mv release/SHA256SUMS.next release/SHA256SUMS.txt
            printf '%s  %s\n' "$digest" "$filename" >> release/SHA256SUMS.txt
          done < "$STAGING_ROOT/assets.tsv"
          LC_ALL=C sort -k2,2 -o release/SHA256SUMS.txt release/SHA256SUMS.txt
          while IFS=$'\t' read -r filename kind size digest pages; do
            test "$(grep -Fc "  $filename" release/SHA256SUMS.txt)" = 1
          done < "$STAGING_ROOT/assets.tsv"

      - name: Require unused public asset names
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          names="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          while IFS=$'\t' read -r filename kind size digest pages; do
            ! grep -Fxq "$filename" <<<"$names"
          done < "$STAGING_ROOT/assets.tsv"

      - name: Upload PDF and EPUB assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          files=()
          while IFS=$'\t' read -r filename kind size digest pages; do files+=("release/$filename"); done < "$STAGING_ROOT/assets.tsv"
          gh release upload "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY"
          gh release upload "$TAG" release/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber

      - name: Re-download and byte-verify uploaded assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verify
          patterns=()
          while IFS=$'\t' read -r filename kind size digest pages; do patterns+=(--pattern "$filename"); done < "$STAGING_ROOT/assets.tsv"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" "${patterns[@]}" --pattern SHA256SUMS.txt --dir verify
          : > verify/WAFER_SHA256SUMS.txt
          while IFS=$'\t' read -r filename kind size digest pages; do
            grep -F "  $filename" verify/SHA256SUMS.txt >> verify/WAFER_SHA256SUMS.txt
            cmp "release/$filename" "verify/$filename"
          done < "$STAGING_ROOT/assets.tsv"
          test "$(wc -l < verify/WAFER_SHA256SUMS.txt)" = 2
          (cd verify && sha256sum -c WAFER_SHA256SUMS.txt)

      - name: Remove staging branch and one-shot workflow
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$STAGING_BRANCH"
          workflow_sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/$WORKFLOW_PATH?ref=main" --jq .sha)"
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/contents/$WORKFLOW_PATH"             -f message="Remove completed Wafer asset workflow"             -f sha="$workflow_sha"             -f branch=main
