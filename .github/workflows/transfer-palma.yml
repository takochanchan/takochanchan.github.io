name: Transfer approved Palma publication files
on:
  push:
    branches: [agent/palma-publish-20261006]
    paths: ['.palma-public-requests/*.json']
permissions:
  contents: write
concurrency:
  group: publication-release-transfer
  cancel-in-progress: false
jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run build && npm test
      - name: Upload and verify final PDF and EPUB files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for request in .palma-public-requests/*.json; do
            python3 .palma-transfer.py "$request"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: palma-public-verification
          path: palma-public-verification-v*.json
