name: Verify Pardo 1676 search and publication
on:
  push:
    branches: [agent/pardo1676-verify-20261128]
    paths: [.pardo1676-live-plan.json]
permissions:
  contents: read
jobs:
  search-maps:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run build && npm test
      - run: python3 .pardo1676-verify.py maps && npm run verify:remote-search
      - uses: actions/upload-artifact@v4
        with:
          name: pardo1676-map-verification
          path: pardo1676-verification.json
  live-publication:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: python3 .pardo1676-verify.py live
      - uses: actions/upload-artifact@v4
        with:
          name: pardo1676-live-readback
          path: pardo1676-verification.json
