name: Publish Uring release assets

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-uring-release.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Reassemble release assets
        env:
          PDF_CHUNKS: "a256e3cd0ed89cbc60021b226162e8c4a0d35cd4 f8992deefa2af04c29b83f8e1e3fe5264d526cbe 20a93ca48c2d9e88fd05421f740a0d467ad1e707 8208c49e4a0a3130b792df95b7d90eca73087e6a d9ab36a3f739f5b2dace86127ec5df32803d9658 f5bf2d91e8b03a66cf4be9dd4e8de41cc4ec21be c08d5e8b7e3b0f8faeadd6de41c5142f38b242c7 b19f72f72073306bff64be801aec0d13f26dfa50 2d09436628af0f76cfef02086ceb62d9e84b36af f48fbc2888e31c1bc0d8ae7ad0e918b5d35b97da 435b527f7cefb221e6389a687c5fc1e47345f7ad 4a64f94b9e0aa9b412b207d1a149ca6f093cae44 5a1cb2c111a861f75706a5cf79bc9193da9e1ec3 ddf9bb96175ece517921d50c0c85572262bf6cca 159deadd79acb1bc5d157403be9492125dc23c7d 0794ef4f01a3bb64206e54576d280281fae95901 a580cb7b011855f4b8c0779e0f24c33d9d24fdf2 0e85f9ab94e58b43d541575e8edfea1da9f217a4 141a001df09f0de0a221c3be190da582a8055217 34681db83a4e4cf8415d6e7b072fff1695408a78 0e6509b2d952d26faece3194a5526e1fc4cf4abe 32b3d591f75a213dc181863f91d8bed7389e3fb3 c437de6a4e99ca9c6f0004191c9f52d4bf21a780 840ebb1e380afd07f041ad30d629151aa15f1fde 815b350592220b89670b068dd64b3f6ca8c5b05c 37cdbe3beced329ba6e1a4eb77203c401cb61402 82f61467d2aa994b7c97beb377b6899252452c8f 40288a4e5611aa9d026f791b42c534a1206103c1 0a0df0bedb0659101af5ec410db219c2ebedb4dc 9d94c69364b34d152a0c2f605fd0d968ebcace69 1623b4fff8165deff79b522893109b865a102abd b21258971e1a223dbb6aeccca387fd954c82ceba"
          EPUB_CHUNKS: "50780a119c809187d45b694682769fba144c9c93 4c4ae534928f6d8cc1dda55d3749996df7d4e1af 8bd884ba4943f8337b0ec52d5df1a65df483dc66 561a64896f7eef2c4f020f06d969ff65acf6231d 7d0f9b0cf6c23056cbd91213fcc2a0335f8ea8e6 1c3eb717c095f355d34b70acfb4917d0996bc0d7 a02a4bf383a221d9ca091ae8839fe07a3a7e2aa8 8ba347b61391be23babf017c84e90769c14468a7 667f433eec397b9aae4e7ff9848a39d53f13effe d4afc3b199a53646cc9af2535211d9d3418a7e19 16921837b3d5d627fc0cecb9f961b5edb1bbc3ad 9544aeb320838a86211afe4ea81cab2ddba7dee2 88edff96dad8a049abd5001b375c2815c34bf877 4f5115a2a201e2d826931172cc3c833ffd348321 63f3385b7f1ddc08ff908e02bd001e880dadfcd5"
        run: |
          set -euo pipefail
          pdf=Nathaniel_Uring_Voyages_and_Travels_1928_Japanese_Complete_Translation.pdf
          epub=Nathaniel_Uring_Voyages_and_Travels_1928_Japanese_Complete_Translation.epub
          : > "$pdf"
          : > "$epub"
          for chunk in $PDF_CHUNKS; do
            gh api "repos/$GITHUB_REPOSITORY/git/blobs/$chunk" --jq .content | tr -d '\n' | base64 --decode >> "$pdf"
          done
          for chunk in $EPUB_CHUNKS; do
            gh api "repos/$GITHUB_REPOSITORY/git/blobs/$chunk" --jq .content | tr -d '\n' | base64 --decode >> "$epub"
          done
          echo "b7e642bf2ec46e563410084684b5803dacfa1d01336d4ec18cb5a71c8b25f295  $pdf" | sha256sum -c -
          echo "50dc7f7457ebd79568fcbf13967d6f1d41d918a9ffcd7eaab7e85576f4ec1d58  $epub" | sha256sum -c -
          test "$(stat -c %s "$pdf")" = 8266282
          test "$(stat -c %s "$epub")" = 3882891

      - name: Update release assets and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pdf=Nathaniel_Uring_Voyages_and_Travels_1928_Japanese_Complete_Translation.pdf
          epub=Nathaniel_Uring_Voyages_and_Travels_1928_Japanese_Complete_Translation.epub
          gh release download publications-current \
            --pattern SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY"
          awk -v pdf="$pdf" -v epub="$epub" \
            '$2 != pdf && $2 != epub { print }' \
            SHA256SUMS.txt > SHA256SUMS.next
          sha256sum "$pdf" "$epub" >> SHA256SUMS.next
          LC_ALL=C sort -k2,2 SHA256SUMS.next > SHA256SUMS.txt
          gh release upload publications-current \
            "$pdf" \
            "$epub" \
            SHA256SUMS.txt \
            --clobber \
            --repo "$GITHUB_REPOSITORY"

      - name: Remove temporary branch and workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api \
            --method DELETE \
            "repos/$GITHUB_REPOSITORY/git/refs/heads/agent/uring-release-assets" \
            >/dev/null 2>&1 || true
          path=.github/workflows/publish-uring-release.yml
          sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/$path?ref=main" --jq .sha 2>/dev/null || true)"
          if test -z "$sha"; then
            exit 0
          fi
          gh api \
            --method DELETE \
            "repos/$GITHUB_REPOSITORY/contents/$path" \
            -f message="Remove one-time Uring release workflow" \
            -f sha="$sha" \
            -f branch=main
