name: Transfer checksum-pinned publication batch assets
on:
  push:
    branches: ["agent/burgoa-1674-transfer"]
    paths: [".publication-upload-requests/burgoa-1674.json"]
permissions:
  contents: write
concurrency:
  group: publication-release-transfer
  cancel-in-progress: false
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install build dependencies
        run: npm ci --no-audit --no-fund
      - name: Build and test the publication catalogue
        run: npm run build && npm test
      - name: Reconstruct, upload, and verify publication PDF and EPUB
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .publication-transfer/transfer-burgoa-1674.py
      - uses: actions/upload-artifact@v4
        with:
          name: burgoa-1674-transfer-verification
          path: burgoa-1674-transfer-verification.json

