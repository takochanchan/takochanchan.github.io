name: Transfer approved Gueguence publication
on:
  push:
    branches: [agent/gueguence-publish-20260908]
    paths: ['.publication-upload-requests/brinton-gueguence-1883.json']
permissions:
  contents: write
concurrency:
  group: gueguence-publication-transfer
  cancel-in-progress: false
jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm test
      - name: Upload and verify approved files
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .publication-transfer/transfer-gueguence.py
      - uses: actions/upload-artifact@v4
        with:
          name: gueguence-release-byte-verification
          path: release-byte-verification.json
