name: Transfer approved De Guignes publication files
on:
  push:
    branches: [agent/de-guignes-publish-20261005]
    paths: [.de-guignes-public-request.json]
permissions:
  contents: write
concurrency:
  group: publication-release-transfer
  cancel-in-progress: false
jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run build && npm test
      - name: Upload and verify final PDF and EPUB files
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .de-guignes-transfer.py
      - uses: actions/upload-artifact@v4
        with:
          name: de-guignes-public-verification
          path: de-guignes-public-verification.json

