name: Verify public Nuevo Bernal bibliography and all downloads
on:
  push:
    branches: ["agent/nuevo-bernal1847-live-20261120"]
    paths: [".nuevo-bernal1847-verify/request.json"]

permissions:
  contents: read
  actions: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Wait for the pinned search deployment
        working-directory: .nuevo-bernal1847-verify
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 wait_deploy.py search
      - name: Verify map hashes and page locations before site publication
        working-directory: .nuevo-bernal1847-verify
        run: python3 check_live.py maps-only
      - name: Wait for the pinned main-site deployment
        working-directory: .nuevo-bernal1847-verify
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 wait_deploy.py site
      - name: Verify live bibliography, aliases, search and four downloads
        working-directory: .nuevo-bernal1847-verify
        run: python3 check_live.py
