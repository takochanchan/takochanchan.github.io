name: Transfer approved García 1910 publication files
on:
  push:
    branches: [agent/garcia-leona1910-publish-20261120]
    paths: [.garcialeona1910-public-request.json]

permissions:
  contents: read
concurrency:
  group: publication-release-transfer
  cancel-in-progress: false

jobs:
  test-and-transfer:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: transfer
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: aa803e0cf2a74d6a56815f397c0716b121b890e5
          path: candidate
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate candidate ledgers and reconstruct approved bytes
        working-directory: transfer
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .garcialeona1910-transfer.py stage "$RUNNER_TEMP/garcialeona1910-assets" ../candidate
      - name: Publication build, regression tests and EPUB format check
        working-directory: candidate
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npm test
          python3 ../transfer/.garcialeona1910-readback.py --expect ../transfer/.garcialeona1910-expectations.json --html dist/publications/garcia-leona-vicario-1910/index.html
          target=dist/publications/garcia-leona-vicario-1910
          mkdir -p "$target"
          cp "$RUNNER_TEMP/garcialeona1910-assets/garcia-leona-vicario-1910.epub" "$target/"
          python3 scripts/validate-epubs.py dist --slug garcia-leona-vicario-1910
      - name: Upload and re-download approved PDF, EPUB and checksum list
        working-directory: transfer
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .garcialeona1910-transfer.py transfer "$RUNNER_TEMP/garcialeona1910-assets" ../candidate
      - uses: actions/upload-artifact@v4
        with:
          name: garcialeona1910-public-verification
          path: transfer/garcialeona1910-public-verification.json
          if-no-files-found: error

