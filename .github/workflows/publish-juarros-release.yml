name: Publish Juarros release assets

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-juarros-release.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Reassemble release assets
        env:
          GH_TOKEN: ${{ github.token }}
          PDF_CHUNKS: "695b65a3d6e086a53b02eb1215585e67d317b0d1 bd629e6f5bc2c9535c37a74fea3600e8c2797a75 65fb26c7d0b324cd8e775bb637dea2b2e2cd0c4e 66848d4df4e80e4c11dfa907bd392ca132b922e8 051c5df1ec45a24cfe36cfc98d1d4e8781711ede 494899bc290b723c1526a3d1f0a0e975caa833d0 eb673a6a15e1499d8348bf711f4ab2c924d0fbdd 4153740d32ac9761a9c787dfb1b35ba92a1f45df fdfac35043d7ac77c1adc5e09dfacd5652cc1bd0 6579c4e8610580716b3a454aa5b9c820fe99fdb5 5bbc84b3690ae9ba61ab386848041966260d7ebd 1edbf047860b856c0230d29a4d88a814f1497c0a 82994227742571b77c0b9205e0770d7b9f6c76cb dde6c7fea0a8f940c48d1be2d5c0497451035820 db1988254122837fdbfabc7fc133ec4904b63bf7 755a23e2973dd6efe36df72a414c0306a6da3b1b f1f431d80740e9bbe4dc750beef339581910145d 10c1ad21a8130ed7c561876173207e3da077f65c 071efa45def1c687213d43f172dbd86be65b4159 9a9aac1b1e44efc5da84700630854dc21d4ddbbe b80a150b1221e890d8a32736d6776668f883e46d fdfada344d9fe70cdc8a345633ce233a3fbd3972 e239a5711055a42019e049756c803b0d02ced998 a18e97827f4f939a5025b20bce6ffa553708c96f 2a95d0f5504f85025f93e8d2b6b8b33c3bb75609 d3ebb8c5245c5bcfba938859ab0b9ee345c8833d 804fb776fc92ace9c432617de4cf16a661a66f1b 8686621a10d71eb78fdbb7ee6b984cc5c596bd60"
          EPUB_CHUNKS: "69a8847d43cf7193f5d55d0155757754c1adbe29 3612dc83043e204804699e172daf894f902c7aa7 d0fec971987e72ddfd5cdc0b5bf6eb5a04b189f1 b50211652cdf41e50cf99d8f58d86d54c45ab6a9 0961ab6a839209aa97efd1ba2d1a0f7e5155fd4d 49716f7b775f886d2123b5bf1de9df43b15b16a1 2a555175f39e42419cffbf51441465a380e87e57 413c649f6bd8b63726db7212fc40429a11583cdd"
          SUMS_CHUNKS: "0cb120f316b220bf27e6f7d38b1c91df3f05a411"
        run: |
          set -euo pipefail
          pdf=Juarros_Compendio_Historia_Ciudad_Guatemala_1857_Japanese_Complete_Translation.pdf
          epub=Juarros_Compendio_Historia_Ciudad_Guatemala_1857_Japanese_Complete_Translation.epub
          sums=SHA256SUMS.txt
          : > "$pdf"
          : > "$epub"
          : > "$sums"
          for chunk in $PDF_CHUNKS; do
            gh api "repos/$GITHUB_REPOSITORY/git/blobs/$chunk" --jq .content | tr -d '\n' | base64 --decode >> "$pdf"
          done
          for chunk in $EPUB_CHUNKS; do
            gh api "repos/$GITHUB_REPOSITORY/git/blobs/$chunk" --jq .content | tr -d '\n' | base64 --decode >> "$epub"
          done
          for chunk in $SUMS_CHUNKS; do
            gh api "repos/$GITHUB_REPOSITORY/git/blobs/$chunk" --jq .content | tr -d '\n' | base64 --decode >> "$sums"
          done
          echo "003d086cb48fdc84653b915289c40ddfb43abb774fe644c8cb2ecde65cef30e5  $pdf" | sha256sum -c -
          echo "9c41d2513659bc4e7c0e45f3cf745a3d4a8ce6fddb5327f84334e949d92cea73  $epub" | sha256sum -c -
          echo "519aab6b22b28c9e4de6c4c3d9916b8326e7fb5c03b40a477d894625a664bbbd  $sums" | sha256sum -c -
          test "$(stat -c %s "$pdf")" = 14453720
          test "$(stat -c %s "$epub")" = 3705326
          test "$(stat -c %s "$sums")" = 13784

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload publications-current \
            Juarros_Compendio_Historia_Ciudad_Guatemala_1857_Japanese_Complete_Translation.pdf \
            Juarros_Compendio_Historia_Ciudad_Guatemala_1857_Japanese_Complete_Translation.epub \
            SHA256SUMS.txt \
            --clobber \
            --repo "$GITHUB_REPOSITORY"

      - name: Remove one-time workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          path=.github/workflows/publish-juarros-release.yml
          sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/$path?ref=main" --jq .sha 2>/dev/null || true)"
          if test -z "$sha"; then
            exit 0
          fi
          gh api \
            --method DELETE \
            "repos/$GITHUB_REPOSITORY/contents/$path" \
            -f message="Remove one-time Juarros release workflow" \
            -f sha="$sha" \
            -f branch=main
