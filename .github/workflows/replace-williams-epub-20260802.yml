name: Replace Williams EPUB with validated EPUB 3 once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/replace-williams-epub-20260802.yml

permissions:
  contents: write

concurrency:
  group: publications-current-release
  cancel-in-progress: false

jobs:
  replace:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EPUB_NAME: Mary_Wilhelmine_Williams_Anglo_American_Isthmian_Diplomacy_1916_Japanese_Complete_Translation.epub
      EPUB_SIZE: "1707365"
      EPUB_SHA256: 457ac54e64d54de4cc55df94ecec0f003b80513afcd212ed252a6e54ad97fd09
      EPUB_BLOBS: "dddb49888ef1d6534fc7f3d23fd2978c208d00b6 d6aae0524e5102e6a7d00e0e8d03c94239cb66a6 82538b11914298fdb5d0ae2aa174ac2068b2a79a 939c655c694f88cbab675e13eb0594e9912e8328 6c46ec4fa3d430ed76cb1be6a69c762fe7661c01 a5c0f91b30d1af3e3631a5270f5211d6293b335a fde411bb68a60acb6e435a4906f18bc713e8650d"
    steps:
      - name: Reassemble and validate EPUB 3
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/williams-epub /tmp/current /tmp/verified
          target="/tmp/williams-epub/$EPUB_NAME"
          : > "$target"
          for blob in $EPUB_BLOBS; do
            gh api "repos/$GITHUB_REPOSITORY/git/blobs/$blob" --jq .content |
              tr -d '\n' | base64 --decode >> "$target"
          done
          echo "$EPUB_SHA256  $target" | sha256sum -c -
          test "$(stat -c %s "$target")" = "$EPUB_SIZE"
          python3 - <<'PY'
          import os, zipfile
          path='/tmp/williams-epub/' + os.environ['EPUB_NAME']
          with zipfile.ZipFile(path) as z:
              assert z.testzip() is None
              names=z.namelist()
              assert names[0] == 'mimetype'
              assert z.read('mimetype') == b'application/epub+zip'
              opf=z.read('EPUB/content.opf').decode('utf-8')
              assert 'properties="cover-image"' in opf
              assert 'properties="nav"' in opf
              text=''.join(
                  z.read(n).decode('utf-8')
                  for n in names
                  if n.endswith(('.xhtml','.html','.opf','.ncx'))
              ).replace('\xa0', ' ')
          assert '中米地峡をめぐる英米外交' in text
          assert 'クレイトン＝ブルワー条約' in text
          assert '〔原刊 p. 356〕' in text
          PY

      - name: Replace asset and shared checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download publications-current --pattern SHA256SUMS.txt --dir /tmp/current --repo "$GITHUB_REPOSITORY"
          grep -v -F "  $EPUB_NAME" /tmp/current/SHA256SUMS.txt > /tmp/SHA256SUMS.txt
          printf '%s  %s\n' "$EPUB_SHA256" "$EPUB_NAME" >> /tmp/SHA256SUMS.txt
          gh release upload publications-current "/tmp/williams-epub/$EPUB_NAME" /tmp/SHA256SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"
          gh release download publications-current --pattern "$EPUB_NAME" --dir /tmp/verified --repo "$GITHUB_REPOSITORY"
          gh release download publications-current --pattern SHA256SUMS.txt --dir /tmp/verified --repo "$GITHUB_REPOSITORY"
          echo "$EPUB_SHA256  /tmp/verified/$EPUB_NAME" | sha256sum -c -
          test "$(stat -c %s "/tmp/verified/$EPUB_NAME")" = "$EPUB_SIZE"
          grep -F "$EPUB_SHA256  $EPUB_NAME" /tmp/verified/SHA256SUMS.txt

      - name: Remove one-time workflow
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          path=.github/workflows/replace-williams-epub-20260802.yml
          sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/$path?ref=main" --jq .sha)"
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/contents/$path" -f message="Remove completed Williams EPUB workflow" -f sha="$sha" -f branch=main
