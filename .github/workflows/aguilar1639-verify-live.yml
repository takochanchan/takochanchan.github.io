name: Verify live Aguilar 1639 Japanese edition
on:
  push:
    branches: ["agent/aguilar1639-live-20261119"]
    paths: [".github/workflows/aguilar1639-verify-live.yml"]
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Wait for the exact catalogue deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,os,subprocess,time
          for _ in range(90):
              repo=os.environ['GITHUB_REPOSITORY']
              result=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/runs?head_sha=9c542e60abee51114319394a83d91cda8ba58ba5']))
              runs=[r for r in result['workflow_runs'] if r['name']=='Deploy archive to GitHub Pages']
              if runs and runs[0]['status']=='completed':
                  assert runs[0]['conclusion']=='success', runs[0]['conclusion']
                  print('Pages succeeded',runs[0]['id'])
                  break
              time.sleep(10)
          else: raise SystemExit('Pages deployment timed out')
          PY
      - name: Install PDF inspection dependency
        run: command -v pdftotext >/dev/null || (sudo apt-get update && sudo apt-get install -y poppler-utils)
      - name: Verify public bibliography and exact text-only reader files
        run: |
          python3 - <<'PY'
          import hashlib,html,json,pathlib,re,subprocess,tempfile,time,urllib.request,zipfile
          from xml.etree import ElementTree as ET
          slug='pedro-sanchez-de-aguilar-informe-contra-idolorum-cultores-1639'
          site='https://takochanchan.github.io/publications/'
          expected=json.load(open('src/publication-overviews.json'))['records'][slug]
          urls={'https://archive.org/details/informecontraido00snch',
                'https://archive.org/download/informecontraido00snch/informecontraido00snch.pdf'}
          def get(u):
              for i in range(15):
                  try:return urllib.request.urlopen(u,timeout=120).read()
                  except OSError:
                      if i==14:raise
                      time.sleep(4)
          page=html.unescape(get(site+slug+'/').decode())
          for word in ['ユカタン司教区の偶像礼拝者に対する報告書','Pedro Sánchez de Aguilar','1639','205頁','CC BY 4.0','BA639 S311i', *urls]:
              assert word in page,word
          for paragraph in expected.split('\n\n'): assert paragraph in page,paragraph
          assets=[a for a in json.load(open('assets-manifest.json'))['assets'] if a['path'].startswith('publications/'+slug+'/')]
          assert len(assets)==3
          with tempfile.TemporaryDirectory() as td:
              for row in assets:
                  p=pathlib.Path(td,pathlib.PurePosixPath(row['path']).name)
                  assert row['url'] in page or p.name=='cover.jpg'
                  p.write_bytes(get(row['url']))
                  assert p.stat().st_size==row['size'] and hashlib.sha256(p.read_bytes()).hexdigest()==row['sha256'],p.name
                  if p.suffix=='.pdf':
                      assert 'Pages: 205' in re.sub(r' +',' ',subprocess.check_output(['pdfinfo',str(p)],text=True))
                      im=subprocess.check_output(['pdfimages','-list',str(p)],text=True)
                      assert not re.search(r'^\s*\d+\s+\d+\s+(image|mask|smask)\b',im,re.M)
                      text=subprocess.check_output(['pdftotext','-f','2','-l','2',str(p),'-'],text=True)
                      link=subprocess.check_output(['pdfinfo','-url',str(p)],text=True)
                      assert all(u in re.sub(r'\s+','',text) and u in link for u in urls)
                  if p.suffix=='.epub':
                      with zipfile.ZipFile(p) as z:
                          assert z.testzip() is None and z.read('mimetype')==b'application/epub+zip'
                          xhtml=[z.read(n).decode() for n in z.namelist() if re.search(r'/ch\d+\.xhtml$',n)]
                          assert sum(doc.count('epub:type="footnote"') for doc in xhtml)==401
                          assert len([n for n in z.namelist() if n.lower().endswith(('.jpg','.jpeg','.png','.svg','.gif'))])==1
                          found=set()
                          for s in xhtml:
                              for node in ET.fromstring(s).findall('.//{http://www.w3.org/1999/xhtml}a'):
                                  u=node.get('href')
                                  if u in urls and ''.join(node.itertext())==u:found.add(u)
                          assert found==urls
              print('Live separate Aguilar 1639 bibliography, full synopsis, exact 205-page PDF, EPUB, cover, two visibly linked source URLs, and no body illustrations.')
          PY
