name: Publish Baqueiro release assets

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/publish-baqueiro-assets-20260815-v1.yml"

permissions:
  contents: write

concurrency:
  group: public-release-assets
  cancel-in-progress: false

jobs:
  publish-assets:
    runs-on: ubuntu-latest
    env:
      STAGING_BRANCH: agent/baqueiro-public-assets-20260815-v1
      STAGING_ROOT: .release-staging/baqueiro-public-20260815-v1
      WORKFLOW_PATH: .github/workflows/publish-baqueiro-assets-20260815-v1.yml
      RELEASE_TAG: publications-current
      BUNDLE_SIZE: "21284308"
      BUNDLE_SHA256: 548f48216b0f474ec7e463bc457bb27d0f920db2e3c1cf014d4c2ca4559996dd

    steps:
      - name: Check out checksum-pinned public assets
        uses: actions/checkout@v4
        with:
          ref: agent/baqueiro-public-assets-20260815-v1

      - name: Restore checksum-pinned public bundle
        shell: bash
        run: |
          set -euo pipefail
          cat "$STAGING_ROOT"/bundle.tar.gz.part-* > /tmp/baqueiro-public.tar.gz
          test "$(stat -c %s /tmp/baqueiro-public.tar.gz)" = "$BUNDLE_SIZE"
          echo "$BUNDLE_SHA256  /tmp/baqueiro-public.tar.gz" | sha256sum -c -
          tar -xzf /tmp/baqueiro-public.tar.gz -C "$STAGING_ROOT"

      - name: Ensure PDF inspection tools are available
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v pdfinfo >/dev/null 2>&1 || ! command -v pdftotext >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y poppler-utils
          fi

      - name: Validate public PDF and EPUB
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import pathlib
          import re
          import subprocess
          import zipfile
          from xml.etree import ElementTree as ET

          root = pathlib.Path('.release-staging/baqueiro-public-20260815-v1')
          payload = json.loads((root / 'manifest.json').read_text(encoding='utf-8'))
          assert len(payload) == 1
          entry = payload[0]
          assert entry['slug'] == 'baqueiro-ensayo-revoluciones-yucatan-1878-1887'
          expected_files = {'manifest.json'}
          for kind in ('pdf', 'epub'):
              asset = entry[kind]
              expected_files.add(asset['filename'])
              data = (root / asset['filename']).read_bytes()
              assert len(data) == asset['size'], kind
              assert hashlib.sha256(data).hexdigest() == asset['sha256'], kind

          banned = ('確認用校正刷', '日本語全訳版（確認用）')
          pdf = root / entry['pdf']['filename']
          pdf_bytes = pdf.read_bytes()
          assert pdf_bytes.startswith(b'%PDF-') and b'%%EOF' in pdf_bytes[-4096:]
          info = subprocess.check_output(['pdfinfo', str(pdf)], text=True)
          assert re.search(r'^Pages:\s+1251$', info, re.MULTILINE)
          assert re.search(r'^Page size:\s+612 x 792 pts \(letter\)$', info, re.MULTILINE)
          assert re.search(r'^Tagged:\s+yes$', info, re.MULTILINE)
          assert re.search(r'^Encrypted:\s+no$', info, re.MULTILINE)
          pdf_text = subprocess.check_output(['pdftotext', str(pdf), '-'], text=True)
          normalized_pdf = re.sub(r'\s+', ' ', pdf_text)
          assert len(re.findall(r'〔原刊 p\.\s*\d+〕', normalized_pdf)) == entry['marker_count_numeric']
          for phrase in (entry['title'], entry['original_title'], entry['author'], entry['author_original'], 'British Library', '9781.dd.11', '第3巻', '〔原刊 p. 340〕'):
              assert phrase in pdf_text, phrase
          for phrase in banned:
              assert phrase not in pdf_text and phrase not in info, phrase

          epub = root / entry['epub']['filename']
          with zipfile.ZipFile(epub) as archive:
              assert archive.testzip() is None
              first = archive.infolist()[0]
              assert first.filename == 'mimetype' and first.compress_type == 0
              assert archive.read('mimetype') == b'application/epub+zip'
              container = ET.fromstring(archive.read('META-INF/container.xml'))
              rootfile = next(node for node in container.iter() if node.tag.endswith('}rootfile'))
              opf = ET.fromstring(archive.read(rootfile.attrib['full-path']))
              image_items = [item for item in opf.iter() if item.tag.endswith('}item') and item.attrib.get('media-type', '').startswith('image/')]
              assert len(image_items) == 1
              roots = [ET.fromstring(archive.read(name)) for name in archive.namelist() if name.endswith(('.xhtml', '.html'))]
              epub_text = ' '.join(' '.join(root_node.itertext()) for root_node in roots)
              normalized_epub = re.sub(r'\s+', ' ', epub_text)
              assert len(re.findall(r'〔原刊 p\.\s*\d+〕', normalized_epub)) == entry['marker_count_numeric']
              assert len(re.findall(r'[ぁ-んァ-ヶ一-龠々〆ヵヶ]', epub_text)) >= 500000
              assert sum(1 for root_node in roots for node in root_node.iter() if node.tag.endswith('}img')) == 1
              for phrase in (entry['title'], entry['original_title'], entry['author'], entry['author_original'], 'British Library', '第3巻'):
                  assert phrase in epub_text, phrase
              for phrase in banned:
                  assert phrase not in epub_text, phrase

          actual = {path.name for path in root.iterdir() if path.is_file()}
          assert actual == expected_files, (actual, expected_files)
          PY

      - name: Upload new files without replacing unrelated release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          python - <<'PY' > /tmp/public-asset-names.txt
          import json
          payload = json.load(open('.release-staging/baqueiro-public-20260815-v1/manifest.json'))
          for entry in payload:
              print(entry['pdf']['filename'])
              print(entry['epub']['filename'])
          PY
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' > /tmp/current-assets.txt
          while IFS= read -r name; do
            if grep -Fqx "$name" /tmp/current-assets.txt; then
              mkdir -p /tmp/existing
              gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$name" --dir /tmp/existing
              cmp "$STAGING_ROOT/$name" "/tmp/existing/$name"
            else
              gh release upload "$RELEASE_TAG" "$STAGING_ROOT/$name" --repo "$GITHUB_REPOSITORY"
            fi
          done < /tmp/public-asset-names.txt

      - name: Re-download and verify every published byte
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/verified-public
          while IFS= read -r name; do
            gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$name" --dir /tmp/verified-public
            cmp "$STAGING_ROOT/$name" "/tmp/verified-public/$name"
          done < /tmp/public-asset-names.txt
          python - <<'PY'
          import hashlib
          import json
          import pathlib
          payload = json.load(open('.release-staging/baqueiro-public-20260815-v1/manifest.json'))
          root = pathlib.Path('/tmp/verified-public')
          for entry in payload:
              for kind in ('pdf', 'epub'):
                  asset = entry[kind]
                  data = (root / asset['filename']).read_bytes()
                  assert len(data) == asset['size']
                  assert hashlib.sha256(data).hexdigest() == asset['sha256']
          PY

      - name: Check out current public main
        uses: actions/checkout@v4
        with:
          ref: main
          path: public-main
          fetch-depth: 0

      - name: Commit workflow cleanup
        shell: bash
        run: |
          set -euo pipefail
          git -C public-main fetch origin main
          git -C public-main checkout -B main origin/main
          git -C public-main config user.name "github-actions[bot]"
          git -C public-main config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C public-main rm -f --ignore-unmatch "$WORKFLOW_PATH"
          if ! git -C public-main diff --cached --quiet; then
            git -C public-main commit -m "Publish Baqueiro release assets"
            git -C public-main pull --rebase origin main
            git -C public-main push origin HEAD:main
          fi

      - name: Remove transfer branches
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$STAGING_BRANCH" >/dev/null
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/agent/baqueiro-source-snapshot-20260815-v1" >/dev/null || true
