name: Publish both approved CEHM articles
on:
  push:
    branches: [agent/cehm-two-20261002-publish-20261002]
    paths: [.cehm-two-20261002-public-request.json]
permissions:
  contents: write
concurrency:
  group: publication-release-transfer
  cancel-in-progress: false
jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run build && npm test
      - name: Upload and verify final PDF and EPUB files
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .cehm-two-20261002-transfer.py
      - uses: actions/upload-artifact@v4
        with:
          name: cehm-two-20261002-public-verification
          path: cehm-two-20261002-public-verification.json

