name: Publish Roberts complete Japanese translation

on:
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened]
    paths:
      - ".github/roberts-publication-trigger-20260822"

permissions:
  contents: write

concurrency:
  group: publish-roberts-20260822
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: publications-current
      STAGING_BRANCH: agent/roberts-public-assets-20260822-v1
      READY_BRANCH: agent/roberts-publication-ready-20260822-v1
      SLUG: roberts-voyages-central-america-1827
      PDF_FILENAME: Orlando_W_Roberts_Narrative_of_Voyages_and_Excursions_1827_Japanese_Complete_Translation.pdf
      EPUB_FILENAME: Orlando_W_Roberts_Narrative_of_Voyages_and_Excursions_1827_Japanese_Complete_Translation.epub
      SOURCE_SITE_COMMIT: 086f9120de1f7c8843f0d69a777edf885c6681eb
      TRIGGER_FILE: .github/roberts-publication-trigger-20260822
      BASE_MAIN_COMMIT: ${{ github.event.pull_request.base.sha }}
      TRIGGER_HEAD_COMMIT: ${{ github.event.pull_request.head.sha }}
      ARCHIVE_COMMIT: 2b55b0fe16030de8de22e0fea97f37cf1db7bd4f
      PAYLOAD_SHA256: d24cb0736c3169132bdb973bcd5595bd3646cb42d6c6d8fab7b064f1d0f37192
      PAYLOAD_SIZE: "4400344"
      PAYLOAD_PARTS: "9"
      PDF_SHA256: 363824afb2299c2d372291169432a9cbc7aa9720620d76b1d06eaafcebb344cd
      PDF_SIZE: "3288258"
      EPUB_SHA256: 286cef15021e56210bfcb93b26488945d0f94457ba90a209488b9ebcf23bb491
      EPUB_SIZE: "1661986"
      COVER_SHA256: 0cd85b11e087ea6a802737116c5fae7c3c5d62e38925186af8709ae86c4e91dd
      COVER_SIZE: "94827"
      REVIEW_SHA256: 83c1fa4b029138103d279cb4595bb17f8f0c99eee144be054b6f8eb26a70c27e
      APPLY_SHA256: 7ee2172d2290dd6938eeef6bbc77d507b494fa7af917b1771e447ba50bee125c
    steps:
      - name: Check out the publication trigger commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Validate the trigger provenance
        shell: bash
        run: |
          set -euo pipefail
          if test "$(git rev-parse HEAD)" != "$TRIGGER_HEAD_COMMIT"; then
            echo "checked-out commit is not the recorded trigger head" >&2
            exit 1
          fi
          if test "$(git rev-parse HEAD^)" != "$BASE_MAIN_COMMIT"; then
            echo "publication trigger parent is not the recorded main commit" >&2
            exit 1
          fi
          if test "$(git diff --name-only HEAD^ HEAD)" != "$TRIGGER_FILE"; then
            echo "publication trigger commit contains an unexpected path" >&2
            exit 1
          fi

      - name: Check out the checksum-locked payload
        uses: actions/checkout@v4
        with:
          ref: ${{ env.STAGING_BRANCH }}
          path: staging
          sparse-checkout: release-staging/roberts-20260822
          sparse-checkout-cone-mode: false

      - name: Reconstruct and verify the publication payload
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          source = Path("staging/release-staging/roberts-20260822")
          parts = sorted(source.glob("chunk-*"))
          count = int(os.environ["PAYLOAD_PARTS"])
          expected = [f"chunk-{index:04d}" for index in range(count)]
          if [part.name for part in parts] != expected:
              raise SystemExit("payload part set is incomplete or unexpected")
          output = Path(os.environ["RUNNER_TEMP"]) / "roberts-public-release.tar.gz"
          digest = hashlib.sha256()
          size = 0
          with output.open("wb") as destination:
              for part in parts:
                  block = part.read_bytes()
                  destination.write(block)
                  digest.update(block)
                  size += len(block)
          if size != int(os.environ["PAYLOAD_SIZE"]):
              raise SystemExit(f"payload size {size} is not expected")
          if digest.hexdigest() != os.environ["PAYLOAD_SHA256"]:
              raise SystemExit("payload SHA-256 mismatch")
          print(f"payload OK: {size} bytes {digest.hexdigest()}")
          PY
          mkdir -p "$RUNNER_TEMP/publication-payload"
          tar -xzf "$RUNNER_TEMP/roberts-public-release.tar.gz" -C "$RUNNER_TEMP/publication-payload"

      - name: Validate the exact PDF, EPUB, cover, reports, and source applicator
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v pdfinfo >/dev/null || ! command -v pdftotext >/dev/null || ! command -v pdffonts >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y poppler-utils
          fi
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          import subprocess
          import zipfile
          from pathlib import Path
          from xml.etree import ElementTree as ET

          payload = Path(os.environ["RUNNER_TEMP"]) / "publication-payload/public_release_payload"
          report = json.loads((payload / "publication_report.json").read_text(encoding="utf-8"))
          expected_report = {
              "slug": os.environ["SLUG"],
              "source_site_commit": os.environ["SOURCE_SITE_COMMIT"],
              "archive_commit": os.environ["ARCHIVE_COMMIT"],
              "canonical_master": f'publications/{os.environ["SLUG"]}/master.docx',
          }
          for key, value in expected_report.items():
              if report.get(key) != value:
                  raise SystemExit(f"publication report mismatch: {key}")

          bibliography = json.loads((payload / "BIBLIOGRAPHY.json").read_text(encoding="utf-8"))
          publication = bibliography["publication"]
          if publication.get("slug") != os.environ["SLUG"]:
              raise SystemExit("bibliography slug mismatch")
          working = bibliography["working_master"]
          required_master = {
              "master_size": 1565508,
              "master_sha256": "c68d369586784a58a683b578fa0210c13ea58acfc007d4f563d51c7c9ab2034a",
              "source_location_markers": 289,
              "noncover_embedded_images": 3,
              "publicationStatus": "approved_for_publication",
          }
          for key, value in required_master.items():
              if working.get(key) != value:
                  raise SystemExit(f"working-master report mismatch: {key}")
          scope = bibliography["translation_scope"]
          if not scope.get("complete_translation") or not scope.get("paragraph_boundaries_collated"):
              raise SystemExit("complete-translation or paragraph-collation flag is missing")
          if scope.get("counted_paragraphs_including_original_notes") != 479:
              raise SystemExit("paragraph count report mismatch")

          review_path = payload / "independent_final_review.json"
          review_data = review_path.read_bytes()
          if hashlib.sha256(review_data).hexdigest() != os.environ["REVIEW_SHA256"]:
              raise SystemExit("independent review checksum mismatch")
          review = json.loads(review_data)
          review_expected = {
              "verdict": "GO",
              "approved_pdf_sha256": os.environ["PDF_SHA256"],
              "pdf_pages": 202,
              "source_markers": 289,
              "counted_paragraphs": 479,
              "main_prose_paragraphs": 439,
              "original_note_paragraphs": 40,
              "omissions": 0,
              "duplicates": 0,
              "standalone_stray_x": 0,
              "positive_first_line_indents": 0,
          }
          for key, value in review_expected.items():
              if review.get(key) != value:
                  raise SystemExit(f"independent review mismatch: {key}")
          if not all(review.get(key) for key in (
              "paragraph_stream_matches_docx",
              "paragraph_order_matches_docx",
              "marker_sequence_matches_canonical",
              "fonts_embedded",
              "unicode_maps_present",
          )):
              raise SystemExit("independent review completion flag is missing")

          applicator = payload / "apply_public_release.py"
          if hashlib.sha256(applicator.read_bytes()).hexdigest() != os.environ["APPLY_SHA256"]:
              raise SystemExit("source applicator checksum mismatch")

          expected_assets = {
              "pdf": (int(os.environ["PDF_SIZE"]), os.environ["PDF_SHA256"]),
              "epub": (int(os.environ["EPUB_SIZE"]), os.environ["EPUB_SHA256"]),
              "cover": (int(os.environ["COVER_SIZE"]), os.environ["COVER_SHA256"]),
          }
          asset_root = payload / "public" / report["slug"]
          paths = {}
          for kind, (size, digest) in expected_assets.items():
              filename = report[kind]["filename"]
              path = asset_root / filename
              data = path.read_bytes()
              if len(data) != size or hashlib.sha256(data).hexdigest() != digest:
                  raise SystemExit(f"{kind}: exact-byte validation failed")
              if report[kind]["size"] != size or report[kind]["sha256"] != digest:
                  raise SystemExit(f"{kind}: report validation failed")
              paths[kind] = path

          marker_pattern = r"〔原刊\s*p\.\s*(?:[ivxlcdm]+|\d+)(?:（白紙）)?〕"
          info = subprocess.check_output(["pdfinfo", str(paths["pdf"])], text=True)
          if not re.search(r"^Pages:\s+202$", info, flags=re.MULTILINE):
              raise SystemExit("PDF page count mismatch")
          if "612 x 792 pts (letter)" not in info:
              raise SystemExit("PDF page size mismatch")
          pdf_text = subprocess.check_output(["pdftotext", str(paths["pdf"]), "-"], text=True)
          markers = re.findall(marker_pattern, pdf_text, flags=re.IGNORECASE)
          if len(markers) != 289 or len(set(markers)) != 289:
              raise SystemExit(f"PDF source marker mismatch: {len(markers)}")
          blank_pages = []
          page_texts = {}
          for page_number in range(1, 203):
              page_text = subprocess.check_output(
                  [
                      "pdftotext",
                      "-f",
                      str(page_number),
                      "-l",
                      str(page_number),
                      str(paths["pdf"]),
                      "-",
                  ],
                  text=True,
              )
              page_texts[page_number] = page_text
              if not re.sub(r"\s+", "", page_text):
                  blank_pages.append(page_number)
          if blank_pages:
              raise SystemExit(f"blank translation PDF pages: {blank_pages}")
          page_194_compact = re.sub(r"\s+", "", page_texts[194])
          if "〔原刊p.294（白紙）〕" not in page_194_compact:
              raise SystemExit("original blank-page marker is not on translation PDF page 194")
          if "イングランドへ帰る船便を、たやすく得た" not in page_194_compact:
              raise SystemExit("translation PDF page 194 lacks its substantive p.293 text")
          compact_pdf = re.sub(r"\s+", "", pdf_text)
          required = [
              "中央アメリカ東岸および内陸部航海旅行記",
              "NarrativeofVoyagesandExcursions",
              "本訳について",
              "第14章",
              "注VIII266頁",
              "国王の公秤",
              "終わり",
          ]
          if any(value not in compact_pdf for value in required):
              raise SystemExit("PDF required wording is missing")
          first_page = subprocess.check_output(
              ["pdftotext", "-f", "1", "-l", "1", str(paths["pdf"]), "-"],
              text=True,
          )
          if "日本語全訳・校訂版" not in first_page:
              raise SystemExit("approved cover edition line is missing")
          if any(value in pdf_text for value in ["校正用", "確認用", "公開版ではない"]):
              raise SystemExit("PDF contains proof-only wording")
          if re.search(r"(?m)^\s*X\s*$", pdf_text):
              raise SystemExit("PDF contains a standalone stray X")
          if re.search(r"――|～", pdf_text):
              raise SystemExit("PDF contains forbidden punctuation")
          fonts = subprocess.check_output(["pdffonts", str(paths["pdf"])], text=True)
          font_rows = [line.split() for line in fonts.splitlines()[2:] if line.strip()]
          if not font_rows or any(len(row) < 6 or row[3] != "yes" or row[5] != "yes" for row in font_rows):
              raise SystemExit("PDF fonts are not all embedded with Unicode maps")
          if not all("Noto" in row[0] for row in font_rows):
              raise SystemExit("PDF contains a non-Noto embedded font")

          with zipfile.ZipFile(paths["epub"]) as archive:
              if archive.testzip() is not None:
                  raise SystemExit("corrupt EPUB")
              infos = archive.infolist()
              if not infos or infos[0].filename != "mimetype":
                  raise SystemExit("EPUB mimetype is not first")
              if infos[0].compress_type != zipfile.ZIP_STORED:
                  raise SystemExit("EPUB mimetype is compressed")
              if archive.read("mimetype") != b"application/epub+zip":
                  raise SystemExit("invalid EPUB mimetype")
              container = ET.fromstring(archive.read("META-INF/container.xml"))
              rootfile = next(node for node in container.iter() if node.tag.endswith("rootfile"))
              package = ET.fromstring(archive.read(rootfile.attrib["full-path"]))
              if not package.attrib.get("version", "").startswith("3"):
                  raise SystemExit("EPUB package is not version 3")
              item_nodes = [node for node in package.iter() if node.tag.endswith("item")]
              if not any("cover-image" in node.attrib.get("properties", "").split() for node in item_nodes):
                  raise SystemExit("EPUB cover-image property is missing")
              if not any("nav" in node.attrib.get("properties", "").split() for node in item_nodes):
                  raise SystemExit("EPUB navigation document is missing")
              texts = []
              source_classes = 0
              images = []
              for name in archive.namelist():
                  if not name.endswith((".xhtml", ".html")):
                      continue
                  document = ET.fromstring(archive.read(name))
                  texts.append(" ".join("".join(document.itertext()).split()))
                  for node in document.iter():
                      classes = node.attrib.get("class", "").split()
                      if "source-page" in classes and "page-marker" in classes:
                          source_classes += 1
                      if node.tag.endswith("img"):
                          images.append(node)
              full_text = "\n".join(texts)
              epub_markers = re.findall(marker_pattern, full_text, flags=re.IGNORECASE)
              if len(epub_markers) != 289 or source_classes != 289:
                  raise SystemExit("EPUB source-location marker mismatch")
              if len(images) != 3:
                  raise SystemExit(f"EPUB body image count mismatch: {len(images)}")
              if any(not image.attrib.get("alt", "").strip() for image in images):
                  raise SystemExit("EPUB image without alternative text")
              if len(re.findall(r"[\u3040-\u30ff\u3400-\u9fff]", full_text)) <= 140_000:
                  raise SystemExit("EPUB Japanese text volume is unexpectedly low")
              if any(value not in full_text for value in ["本訳について", "国王の公秤", "終わり"]):
                  raise SystemExit("EPUB required wording is missing")
              if any(value in full_text for value in ["校正用", "確認用", "公開版ではない"]):
                  raise SystemExit("EPUB contains proof-only wording")
              if re.search(r"――|～", full_text):
                  raise SystemExit("EPUB contains forbidden punctuation")
              css = "\n".join(
                  archive.read(name).decode("utf-8")
                  for name in archive.namelist()
                  if name.endswith(".css")
              )
              if "text-align: left" not in css or "text-align: justify" in css:
                  raise SystemExit("EPUB alignment policy mismatch")
              if "text-indent: 0" not in css:
                  raise SystemExit("EPUB paragraph indentation policy mismatch")
          print("PDF, EPUB, cover, reports, and source applicator are exact and valid")
          PY

      - name: Apply the source changes
        shell: bash
        run: |
          set -euo pipefail
          payload="$RUNNER_TEMP/publication-payload/public_release_payload"
          python3 "$payload/apply_public_release.py" "$GITHUB_WORKSPACE" "$payload"
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/search/verify-queries.mjs")
          text = path.read_text(encoding="utf-8")
          old = 'await verifyCounts("ポ", { books: 49, papers: 11 });'
          new = 'await verifyCounts("ポ", { books: 48, papers: 11 });'
          if text.count(old) != 1:
              raise SystemExit("unexpected short-literal search regression state")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
          mkdir -p "static/publications/$SLUG"
          mv "$payload/public/$SLUG/cover.jpg" "static/publications/$SLUG/cover.jpg"
          node scripts/verify-master-archive.mjs
          node --check src/publications.mjs
          node --check scripts/search/verify-queries.mjs
          python3 -m py_compile scripts/validate-epubs.py
          git diff --check

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install build dependencies
        run: npm ci

      - name: Build and test source before release mutation
        run: |
          npm run build
          npm test

      - name: Upload the checksum-locked release assets
        shell: bash
        run: |
          set -euo pipefail
          checksum_dir="$RUNNER_TEMP/release-checksums"
          asset_dir="$RUNNER_TEMP/publication-payload/public_release_payload/public/$SLUG"
          mkdir -p "$checksum_dir"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS.txt --dir "$checksum_dir"
          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path(os.environ["RUNNER_TEMP"]) / "release-checksums/SHA256SUMS.txt"
          additions = {
              os.environ["EPUB_FILENAME"]: os.environ["EPUB_SHA256"],
              os.environ["PDF_FILENAME"]: os.environ["PDF_SHA256"],
          }
          kept = []
          for line in path.read_text(encoding="utf-8").splitlines():
              fields = line.split()
              if fields and fields[-1] in additions:
                  continue
              kept.append(line)
          kept.extend(f"{digest}  {filename}" for filename, digest in sorted(additions.items()))
          path.write_text("\n".join(kept) + "\n", encoding="utf-8")
          PY
          gh release upload "$RELEASE_TAG" "$asset_dir/$PDF_FILENAME" "$asset_dir/$EPUB_FILENAME" "$checksum_dir/SHA256SUMS.txt" --repo "$GITHUB_REPOSITORY" --clobber

      - name: Download the public release assets back and verify
        shell: bash
        run: |
          set -euo pipefail
          verify_dir="$RUNNER_TEMP/release-verify"
          mkdir -p "$verify_dir"
          for filename in "$PDF_FILENAME" "$EPUB_FILENAME" SHA256SUMS.txt
          do
            gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$filename" --dir "$verify_dir"
          done
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "release-verify"
          expected = {
              os.environ["PDF_FILENAME"]: (int(os.environ["PDF_SIZE"]), os.environ["PDF_SHA256"]),
              os.environ["EPUB_FILENAME"]: (int(os.environ["EPUB_SIZE"]), os.environ["EPUB_SHA256"]),
          }
          checksums = set((root / "SHA256SUMS.txt").read_text(encoding="utf-8").splitlines())
          for filename, (size, digest) in expected.items():
              data = (root / filename).read_bytes()
              if len(data) != size or hashlib.sha256(data).hexdigest() != digest:
                  raise SystemExit(f"downloaded release asset mismatch: {filename}")
              if f"{digest}  {filename}" not in checksums:
                  raise SystemExit(f"SHA256SUMS entry mismatch: {filename}")
              print(f"release asset OK: {filename}")
          PY

      - name: Restore PDF and EPUB search inputs
        uses: actions/cache/restore@v4
        with:
          path: |
            .cache/fulltext-assets
            .cache/fulltext-ocr
          key: publish-roberts-fresh-assets-${{ hashFiles('assets-manifest.json') }}
          restore-keys: |
            fulltext-assets-

      - name: Ensure full-text extraction tools are available
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v pdftotext >/dev/null || ! command -v tesseract >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y poppler-utils tesseract-ocr
          fi

      - name: Fetch checksum-verified full-text inputs
        run: npm run fetch:search-assets

      - name: Build the exact final full-text search index
        run: npm run build:search

      - name: Verify full-text search and Roberts page mapping
        run: npm run verify:search

      - name: Commit the verified publication to a ready branch
        shell: bash
        run: |
          set -euo pipefail
          workflow=".github/workflows/publish-roberts-20260822.yml"
          rm "$workflow" "$TRIGGER_FILE"
          python3 - <<'PY'
          import subprocess

          expected = {
              ".github/workflows/publish-roberts-20260822.yml",
              ".github/roberts-publication-trigger-20260822",
              "REVISION_LOG.md",
              "assets-manifest.json",
              "master-archive.json",
              "static/publications/roberts-voyages-central-america-1827/cover.jpg",
              "scripts/search/verify-queries.mjs",
              "scripts/validate-epubs.py",
              "src/publications.mjs",
              "tests/archive.test.mjs",
          }
          actual = set(
              subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines()
          )
          untracked = subprocess.check_output(
              ["git", "ls-files", "--others", "--exclude-standard"],
              text=True,
          ).splitlines()
          actual.update(path for path in untracked if not path.startswith("staging/"))
          if actual != expected:
              raise SystemExit(
                  "unexpected source diff: "
                  + f"missing={sorted(expected - actual)} extra={sorted(actual - expected)}"
              )
          PY
          remote_main="$(git ls-remote origin refs/heads/main | cut -f1)"
          if test "$remote_main" != "$BASE_MAIN_COMMIT"; then
            echo "main advanced during publication gate: $remote_main != $BASE_MAIN_COMMIT" >&2
            exit 1
          fi
          if test "$(git rev-parse HEAD^)" != "$BASE_MAIN_COMMIT"; then
            echo "publication trigger parent is not the recorded main commit" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$READY_BRANCH"
          git add "$workflow" "$TRIGGER_FILE" REVISION_LOG.md assets-manifest.json master-archive.json "static/publications/$SLUG/cover.jpg" scripts/search/verify-queries.mjs scripts/validate-epubs.py src/publications.mjs tests/archive.test.mjs
          git commit -m "Publish Roberts complete Japanese translation" -m "Publish the approved 202-page PDF, verified EPUB, three-image catalogue entry, private-master ledger reference, paragraph-preservation audit, and literal full-text search regression."
          git push origin "HEAD:refs/heads/$READY_BRANCH"
