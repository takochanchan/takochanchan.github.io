name: Replace Fellechner cover assets
on:
  push:
    branches: [agent/fellechner-cover-20260925]
permissions:
  contents: write
concurrency:
  group: publication-release-assets
  cancel-in-progress: false
jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm test
      - name: Install PDF inspection dependency
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils
      - name: Upload and re-download approved assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .publication-transfer/revise-fellechner-cover.py
      - uses: actions/upload-artifact@v4
        with:
          name: fellechner-release-byte-verification
          path: fellechner-cover-verification.json
