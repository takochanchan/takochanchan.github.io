name: Publish Berendt papers 6-10
# Retry 3: archive ledger and catalogue-size assertions are aligned.

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/publish-berendt-batch-02-20260814-v2.yml"

permissions:
  contents: write

concurrency:
  group: publication-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      ASSET_BRANCH: agent/berendt-batch-02-public-assets-20260814-v2
      SITE_BRANCH: agent/berendt-batch-02-publication-20260814-v2
      STAGING_ROOT: .release-staging/berendt-papers-20260814-v2
      WORKFLOW_PATH: .github/workflows/publish-berendt-batch-02-20260814-v2.yml
      RELEASE_TAG: publications-current
      ARCHIVE_COMMIT: 29bc5e132056d6e62e2f9267edd3d5f7add2d230
    steps:
      - name: Check out checksum-pinned release bytes
        uses: actions/checkout@v4
        with:
          ref: agent/berendt-batch-02-public-assets-20260814-v2
          path: assets

      - name: Restore checksum-pinned release bundle
        shell: bash
        run: |
          set -euo pipefail
          cat "assets/$STAGING_ROOT"/bundle.tar.gz.part-* > /tmp/berendt-batch-02-public.tar.gz
          tar -xzf /tmp/berendt-batch-02-public.tar.gz -C "assets/$STAGING_ROOT"

      - name: Check out publication source
        uses: actions/checkout@v4
        with:
          ref: agent/berendt-batch-02-publication-20260814-v2
          path: site
          fetch-depth: 0

      - name: Ensure PDF text tools are available
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v pdfinfo >/dev/null 2>&1 || ! command -v pdftotext >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y poppler-utils
          fi

      - name: Validate approved PDF and EPUB bytes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release epub-root/publications
          python - <<'PY'
          import hashlib
          import json
          import pathlib
          import re
          import shutil
          import subprocess
          import zipfile
          from xml.etree import ElementTree as ET

          root = pathlib.Path("assets/.release-staging/berendt-papers-20260814-v2")
          payload = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          site = pathlib.Path("site")
          asset_manifest = json.loads((site / "assets-manifest.json").read_text(encoding="utf-8"))
          manifest_assets = {asset["path"]: asset for asset in asset_manifest["assets"]}
          archive = json.loads((site / "master-archive.json").read_text(encoding="utf-8"))
          banned = (
              "確認用校正刷",
              "日本語翻訳版には再利用ライセンス",
              "日本語版ライセンス",
          )
          expected_pages = {
              "berendt-baumwollenbau-yucatan-1863": 2,
              "berendt-analytical-alphabet-1869": 8,
              "berendt-escritos-garcia-icazbalceta-1870": 8,
              "berendt-trabajos-linguisticos-juan-pio-perez-1871": 5,
              "berendt-el-ramie-1871": 17,
          }
          assert len(payload) == 5
          assert archive["archive_commit"] == "29bc5e132056d6e62e2f9267edd3d5f7add2d230"
          for entry in payload:
              record = entry["record"]
              slug = record["slug"]
              assert slug in expected_pages
              fallback = archive["release_fallbacks"][slug]
              assert fallback["ledger_commit"] == archive["archive_commit"]
              assert fallback["status"] == "pending_lfs"
              assert fallback["release_tag"] == f"master-{slug}-20260814-v2"
              bundle = root / slug
              public_assets = [
                  asset for asset in entry["archive_assets"]
                  if pathlib.PurePosixPath(asset["filename"]).suffix in {".pdf", ".epub"}
              ]
              assert len(public_assets) == 2
              assert {pathlib.PurePosixPath(asset["filename"]).suffix for asset in public_assets} == {".pdf", ".epub"}
              for asset in public_assets:
                  filename = asset["filename"]
                  source = bundle / filename
                  data = source.read_bytes()
                  assert len(data) == asset["size"]
                  assert hashlib.sha256(data).hexdigest() == asset["sha256"]
                  relative = f"publications/{slug}/{filename}"
                  declared = manifest_assets[relative]
                  assert declared["size"] == asset["size"]
                  assert declared["sha256"] == asset["sha256"]
                  destination = pathlib.Path("release") / filename
                  assert not destination.exists(), filename
                  shutil.copyfile(source, destination)
                  if filename.endswith(".epub"):
                      mirror = pathlib.Path("epub-root/publications") / slug / filename
                      mirror.parent.mkdir(parents=True, exist_ok=True)
                      shutil.copyfile(source, mirror)

              pdf = next(bundle / asset["filename"] for asset in public_assets if asset["filename"].endswith(".pdf"))
              data = pdf.read_bytes()
              assert data.startswith(b"%PDF-") and b"%%EOF" in data[-2048:]
              info = subprocess.check_output(["pdfinfo", str(pdf)], text=True)
              pages = re.search(r"^Pages:\s+(\d+)$", info, re.MULTILINE)
              assert pages and int(pages.group(1)) == expected_pages[slug]
              text = subprocess.check_output(["pdftotext", str(pdf), "-"], text=True)
              assert record["title"] in text
              assert "原著・公開機関の利用条件" in text
              assert "日本語全訳\n" not in text
              for phrase in banned:
                  assert phrase not in text, (slug, phrase)

              epub = next(bundle / asset["filename"] for asset in public_assets if asset["filename"].endswith(".epub"))
              with zipfile.ZipFile(epub) as book:
                  assert book.testzip() is None
                  first = book.infolist()[0]
                  assert first.filename == "mimetype" and first.compress_type == 0
                  assert book.read("mimetype") == b"application/epub+zip"
                  roots = [ET.fromstring(book.read(name)) for name in book.namelist() if name.endswith((".xhtml", ".html"))]
                  book_text = " ".join(" ".join(root.itertext()) for root in roots)
                  titles = [" ".join("".join(element.itertext()).split()) for root in roots for element in root.iter() if element.attrib.get("data-custom-style") == "SectionHeading"]
                  markers = [" ".join("".join(element.itertext()).split()) for root in roots for element in root.iter() if element.attrib.get("data-custom-style") == "OriginalPage"]
                  images = [element for root in roots for element in root.iter() if element.tag.endswith("}img")]
                  assert titles[0] == record["title"]
                  assert titles.count(record["title"]) == 1
                  assert markers and all(re.fullmatch(r"〔原刊\s+p\.\s*[0-9]+〕", marker) for marker in markers)
                  assert not images
                  for phrase in banned:
                      assert phrase not in book_text, (slug, phrase)

              cover = site / "static" / "publications" / slug / "cover.jpg"
              cover_data = cover.read_bytes()
              assert cover_data.startswith(b"\xff\xd8") and cover_data.endswith(b"\xff\xd9")
              declared_cover = manifest_assets[f"publications/{slug}/cover.jpg"]
              assert len(cover_data) == declared_cover["size"]
              assert hashlib.sha256(cover_data).hexdigest() == declared_cover["sha256"]
          PY

      - name: Install and validate catalogue source
        working-directory: site
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
          npm test
          python3 scripts/validate-epubs.py ../epub-root \
            --slug berendt-baumwollenbau-yucatan-1863 \
            --slug berendt-analytical-alphabet-1869 \
            --slug berendt-escritos-garcia-icazbalceta-1870 \
            --slug berendt-trabajos-linguisticos-juan-pio-perez-1871 \
            --slug berendt-el-ramie-1871
          node --input-type=module - <<'NODE'
          import assert from "node:assert/strict";
          import { publications } from "./src/publications.mjs";
          const expected = new Map([
            ["berendt-baumwollenbau-yucatan-1863", 2],
            ["berendt-analytical-alphabet-1869", 8],
            ["berendt-escritos-garcia-icazbalceta-1870", 8],
            ["berendt-trabajos-linguisticos-juan-pio-perez-1871", 5],
            ["berendt-el-ramie-1871", 17],
          ]);
          for (const [slug, pageCount] of expected) {
            const item = publications.find((entry) => entry.slug === slug);
            assert.ok(item, slug);
            assert.equal(item.authorKey, "carl-hermann-berendt", slug);
            assert.equal(item.recordClass, "short-work", slug);
            assert.equal(item.pageCount, pageCount, slug);
            assert.equal(item.publishedDate, "2026-08-14", slug);
            assert.doesNotMatch(item.rights, /日本語翻訳版には再利用ライセンス|日本語版ライセンス/);
          }
          NODE

      - name: Verify new full-text extraction and physical PDF mapping
        working-directory: site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache
          python - <<'PY'
          import hashlib
          import json
          import pathlib

          project = pathlib.Path.cwd()
          release = (project.parent / "release").resolve()
          payload = json.load(open(project.parent / "assets/.release-staging/berendt-papers-20260814-v2/manifest.json"))
          records = {entry["record"]["slug"]: entry for entry in payload}
          catalogue = json.loads(__import__("subprocess").check_output([
              "node", "--input-type=module", "-e",
              "import {publications} from './src/publications.mjs';process.stdout.write(JSON.stringify(publications));"
          ], text=True))
          by_slug = {item["slug"]: item for item in catalogue}
          works = []
          for slug, entry in records.items():
              item = by_slug[slug]
              assets = entry["archive_assets"]
              epub = next(asset for asset in assets if asset["filename"].endswith(".epub"))
              pdf = next(asset for asset in assets if asset["filename"].endswith(".pdf"))
              works.append({
                  "slug": slug,
                  "title": item["title"],
                  "author": item["author"],
                  "recordClass": item["recordClass"],
                  "url": f"/publications/{slug}/",
                  "pdfUrl": item["pdfUrl"],
                  "masterPath": f"publications/{slug}/master.docx",
                  "source": str(release / epub["filename"]),
                  "format": "epub",
                  "sourceMode": "approved-epub-mirror",
                  "sourceSha256": epub["sha256"],
                  "pdf": str(release / pdf["filename"]),
                  "pdfSha256": pdf["sha256"],
              })
          asset_bytes = (project / "assets-manifest.json").read_bytes()
          manifest = {
              "schemaVersion": 1,
              "archiveCommit": "29bc5e132056d6e62e2f9267edd3d5f7add2d230",
              "assetManifestSha256": hashlib.sha256(asset_bytes).hexdigest(),
              "works": works,
          }
          pathlib.Path(".cache/berendt-batch-02-search-manifest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )
          PY
          python3 scripts/search/extract-corpus.py \
            --manifest .cache/berendt-batch-02-search-manifest.json \
            --output .cache/berendt-batch-02-search-corpus.json
          python - <<'PY'
          import json

          expected_pages = {
              "berendt-baumwollenbau-yucatan-1863": 2,
              "berendt-analytical-alphabet-1869": 8,
              "berendt-escritos-garcia-icazbalceta-1870": 8,
              "berendt-trabajos-linguisticos-juan-pio-perez-1871": 5,
              "berendt-el-ramie-1871": 17,
          }
          corpus = json.load(open(".cache/berendt-batch-02-search-corpus.json"))
          assert len(corpus["works"]) == 5
          for work in corpus["works"]:
              slug = work["slug"]
              assert work["pdfPageCount"] == expected_pages[slug]
              assert len(work["chunks"]) >= 2
              assert sum(len(chunk["text"]) for chunk in work["chunks"]) >= 400
              assert work["mappingSummary"]["unmapped"] == 0
              assert work["mappingSummary"]["verifiedRate"] == 1.0
              assert work["mappingSummary"]["pdfTextMode"] == "embedded"
          PY

      - name: Upload PDF and EPUB and refresh release checksums
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-metadata updated-release-metadata
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern SHA256SUMS.txt \
            --dir release-metadata
          gh release upload "$RELEASE_TAG" release/*.epub release/*.pdf \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
          python - <<'PY'
          import json
          import pathlib

          payload = json.load(open("assets/.release-staging/berendt-papers-20260814-v2/manifest.json"))
          expected = {}
          for entry in payload:
              for asset in entry["archive_assets"]:
                  if asset["filename"].endswith((".pdf", ".epub")):
                      expected[asset["filename"]] = asset["sha256"]
          assert len(expected) == 10
          path = pathlib.Path("release-metadata/SHA256SUMS.txt")
          previous = {}
          for line in path.read_text(encoding="utf-8").splitlines():
              digest, filename = line.split("  ", 1)
              assert filename not in previous
              previous[filename] = digest
          previous.update(expected)
          target = pathlib.Path("updated-release-metadata/SHA256SUMS.txt")
          target.write_text(
              "\n".join(f"{digest}  {filename}" for filename, digest in sorted(previous.items())) + "\n",
              encoding="utf-8",
          )
          PY
          gh release upload "$RELEASE_TAG" updated-release-metadata/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Re-download and verify public release bytes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verify-release
          python - <<'PY' > /tmp/public-assets.txt
          import json
          for entry in json.load(open("assets/.release-staging/berendt-papers-20260814-v2/manifest.json")):
              for asset in entry["archive_assets"]:
                  if asset["filename"].endswith((".pdf", ".epub")):
                      print(asset["filename"])
          PY
          while IFS= read -r filename; do
            gh release download "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern "$filename" \
              --dir verify-release
          done < /tmp/public-assets.txt
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern SHA256SUMS.txt \
            --dir verify-release
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > verify-release/release.json
          python - <<'PY'
          import json
          import pathlib

          payload = json.load(open("assets/.release-staging/berendt-papers-20260814-v2/manifest.json"))
          expected = {}
          for entry in payload:
              for asset in entry["archive_assets"]:
                  if asset["filename"].endswith((".pdf", ".epub")):
                      expected[asset["filename"]] = asset
          sums = pathlib.Path("verify-release/SHA256SUMS.txt").read_text(encoding="utf-8").splitlines()
          release_info = json.load(open("verify-release/release.json"))
          remote = {asset["name"]: asset for asset in release_info["assets"]}
          for filename, asset in expected.items():
              original = pathlib.Path("release") / filename
              downloaded = pathlib.Path("verify-release") / filename
              assert original.read_bytes() == downloaded.read_bytes(), filename
              assert f"{asset['sha256']}  {filename}" in sums
              assert remote[filename]["size"] == asset["size"]
              assert remote[filename]["digest"] == f"sha256:{asset['sha256']}"
          PY

      - name: Publish the verified catalogue source
        id: publish-source
        working-directory: site
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          git rebase origin/main
          git push origin HEAD:main
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Remove staging branches and one-shot workflow
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$ASSET_BRANCH"
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$SITE_BRANCH"
          workflow_sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/$WORKFLOW_PATH?ref=main" --jq .sha)"
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/contents/$WORKFLOW_PATH" \
            -f message="Remove completed Berendt batch 02 publication workflow" \
            -f sha="$workflow_sha" \
            -f branch=main
