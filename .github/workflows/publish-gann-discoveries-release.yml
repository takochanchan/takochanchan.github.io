name: Publish Gann Discoveries release assets

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-gann-discoveries-release.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Reassemble release assets
        env:
          GH_TOKEN: ${{ github.token }}
          PDF_CHUNKS: "8fd319a66a6d8b815caaf799a2bd7bdcf2c24f0e 87f02869c3e20b51f21e5d4bb5f214749e27260a ef95e0717cda73cf98b5d30510d53490a56d6104 e643ce09f677b15c65bda5142b224bc530004040 d308f8ec3841e32894c22b0828eef77ba6ab4e9b 2886e44f456430085080c73abd0c72386bbff4f1 27ddc01ef34946a8550e769c283577f305111bea c086b5e8422dee161636e3c9accb55cfe0210523 b28f8aabffacfa7d307d18efab801969ba929e7f 35845191864e8987321d0f8f743207df78a4080a b0bc75dbe000a49ca612b656ca1d587acf2b9a4b d2875cc42869e5d4b629bc3e66e025770df531b2 2a308153d211a4b0c8b547ea1d99fbbe534dc200 c08299adbcf1213986ee67416c443fe64f94e9d0 45b94497f39aa150812af7fa4f8f61316bb452bf af8f279c052a4014da1f49e6b92f1be9b7915cd3 8dc52350478b0ff587b750eb4561b0751379e1aa 8b1cb306d02b65b479ab3e5a07b6dcce330e3a23 005a7a1d688f68be05a3bfd149a76af3e0efa0bd dcb1cb3c1403733a3c899a8ed998b54b716c9649 7f3c7fa488c3c3bbeaa23f780ce46618c5240332 954444a8171f1af338382766e5ce25caab9f04b4 0e87a7186d223e46df561e0fe2df60b0b7b46b17 7472e815436e412496a837b2b5d1c9a9e27ec8af 6ad61e0882b5d72bab962f02afa9e8814e25a2e3 7a3402c114292ecf2e66326ec1edc1eabffbe8ab 9cbeffc55f1a89cbc09f989f259a5fed4c9f3ae1 cb63965caaba1cb22a1b796df165044430796044 72e6b833d7abae335618523f16ee6531b66a5f58"
          EPUB_CHUNKS: "5d7c71368c3768e6c9cacf486dd427229e97edae 1d81210ffe8c4743ffcbce76d176f7aad6a3a712 82af352527af6189c86db0a263072aa93013b6b8 1b428b8d10424c3c8c71a1094af425a00d04ec83 0762e9a3d020f54169e2a0cec8fcb24a0bf00729 59c610cf949108b2226d216b49c8c7fe9c43c45a 3b72eb3afd68ac9706c50bfd489aa220a7d0e2d6 81e51d3bc8098100d4f7504c2c0796ae3d2462f1 8c6a586cf7c99cebb81fd43377b1b72e0d7aa697 f8c33fd8004c02c56e8def2c14a432e3077cc3a5 c268434a70c1c693faf26f42e18b03e0dc9cb583 8836c92eca00dce7ae0b6d81f3f684a0f9ee4cff 9306e2765003e62971c9c94d032a820a4203b764 a3e016a5dd9529c6a0e859aa3814a5d360cccd11 d30556b5f46dc90aab5a9703f275a82f4e86d987 2a51e2f25d725ccca49b5dd18228a3b6ac64fb2a bae677b45ac75ec3296956dbe7aab656137d3387 c6e8a829d4289738dbc98a9f88cae6c6d23322d0 8dedf2efe9e9a96960977e1647d8e19736acd16c c12b1b061ac25034da61e1933e31888d5a231931 bd0c10e4dc6722ec2d508e85671f33ec289bef06 d7935c303f757525727169a4a92fe46c6c96c815 f8545c2118da41a25098e110d2bb28a659e73dba f75661df7736b0ca27a27c79ca9dd0efa3454fa2 e80f02802e100b997ac76a608f54c2b3603fa9f5 6b02ab08de9687acfcb6178e8b87434e1c384ee5"
          SUMS_CHUNKS: "5c01398a3975e84d52f989699b4f539e92697705"
        run: |
          set -euo pipefail
          pdf=Gann_Discoveries_and_Adventures_in_Central_America_1928_Japanese_Complete_Translation.pdf
          epub=Gann_Discoveries_and_Adventures_in_Central_America_1928_Japanese_Complete_Translation.epub
          sums=SHA256SUMS.txt
          : > "$pdf"
          : > "$epub"
          : > "$sums"
          for chunk in $PDF_CHUNKS; do
            gh api "repos/$GITHUB_REPOSITORY/git/blobs/$chunk" --jq .content | tr -d '\n' | base64 --decode >> "$pdf"
          done
          for chunk in $EPUB_CHUNKS; do
            gh api "repos/$GITHUB_REPOSITORY/git/blobs/$chunk" --jq .content | tr -d '\n' | base64 --decode >> "$epub"
          done
          for chunk in $SUMS_CHUNKS; do
            gh api "repos/$GITHUB_REPOSITORY/git/blobs/$chunk" --jq .content | tr -d '\n' | base64 --decode >> "$sums"
          done
          echo "171b94b46f1529e9cd70f4fda7a1c501d5b74c1a1216ee0352f8ed3b01eb6b59  $pdf" | sha256sum -c -
          echo "7663c5ded8923ad351d17c12d241fd08091eb2a40b312acc1ccbd94e62a38a79  $epub" | sha256sum -c -
          echo "4bad704cfb62b319f59029cbea86d452b19f3f08ad0eff86712455569461f4d8  $sums" | sha256sum -c -
          test "$(stat -c %s "$pdf")" = 14963453
          test "$(stat -c %s "$epub")" = 13544296
          test "$(stat -c %s "$sums")" = 13485

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload publications-current \
            Gann_Discoveries_and_Adventures_in_Central_America_1928_Japanese_Complete_Translation.pdf \
            Gann_Discoveries_and_Adventures_in_Central_America_1928_Japanese_Complete_Translation.epub \
            SHA256SUMS.txt \
            --clobber \
            --repo "$GITHUB_REPOSITORY"

      - name: Remove one-time workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          path=.github/workflows/publish-gann-discoveries-release.yml
          sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/$path?ref=main" --jq .sha 2>/dev/null || true)"
          if test -z "$sha"; then
            exit 0
          fi
          gh api \
            --method DELETE \
            "repos/$GITHUB_REPOSITORY/contents/$path" \
            -f message="Remove one-time Gann Discoveries release workflow" \
            -f sha="$sha" \
            -f branch=main
