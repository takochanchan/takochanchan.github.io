name: Verify live Isagoge publication
on:
  push:
    branches: [main]
    paths: [src/isagoge-publication.mjs, .github/workflows/isagoge-verify-live.yml]
permissions:
  contents: write
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Wait for this catalogue deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,os,subprocess,time
          for attempt in range(90):
              result=json.loads(subprocess.check_output(['gh','api','repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs?head_sha='+os.environ['GITHUB_SHA']]))
              runs=[r for r in result['workflow_runs'] if r['name']=='Deploy archive to GitHub Pages']
              if runs and runs[0]['status']=='completed':
                  assert runs[0]['conclusion']=='success',runs[0]['conclusion']
                  print('Pages succeeded',runs[0]['id'])
                  break
              time.sleep(10)
          else: raise SystemExit('Pages deployment timed out')
          PY
      - name: Ensure PDF inspection commands are available
        run: |
          if ! command -v pdfinfo || ! command -v pdftotext; then
            sudo apt-get update
            sudo apt-get install -y poppler-utils
          fi
      - name: Verify live bibliography, full overview, exact assets, and page map
        run: python3 .isagoge-verify-live.py
      - name: Remove this publication's temporary workflows and branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin main
          git checkout -b isagoge-cleanup origin/main
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm --ignore-unmatch .isagoge-public-request.json .isagoge-transfer.py .isagoge-verify-live.py .github/workflows/transfer-isagoge.yml .github/workflows/isagoge-verify-remote.yml .github/workflows/isagoge-verify-live.yml
          if ! git diff --cached --quiet; then
            git commit -m "Remove verified Isagoge one-shot publication helpers"
            git push origin HEAD:main
          fi
          for branch in agent/isagoge-assets-20261016 agent/isagoge-publish-20261016; do
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch"
          done
