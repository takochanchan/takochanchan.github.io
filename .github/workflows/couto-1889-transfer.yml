name: Transfer checksum-pinned Couto México 1889 assets
on:
  push:
    branches: ["agent/couto-1889-transfer"]
    paths: [".publication-upload-requests/couto-dialogo-pintura-mexico-1889.json"]
permissions:
  contents: write
concurrency:
  group: publication-release-transfer
  cancel-in-progress: false
jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install build dependencies
        run: npm ci --no-audit --no-fund
      - name: Build and test the publication catalogue
        run: npm run build && npm test
      - name: Reconstruct, upload, and verify publication PDF and EPUB
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .publication-transfer/transfer-couto-1889.py
      - uses: actions/upload-artifact@v4
        with:
          name: couto-1889-release-verification
          path: couto-1889-release-verification.json
