name: Replace Galindo Peten locality editions once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/replace-galindo-peten-locality-20260801.yml

permissions:
  contents: write

concurrency:
  group: publications-current-release
  cancel-in-progress: false

jobs:
  replace:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ASSETS: |
          asset|Galindo_Antiquities_Peten_1834_Japanese_Complete_Translation.pdf|1106392|f8fcb3523b22f5e4120008de0d6d486a6b52a6e908face5bd285893d6ccda489|2691c2f8c9e6338246017b472f1dd1b435ab9542 18f3a6d1f19ab7cb97482dac79506c856c3eb89c 0172509bde4e12e8ec871c61a4830b21934387c9
          asset|Galindo_Antiquities_Peten_1834_Japanese_Complete_Translation.epub|4822726|3ff446e8f840f904bbc8a9bcb82b33728a40c540870338b920cad00c18f7747f|b95e9204e681da46311c223a828936fb5ea2aa8f cb51085db5c2743461073a0589c969bd1978e350 2f8143cd89a7fb4bb125f5dcf899710daf727971 0f268ef75df85c5f7dd0cbd686bcb3dd5ce10f43 593e01e98636f3abdc04a302227398f543d69668 dfec90f20df02d5ede872b70bf8eceaaff1a7103 beae2ebb427ed5306aca15cd798b7a8a6a1a78ff 8605813fd0cdab2093f1ee0163db9f3a5cb38937 df6604721d419f458f5568720c2d467e5653034a a8206c8c20fff24fa545cf77a69953dc7120d17d f6b619b3a26b6f8bcec43c049cf2f47845a1aa48

    steps:
      - name: Reassemble and verify corrected assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/assets
          while IFS='|' read -r _ name size digest blobs; do
            test -n "$name" || continue
            target="/tmp/assets/$name"
            : > "$target"
            for blob in $blobs; do
              gh api "repos/$GITHUB_REPOSITORY/git/blobs/$blob" --jq .content |
                tr -d '\n' | base64 --decode >> "$target"
            done
            echo "$digest  $target" | sha256sum -c -
            test "$(stat -c %s "$target")" = "$size"
          done <<< "$ASSETS"
          pdftotext -layout /tmp/assets/Galindo_Antiquities_Peten_1834_Japanese_Complete_Translation.pdf /tmp/peten.txt
          grep -F "ペテン地方" /tmp/peten.txt
          grep -F "ヤショー湖" /tmp/peten.txt
          ! grep -F "管区" /tmp/peten.txt
          test "$(pdfinfo /tmp/assets/Galindo_Antiquities_Peten_1834_Japanese_Complete_Translation.pdf | awk '/^Pages:/ {print $2}')" = 5
          python3 - <<'PY'
          import zipfile
          p="/tmp/assets/Galindo_Antiquities_Peten_1834_Japanese_Complete_Translation.epub"
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              text="".join(z.read(n).decode("utf-8") for n in z.namelist() if n.endswith((".xhtml",".html",".opf",".ncx")))
          assert "ペテン地方" in text
          assert "ヤショー湖" in text
          assert "管区" not in text
          PY

      - name: Replace release assets and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/current /tmp/verified
          gh release download publications-current --pattern SHA256SUMS.txt --dir /tmp/current --repo "$GITHUB_REPOSITORY"
          python3 - <<'PY'
          import os
          from pathlib import Path
          path=Path("/tmp/current/SHA256SUMS.txt")
          entries={}
          order=[]
          for line in path.read_text(encoding="utf-8").splitlines():
              digest, sep, name=line.partition("  ")
              assert sep and len(digest)==64 and name
              entries[name]=digest
              order.append(name)
          for line in os.environ["ASSETS"].splitlines():
              if not line.strip():
                  continue
              _, name, _, digest, _=line.split("|",4)
              assert name in entries, name
              entries[name]=digest
          Path("/tmp/SHA256SUMS.txt").write_text(
              "".join(f"{entries[name]}  {name}\n" for name in order),
              encoding="utf-8",
          )
          PY
          files=()
          while IFS='|' read -r _ name _size _digest _blobs; do
            test -n "$name" || continue
            files+=("/tmp/assets/$name")
          done <<< "$ASSETS"
          gh release upload publications-current "${files[@]}" /tmp/SHA256SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"
          while IFS='|' read -r _ name size digest _blobs; do
            test -n "$name" || continue
            gh release download publications-current --pattern "$name" --dir /tmp/verified --repo "$GITHUB_REPOSITORY"
            echo "$digest  /tmp/verified/$name" | sha256sum -c -
            test "$(stat -c %s "/tmp/verified/$name")" = "$size"
          done <<< "$ASSETS"

      - name: Remove one-time workflow
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          path=.github/workflows/replace-galindo-peten-locality-20260801.yml
          sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/$path?ref=main" --jq .sha)"
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/contents/$path" -f message="Remove completed Galindo Peten correction workflow" -f sha="$sha" -f branch=main

