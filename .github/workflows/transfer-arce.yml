name: Transfer approved Arce 1762 PDF and EPUB
on:
  push:
    branches: [agent/arce-release-transfer-20261101]
    paths: [.arce-public-request.json]
permissions:
  contents: write
concurrency:
  group: publication-release-transfer
  cancel-in-progress: false
jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify approved bytes and prepare release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/.arce-prepare.py
      - run: npm ci --no-audit --no-fund
      - run: npm run build && npm test
      - name: Upload and verify final PDF and EPUB files
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/.arce-transfer.py
      - uses: actions/upload-artifact@v4
        with:
          name: arce-public-verification
          path: arce-public-verification.json
