name: Publish Figueroa Album release assets

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-figueroa-album-assets-20260809.yml

permissions:
  contents: write

concurrency:
  group: publications-current-release
  cancel-in-progress: false

