name: Publish Sapper Alta Verapaz release assets

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-sapper-alta-verapaz-release.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Reassemble release assets
        env:
          GH_TOKEN: ${{ github.token }}
          EPUB_CHUNKS: "d3de6d2d1b2de9c6ab721000badf85d4a69b7a14 2c270cccd3bb98b4867df06f690d85946d234c04 348bcf32b26501bd6c0f1e2e0677d2633079db91 3dce610db19d1b1196e29324450e76dceebfed68 d4518679564472432eebe0814e482269cb437658 c305e880051320144d2691b1a0c04b309d824ee0 f725aa1bfda1bde06f024649d856e831b5374195 93f784997d23db0ad53cc0f0ca3377780753cc86 011cc6317c7cd6f00a96ad66ff6770a7afb084f8 2f9931b75afff2e9f0c3f94c8d43f592873f5f13 55d89d5a47ddb6c6315d8f956e5564f06617a365 e59459a3b6b72f6d5104d4b258ca67a865a31df1 ea33a9d44f1c583e6d166a4cbe05eab3ccd06c54 6ea787c81eb65fffde4599c3cf3ac68b5ad3a59e 0434dacf42e1ec784b4078a474732ed939ebf304 304f021936e7923e86e378adaee5e54b6fadca28 743e97a61592aeaeedf76a45728c76cfc2f8cd30 68f3d781c82d62ef6eb90407c3610f05efd64b5c 43ef049c8c12bf77c2713d23247d3a873efc784b bfddbf012fca42e716ddef287f414de4d6f59d18 31a54193819610556b4aaccbd8fa0fb87dfdc9a8 d088900a29fba6cdc8251e28e80729db8693860e 92807a70826fe3040fd64e2c271e3664b472b1a6 7a4af8b49983b77f909308513f9a77a82d3a918d 60b6f535f50bec803f5cba94472176d08098f744 1d0c07eab97fe200c5560e8bf73c75c41eaf8951 5f46930b40aeea324e61780353fbbfa2a0c9a425 d188cdfa85270c1a952441e07d2afd5f3daacc27 4af9d584a57dfe62e174a1783fe80a8d0b5b1d7f f9ab4e4a4f6c201ad4fdd77a40aa7a1b39a30940 c0e5e81d34e46a2cac0152ced5f66fb718e6d83a"
          PDF_CHUNKS: "f5bfc74ea43fd1f92b398fcf6e9391bc8ae32922 54c003ea3644a4e777104d6c38de2c80640b5732 fb6fc31bc64b75b5f60592f6b65823ee5ab912a5 ffbe231df1ae683245aac1b2d55e5027f52e4c2a 3d41d20f0bd9cd062a4e1f1407ff8bb11c9b14fe 5f627539277d84b5c26879aa57877c64b1ca4d01 91031b2fd385e61469736ee667e6f5e7637e80d1 682de47e46dd1b5c669a4292fe77a99261a7f270 c483cadc4edc9914232acd5cf21f8a15ba2bf384 a28f35b5fff9a6794dfee32e01b9e7959599b197 0b1cfdc69fd0c3a826dcce9c53abc3ee76be031a e743b1a919a7f293ea0590450bcf0bf3c76be06a 50d272fa15210a5220739ad4112dab031d568e2f fd266208833fdbc5d950cfc65401e1e8bb38b8fc"
          SUMS_CHUNKS: "bc552244d9df4b316394a64728730bef4e6a19b3"
        run: |
          set -euo pipefail
          pdf=Karl_Sapper_Die_Alta_Verapaz_Guatemala_1901_Japanese_Complete_Translation.pdf
          epub=Karl_Sapper_Die_Alta_Verapaz_Guatemala_1901_Japanese_Complete_Translation.epub
          sums=SHA256SUMS.txt
          : > "$pdf"
          : > "$epub"
          : > "$sums"
          for chunk in $PDF_CHUNKS; do
            gh api "repos/$GITHUB_REPOSITORY/git/blobs/$chunk" --jq .content | tr -d '\n' | base64 --decode >> "$pdf"
          done
          for chunk in $EPUB_CHUNKS; do
            gh api "repos/$GITHUB_REPOSITORY/git/blobs/$chunk" --jq .content | tr -d '\n' | base64 --decode >> "$epub"
          done
          for chunk in $SUMS_CHUNKS; do
            gh api "repos/$GITHUB_REPOSITORY/git/blobs/$chunk" --jq .content | tr -d '\n' | base64 --decode >> "$sums"
          done
          echo "ea4cf98f7dfffb66b9fefbd206281c5e5d6eb996f4fb267e3977ae92981d8ea8  $pdf" | sha256sum -c -
          echo "7de5369e296b8c553c5eaf028bb6eea79a7f413122694e7ec0ef71ab1661ce8f  $epub" | sha256sum -c -
          echo "1026d7f57f4465d61ed3f73f1ca90a9196b67948989ddfef8963e92e11879ec8  $sums" | sha256sum -c -
          test "$(stat -c %s "$pdf")" = 6752873
          test "$(stat -c %s "$epub")" = 15443787
          test "$(stat -c %s "$sums")" = 17595

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload publications-current \
            Karl_Sapper_Die_Alta_Verapaz_Guatemala_1901_Japanese_Complete_Translation.pdf \
            Karl_Sapper_Die_Alta_Verapaz_Guatemala_1901_Japanese_Complete_Translation.epub \
            SHA256SUMS.txt \
            --clobber \
            --repo "$GITHUB_REPOSITORY"

      - name: Remove release staging branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api \
            --method DELETE \
            "repos/$GITHUB_REPOSITORY/git/refs/heads/agent/release-assets-sapper-alta-verapaz-1901-bcfbcc52"
          gh api \
            --method DELETE \
            "repos/$GITHUB_REPOSITORY/git/refs/heads/agent/actions-probe-result-sapper-alta-bcfbcc52" \
            >/dev/null 2>&1 || true

      - name: Remove one-time workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          path=.github/workflows/publish-sapper-alta-verapaz-release.yml
          sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/$path?ref=main" --jq .sha 2>/dev/null || true)"
          if test -z "$sha"; then
            exit 0
          fi
          gh api \
            --method DELETE \
            "repos/$GITHUB_REPOSITORY/contents/$path" \
            -f message="Remove one-time Sapper Alta Verapaz release workflow" \
            -f sha="$sha" \
            -f branch=main
