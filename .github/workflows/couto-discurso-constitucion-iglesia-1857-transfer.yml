name: Transfer checksum-pinned Couto 1857 assets

on:
  push:
    branches: ["agent/couto-discurso-constitucion-iglesia-1857-transfer-20261107"]
    paths: [".publication-upload-requests/couto-discurso-constitucion-iglesia-1857.json"]
permissions:
  contents: write
concurrency:
  group: publication-release-transfer
  cancel-in-progress: false
jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install build dependencies
        run: npm ci --no-audit --no-fund
      - name: Build and test the publication catalogue
        run: npm run build && npm test
      - name: Reconstruct, upload, and verify publication bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .publication-transfer/transfer-couto-discurso-constitucion-iglesia-1857.py
      - uses: actions/upload-artifact@v4
        with:
          name: couto-release-byte-verification
          path: couto-release-verification.json
