name: Publish Guatemala-Mexico boundary report assets

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-boundary-reports-release.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reassemble release assets
        env:
          GH_TOKEN: ${{ github.token }}
          FRIAS_PDF_CHUNKS: "ee60105f9ab15529c6b5a1000dfef332423ee117 9b590a41809f956b914bedaedc4d3a913f24fefc 47d4d1115ff96a033b92b26cd9caa88cda7545c2"
          FRIAS_EPUB_CHUNKS: "42ea3ac585875b85f7d4a7cbeac0cb47415b3dd3 7ad644d42729d2f1488b07a08f6284199edc92c3"
          PASTRANA_PDF_CHUNKS: "a5b22080579496d1328c4ac974df89619635cc6c b6844f451a8858a22a5d53e82a5a4cd53ed5406e caeceac9d7545d8b5a4c850870983f54ec379538 fa7df89c68bc0c5d0dc2e6d6a3825be0b4e86109"
          PASTRANA_EPUB_CHUNKS: "98c65a444989cf1dd36be0d42bc04f2bbd920d6b"
          URRUTIA_PDF_CHUNKS: "5182d4c269d0de3030b56bb20c9b475408a00f64 76579b770024c33a1ff7d04c0679c4d2ba1ee467 ce32c31d2cf69e3a81f70361ec8193ff8c9b2997 e9194f6cd461914d5dbd96e3fb1433dcbdbd7ccc ef70c5ab00495b78fa4ff9eb849d06de6c59564d 5c389f7cba5c952c48af0c4e82dfd4634eadf35f c2124277731e05575856622f2b1e675761d417a3 69ef527a55122607f57a3defd462aaf8a57b4ab7 8f49b6f55bc1522bdb9ae93e33e7c754e9f1b4e1"
          URRUTIA_EPUB_CHUNKS: "fa4ad62a7aa4304653f51066f6971a39eda35f1a"
        run: |
          set -euo pipefail
          frias_pdf=Frias_Cuestion_Limites_Mexico_Guatemala_1883_Japanese_Complete_Translation.pdf
          frias_epub=Frias_Cuestion_Limites_Mexico_Guatemala_1883_Japanese_Complete_Translation.epub
          pastrana_pdf=Pastrana_Informe_Comision_Mexicana_Limites_Guatemala_1897_Japanese_Complete_Translation.pdf
          pastrana_epub=Pastrana_Informe_Comision_Mexicana_Limites_Guatemala_1897_Japanese_Complete_Translation.epub
          urrutia_pdf=Urrutia_Memoria_Limites_Guatemala_Mexico_1900_Japanese_Complete_Translation.pdf
          urrutia_epub=Urrutia_Memoria_Limites_Guatemala_Mexico_1900_Japanese_Complete_Translation.epub

          : > "$frias_pdf"
          : > "$frias_epub"
          : > "$pastrana_pdf"
          : > "$pastrana_epub"
          : > "$urrutia_pdf"
          : > "$urrutia_epub"

          for chunk in $FRIAS_PDF_CHUNKS; do
            gh api "repos/$GITHUB_REPOSITORY/git/blobs/$chunk" --jq .content | tr -d '\n' | base64 --decode >> "$frias_pdf"
          done
          for chunk in $FRIAS_EPUB_CHUNKS; do
            gh api "repos/$GITHUB_REPOSITORY/git/blobs/$chunk" --jq .content | tr -d '\n' | base64 --decode >> "$frias_epub"
          done
          for chunk in $PASTRANA_PDF_CHUNKS; do
            gh api "repos/$GITHUB_REPOSITORY/git/blobs/$chunk" --jq .content | tr -d '\n' | base64 --decode >> "$pastrana_pdf"
          done
          for chunk in $PASTRANA_EPUB_CHUNKS; do
            gh api "repos/$GITHUB_REPOSITORY/git/blobs/$chunk" --jq .content | tr -d '\n' | base64 --decode >> "$pastrana_epub"
          done
          for chunk in $URRUTIA_PDF_CHUNKS; do
            gh api "repos/$GITHUB_REPOSITORY/git/blobs/$chunk" --jq .content | tr -d '\n' | base64 --decode >> "$urrutia_pdf"
          done
          for chunk in $URRUTIA_EPUB_CHUNKS; do
            gh api "repos/$GITHUB_REPOSITORY/git/blobs/$chunk" --jq .content | tr -d '\n' | base64 --decode >> "$urrutia_epub"
          done

          echo "d920df07075e85dc8dcd5f934c196a02541213d4e910691f21a16944cc5e3b26  $frias_pdf" | sha256sum -c -
          echo "54c7a0e5a9e2dd894bf27a3dc055f97a20e0c6559f269267615e5f05695aecc6  $frias_epub" | sha256sum -c -
          echo "8df483f9e0b2d58b415192fc1903a1b215350b07c8da89972def73e7006fa348  $pastrana_pdf" | sha256sum -c -
          echo "a03b22072095b635ddd0cc9aaafc00b71d0f464b70264c1cd3843dcc340fdf1b  $pastrana_epub" | sha256sum -c -
          echo "fb1d80c4da4214505d56966f448c2519532084d866b3e306766457aa6c05af0e  $urrutia_pdf" | sha256sum -c -
          echo "183f2c4508809457e9830d0881d1669d09cfae48fc9edb3516e3355b9b2f5669  $urrutia_epub" | sha256sum -c -
          test "$(stat -c %s "$frias_pdf")" = 1392195
          test "$(stat -c %s "$frias_epub")" = 897600
          test "$(stat -c %s "$pastrana_pdf")" = 2040488
          test "$(stat -c %s "$pastrana_epub")" = 116109
          test "$(stat -c %s "$urrutia_pdf")" = 4819327
          test "$(stat -c %s "$urrutia_epub")" = 298655

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload publications-current \
            Frias_Cuestion_Limites_Mexico_Guatemala_1883_Japanese_Complete_Translation.pdf \
            Frias_Cuestion_Limites_Mexico_Guatemala_1883_Japanese_Complete_Translation.epub \
            Pastrana_Informe_Comision_Mexicana_Limites_Guatemala_1897_Japanese_Complete_Translation.pdf \
            Pastrana_Informe_Comision_Mexicana_Limites_Guatemala_1897_Japanese_Complete_Translation.epub \
            Urrutia_Memoria_Limites_Guatemala_Mexico_1900_Japanese_Complete_Translation.pdf \
            Urrutia_Memoria_Limites_Guatemala_Mexico_1900_Japanese_Complete_Translation.epub \
            --clobber

      - name: Remove one-time workflow
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/publish-boundary-reports-release.yml
          git commit -m "Remove one-time boundary reports release workflow"
          git push origin HEAD:main
