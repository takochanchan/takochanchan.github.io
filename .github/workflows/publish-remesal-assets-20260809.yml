name: Publish Remesal release assets

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-remesal-assets-20260809.yml

permissions:
  contents: write

concurrency:
  group: publications-current-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WORKFLOW_PATH: .github/workflows/publish-remesal-assets-20260809.yml
      STAGING_BRANCH: agent/publish-remesal-assets-20260809
      PDF_NAME: Antonio_de_Remesal_Historia_General_1619_Japanese_Complete_Translation.pdf
      PDF_SIZE: "16655237"
      PDF_SHA256: 932c290dedada4d0a86719be7410a5605a668982c00275ed10a20353c8616f48
      PDF_BLOBS: >-
        8f7412fbe884b1f623586ab9cab30a593524f59a
        41c26ca27722fcc465a58015d8034d218a39553e
        8048c7c66e69772414a5556ca71b3dceb88ef42b
        177fdecf50b91b439e5bf212068386bc8144910d
