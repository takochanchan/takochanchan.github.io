        4261479fe4c69c4824a5ef79e7d264b82e0df10e

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install PDF inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Reassemble and validate release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/remesal-assets
          pdf="/tmp/remesal-assets/$PDF_NAME"
          epub="/tmp/remesal-assets/$EPUB_NAME"

          fetch_blob() {
            local sha="$1"
            local out="$2"
            gh api "repos/$GITHUB_REPOSITORY/git/blobs/$sha" --jq '.content' |
              tr -d '\n' |
              base64 --decode >> "$out"
          }

          : > "$pdf"
          for blob in $PDF_BLOBS; do
            fetch_blob "$blob" "$pdf"
          done
          : > "$epub"
          for blob in $EPUB_BLOBS; do
            fetch_blob "$blob" "$epub"
          done

          test "$(stat -c %s "$pdf")" = "$PDF_SIZE"
          test "$(stat -c %s "$epub")" = "$EPUB_SIZE"
          test "$(sha256sum "$pdf" | awk '{print $1}')" = "$PDF_SHA256"
          test "$(sha256sum "$epub" | awk '{print $1}')" = "$EPUB_SHA256"

          test "$(pdfinfo "$pdf" | awk '/^Pages:/ {print $2}')" = 2130
          pdftotext -layout "$pdf" /tmp/remesal.txt
          grep -F "西インド総史" /tmp/remesal.txt
          grep -F "第十一巻" /tmp/remesal.txt
          grep -F "〔原刊 p. 752〕" /tmp/remesal.txt
          grep -F "章題表" /tmp/remesal.txt
          if grep -E "GPT|ChatGPT|Markdown|生成AI|制作工程|Proof|公開前校閲用|独立レビュー|翻訳作業稿" /tmp/remesal.txt; then
            echo "Forbidden production wording found in PDF" >&2
            exit 1
          fi

          python3 - <<'PY'
          import os, posixpath, re, zipfile
          from xml.etree import ElementTree as ET

          path = '/tmp/remesal-assets/' + os.environ['EPUB_NAME']
          with zipfile.ZipFile(path) as archive:
              assert archive.testzip() is None
              names = archive.namelist()
              assert names[0] == 'mimetype'
              assert archive.getinfo('mimetype').compress_type == zipfile.ZIP_STORED
              assert archive.read('mimetype') == b'application/epub+zip'
              opf_name = next(name for name in names if name.endswith('.opf'))
              opf_root = ET.fromstring(archive.read(opf_name))
              ns = {'opf': 'http://www.idpf.org/2007/opf'}
              manifest = opf_root.find('opf:manifest', ns)
              spine = opf_root.find('opf:spine', ns)
              assert manifest is not None and spine is not None
              items = manifest.findall('opf:item', ns)
              assert sum('cover-image' in item.get('properties', '').split() for item in items) == 1
              assert sum('nav' in item.get('properties', '').split() for item in items) == 1
              assert len(spine.findall('opf:itemref', ns)) == 24
              base = posixpath.dirname(opf_name)
              for item in items:
                  href = item.get('href', '').split('#', 1)[0]
                  if href and not re.match(r'^[a-z][a-z0-9+.-]*:', href, re.I):
                      resolved = posixpath.normpath(posixpath.join(base, href))
                      assert resolved in names, resolved
              text = ''.join(
                  archive.read(name).decode('utf-8')
                  for name in names
                  if name.endswith(('.xhtml', '.html', '.opf', '.ncx'))
              ).replace('\xa0', ' ')
          for required in ('西インド総史', '第十一巻', '〔原刊 p. 752〕', '章題表'):
              assert required in text
          for forbidden in ('GPT', 'ChatGPT', 'Markdown', '生成AI', '制作工程', 'Proof', '公開前校閲用', '独立レビュー', '翻訳作業稿'):
              assert forbidden not in text
          PY

      - name: Upload release assets and verify downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/current /tmp/verified
          gh release download publications-current --pattern SHA256SUMS.txt --dir /tmp/current --repo "$GITHUB_REPOSITORY"
          awk -v pdf="$PDF_NAME" -v epub="$EPUB_NAME" '$2 != pdf && $2 != epub' /tmp/current/SHA256SUMS.txt > /tmp/SHA256SUMS.txt
          printf '%s  %s\n' "$PDF_SHA256" "$PDF_NAME" >> /tmp/SHA256SUMS.txt
          printf '%s  %s\n' "$EPUB_SHA256" "$EPUB_NAME" >> /tmp/SHA256SUMS.txt

          gh release upload publications-current \
            "/tmp/remesal-assets/$PDF_NAME" \
            "/tmp/remesal-assets/$EPUB_NAME" \
            /tmp/SHA256SUMS.txt \
            --clobber --repo "$GITHUB_REPOSITORY"

          gh release download publications-current --pattern "$PDF_NAME" --dir /tmp/verified --repo "$GITHUB_REPOSITORY"
          gh release download publications-current --pattern "$EPUB_NAME" --dir /tmp/verified --repo "$GITHUB_REPOSITORY"
          gh release download publications-current --pattern SHA256SUMS.txt --dir /tmp/verified --repo "$GITHUB_REPOSITORY"
          test "$(stat -c %s "/tmp/verified/$PDF_NAME")" = "$PDF_SIZE"
          test "$(stat -c %s "/tmp/verified/$EPUB_NAME")" = "$EPUB_SIZE"
          test "$(sha256sum "/tmp/verified/$PDF_NAME" | awk '{print $1}')" = "$PDF_SHA256"
          test "$(sha256sum "/tmp/verified/$EPUB_NAME" | awk '{print $1}')" = "$EPUB_SHA256"
          grep -Fx "$PDF_SHA256  $PDF_NAME" /tmp/verified/SHA256SUMS.txt
          grep -Fx "$EPUB_SHA256  $EPUB_NAME" /tmp/verified/SHA256SUMS.txt

      - name: Remove one-time workflow and staging branch
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git push origin --delete "$STAGING_BRANCH" || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -B cleanup origin/main
            if [ -f "$WORKFLOW_PATH" ]; then
              git rm "$WORKFLOW_PATH"
            fi
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m "Remove completed Remesal release workflow"
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          exit 1

      - name: Record workflow failure
        if: failure()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          failure_path=".github/publication-failures/remesal-release-${GITHUB_RUN_ID}.txt"
          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -B failure origin/main
            mkdir -p "$(dirname "$failure_path")"
            printf 'run_id=%s\nrun_url=https://github.com/%s/actions/runs/%s\n' "$GITHUB_RUN_ID" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > "$failure_path"
            git add "$failure_path"
            git commit -m "Record failed Remesal release workflow"
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          exit 1
