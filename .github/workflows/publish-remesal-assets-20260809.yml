        c173822647d2221b4f9a522bbf2db7517391ae06
        447e3bd7202f3ce096f545db26ffd3ab7e4e604b
        80c74bbe159d15fb4b55af917c760817664b7891
      EPUB_NAME: Antonio_de_Remesal_Historia_General_1619_Japanese_Complete_Translation.epub
      EPUB_SIZE: "11395673"
      EPUB_SHA256: dd0c7555ea3fa6fa966a75dc53b7816c738593a5c4d3012c78bf27760bbc527a
      EPUB_BLOBS: >-
        6224a89461226da7229b7a14e133e071a45de9b3
        c7597f2c158a0ac83bc97e4297151ab619981aa9
        d3fbd83ed5da25e7cbf3d2c8243683dd4aa8d431
