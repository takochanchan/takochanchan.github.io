name: Transfer approved Rodriguez publication
on:
  push:
    branches: [agent/rodriguez-publish-20260909]
    paths: ['.publication-upload-requests/rodriguez-relacion-espantable-terremoto-1541.json']
permissions:
  contents: write
concurrency:
  group: rodriguez-publication-transfer
  cancel-in-progress: false
jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm test
      - name: Upload and verify approved files
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .publication-transfer/transfer-rodriguez.py
      - uses: actions/upload-artifact@v4
        with:
          name: rodriguez-release-byte-verification
          path: release-byte-verification.json
