name: Verify Lemus 1683 search and publication
on:
  push:
    branches: [agent/lemus1683-verify-20261127]
    paths: [.lemus1683-live-plan.json]
permissions:
  contents: read
jobs:
  search-maps:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run build && npm test
      - run: python3 .lemus1683-verify.py maps && npm run verify:remote-search
      - uses: actions/upload-artifact@v4
        with:
          name: lemus1683-map-verification
          path: lemus1683-verification.json
  live-publication:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: python3 .lemus1683-verify.py live
      - uses: actions/upload-artifact@v4
        with:
          name: lemus1683-live-readback
          path: lemus1683-verification.json
