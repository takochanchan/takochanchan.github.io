name: Verify Dollfus and Mont-Serrat 1868 search and publication
on:
  push:
    branches: [agent/dollfus1868-verify-20261128]
    paths: [.dollfus1868-live-plan.json]
permissions:
  contents: read
jobs:
  search-maps:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run build && npm test
      - run: python3 .dollfus1868-verify.py maps && npm run verify:remote-search
      - uses: actions/upload-artifact@v4
        with:
          name: dollfus1868-map-verification
          path: dollfus1868-verification.json
  live-publication:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: python3 .dollfus1868-verify.py live
      - uses: actions/upload-artifact@v4
        with:
          name: dollfus1868-live-readback
          path: dollfus1868-verification.json
