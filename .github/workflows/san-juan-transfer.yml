name: Transfer checksum-pinned San Juan de Ulua 1839 assets

on:
  push:
    branches: ["agent/san-juan-publish-20261109"]
    paths: [".publication-upload-requests/blanchard-dauzats-san-juan-de-ulua-1839.json"]
permissions:
  contents: write
concurrency:
  group: publication-release-transfer
  cancel-in-progress: false
jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install build dependencies
        run: npm ci --no-audit --no-fund
      - name: Build and test the publication catalogue
        run: npm run build && npm test
      - name: Reconstruct, upload, and verify publication PDF and EPUB
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .publication-transfer/transfer-san-juan.py
      - uses: actions/upload-artifact@v4
        with:
          name: san-juan-release-verification
          path: san-juan-release-verification.json

