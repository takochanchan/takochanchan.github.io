name: Transfer approved Mencos Crónicas 1894
on:
  push:
    branches: [agent/mencos-1894-publish-20261015]
    paths: [.mencos-1894-public-request.json]
permissions:
  contents: write
concurrency:
  group: publication-release-transfer
  cancel-in-progress: false
jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run build && npm test
      - name: Upload and verify final PDF and EPUB files
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .mencos-1894-transfer.py
      - uses: actions/upload-artifact@v4
        with:
          name: mencos-1894-public-verification
          path: mencos-1894-public-verification.json


