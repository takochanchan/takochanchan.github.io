name: Publish Rabinal-Achi release assets

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-rabinal-achi-release.yml

permissions:
  contents: write

concurrency:
  group: publications-current-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Reassemble and verify release assets
        env:
          GH_TOKEN: ${{ github.token }}
          MANIFEST_BLOB: e236db7b5c8576204f9d918433e697f0d83f7fec
        run: |
          set -euo pipefail
          manifest=release-manifest.tsv
          gh api "repos/$GITHUB_REPOSITORY/git/blobs/$MANIFEST_BLOB" \
            --jq .content |
            tr -d '\n' |
            base64 --decode > "$manifest"
          test "$(wc -l < "$manifest")" = 3

          while IFS=$'\t' read -r asset_name expected_size expected_sha blob_list; do
            test -n "$asset_name"
            : > "$asset_name"
            for blob_sha in $blob_list; do
              gh api "repos/$GITHUB_REPOSITORY/git/blobs/$blob_sha" \
                --jq .content |
                tr -d '\n' |
                base64 --decode >> "$asset_name"
            done
            echo "$expected_sha  $asset_name" | sha256sum -c -
            test "$(stat -c %s "$asset_name")" = "$expected_size"
          done < "$manifest"

      - name: Confirm the shared checksum file is still current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir current-release
          gh release download publications-current \
            --pattern SHA256SUMS.txt \
            --dir current-release \
            --repo "$GITHUB_REPOSITORY"
          grep -v -F \
            -e "  Charles_Etienne_Brasseur_de_Bourbourg_Grammaire_de_la_langue_quichee_Rabinal_Achi_1862_Japanese_Complete_Translation.pdf" \
            -e "  Charles_Etienne_Brasseur_de_Bourbourg_Grammaire_de_la_langue_quichee_Rabinal_Achi_1862_Japanese_Complete_Translation.epub" \
            SHA256SUMS.txt > expected-current-SHA256SUMS.txt
          test "$(wc -l < expected-current-SHA256SUMS.txt)" = 140
          cmp expected-current-SHA256SUMS.txt current-release/SHA256SUMS.txt

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload publications-current \
            Charles_Etienne_Brasseur_de_Bourbourg_Grammaire_de_la_langue_quichee_Rabinal_Achi_1862_Japanese_Complete_Translation.pdf \
            Charles_Etienne_Brasseur_de_Bourbourg_Grammaire_de_la_langue_quichee_Rabinal_Achi_1862_Japanese_Complete_Translation.epub \
            SHA256SUMS.txt \
            --clobber \
            --repo "$GITHUB_REPOSITORY"

      - name: Verify published release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir verified-release
          while IFS=$'\t' read -r asset_name expected_size expected_sha blob_list; do
            gh release download publications-current \
              --pattern "$asset_name" \
              --dir verified-release \
              --repo "$GITHUB_REPOSITORY"
            published="verified-release/$asset_name"
            echo "$expected_sha  $published" | sha256sum -c -
            test "$(stat -c %s "$published")" = "$expected_size"
          done < release-manifest.tsv

      - name: Remove release staging branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api \
            --method DELETE \
            "repos/$GITHUB_REPOSITORY/git/refs/heads/agent/release-assets-rabinal-achi-20260731"

      - name: Remove one-time workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          path=.github/workflows/publish-rabinal-achi-release.yml
          sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/$path?ref=main" --jq .sha)"
          gh api \
            --method DELETE \
            "repos/$GITHUB_REPOSITORY/contents/$path" \
            -f message="Remove completed Rabinal-Achi release workflow" \
            -f sha="$sha" \
            -f branch=main
