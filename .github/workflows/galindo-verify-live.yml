name: Verify live Galindo publication
on:
  push:
    branches: [main]
    paths: [src/galindo-publications.mjs, .github/workflows/galindo-verify-live.yml]
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Wait for this catalogue deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,os,subprocess,time
          for attempt in range(90):
              result=json.loads(subprocess.check_output(['gh','api','repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs?head_sha='+os.environ['GITHUB_SHA']]))
              runs=[r for r in result['workflow_runs'] if r['name']=='Deploy archive to GitHub Pages']
              if runs and runs[0]['status']=='completed':
                  assert runs[0]['conclusion']=='success', runs[0]['conclusion']
                  print('Pages succeeded',runs[0]['id'])
                  break
              time.sleep(10)
          else: raise SystemExit('Pages deployment timed out')
          PY
      - name: Install PDF inspection dependency
        run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils
      - name: Verify live bibliography and exact final assets
        run: |
          python3 - <<'PY'
          import json,hashlib,urllib.request,tempfile,pathlib,zipfile,subprocess
          base='https://takochanchan.github.io/'
          slug='galindo-gran-decada-nacional-1904-1906'
          url=base+'publications/'+slug+'/'
          html=urllib.request.urlopen(url,timeout=60).read().decode()
          for text in ['国家の偉大な十年','Miguel Galindo y Galindo','INEHRM','全権利留保','原刊の文章のみ']:
              assert text in html,text
          report=json.load(open('galindo-public-verification.json'))
          root=pathlib.Path(tempfile.mkdtemp())
          sums=urllib.request.urlopen('https://github.com/takochanchan/takochanchan.github.io/releases/download/publications-current/SHA256SUMS.txt',timeout=120).read().decode()
          assets=report['assets']
          assert len(assets)==9
          for a in assets:
              asset_url=a['url'] if a['url'].startswith('https://') else base+a['url'].lstrip('/')
              p=root/pathlib.PurePosixPath(a['path']).name
              with urllib.request.urlopen(asset_url,timeout=120) as response,p.open('wb') as f:
                  while chunk:=response.read(1024*1024): f.write(chunk)
              assert p.stat().st_size==a['size']
              assert hashlib.sha256(p.read_bytes()).hexdigest()==a['sha256']
              if a['kind']=='release':
                  assert a['filename'] in html
                  assert a['sha256']+'  '+a['filename'] in sums
              if p.suffix=='.epub':
                  with zipfile.ZipFile(p) as z:
                      assert z.testzip() is None
                      assert z.read('mimetype')==b'application/epub+zip'
                      assert not any(n.lower().endswith(('.png','.jpg','.jpeg','.gif','.svg','.webp')) for n in z.namelist())
              if p.suffix=='.pdf':
                  vol=next(i for i in (1,2,3) if 'Tomo_%02d_'%i in p.name)
                  info=subprocess.check_output(['pdfinfo',str(p)],text=True)
                  assert any(line.split()==['Pages:',str({1:544,2:766,3:767}[vol])] for line in info.splitlines())
                  images=subprocess.check_output(['pdfimages','-list',str(p)],text=True).splitlines()
                  assert len([line for line in images if line.strip() and line.split()[0].isdigit()])==0
                  intro=subprocess.check_output(['pdftotext','-f','2','-l','2',str(p),'-'],text=True)
                  assert 'INEHRM' in intro and '全権利留保' in intro
              print('VERIFIED',a['filename'],a['size'],a['sha256'])
          print('Live Galindo bibliography, all three text-only PDFs, EPUBs, covers, and release checksums verified.')
          PY
