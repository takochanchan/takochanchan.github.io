name: Transfer approved Nazarenos and Gagini publication files
on:
  push:
    branches: [agent/nazarenos-gagini-publish-20261024]
    paths: [.nazarenos-gagini-public-request.json]
permissions:
  contents: write
concurrency:
  group: publication-release-transfer
  cancel-in-progress: false
jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Verify approved bytes and prepare catalogue cover
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .nazarenos-gagini-prepare.py
      - run: npm ci --no-audit --no-fund
      - run: npm run build && npm test
      - name: Save verified catalogue cover
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static/publications/milla-los-nazarenos-1897/cover.jpg static/publications/gagini-marques-talamanca-obras-dramaticas-1905/cover.jpg assets-manifest.json
          git commit -m 'Add verified Nazarenos and Gagini catalogue cover'
          git push origin HEAD:agent/nazarenos-gagini-publish-20261024
      - name: Upload and verify final PDF and EPUB files
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .nazarenos-gagini-transfer.py
      - uses: actions/upload-artifact@v4
        with:
          name: nazarenos-gagini-public-verification
          path: nazarenos-gagini-public-verification.json


