name: Transfer checksum-pinned Tesoro de medicinas 1674 assets

on:
  push:
    branches: ["agent/lopez-tesoro-medicinas-1674-transfer-20261107"]
    paths: [".publication-upload-requests/lopez-tesoro-medicinas-1674.json", "tests/fixtures/publication-catalogue.json"]
permissions:
  contents: write
concurrency:
  group: publication-release-transfer
  cancel-in-progress: false
jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install build dependencies
        run: npm ci --no-audit --no-fund
      - name: Build and test the publication catalogue
        run: npm run build && npm test
      - name: Reconstruct, upload, and verify publication bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .publication-transfer/transfer-lopez-tesoro-medicinas-1674.py
      - uses: actions/upload-artifact@v4
        with:
          name: tesoro-release-byte-verification
          path: tesoro-release-verification.json

