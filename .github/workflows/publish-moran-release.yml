name: Publish Moran release assets

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-moran-release.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Reassemble release assets
        env:
          GH_TOKEN: ${{ github.token }}
          PDF_CHUNKS: "88ca49d5a5ef15dcc983011cde57eb138bfa4796 cbddf9c029b998a2dde66d6baf3ba860bb2b7cde f00ff8a390d3b9c9b38bbc0e8bed5db9b7b36f2a 665d13db8453bb600cca9c864fecc9202d05cd15 980750e9d595a6f92621ec3bd69ce4c163f4c515 2747bacea82d164dcbcced4f0e8154c318ffb571 b0ad1c79905d165a5d6efab6bc42fed6c2cd5b81 788b8b03bc2b58eb94a4c126303c0cac028991eb a2ef220f0f93556860d1a59fcbd707e17659e39b 771580c81b3f7a667dff7bafffc3151e20236c83 ee157d0b44dce4f8028e8e88c0fc2bf8be1d64fb 501b80e76936e158d9d4d6c6a986baf6b3d5469f 693cdedba58b56088387677c5376ff8f0b4f22a0 fa41db0bbf4688d75b0ecba182f6ed42efe080c5"
          EPUB_CHUNKS: "f2b83a92adba4afb1eb0fadf6ac64332b0271eee c6e78f8729ac4326d1d65930c76bc58b240f3c4e ececd19a9b35aaada424bce9772b5cdcd57a90bc 279740f5ce5bfe7a69d4b1cb147337945c9ad717 48507be3c9c66179ec9b4c2471989193b303d597"
          SUMS_CHUNKS: "c345116d3ab2e0e882b091a077dcb4ecacb5af8c"
        run: |
          set -euo pipefail
          pdf=Moran_Arte_y_vocabulario_Cholti_1695_Japanese_Complete_Translation.pdf
          epub=Moran_Arte_y_vocabulario_Cholti_1695_Japanese_Complete_Translation.epub
          sums=SHA256SUMS.txt
          : > "$pdf"
          : > "$epub"
          : > "$sums"
          for chunk in $PDF_CHUNKS; do
            gh api "repos/$GITHUB_REPOSITORY/git/blobs/$chunk" --jq .content | tr -d '\n' | base64 --decode >> "$pdf"
          done
          for chunk in $EPUB_CHUNKS; do
            gh api "repos/$GITHUB_REPOSITORY/git/blobs/$chunk" --jq .content | tr -d '\n' | base64 --decode >> "$epub"
          done
          for chunk in $SUMS_CHUNKS; do
            gh api "repos/$GITHUB_REPOSITORY/git/blobs/$chunk" --jq .content | tr -d '\n' | base64 --decode >> "$sums"
          done
          echo "b4d7b35e654c2b14259d91eb0b1faff700133d3b1c196d5c0c79edd8039f4a56  $pdf" | sha256sum -c -
          echo "8fd7fac86e891a21fab0e71cd43bb52be20c48fcbb27ddd98676643465422de9  $epub" | sha256sum -c -
          echo "e5e466687baa0c7bc399ec3a87af9de26651e7dd42f0aeab2e4b5ec221221b2d  $sums" | sha256sum -c -
          test "$(stat -c %s "$pdf")" = 7063088
          test "$(stat -c %s "$epub")" = 2352148
          test "$(stat -c %s "$sums")" = 14059

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload publications-current \
            Moran_Arte_y_vocabulario_Cholti_1695_Japanese_Complete_Translation.pdf \
            Moran_Arte_y_vocabulario_Cholti_1695_Japanese_Complete_Translation.epub \
            SHA256SUMS.txt \
            --clobber \
            --repo "$GITHUB_REPOSITORY"

      - name: Remove release staging branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api \
            --method DELETE \
            "repos/$GITHUB_REPOSITORY/git/refs/heads/agent/release-assets-moran-cholti-1695"

      - name: Remove one-time workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          path=.github/workflows/publish-moran-release.yml
          sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/$path?ref=main" --jq .sha 2>/dev/null || true)"
          if test -z "$sha"; then
            exit 0
          fi
          gh api \
            --method DELETE \
            "repos/$GITHUB_REPOSITORY/contents/$path" \
            -f message="Remove one-time Moran release workflow" \
            -f sha="$sha" \
            -f branch=main
