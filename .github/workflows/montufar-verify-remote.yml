name: Verify Montufar deployed full-text search
on:
  push:
    branches: [agent/montufar-prision-integrated-20261018]
    paths: [.github/workflows/montufar-verify-remote.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Wait for the pinned search deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,os,time,urllib.request
          url="https://api.github.com/repos/takochanchan/takochan-search-index-002/actions/runs/39104408113"
          for attempt in range(210):
              req=urllib.request.Request(url,headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json"})
              with urllib.request.urlopen(req,timeout=30) as response: run=json.load(response)
              assert run["head_sha"]=="89050036ffce5f003e91a6ef44cbc85dde08ec70"
              if run["status"]=="completed":
                  assert run["conclusion"]=="success",run["conclusion"]
                  break
              time.sleep(15)
          else: raise SystemExit("Pinned search deployment timeout")
          PY
      - run: npm run build && npm test && npm run verify:remote-search
