name: Publish Romero coffee translation (diagnostic retry)

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/publish-romero-cafe-20260821-v3.yml"

permissions:
  contents: write

concurrency:
  group: publish-romero-cafe-20260821
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: publications-current
      STAGING_BRANCH: codex-release-romero-cafe-20260821-v1
      READY_BRANCH: codex-ready-romero-cafe-20260821-v3
      STATUS_STARTED: codex-status-romero-cafe-20260821-v3-started
      STATUS_PAYLOAD: codex-status-romero-cafe-20260821-v3-payload
      STATUS_APPLIED: codex-status-romero-cafe-20260821-v3-applied
      STATUS_INSTALLED: codex-status-romero-cafe-20260821-v3-installed
      STATUS_BUILT: codex-status-romero-cafe-20260821-v3-built
      STATUS_TESTS: codex-status-romero-cafe-20260821-v3-tests
      STATUS_RELEASE: codex-status-romero-cafe-20260821-v3-release
      STATUS_SEARCH: codex-status-romero-cafe-20260821-v3-search
      PAYLOAD_SHA256: 692b83453c883484f260cd54d097127219d6d56c1aedfbacf204c4d51993c9e3
      PAYLOAD_SIZE: "1695280"
      PAYLOAD_PARTS: "7"
    steps:
      - name: Check out the publication trigger commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Signal workflow start
        run: git push --force origin "$GITHUB_SHA:refs/heads/$STATUS_STARTED"

      - name: Check out the checksum-locked payload
        uses: actions/checkout@v4
        with:
          ref: ${{ env.STAGING_BRANCH }}
          path: staging
          sparse-checkout: release-staging/romero-cafe-20260821
          sparse-checkout-cone-mode: false

      - name: Reconstruct and verify the publication payload
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          parts = sorted(
              Path("staging/release-staging/romero-cafe-20260821").glob(
                  "payload.tar.gz.part-*"
              )
          )
          expected_count = int(os.environ["PAYLOAD_PARTS"])
          if len(parts) != expected_count:
              raise SystemExit(f"payload part count {len(parts)} != {expected_count}")
          output = Path(os.environ["RUNNER_TEMP"]) / "romero-public-release.tar.gz"
          digest = hashlib.sha256()
          size = 0
          with output.open("wb") as destination:
              for part in parts:
                  block = part.read_bytes()
                  destination.write(block)
                  digest.update(block)
                  size += len(block)
          if size != int(os.environ["PAYLOAD_SIZE"]):
              raise SystemExit(f"payload size {size} != {os.environ['PAYLOAD_SIZE']}")
          if digest.hexdigest() != os.environ["PAYLOAD_SHA256"]:
              raise SystemExit("payload SHA-256 mismatch")
          print(f"payload OK: {size} bytes {digest.hexdigest()}")
          PY
          mkdir -p "$RUNNER_TEMP/publication-payload"
          tar -xzf "$RUNNER_TEMP/romero-public-release.tar.gz" \
            -C "$RUNNER_TEMP/publication-payload"

      - name: Validate the exact PDF, EPUB, and cover files
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v pdfinfo >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y poppler-utils
          fi
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import zipfile
          from pathlib import Path
          from xml.etree import ElementTree as ET

          root = Path(os.environ["RUNNER_TEMP"]) / "publication-payload/public_release_payload"
          report = json.loads((root / "publication_report.json").read_text(encoding="utf-8"))
          if report["archive_commit"] != "fe3f0d7877cd9d30b4873abfcd1085947124bbbe":
              raise SystemExit("wrong working-master archive commit")
          if report["fancourt_mother_sha256"] != "4192b835548fb2a87ed54a65df45054fcaf3e3aa704bc4ec3a4c10a5a775dc0e":
              raise SystemExit("wrong locked Fancourt mother hash")
          rows = report["publications"]
          if [row["slug"] for row in rows] != ["romero-cultivo-cafe-chiapas-1893"]:
              raise SystemExit("unexpected publication report slugs")
          row = rows[0]
          slug = row["slug"]
          paths = {}
          for kind in ("pdf", "epub", "cover"):
              filename = "cover.jpg" if kind == "cover" else Path(row["publication"][kind]).name
              path = root / "public" / slug / filename
              data = path.read_bytes()
              if len(data) != row[kind]["size"]:
                  raise SystemExit(f"{kind}: size mismatch")
              if hashlib.sha256(data).hexdigest() != row[kind]["sha256"]:
                  raise SystemExit(f"{kind}: SHA-256 mismatch")
              paths[kind] = path

          with zipfile.ZipFile(paths["epub"]) as archive:
              if archive.testzip() is not None:
                  raise SystemExit("corrupt EPUB")
              members = archive.namelist()
              if not members or members[0] != "mimetype":
                  raise SystemExit("EPUB mimetype is not first")
              if archive.getinfo("mimetype").compress_type != zipfile.ZIP_STORED:
                  raise SystemExit("EPUB mimetype is compressed")
              if archive.read("mimetype") != b"application/epub+zip":
                  raise SystemExit("invalid EPUB mimetype")
              xhtml = [name for name in members if name.endswith(".xhtml")]
              roots = [ET.fromstring(archive.read(name)) for name in xhtml]
              tables = sum(1 for doc in roots for node in doc.iter() if node.tag.endswith("}table"))
              images = [node for doc in roots for node in doc.iter() if node.tag.endswith("}img")]
              noterefs = [
                  node for doc in roots for node in doc.iter()
                  if "noteref" in node.attrib.get("{http://www.idpf.org/2007/ops}type", "").split()
              ]
              footnotes = [
                  node for doc in roots for node in doc.iter()
                  if "footnote" in node.attrib.get("{http://www.idpf.org/2007/ops}type", "").split()
              ]
              markers = []
              for doc in roots:
                  for node in doc.iter():
                      if not node.tag.endswith("}p"):
                          continue
                      text = "".join(node.itertext()).strip()
                      if text.startswith("〔原刊") and text.endswith("〕"):
                          markers.append(text)
              if tables != 31 or len(noterefs) != 3 or len(footnotes) != 3:
                  raise SystemExit(
                      f"EPUB structure mismatch: tables={tables}, "
                      f"noterefs={len(noterefs)}, footnotes={len(footnotes)}"
                  )
              if len(markers) != 167:
                  raise SystemExit(f"EPUB source marker mismatch: {len(markers)}")
              if any(not image.attrib.get("alt", "").strip() for image in images):
                  raise SystemExit("EPUB image without alternative text")
          print("payload assets and EPUB structure OK")
          PY
          payload="$RUNNER_TEMP/publication-payload/public_release_payload/public/romero-cultivo-cafe-chiapas-1893"
          test "$(pdfinfo "$payload/Matias_Romero_Cafe_Chiapas_Japanese_Complete_Translation.pdf" | awk '/^Pages:/ {print $2}')" = "158"

      - name: Signal payload validation
        run: git push --force origin "$GITHUB_SHA:refs/heads/$STATUS_PAYLOAD"

      - name: Apply the source changes in a disposable worktree
        shell: bash
        run: |
          set -euo pipefail
          python3 \
            "$RUNNER_TEMP/publication-payload/public_release_payload/apply_public_release.py" \
            "$GITHUB_WORKSPACE" \
            "$RUNNER_TEMP/publication-payload/public_release_payload"
          node --check src/publications.mjs
          git diff --check

      - name: Signal source application
        run: git push --force origin "$GITHUB_SHA:refs/heads/$STATUS_APPLIED"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install build dependencies
        run: npm ci

      - name: Signal dependency installation
        run: git push --force origin "$GITHUB_SHA:refs/heads/$STATUS_INSTALLED"

      - name: Build before release mutation
        run: npm run build

      - name: Signal site build
        run: git push --force origin "$GITHUB_SHA:refs/heads/$STATUS_BUILT"

      - name: Test before release mutation
        run: npm test

      - name: Signal source tests
        run: git push --force origin "$GITHUB_SHA:refs/heads/$STATUS_TESTS"

      - name: Upload the checksum-locked release assets
        shell: bash
        run: |
          set -euo pipefail
          checksum_dir="$RUNNER_TEMP/release-checksums"
          payload="$RUNNER_TEMP/publication-payload/public_release_payload/public/romero-cultivo-cafe-chiapas-1893"
          mkdir -p "$checksum_dir"
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern SHA256SUMS.txt \
            --dir "$checksum_dir"
          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path(os.environ["RUNNER_TEMP"]) / "release-checksums/SHA256SUMS.txt"
          additions = {
              "Matias_Romero_Cafe_Chiapas_Japanese_Complete_Translation.epub": "be16975095753b8988d07b3a172dfc838243d2cdd8a6ee1e76d6dccdfeb038dd",
              "Matias_Romero_Cafe_Chiapas_Japanese_Complete_Translation.pdf": "ff1936259bb402c5445805138354762abb1616c2032b9df0eacbc6cd8f825702",
          }
          kept = []
          for line in path.read_text(encoding="utf-8").splitlines():
              fields = line.split()
              if fields and fields[-1] in additions:
                  continue
              kept.append(line)
          kept.extend(f"{digest}  {filename}" for filename, digest in sorted(additions.items()))
          path.write_text("\n".join(kept) + "\n", encoding="utf-8")
          PY
          gh release upload "$RELEASE_TAG" \
            "$payload/Matias_Romero_Cafe_Chiapas_Japanese_Complete_Translation.pdf" \
            "$payload/Matias_Romero_Cafe_Chiapas_Japanese_Complete_Translation.epub" \
            "$checksum_dir/SHA256SUMS.txt" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Download the public release assets back and verify them
        shell: bash
        run: |
          set -euo pipefail
          verify_dir="$RUNNER_TEMP/release-verify"
          mkdir -p "$verify_dir"
          for filename in \
            Matias_Romero_Cafe_Chiapas_Japanese_Complete_Translation.pdf \
            Matias_Romero_Cafe_Chiapas_Japanese_Complete_Translation.epub \
            SHA256SUMS.txt
          do
            gh release download "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern "$filename" \
              --dir "$verify_dir"
          done
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "release-verify"
          expected = {
              "Matias_Romero_Cafe_Chiapas_Japanese_Complete_Translation.epub": (255469, "be16975095753b8988d07b3a172dfc838243d2cdd8a6ee1e76d6dccdfeb038dd"),
              "Matias_Romero_Cafe_Chiapas_Japanese_Complete_Translation.pdf": (2680546, "ff1936259bb402c5445805138354762abb1616c2032b9df0eacbc6cd8f825702"),
          }
          checksum_lines = set((root / "SHA256SUMS.txt").read_text(encoding="utf-8").splitlines())
          for filename, (size, digest) in expected.items():
              data = (root / filename).read_bytes()
              if len(data) != size or hashlib.sha256(data).hexdigest() != digest:
                  raise SystemExit(f"downloaded release asset mismatch: {filename}")
              if f"{digest}  {filename}" not in checksum_lines:
                  raise SystemExit(f"SHA256SUMS entry mismatch: {filename}")
              print(f"release asset OK: {filename}")
          PY

      - name: Signal release verification
        run: git push --force origin "$GITHUB_SHA:refs/heads/$STATUS_RELEASE"

      - name: Restore the exact final full-text search index
        id: search-index-cache
        uses: actions/cache/restore@v4
        with:
          path: dist/search
          key: fulltext-index-${{ hashFiles('assets-manifest.json', 'master-archive.json', 'src/publications.mjs', 'scripts/search/build-index.mjs', 'scripts/search/create-manifest.mjs', 'scripts/search/extract-corpus.py', 'package-lock.json') }}

      - name: Restore final PDF and EPUB inputs
        if: steps.search-index-cache.outputs.cache-hit != 'true'
        id: search-assets-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .cache/fulltext-assets
            .cache/fulltext-ocr
          key: publish-romero-cafe-assets-${{ hashFiles('assets-manifest.json') }}
          restore-keys: |
            fulltext-assets-

      - name: Ensure full-text extraction tools are available
        if: steps.search-index-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v pdftotext >/dev/null || ! command -v tesseract >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y poppler-utils tesseract-ocr
          fi

      - name: Fetch checksum-verified search inputs
        if: steps.search-index-cache.outputs.cache-hit != 'true'
        run: npm run fetch:search-assets

      - name: Build the exact final full-text search index
        if: steps.search-index-cache.outputs.cache-hit != 'true'
        run: npm run build:search

      - name: Save the exact final full-text search index
        if: steps.search-index-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: dist/search
          key: fulltext-index-${{ hashFiles('assets-manifest.json', 'master-archive.json', 'src/publications.mjs', 'scripts/search/build-index.mjs', 'scripts/search/create-manifest.mjs', 'scripts/search/extract-corpus.py', 'package-lock.json') }}

      - name: Verify the exact final full-text search index
        run: |
          npm run verify:search
          npm test

      - name: Signal search verification
        run: git push --force origin "$GITHUB_SHA:refs/heads/$STATUS_SEARCH"

      - name: Commit the verified site only to the ready branch
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/publish-romero-cafe-20260821-v3.yml
          legacy_workflow_v2=.github/workflows/publish-romero-cafe-20260821-v2.yml
          legacy_workflow_v1=.github/workflows/publish-romero-cafe-20260821.yml
          rm -f "$workflow" "$legacy_workflow_v2" "$legacy_workflow_v1"
          git diff --check
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git switch -c "$READY_BRANCH"
          git add \
            "$workflow" \
            "$legacy_workflow_v2" \
            "$legacy_workflow_v1" \
            REVISION_LOG.md \
            assets-manifest.json \
            master-archive.json \
            scripts/search/verify-queries.mjs \
            src/publications.mjs \
            static/publications/romero-cultivo-cafe-chiapas-1893/cover.jpg \
            tests/archive.test.mjs
          python3 - <<'PY'
          import subprocess

          expected = sorted([
              ".github/workflows/publish-romero-cafe-20260821-v3.yml",
              ".github/workflows/publish-romero-cafe-20260821-v2.yml",
              ".github/workflows/publish-romero-cafe-20260821.yml",
              "REVISION_LOG.md",
              "assets-manifest.json",
              "master-archive.json",
              "scripts/search/verify-queries.mjs",
              "src/publications.mjs",
              "static/publications/romero-cultivo-cafe-chiapas-1893/cover.jpg",
              "tests/archive.test.mjs",
          ])
          actual = sorted(
              subprocess.check_output(
                  ["git", "diff", "--cached", "--name-only"],
                  text=True,
              ).splitlines()
          )
          if actual != expected:
              raise SystemExit(f"unexpected staged paths: {actual}")
          print("verified staged paths:", ", ".join(actual))
          PY
          git commit -m "Publish Romero coffee translation"
          git push origin "HEAD:refs/heads/$READY_BRANCH"
          echo "READY_COMMIT=$(git rev-parse HEAD)"
          git push origin --delete "$STAGING_BRANCH" || true
          for branch in \
            "$STATUS_STARTED" \
            "$STATUS_PAYLOAD" \
            "$STATUS_APPLIED" \
            "$STATUS_INSTALLED" \
            "$STATUS_BUILT" \
            "$STATUS_TESTS" \
            "$STATUS_RELEASE" \
            "$STATUS_SEARCH" \
            codex-status-romero-cafe-20260821-v2-started \
            codex-status-romero-cafe-20260821-v2-payload \
            codex-status-romero-cafe-20260821-v2-tests \
            codex-status-romero-cafe-20260821-v2-release \
            codex-status-romero-cafe-20260821-v2-search
          do
            git push origin --delete "$branch" || true
          done
