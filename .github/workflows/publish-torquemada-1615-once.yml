name: Publish Torquemada 1615 once

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/publish-torquemada-1615-once.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: publication-release
  cancel-in-progress: true

env:
  SLUG: torquemada-monarquia-indiana-1615
  PDF_NAME: Juan_de_Torquemada_Monarquia_indiana_1615_Japanese_Complete_Translation.pdf
  EPUB_NAME: Juan_de_Torquemada_Monarquia_indiana_1615_Japanese_Complete_Translation.epub
  PDF_SHA: 17916055e698be9ca64fec56b3a44686a45f5f9449dde8a554fb55977e1b5335
  EPUB_SHA: fbb1d4cfda027fa7c6abdbd98c61059cb3aca60227a4f2273d5f24f77de67568
  COVER_SHA: d3cf4a5713bc6c2fdda3f6000f601b137971fa5c5dc3f572d2dd8f65cabc7312
  STAGING_BRANCH: agent/publication-upload-torquemada-20260824
  ARCHIVE_COMMIT: a834f50f972a36bd78fa37a1f5449daad2cb5e60
  GH_TOKEN: ${{ github.token }}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out publication source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use isolated publication branch
        run: git checkout -B publish-torquemada-1615 "$GITHUB_SHA"

      - name: Prepare progress reporting
        run: |
          mkdir -p "$RUNNER_TEMP/publication-bin"
          cat > "$RUNNER_TEMP/publication-bin/report-status" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          status="$1"
          detail="${2:-}"
          path="publication-status-torquemada.json"
          endpoint="repos/$GITHUB_REPOSITORY/contents/$path"
          body="$(jq -cn \
            --arg status "$status" \
            --arg detail "$detail" \
            --arg head_sha "$GITHUB_SHA" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg updated_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{status:$status,detail:$detail,head_sha:$head_sha,run_id:$run_id,run_attempt:$run_attempt,updated_at:$updated_at}')"
          encoded="$(printf '%s' "$body" | base64 -w0)"
          sha="$(gh api --method GET "$endpoint" -f ref="$STAGING_BRANCH" --jq .sha 2>/dev/null || true)"
          args=(--method PUT "$endpoint" -f "message=Report Torquemada publication: $status" -f "branch=$STAGING_BRANCH" -f "content=$encoded")
          if test -n "$sha"; then
            args+=(-f "sha=$sha")
          fi
          gh api "${args[@]}" >/dev/null
          SH
          chmod +x "$RUNNER_TEMP/publication-bin/report-status"
          "$RUNNER_TEMP/publication-bin/report-status" started

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install PDF inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Restore verified PDF and EPUB cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .cache/fulltext-assets
            .cache/fulltext-ocr
          key: fulltext-assets-${{ hashFiles('assets-manifest.json') }}
          restore-keys: |
            fulltext-assets-

      - name: Reconstruct and verify release payload
        id: payload
        run: |
          bundle="$RUNNER_TEMP/torquemada-public-assets.tar.gz"
          : > "$bundle"
          for sha in \
            3d3bd18895458a03a02dd1ec389124b7408669c5 3d5c8d440e3ec7dc6f6281919e303413992aa160 a563cf5e3298c526ed3ddd1dc322dc230d70449c dc644cbf68f6816b4e26904e7ad32cecd6bb8ef9 e637caee6a69dcc4d61df4ad93d575abe60410f9 \
            38c543c043f68b15fb0ebccfc5048cbfe210efb2 79087be46d461e83f913d22a36bb07947ef7de26 7edd179c855b3ecf48b4a2239eab358a29d99ab8 aa88b573bc72949c4712daf7448e5b608c76aa50 e6a115351b0db6424133c2f2a3a487e4973e6ff2 \
            6e275d63d8a832ad9f1ad47c14256ee1da302e7c f42992c62342b932118c6b7e38b0e4318593ead2 5cb78359dda52b9c41bb4d0c1eea0dd9db7008e6 84c548a302af3ddc75cdd6172140f172c4625f89 2b5397611039f6ee040e2384ec92c6253799de2b \
            4a3c2ae6b2da5b4dc08197582f778f7976e28be5 5b234793bd84ddad220888af4dc480269cb0df4d ea960286edfa2e82aa3d44d67ec6b0cbee380e0d 505b95c4c5339899f151bb2864b29d326c81c03d 5be5eb2602dd94c093c86642536c26a660e79d08 \
            4613218ca24a59260dcf5d39a7b9c83b94ea7da0 8a17d9f3800433fd587866a19c646579f99530ff cac3682d893042bf65cab46938450ca3ea740747 64be55e8049ebbd40ae33a2facdc599add9301e0 6040a045d13714bb2fc10cb05cf9a90ff7cd9a63 \
            281444ad350ba011356c43422900cfd74058ff92 b5d2fdb695e1efb43b172c1cd12b4b88bcd0c64a 48e431be8c7a346c5017e1a29cfd64d313595bb2 967f637604cea8b5d8a92e7aaa854d8e6849964a ea4fb138f16adb2d0422d3ab2f2c8277ee866199 \
            dec8cba2b6707dd70b6d098a47c68787f376d6a9 f2de5518ad9d166f1eecd1852853737ec5546258 e6d6d8309f38d963e2e7b27ebe7b17564df09c28 68c5348089d2617c08a341f996cd1de568e97b37 aac193b1f298d5f68e52fe68ef25570b9d74b189 \
            855eeb519e087b080ae302ad1f70cea075c74868 07c4b363f5021d9e4a523a52d06191e7058b3a02 8ce557eefd3d4a3c28f87d3e348d0b4594b203a7 589acafa257533dab46420d54782a1fc5b0e61a2 1d4ab2711141f377eb19af66958466b971aa8ef1 \
            7f41add477d22c448953f5e9d2d613d35e483c07 2df416bdd424dae31554d1a3ce042ae13dab8b1e f1d793c705788e3c3a55f24fb6ecebd84028a9d6 384616357ee900ac50a76f1d8fb36060d2215c0b 9aecac4055ddf9a6c93a4e5a8fda13fe7dfb8925 \
            7417df87268e6c147e27dc7be54a683725ce87de 6759bbe2c244e1e8b5f1e8387c0d61b7396eacb8 630791ff420216080f1df08b675566350f407324 7bcea6ea2dbf45b4680655263150eb6161479432 1d88e971837cedeb57f676c0c2475f79cb9ed06c \
            95e18262f15e56d7fd98ee3891144ac366b58d40 ae46dbcf3d25ad9259239ce64a58e27fb5812ee8 81b15a784fffb097d10fe8f8310a5a823bce2524 39c4660f833100259f2d988125426827f5e9bfc3 63ec397a20fd7f999d9b588f688cf728deaf812e \
            775b716e8fbd865a81ccb02bb21af10df9135b9e 7722a91a07201661b62486cdd0dcc5c60062cbcc 27d638da57e590b042934c163cb46474bd7198aa 22a8be8031c8010f6b80106130aa00e5918a6576 c2a58c182f4142c573712c317fef6f7d1ad6ce7d; do
            gh api "repos/$GITHUB_REPOSITORY/git/blobs/$sha" --jq .content |
              tr -d '\n' | base64 -d >> "$bundle"
          done
          test "$(stat -c %s "$bundle")" = "29584790"
          echo "5dee6a9ac3df88f149151a5e7f324d4959586d83f946a03d523ae8df7a6af8b5  $bundle" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/torquemada-release"
          tar -xzf "$bundle" -C "$RUNNER_TEMP/torquemada-release"
          payload="$RUNNER_TEMP/torquemada-release/release-payload"
          test "$(stat -c %s "$payload/$PDF_NAME")" = "28811590"
          test "$(stat -c %s "$payload/$EPUB_NAME")" = "9958534"
          test "$(stat -c %s "$payload/cover.jpg")" = "72583"
          echo "$PDF_SHA  $payload/$PDF_NAME" | sha256sum -c -
          echo "$EPUB_SHA  $payload/$EPUB_NAME" | sha256sum -c -
          echo "$COVER_SHA  $payload/cover.jpg" | sha256sum -c -
          test "$(pdfinfo "$payload/$PDF_NAME" | awk '/^Pages:/ {print $2}')" = "3701"
          unzip -t "$payload/$EPUB_NAME"

      - name: Report verified payload
        run: |
          "$RUNNER_TEMP/publication-bin/report-status" payload_verified

      - name: Update catalogue, archive ledger, and manifests
        id: metadata
        run: |
          python3 - <<'PY'
          import base64
          import json
          from pathlib import Path

          slug = "torquemada-monarquia-indiana-1615"
          record = json.loads(base64.b64decode(""))
          metadata = json.loads(base64.b64decode(""))

          publications_path = Path("src/publications.mjs")
          publications = publications_path.read_text(encoding="utf-8")
          if f'"slug": "{slug}"' in publications:
              raise SystemExit(f"{slug} already exists")
          record_text = "\n".join("  " + line for line in json.dumps(record, ensure_ascii=False, indent=2).splitlines())
          record_marker = "const publicationRecords = [\n"
          if record_marker not in publications:
              raise SystemExit("publication record marker missing")
          publications = publications.replace(record_marker, record_marker + record_text + ",\n", 1)

          metadata_text = "\n".join(json.dumps({slug: metadata}, ensure_ascii=False, indent=2).splitlines()[1:-1])
          metadata_marker = "const publicationMetadata = {\n"
          if metadata_marker not in publications:
              raise SystemExit("publication metadata marker missing")
          publications = publications.replace(metadata_marker, metadata_marker + metadata_text + ",\n", 1)
          publications_path.write_text(publications, encoding="utf-8")

          archive_path = Path("master-archive.json")
          archive = json.loads(archive_path.read_text(encoding="utf-8"))
          archive_commit = "a834f50f972a36bd78fa37a1f5449daad2cb5e60"
          archive["archive_commit"] = archive_commit
          for fallback in archive.get("release_fallbacks", {}).values():
              fallback["ledger_commit"] = archive_commit
          archive["publications"][slug] = f"publications/{slug}/master.docx"
          archive["publications"] = dict(sorted(archive["publications"].items()))
          archive_path.write_text(json.dumps(archive, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          manifest_path = Path("assets-manifest.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          new_assets = [
              {
                  "path": f"publications/{slug}/Juan_de_Torquemada_Monarquia_indiana_1615_Japanese_Complete_Translation.epub",
                  "url": "https://github.com/takochanchan/takochanchan.github.io/releases/download/publications-current/Juan_de_Torquemada_Monarquia_indiana_1615_Japanese_Complete_Translation.epub",
                  "size": 9958534,
                  "sha256": "fbb1d4cfda027fa7c6abdbd98c61059cb3aca60227a4f2273d5f24f77de67568",
              },
              {
                  "path": f"publications/{slug}/Juan_de_Torquemada_Monarquia_indiana_1615_Japanese_Complete_Translation.pdf",
                  "url": "https://github.com/takochanchan/takochanchan.github.io/releases/download/publications-current/Juan_de_Torquemada_Monarquia_indiana_1615_Japanese_Complete_Translation.pdf",
                  "size": 28811590,
                  "sha256": "17916055e698be9ca64fec56b3a44686a45f5f9449dde8a554fb55977e1b5335",
              },
              {
                  "path": f"publications/{slug}/cover.jpg",
                  "url": f"https://takochanchan.github.io/publications/{slug}/cover.jpg",
                  "size": 72583,
                  "sha256": "d3cf4a5713bc6c2fdda3f6000f601b137971fa5c5dc3f572d2dd8f65cabc7312",
              },
          ]
          existing = {asset["path"] for asset in manifest["assets"]}
          overlap = existing & {asset["path"] for asset in new_assets}
          if overlap:
              raise SystemExit(f"asset entries already exist: {sorted(overlap)}")
          manifest["assets"].extend(new_assets)
          manifest["assets"].sort(key=lambda asset: asset["path"])
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          epub_builder_path = Path("scripts/build-epubs.py")
          epub_builder = epub_builder_path.read_text(encoding="utf-8")
          source_entry = (
              '    "torquemada-monarquia-indiana-1615": SOURCES\n'
              '    / "翻訳サイト"\n'
              '    / "Juan_de_Torquemada_Monarquia_indiana_1615_Japanese_Complete_Translation.docx",\n'
          )
          source_marker = "}\n\nMARKDOWN_SOURCES = {"
          if slug in epub_builder:
              raise SystemExit("EPUB source route already exists")
          if source_marker not in epub_builder:
              raise SystemExit("EPUB source marker missing")
          epub_builder_path.write_text(epub_builder.replace(source_marker, source_entry + "}\n\nMARKDOWN_SOURCES = {", 1), encoding="utf-8")

          validator_path = Path("scripts/validate-epubs.py")
          validator = validator_path.read_text(encoding="utf-8")
          old_validator = 'assert len(items) == 260, f"expected 260 publications, found {len(items)}"'
          new_validator = 'assert len(items) == 261, f"expected 261 publications, found {len(items)}"'
          if validator.count(old_validator) != 1:
              raise SystemExit("EPUB publication count marker missing")
          validator_path.write_text(validator.replace(old_validator, new_validator), encoding="utf-8")

          tests_path = Path("tests/archive.test.mjs")
          tests = tests_path.read_text(encoding="utf-8")
          replacements = {
              "assert.equal(publications.length, 260);": "assert.equal(publications.length, 261);",
              "assert.equal(majorPublications.length, 123);": "assert.equal(majorPublications.length, 124);",
              'assert.match(html, /id="book-match-count">123<\\/strong>件/);': 'assert.match(html, /id="book-match-count">124<\\/strong>件/);',
          }
          for old, new in replacements.items():
              if tests.count(old) != 1:
                  raise SystemExit(f"test count marker missing: {old}")
              tests = tests.replace(old, new)
          tests_path.write_text(tests, encoding="utf-8")

          queries_path = Path("scripts/search/verify-queries.mjs")
          queries = queries_path.read_text(encoding="utf-8")
          query_replacements = {
              'books: 41,\n    papers: 7,': 'books: 42,\n    papers: 7,',
              'books: 22,\n    papers: 5,': 'books: 23,\n    papers: 5,',
              'await verifyCounts("ポ", { books: 52, papers: 11 });': 'await verifyCounts("ポ", { books: 53, papers: 11 });',
              '["グリハルバ", grijalva, 253]': '["グリハルバ", grijalva, 272]',
              '["グリハルバ川", grijalvaRiver, 72]': '["グリハルバ川", grijalvaRiver, 74]',
          }
          for old, new in query_replacements.items():
              if queries.count(old) != 1:
                  raise SystemExit(f"search count marker missing: {old}")
              queries = queries.replace(old, new)
          queries_path.write_text(queries, encoding="utf-8")

          revision_path = Path("REVISION_LOG.md")
          revision = revision_path.read_text(encoding="utf-8")
          heading = "# 改訂記録\n"
          entry = base64.b64decode("").decode("utf-8")
          if heading not in revision or slug in revision:
              raise SystemExit("revision log marker missing or duplicate")
          revision_path.write_text(revision.replace(heading, heading + "\n" + entry, 1), encoding="utf-8")
          PY

          payload="$RUNNER_TEMP/torquemada-release/release-payload"
          mkdir -p "static/publications/$SLUG"
          cp "$payload/cover.jpg" "static/publications/$SLUG/cover.jpg"
          mkdir -p "$RUNNER_TEMP/release-tree/publications/$SLUG"
          cp "$payload/$PDF_NAME" "$RUNNER_TEMP/release-tree/publications/$SLUG/$PDF_NAME"
          cp "$payload/$EPUB_NAME" "$RUNNER_TEMP/release-tree/publications/$SLUG/$EPUB_NAME"
          cp "$payload/cover.jpg" "$RUNNER_TEMP/release-tree/publications/$SLUG/cover.jpg"
          mkdir -p ".cache/fulltext-assets/publications/$SLUG"
          cp "$payload/$PDF_NAME" ".cache/fulltext-assets/publications/$SLUG/$PDF_NAME"
          cp "$payload/$EPUB_NAME" ".cache/fulltext-assets/publications/$SLUG/$EPUB_NAME"

      - name: Report prepared publication metadata
        run: |
          "$RUNNER_TEMP/publication-bin/report-status" metadata_prepared

      - name: Install build dependencies
        run: npm ci

      - name: Ensure PDF text and OCR tools are available
        run: |
          if ! command -v pdftotext || ! command -v tesseract; then
            sudo apt-get update
            sudo apt-get install -y poppler-utils tesseract-ocr
          fi

      - name: Validate EPUB, site build, and full-text search before release
        id: gate
        run: |
          "$RUNNER_TEMP/publication-bin/report-status" indexing_and_tests
          python3 scripts/validate-epubs.py "$RUNNER_TEMP/release-tree" --slug "$SLUG"
          npm run build
          npm run fetch:search-assets
          npm run build:search
          npm run verify:search
          npm test

      - name: Report passed pre-publication gate
        run: |
          "$RUNNER_TEMP/publication-bin/report-status" prepublication_gate_passed

      - name: Save verified asset cache
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            .cache/fulltext-assets
            .cache/fulltext-ocr
          key: fulltext-assets-${{ hashFiles('assets-manifest.json') }}

      - name: Save verified search index
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: dist/search
          key: fulltext-index-torquemada-v1-${{ hashFiles('assets-manifest.json', 'master-archive.json', 'src/publications.mjs', 'scripts/search/build-index.mjs', 'scripts/search/create-manifest.mjs', 'scripts/search/extract-corpus.py', 'package-lock.json') }}

      - name: Confirm remote main is unchanged
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"

      - name: Upload and re-download verified Release assets
        id: release
        run: |
          payload="$RUNNER_TEMP/torquemada-release/release-payload"
          checksum_dir="$RUNNER_TEMP/release-checksums"
          verify_dir="$RUNNER_TEMP/release-verify"
          mkdir -p "$checksum_dir" "$verify_dir"
          gh release download publications-current --pattern SHA256SUMS.txt --dir "$checksum_dir"
          python3 - "$checksum_dir/SHA256SUMS.txt" <<'PY'
          import sys
          from pathlib import Path
          path = Path(sys.argv[1])
          additions = {
              "Juan_de_Torquemada_Monarquia_indiana_1615_Japanese_Complete_Translation.pdf":
                  "17916055e698be9ca64fec56b3a44686a45f5f9449dde8a554fb55977e1b5335",
              "Juan_de_Torquemada_Monarquia_indiana_1615_Japanese_Complete_Translation.epub":
                  "fbb1d4cfda027fa7c6abdbd98c61059cb3aca60227a4f2273d5f24f77de67568",
          }
          kept = []
          for line in path.read_text(encoding="utf-8").splitlines():
              if not line.strip():
                  continue
              name = line.split("  ", 1)[1] if "  " in line else ""
              if name not in additions:
                  kept.append(line)
          kept.extend(f"{digest}  {name}" for name, digest in additions.items())
          kept.sort(key=lambda line: line.split("  ", 1)[1])
          path.write_text("\n".join(kept) + "\n", encoding="utf-8")
          PY
          gh release upload publications-current \
            "$payload/$PDF_NAME" \
            "$payload/$EPUB_NAME" \
            "$checksum_dir/SHA256SUMS.txt" \
            --clobber
          gh release download publications-current \
            --pattern "$PDF_NAME" \
            --pattern "$EPUB_NAME" \
            --pattern SHA256SUMS.txt \
            --dir "$verify_dir"
          test "$(stat -c %s "$verify_dir/$PDF_NAME")" = "28811590"
          test "$(stat -c %s "$verify_dir/$EPUB_NAME")" = "9958534"
          echo "$PDF_SHA  $verify_dir/$PDF_NAME" | sha256sum -c -
          echo "$EPUB_SHA  $verify_dir/$EPUB_NAME" | sha256sum -c -
          grep -Fx "$PDF_SHA  $PDF_NAME" "$verify_dir/SHA256SUMS.txt"
          grep -Fx "$EPUB_SHA  $EPUB_NAME" "$verify_dir/SHA256SUMS.txt"
          test "$(pdfinfo "$verify_dir/$PDF_NAME" | awk '/^Pages:/ {print $2}')" = "3701"
          unzip -t "$verify_dir/$EPUB_NAME"

      - name: Report verified Release assets
        run: |
          "$RUNNER_TEMP/publication-bin/report-status" release_verified

      - name: Commit verified publication
        id: publish
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            src/publications.mjs \
            master-archive.json \
            assets-manifest.json \
            scripts/build-epubs.py \
            scripts/validate-epubs.py \
            scripts/search/verify-queries.mjs \
            tests/archive.test.mjs \
            REVISION_LOG.md \
            "static/publications/$SLUG/cover.jpg"
          git rm .github/workflows/publish-torquemada-1615-once.yml
          git commit -m "Publish Torquemada Monarquía indiana 1615"
          git push origin HEAD:main
          final_sha="$(git rev-parse HEAD)"
          echo "sha=$final_sha" >> "$GITHUB_OUTPUT"
          encoded_branch="$(python3 -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["STAGING_BRANCH"], safe=""))')"
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$encoded_branch" >/dev/null 2>&1 || true

      - name: Deploy verified site
        env:
          FINAL_SHA: ${{ steps.publish.outputs.sha }}
        run: |
          gh workflow run pages.yml --ref main
          run_id=""
          for attempt in $(seq 1 40); do
            run_id="$(gh run list --workflow pages.yml --branch main --event workflow_dispatch --limit 30 \
              --json databaseId,headSha,createdAt \
              --jq ".[] | select(.headSha == \"$FINAL_SHA\") | .databaseId" | head -1)"
            test -n "$run_id" && break
            sleep 5
          done
          test -n "$run_id"
          gh run watch "$run_id" --exit-status

      - name: Verify live publication
        id: live
        run: |
          site="https://takochanchan.github.io"
          page="$site/publications/$SLUG/"
          for attempt in $(seq 1 24); do
            if curl -fsSL "$page" -o "$RUNNER_TEMP/live-page.html" &&
               grep -Fq "インディア王国誌" "$RUNNER_TEMP/live-page.html"; then
              break
            fi
            sleep 10
          done
          grep -Fq "インディア王国誌" "$RUNNER_TEMP/live-page.html"
          curl -fsSL "$site/sitemap-books.xml" | grep -Fq "$site/publications/$SLUG/"
          curl -fsSL "$site/search/search-meta.json" -o "$RUNNER_TEMP/search-meta.json"
          jq -e --arg slug "$SLUG" '.workSlugs | index($slug) != null' "$RUNNER_TEMP/search-meta.json"
          curl -fsSL "$site/search/maps/$SLUG.json" -o "$RUNNER_TEMP/search-map.json"
          jq -e \
            --arg url "/publications/$SLUG/" \
            --arg sha "$PDF_SHA" \
            '.canonicalUrl == $url and .pdfSha256 == $sha and (.blocks | length) > 0' \
            "$RUNNER_TEMP/search-map.json"
          curl -fsSL "https://github.com/takochanchan/takochanchan.github.io/releases/download/publications-current/SHA256SUMS.txt" \
            -o "$RUNNER_TEMP/live-SHA256SUMS.txt"
          grep -Fx "$PDF_SHA  $PDF_NAME" "$RUNNER_TEMP/live-SHA256SUMS.txt"
          grep -Fx "$EPUB_SHA  $EPUB_NAME" "$RUNNER_TEMP/live-SHA256SUMS.txt"

      - name: Report pre-publication failure
        if: failure() && steps.publish.outcome != 'success'
        env:
          DETAIL: payload=${{ steps.payload.outcome }},metadata=${{ steps.metadata.outcome }},gate=${{ steps.gate.outcome }},release=${{ steps.release.outcome }}
        run: |
          "$RUNNER_TEMP/publication-bin/report-status" failed "$DETAIL"
