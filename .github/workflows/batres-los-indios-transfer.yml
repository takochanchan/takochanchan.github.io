name: Transfer approved Batres Los indios publication files
on:
  push:
    branches: [agent/batres-los-indios-publish-20261005]
    paths: [.publication-upload-requests/batres-los-indios-1894.json]
permissions:
  contents: write
concurrency:
  group: publication-release-transfer
  cancel-in-progress: false
jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run build && npm test
      - name: Upload and verify final PDF and EPUB files
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .publication-transfer/transfer-batres-los-indios.py
      - uses: actions/upload-artifact@v4
        with:
          name: batres-public-verification
          path: batres-public-verification.json
