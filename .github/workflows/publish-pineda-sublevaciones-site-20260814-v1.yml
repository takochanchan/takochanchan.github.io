name: Publish Vicente Pineda sublevaciones translation

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/publish-pineda-sublevaciones-site-20260814-v1.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: publish-pineda-sublevaciones-site-20260814-v1
  cancel-in-progress: false

jobs:
  publish-site:
    runs-on: ubuntu-latest
    env:
      EXPECTED_PARENT: 2499d43b5b28f97437ed95adee6d4215f5a8e6ea
      EXPECTED_BASE: 7e5e0632a7bd2c52a0af8d45878f9e4b78000253
      EXPECTED_STAGE_COMMIT: bfce1b32c657f92690aafbd5e2436a82b1606c6e
      EXPECTED_TARGET_TREE: 058cc1706ffcc07dbe044913283cb48029322e8d
      STAGING_BRANCH: site-staging-pineda-sublevaciones-20260814-v1
      WORKFLOW_PATH: .github/workflows/publish-pineda-sublevaciones-site-20260814-v1.yml
      PINEDA_SLUG: pineda-sublevaciones-indigenas-chiapas-1888
    steps:
      - name: Check out publication branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import checksum-pinned catalogue files
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git diff --name-only "$EXPECTED_PARENT" HEAD)" = "$WORKFLOW_PATH"
          git fetch origin "$STAGING_BRANCH:refs/remotes/origin/$STAGING_BRANCH"
          test "$(git rev-parse "refs/remotes/origin/$STAGING_BRANCH")" = "$EXPECTED_STAGE_COMMIT"
          actual=/tmp/pineda-stage-files.txt
          expected=/tmp/pineda-expected-files.txt
          git diff --name-status "$EXPECTED_BASE" "refs/remotes/origin/$STAGING_BRANCH" | LC_ALL=C sort > "$actual"
          printf '%s\n' \
            "A	static/publications/pineda-sublevaciones-indigenas-chiapas-1888/cover.jpg" \
            "M	REVISION_LOG.md" \
            "M	assets-manifest.json" \
            "M	master-archive.json" \
            "M	scripts/search/verify-queries.mjs" \
            "M	scripts/validate-epubs.py" \
            "M	src/publications.mjs" \
            "M	tests/archive.test.mjs" | LC_ALL=C sort > "$expected"
          cmp "$expected" "$actual"
          while IFS= read -r target; do
            mkdir -p "$(dirname "$target")"
            git show "refs/remotes/origin/$STAGING_BRANCH:$target" > "$target"
          done < <(cut -f2 "$expected")
          git rm "$WORKFLOW_PATH"
          git add \
            REVISION_LOG.md \
            assets-manifest.json \
            master-archive.json \
            scripts/search/verify-queries.mjs \
            scripts/validate-epubs.py \
            src/publications.mjs \
            tests/archive.test.mjs \
            static/publications/pineda-sublevaciones-indigenas-chiapas-1888/cover.jpg

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate archive gate and catalogue
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
          node --test tests/archive.test.mjs

      - name: Restore final PDF and EPUB inputs
        uses: actions/cache@v4
        with:
          path: |
            .cache/fulltext-assets
            .cache/fulltext-ocr
          key: fulltext-assets-${{ hashFiles('assets-manifest.json') }}
          restore-keys: |
            fulltext-assets-

      - name: Install text extraction tools
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v pdftotext || ! command -v tesseract; then
            sudo apt-get update
            sudo apt-get install -y poppler-utils tesseract-ocr
          fi

      - name: Fetch checksum-verified full-text inputs
        shell: bash
        run: |
          set -euo pipefail
          npm run fetch:search-assets

      - name: Validate the new reflowable EPUB
        shell: bash
        run: |
          set -euo pipefail
          epub_path="$(node --input-type=module - <<'NODE'
          import { publications } from "./src/publications.mjs";
          const item = publications.find(
            (publication) =>
              publication.slug === "pineda-sublevaciones-indigenas-chiapas-1888",
          );
          if (!item) process.exit(1);
          process.stdout.write(item.epub);
          NODE
          )"
          mkdir -p "dist/$(dirname "$epub_path")"
          cp ".cache/fulltext-assets/$epub_path" "dist/$epub_path"
          python3 scripts/validate-epubs.py dist --slug "$PINEDA_SLUG"

      - name: Cache current search inputs
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            .cache/fulltext-assets
            .cache/fulltext-ocr
          key: fulltext-assets-${{ hashFiles('assets-manifest.json') }}

      - name: Build full-text search
        shell: bash
        run: |
          set -euo pipefail
          npm run build:search

      - name: Cache current full-text index
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: dist/search
          key: fulltext-index-${{ hashFiles('assets-manifest.json', 'master-archive.json', 'src/publications.mjs', 'scripts/search/build-index.mjs', 'scripts/search/create-manifest.mjs', 'scripts/search/extract-corpus.py', 'package-lock.json') }}

      - name: Verify full publication
        shell: bash
        run: |
          set -euo pipefail
          npm run verify:search
          npm test
          test "$(grep -Fc 'pineda-sublevaciones-indigenas-chiapas-1888' dist/sitemap-books.xml)" = 1
          test -f "dist/publications/$PINEDA_SLUG/index.html"
          grep -Fq "チアパス州で起きた先住民蜂起の歴史" "dist/publications/$PINEDA_SLUG/index.html"
          grep -Fq "UANL公開画像は転載・切り抜きせず" "dist/publications/$PINEDA_SLUG/index.html"

      - name: Commit and publish validated site
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Publication Bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Publish Vicente Pineda sublevaciones Japanese translation"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TARGET_TREE"
          git push origin HEAD:main

      - name: Remove staging branch and start Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --silent --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$STAGING_BRANCH"
          final_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          final_tree="$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$final_sha" --jq .tree.sha)"
          test "$final_tree" = "$EXPECTED_TARGET_TREE"
          gh workflow run pages.yml --ref main
