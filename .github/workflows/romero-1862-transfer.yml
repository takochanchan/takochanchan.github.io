name: Transfer checksum-pinned Romero Michoacán 1862 assets
on:
  push:
    branches: ["agent/romero-1862-transfer"]
    paths: [".publication-upload-requests/romero-michoacan-diocesan-history-1862.json"]
permissions:
  contents: write
concurrency:
  group: publication-release-transfer
  cancel-in-progress: false
jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install build dependencies
        run: npm ci --no-audit --no-fund
      - name: Build and test the publication catalogue
        run: npm run build && npm test
      - name: Reconstruct, upload, and verify publication PDF and EPUB
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .publication-transfer/transfer-romero-1862.py
      - uses: actions/upload-artifact@v4
        with:
          name: romero-1862-release-verification
          path: romero-1862-release-verification.json
