name: Publish Berendt release assets

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-berendt-release.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Reassemble release assets
        env:
          GH_TOKEN: ${{ github.token }}
          PDF_CHUNKS: "d2ebceac27d9b891b332aa70c28ec3ba3264459d 2a5410fb56693c4296550b8b827393e88b924166 4a3d2311512859ab3a0ce629237de05d0bc39286"
          EPUB_CHUNKS: "ec7feb16e28dc9931452e1cc19ff790cea2ac142"
          SUMS_CHUNKS: "9b6256185f819aeecdba31e6ede5fa4d6ffa546e"
        run: |
          set -euo pipefail
          pdf=Carl_Hermann_Berendt_Report_of_Explorations_in_Central_America_1867_Japanese_Complete_Translation.pdf
          epub=Carl_Hermann_Berendt_Report_of_Explorations_in_Central_America_1867_Japanese_Complete_Translation.epub
          sums=SHA256SUMS.txt
          : > "$pdf"
          : > "$epub"
          : > "$sums"
          for chunk in $PDF_CHUNKS; do
            gh api "repos/$GITHUB_REPOSITORY/git/blobs/$chunk" --jq .content | tr -d '\n' | base64 --decode >> "$pdf"
          done
          for chunk in $EPUB_CHUNKS; do
            gh api "repos/$GITHUB_REPOSITORY/git/blobs/$chunk" --jq .content | tr -d '\n' | base64 --decode >> "$epub"
          done
          for chunk in $SUMS_CHUNKS; do
            gh api "repos/$GITHUB_REPOSITORY/git/blobs/$chunk" --jq .content | tr -d '\n' | base64 --decode >> "$sums"
          done
          echo "45f97da2006ea5e41d16b7667c3f843170b0928ef4a8cc42dbd03c6eb8c6faa6  $pdf" | sha256sum -c -
          echo "1c80e8ce174ed01585be6a7e6efae202e6978fdaa623aadde248bff967f58c82  $epub" | sha256sum -c -
          echo "a6eda74a61a30b6d9525e18b6e5294676ec5a7971e605f2a36292b86c53be096  $sums" | sha256sum -c -
          test "$(stat -c %s "$pdf")" = 491863
          test "$(stat -c %s "$epub")" = 34657
          test "$(stat -c %s "$sums")" = 14689

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload publications-current \
            Carl_Hermann_Berendt_Report_of_Explorations_in_Central_America_1867_Japanese_Complete_Translation.pdf \
            Carl_Hermann_Berendt_Report_of_Explorations_in_Central_America_1867_Japanese_Complete_Translation.epub \
            SHA256SUMS.txt \
            --clobber \
            --repo "$GITHUB_REPOSITORY"

      - name: Remove release staging branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api \
            --method DELETE \
            "repos/$GITHUB_REPOSITORY/git/refs/heads/agent/release-assets-berendt-central-america-explorations-1867"

      - name: Remove one-time workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          path=.github/workflows/publish-berendt-release.yml
          sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/$path?ref=main" --jq .sha 2>/dev/null || true)"
          if test -z "$sha"; then
            exit 0
          fi
          gh api \
            --method DELETE \
            "repos/$GITHUB_REPOSITORY/contents/$path" \
            -f message="Remove one-time Berendt release workflow" \
            -f sha="$sha" \
            -f branch=main
