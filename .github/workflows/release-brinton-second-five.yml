name: Upload Brinton second five-paper assets

on:
  push:
    branches: ["agent/brinton-second-five-release"]

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload PDF and EPUB files
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload publications-current release-staging/* --clobber
