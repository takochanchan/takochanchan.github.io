name: Upload Brinton second five-paper assets

on:
  push:
    branches: ["agent/brinton-second-five-release"]

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble and replace large PDF files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir release-output
          for name in \
            Daniel_G_Brinton_Notes_on_the_Mangue_1886_Japanese_Complete_Translation.pdf \
            Daniel_G_Brinton_On_the_Chane_Abal_Tribe_and_Dialect_of_Chiapas_1888_Japanese_Complete_Translation.pdf \
            Daniel_G_Brinton_The_Battle_and_the_Ruins_of_Cintla_1896_Japanese_Complete_Translation.pdf
          do
            cat release-staging/chunks/"$name".part* > release-output/"$name"
          done
          gh release upload publications-current release-output/* --clobber
