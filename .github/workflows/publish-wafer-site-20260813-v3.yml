name: Publish Lionel Wafer translation v3

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/publish-wafer-site-20260813-v3.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: publish-wafer-site-20260813-v3
  cancel-in-progress: false

jobs:
  publish-site:
    runs-on: ubuntu-latest
    env:
      EXPECTED_PARENT: 6d66bd384af1021ccd42a0ae3f42cbbabc27ea7e
      EXPECTED_STAGE_COMMIT: 0ec73c305809401eeba53a29eaf1352f9f9724c4
      EXPECTED_TARGET_TREE: a9b2d9c92d84d259ac556255d1ad67bc063e02ca
      STAGING_BRANCH: publish-staging-wafer-site-20260813-v3
      WORKFLOW_PATH: .github/workflows/publish-wafer-site-20260813-v3.yml
    steps:
      - name: Check out publication branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import checksum-pinned catalogue files
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git diff --name-only "$EXPECTED_PARENT" HEAD)" = "$WORKFLOW_PATH"
          git fetch origin "$STAGING_BRANCH:refs/remotes/origin/$STAGING_BRANCH"
          test "$(git rev-parse "refs/remotes/origin/$STAGING_BRANCH")" = "$EXPECTED_STAGE_COMMIT"
          actual=/tmp/wafer-stage-files.txt
          expected=/tmp/wafer-expected-files.txt
          git diff --name-status "$EXPECTED_PARENT" "refs/remotes/origin/$STAGING_BRANCH" | LC_ALL=C sort > "$actual"
          printf '%s\n'             "A	static/publications/wafer-new-voyage-isthmus-america-1699/cover.jpg"             "M	REVISION_LOG.md"             "M	assets-manifest.json"             "M	scripts/validate-epubs.py"             "M	src/publications.mjs"             "M	tests/archive.test.mjs" | LC_ALL=C sort > "$expected"
          cmp "$expected" "$actual"
          while IFS= read -r target; do
            mkdir -p "$(dirname "$target")"
            git show "refs/remotes/origin/$STAGING_BRANCH:$target" > "$target"
          done < <(cut -f2 "$expected")
          git rm "$WORKFLOW_PATH"
          git add REVISION_LOG.md assets-manifest.json scripts/validate-epubs.py src/publications.mjs tests/archive.test.mjs static/publications/wafer-new-voyage-isthmus-america-1699/cover.jpg

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate archive gate and catalogue before cache restore
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
          node --test tests/archive.test.mjs

      - name: Restore final PDF and EPUB inputs
        uses: actions/cache@v4
        with:
          path: |
            .cache/fulltext-assets
            .cache/fulltext-ocr
          key: fulltext-assets-${{ hashFiles('assets-manifest.json') }}
          restore-keys: |
            fulltext-assets-

      - name: Install text extraction tools
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v pdftotext || ! command -v tesseract; then
            sudo apt-get update
            sudo apt-get install -y poppler-utils tesseract-ocr
          fi

      - name: Build and validate full-text search
        shell: bash
        run: |
          set -euo pipefail
          npm run fetch:search-assets
          npm run build:search
          npm run verify:search
          npm test

      - name: Cache verified search inputs
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            .cache/fulltext-assets
            .cache/fulltext-ocr
          key: fulltext-assets-${{ hashFiles('assets-manifest.json') }}

      - name: Cache verified full-text index
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: dist/search
          key: fulltext-index-${{ hashFiles('assets-manifest.json', 'master-archive.json', 'src/publications.mjs', 'scripts/search/build-index.mjs', 'scripts/search/create-manifest.mjs', 'scripts/search/extract-corpus.py', 'package-lock.json') }}

      - name: Commit and publish validated site
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Publication Bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Publish Lionel Wafer Japanese translation"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TARGET_TREE"
          git push origin HEAD:main

      - name: Remove staging branches and start Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for branch in "$STAGING_BRANCH" publish-staging-wafer-site-20260813-v1 publish-staging-wafer-site-20260813-v2; do
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch"
          done
          final_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          final_tree="$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$final_sha" --jq .tree.sha)"
          test "$final_tree" = "$EXPECTED_TARGET_TREE"
          gh workflow run pages.yml --ref main
