name: Redeploy corrected Brinton site

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/redeploy-corrected-brinton-site.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Remove one-time redeploy trigger
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          path=.github/workflows/redeploy-corrected-brinton-site.yml
          sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/$path?ref=main" --jq .sha)"
          gh api --method DELETE \
            "repos/$GITHUB_REPOSITORY/contents/$path" \
            -f message="Remove completed Brinton redeploy trigger" \
            -f sha="$sha" \
            -f branch=main
