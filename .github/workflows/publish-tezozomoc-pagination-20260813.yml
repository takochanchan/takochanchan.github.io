name: Publish Tezozomoc pagination correction

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/publish-tezozomoc-pagination-20260813.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: publication-release-update
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      STAGING_BRANCH: publication-staging-tezozomoc-pagination-20260813
      STAGING_ROOT: .publication-staging/tezozomoc-pagination-20260813
      WORKFLOW_PATH: .github/workflows/publish-tezozomoc-pagination-20260813.yml
      RELEASE_TAG: publications-current
      EPUB_NAME: Hernando_Alvarado_Tezozomoc_Cronica_Mexicana_Kraus117_Japanese_Complete_Translation.epub
      PDF_NAME: Hernando_Alvarado_Tezozomoc_Cronica_Mexicana_Kraus117_Japanese_Complete_Translation.pdf
      EPUB_SHA: 947be54aed8302b00fca7bb30f4f0e81bed84b7d926dc959f0b08489749a9bb7
      PDF_SHA: c5d76fb73523212956fd9344eab62836f547078755fcd6ce0dcffc9f41b79e10
    steps:
      - name: Check out checksum-pinned staging revision
        uses: actions/checkout@v4
        with:
          ref: publication-staging-tezozomoc-pagination-20260813

      - name: Reconstruct and validate release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          cat "$STAGING_ROOT"/pdf.part-* | iconv -f UTF-8 -t ISO-8859-1 | base64 -d > "release/$PDF_NAME"
          iconv -f UTF-8 -t ISO-8859-1 "$STAGING_ROOT/epub.b64" | base64 -d > "release/$EPUB_NAME"
          test "$(stat -c%s "release/$PDF_NAME")" = 3715315
          test "$(stat -c%s "release/$EPUB_NAME")" = 632593
          test "$(sha256sum "release/$PDF_NAME" | cut -d' ' -f1)" = "$PDF_SHA"
          test "$(sha256sum "release/$EPUB_NAME" | cut -d' ' -f1)" = "$EPUB_SHA"
          pdfinfo "release/$PDF_NAME" | grep -q '^Pages:[[:space:]]*513$'
          unzip -t "release/$EPUB_NAME" >/dev/null

      - name: Update release checksum index
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p current
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS.txt --dir current
          python - <<'PY'
          import os, pathlib
          sums = pathlib.Path("current/SHA256SUMS.txt")
          names = {
              os.environ["EPUB_NAME"]: os.environ["EPUB_SHA"],
              os.environ["PDF_NAME"]: os.environ["PDF_SHA"],
          }
          lines = sums.read_text().splitlines()
          seen = set()
          out = []
          for line in lines:
              parts = line.split(None, 1)
              if len(parts) == 2 and parts[1].lstrip("*") in names:
                  name = parts[1].lstrip("*")
                  out.append(f"{names[name]}  {name}")
                  seen.add(name)
              else:
                  out.append(line)
          assert seen == set(names), seen
          sums.write_text("\n".join(out) + "\n")
          PY

      - name: Atomically replace fixed-name public assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if gh release upload "$RELEASE_TAG" \
              "release/$PDF_NAME" \
              "release/$EPUB_NAME" \
              current/SHA256SUMS.txt \
              --repo "$GITHUB_REPOSITORY" --clobber; then
              exit 0
            fi
            sleep $((attempt * 10))
          done
          exit 1

      - name: Re-download and verify public release bytes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verify
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "$PDF_NAME" --pattern "$EPUB_NAME" --pattern SHA256SUMS.txt --dir verify
          test "$(sha256sum "verify/$PDF_NAME" | cut -d' ' -f1)" = "$PDF_SHA"
          test "$(sha256sum "verify/$EPUB_NAME" | cut -d' ' -f1)" = "$EPUB_SHA"
          grep -Fxq "$PDF_SHA  $PDF_NAME" verify/SHA256SUMS.txt
          grep -Fxq "$EPUB_SHA  $EPUB_NAME" verify/SHA256SUMS.txt
          cmp "release/$PDF_NAME" "verify/$PDF_NAME"
          cmp "release/$EPUB_NAME" "verify/$EPUB_NAME"

      - name: Install dependencies and stage metadata
        shell: bash
        run: |
          set -euo pipefail
          cp "$STAGING_ROOT/src-publications.mjs" src/publications.mjs
          cp "$STAGING_ROOT/assets-manifest.json" assets-manifest.json
          cp "$STAGING_ROOT/master-archive.json" master-archive.json
          cp "$STAGING_ROOT/archive.test.mjs" tests/archive.test.mjs
          cp "$STAGING_ROOT/REVISION_LOG.md" REVISION_LOG.md
          npm ci

      - name: Build and test the publication site
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          node --test tests/archive.test.mjs

      - name: Commit metadata and remove one-shot inputs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release current verify dist
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          git show "$STAGING_BRANCH:$STAGING_ROOT/src-publications.mjs" > src/publications.mjs
          git show "$STAGING_BRANCH:$STAGING_ROOT/assets-manifest.json" > assets-manifest.json
          git show "$STAGING_BRANCH:$STAGING_ROOT/master-archive.json" > master-archive.json
          git show "$STAGING_BRANCH:$STAGING_ROOT/archive.test.mjs" > tests/archive.test.mjs
          git show "$STAGING_BRANCH:$STAGING_ROOT/REVISION_LOG.md" > REVISION_LOG.md
          rm -f "$WORKFLOW_PATH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/publications.mjs assets-manifest.json master-archive.json tests/archive.test.mjs REVISION_LOG.md "$WORKFLOW_PATH"
          git commit -m "Publish Tezozomoc pagination-corrected edition"
          git push origin main
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$STAGING_BRANCH"
          gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
