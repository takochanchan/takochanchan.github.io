name: Verify Lobo publication before catalogue deployment
on:
  push:
    branches: [agent/lobo-betancur-verify-20260919]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm test
      - run: npm run verify:remote-search
      - name: Remove completed temporary publication branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method DELETE repos/takochanchan/takochanchan.github.io/git/refs/heads/agent/lobo-betancur-publish-20260919
          gh api --method DELETE repos/takochanchan/takochanchan.github.io/git/refs/heads/agent/lobo-betancur-ready-20260919
          gh api --method DELETE repos/takochanchan/takochanchan.github.io/git/refs/heads/agent/lobo-betancur-verify-20260919
