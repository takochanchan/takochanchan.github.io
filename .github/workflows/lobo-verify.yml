name: Verify Lobo publication before catalogue deployment
on:
  push:
    branches: [agent/lobo-betancur-verify-20260919]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm test
      - run: npm run verify:remote-search
