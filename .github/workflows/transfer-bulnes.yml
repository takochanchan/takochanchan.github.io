name: Transfer approved Bulnes publication files
on:
  push:
    branches: [agent/bulnes-publish-20261020]
    paths: [.bulnes-public-request.json]
permissions:
  contents: write
concurrency:
  group: publication-release-transfer
  cancel-in-progress: false
jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Verify approved bytes and prepare catalogue cover
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .bulnes-prepare.py
      - run: npm ci --no-audit --no-fund
      - run: npm run build && npm test
      - name: Save verified catalogue cover
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static/publications/bulnes-juarez-ayutla-reforma-1905/cover.jpg assets-manifest.json
          git commit -m 'Add verified Bulnes catalogue cover'
          git push origin HEAD:agent/bulnes-publish-20261020
      - name: Upload and verify final PDF and EPUB files
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .bulnes-transfer.py
      - uses: actions/upload-artifact@v4
        with:
          name: bulnes-public-verification
          path: bulnes-public-verification.json


