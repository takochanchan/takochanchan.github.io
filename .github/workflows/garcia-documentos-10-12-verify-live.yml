name: Verify live Garcia Documentos X–XII publication
on:
  push:
    branches: [main]
    paths: [src/garcia-documentos-publication.mjs, .github/workflows/garcia-documentos-10-12-verify-live.yml]
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Wait for this catalogue deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,os,subprocess,time
          for attempt in range(90):
              result=json.loads(subprocess.check_output(['gh','api','repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs?head_sha='+os.environ['GITHUB_SHA']]))
              runs=[r for r in result['workflow_runs'] if r['name']=='Deploy archive to GitHub Pages']
              if runs and runs[0]['status']=='completed':
                  assert runs[0]['conclusion']=='success', runs[0]['conclusion']
                  print('Pages succeeded',runs[0]['id'])
                  break
              time.sleep(10)
          else: raise SystemExit('Pages deployment timed out')
          PY
      - name: Install PDF inspection dependency
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Verify live bibliography and exact final assets
        run: |
          python3 - <<'PY'
          import json,hashlib,urllib.request,tempfile,pathlib,zipfile,subprocess
          slug='garcia-documentos-ineditos-mexico-1905-1911'
          slugs=['garcia-documentos-ineditos-mexico-v'+str(n).zfill(2)+'-1907' for n in [10,11,12]]
          url='https://takochanchan.github.io/publications/'+slug+'/'
          html=urllib.request.urlopen(url,timeout=60).read().decode()
          for text in ['公開12巻','ロバーツ図書館','Garcia_Documentos_Ineditos_Mexico_X_1907_Japanese_Complete_Translation.pdf','Garcia_Documentos_Ineditos_Mexico_XI_1907_Japanese_Complete_Translation.epub','Garcia_Documentos_Ineditos_Mexico_XII_1907_Japanese_Complete_Translation.pdf']:
              assert text in html, text
          assets=[a for a in json.load(open('assets-manifest.json'))['assets'] if any(a['path'].startswith('publications/'+member+'/') for member in slugs)]
          root=pathlib.Path(tempfile.mkdtemp())
          for a in assets:
              p=root/pathlib.PurePosixPath(a['path']).name
              with urllib.request.urlopen(a['url'],timeout=120) as response,p.open('wb') as f:
                  while chunk:=response.read(1024*1024): f.write(chunk)
              assert p.stat().st_size==a['size']
              assert hashlib.sha256(p.read_bytes()).hexdigest()==a['sha256']
              if p.suffix=='.epub':
                  with zipfile.ZipFile(p) as z:
                      assert z.testzip() is None
                      assert z.read('mimetype')==b'application/epub+zip'
              if p.suffix=='.pdf':
                  info=subprocess.check_output(['pdfinfo',str(p)],text=True)
                  pages=299 if '_XII_' in p.name else (218 if '_XI_' in p.name else 198)
                  assert any(line.split()==['Pages:',str(pages)] for line in info.splitlines())
              print('VERIFIED',p.name,a['size'],a['sha256'])
          assert len(assets)==9
          print('Live Garcia Documentos X–XII bibliography, PDF pages, EPUB, and cover verified.')
          PY

