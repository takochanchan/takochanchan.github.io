      - name: Verify image and update asset manifest
        shell: bash
        run: |
          set -euo pipefail
          test "$(stat -c %s "$COVER_PATH")" = "$NEW_SIZE"
          echo "$NEW_SHA256  $COVER_PATH" | sha256sum -c -
          python3 - "$COVER_PATH" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          data = path.read_bytes()
          assert data[:2] == b"\xff\xd8" and data[-2:] == b"\xff\xd9"
          sof = {0xC0, 0xC1, 0xC2, 0xC3, 0xC5, 0xC6, 0xC7,
                 0xC9, 0xCA, 0xCB, 0xCD, 0xCE, 0xCF}
          i = 2
          width = height = None
          while i + 8 < len(data):
              if data[i] != 0xFF:
                  i += 1
                  continue
              while i < len(data) and data[i] == 0xFF:
                  i += 1
              marker = data[i]
              i += 1
              if marker in {0xD8, 0xD9}:
                  continue
              length = int.from_bytes(data[i:i+2], "big")
              assert length >= 2
              if marker in sof:
                  height = int.from_bytes(data[i+3:i+5], "big")
                  width = int.from_bytes(data[i+5:i+7], "big")
                  break
              i += length
          assert (width, height) == (1275, 1650), (width, height)
          print(f"JPEG OK: {width}x{height}")
          PY
          node <<'NODE'
          const fs = require("node:fs");
          const manifestPath = process.env.MANIFEST_PATH;
          const data = JSON.parse(fs.readFileSync(manifestPath, "utf8"));
          const targetPath =
            "publications/romero-bosquejo-chiapas-soconusco-1877/cover.jpg";
          const hits = data.assets.filter((item) => item.path === targetPath);
          if (hits.length !== 1) throw new Error(`cover entries: ${hits.length}`);
          const item = hits[0];
          if (item.size !== Number(process.env.OLD_SIZE))
            throw new Error(`unexpected old size: ${item.size}`);
          if (item.sha256 !== process.env.OLD_SHA256)
            throw new Error(`unexpected old SHA256: ${item.sha256}`);
          item.size = Number(process.env.NEW_SIZE);
          item.sha256 = process.env.NEW_SHA256;
          fs.writeFileSync(manifestPath, JSON.stringify(data, null, 2) + "\n");
          NODE

      - name: Build and validate the complete site
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          npm run build
          npm test
          published="dist/publications/romero-bosquejo-chiapas-soconusco-1877/cover.jpg"
          test "$(stat -c %s "$published")" = "$NEW_SIZE"
          echo "$NEW_SHA256  $published" | sha256sum -c -

      - name: Commit the verified correction to main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- "$COVER_PATH" "$MANIFEST_PATH"
          git rm -- .github/workflows/fix-romero-cover-20260811.yml
          expected=$'.github/workflows/fix-romero-cover-20260811.yml\nassets-manifest.json\nstatic/publications/romero-bosquejo-chiapas-soconusco-1877/cover.jpg'
          actual="$(git diff --cached --name-only | sort)"
          test "$actual" = "$expected"
          git commit -m "Fix Romero cover image"
          git push origin HEAD:main
          gh api --method DELETE \
            "repos/$GITHUB_REPOSITORY/git/refs/heads/agent%2Ffix-romero-cover-20260811" \
            >/dev/null 2>&1 || true
