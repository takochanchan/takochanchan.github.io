name: Publish Barraza Aquino complete Japanese translation

on:
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened]
    paths:
      - ".github/barraza-publication-trigger-20260823"

permissions:
  contents: write

concurrency:
  group: publish-barraza-aquino-20260823
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: publications-current
      STAGING_BRANCH: agent/barraza-public-assets-20260823-v1
      READY_BRANCH: agent/barraza-publication-ready-20260823-v1
      SLUG: barraza-anastasio-aquino-2001
      PDF_FILENAME: Jorge_Barraza_Ibarra_La_gesta_de_Anastasio_Aquino_2001_Japanese_Complete_Translation.pdf
      EPUB_FILENAME: Jorge_Barraza_Ibarra_La_gesta_de_Anastasio_Aquino_2001_Japanese_Complete_Translation.epub
      SOURCE_SITE_COMMIT: c77c273425004238757d742d646cafe98c035003
      TRIGGER_FILE: .github/barraza-publication-trigger-20260823
      BASE_MAIN_COMMIT: ${{ github.event.pull_request.base.sha }}
      TRIGGER_HEAD_COMMIT: ${{ github.event.pull_request.head.sha }}
      ARCHIVE_COMMIT: 1e0beb2b0f1318f36632b25d09c0e6796193fd17
      PAYLOAD_SHA256: 2634d27e59c04eb9604c87943dd7c464e814ab49058a0847a431cc781164bdc1
      PAYLOAD_SIZE: "26630613"
      PAYLOAD_PARTS: "51"
      PDF_SHA256: 9a5fd6b51e069cd8c7fb822bfd3650e90b5c7447d17d04beeb1ed3815121d046
      PDF_SIZE: "9823467"
      EPUB_SHA256: f47d5dee6e56e2c6b01c7e0d7a77c339ff6fd1973de0d1ea63ba7ad2b37de512
      EPUB_SIZE: "17559754"
      COVER_SHA256: e18659e1b2e986719083e6ba823a1e2dbb295ef8bd9249717b3da7ce1b6ec611
      COVER_SIZE: "63661"
      BIBLIOGRAPHY_SHA256: 4eff1b4663743e3feaa838f7d9cbfa61055f2d3b042bee5b4ceafb7a3bb8591c
      GATE_SHA256: e780ac9b678d7dcaeb9d550c491731ca186fd1d9ad47a7aa85c9dcc382b192a5
      REPORT_SHA256: 26b509bbee5c527cca61cc36832a3b55b67d149f360cba5add83e747ee477b59
      APPLY_SHA256: 1bbd87a8d94fa6fa991b95e511e297ae2eeb81268e3d7d386ab4e8d9d91da4d4
    steps:
      - name: Check out the publication trigger commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Validate the trigger provenance
        shell: bash
        run: |
          set -euo pipefail
          if test "$(git rev-parse HEAD)" != "$TRIGGER_HEAD_COMMIT"; then
            echo "checked-out commit is not the recorded trigger head" >&2
            exit 1
          fi
          if test "$(git rev-parse HEAD^)" != "$BASE_MAIN_COMMIT"; then
            echo "publication trigger parent is not the recorded main commit" >&2
            exit 1
          fi
          if test "$(git rev-parse "$BASE_MAIN_COMMIT^")" != "$SOURCE_SITE_COMMIT"; then
            echo "publication workflow bootstrap is not based on the reviewed site commit" >&2
            exit 1
          fi
          if test "$(git diff --name-only HEAD^ HEAD)" != "$TRIGGER_FILE"; then
            echo "publication trigger commit contains an unexpected path" >&2
            exit 1
          fi

      - name: Check out the checksum-locked payload
        uses: actions/checkout@v4
        with:
          ref: ${{ env.STAGING_BRANCH }}
          path: staging
          sparse-checkout: release-staging/barraza-20260823
          sparse-checkout-cone-mode: false

      - name: Reconstruct and verify the publication payload
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          source = Path("staging/release-staging/barraza-20260823")
          parts = sorted(source.glob("chunk-*"))
          count = int(os.environ["PAYLOAD_PARTS"])
          expected = [f"chunk-{index:04d}" for index in range(count)]
          if [part.name for part in parts] != expected:
              raise SystemExit("payload part set is incomplete or unexpected")
          output = Path(os.environ["RUNNER_TEMP"]) / "barraza-public-release.tar.gz"
          digest = hashlib.sha256()
          size = 0
          with output.open("wb") as destination:
              for part in parts:
                  block = part.read_bytes()
                  destination.write(block)
                  digest.update(block)
                  size += len(block)
          if size != int(os.environ["PAYLOAD_SIZE"]):
              raise SystemExit(f"payload size {size} is not expected")
          if digest.hexdigest() != os.environ["PAYLOAD_SHA256"]:
              raise SystemExit("payload SHA-256 mismatch")
          print(f"payload OK: {size} bytes {digest.hexdigest()}")
          PY
          mkdir -p "$RUNNER_TEMP/publication-payload"
          tar -xzf "$RUNNER_TEMP/barraza-public-release.tar.gz" -C "$RUNNER_TEMP/publication-payload"
          cd "$RUNNER_TEMP/publication-payload/public_release_payload"
          sha256sum -c PAYLOAD_SHA256SUMS.txt

      - name: Validate the approved PDF, EPUB, cover, bibliography, and gate
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v pdfinfo >/dev/null || ! command -v pdftotext >/dev/null || ! command -v pdffonts >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y poppler-utils
          fi
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          import subprocess
          import zipfile
          from pathlib import Path
          from xml.etree import ElementTree as ET

          payload = Path(os.environ["RUNNER_TEMP"]) / "publication-payload/public_release_payload"

          locked_json = {
              "BIBLIOGRAPHY.json": os.environ["BIBLIOGRAPHY_SHA256"],
              "publication_gate.json": os.environ["GATE_SHA256"],
              "publication_report.json": os.environ["REPORT_SHA256"],
          }
          for filename, expected in locked_json.items():
              actual = hashlib.sha256((payload / filename).read_bytes()).hexdigest()
              if actual != expected:
                  raise SystemExit(f"{filename}: checksum mismatch")
          applicator = payload / "apply_public_release.py"
          if hashlib.sha256(applicator.read_bytes()).hexdigest() != os.environ["APPLY_SHA256"]:
              raise SystemExit("source applicator checksum mismatch")

          report = json.loads((payload / "publication_report.json").read_text(encoding="utf-8"))
          expected_report = {
              "slug": os.environ["SLUG"],
              "source_site_commit": os.environ["SOURCE_SITE_COMMIT"],
              "archive_commit": os.environ["ARCHIVE_COMMIT"],
              "canonical_master": f'publications/{os.environ["SLUG"]}/master.docx',
              "license": "CC BY-NC-SA 4.0",
          }
          for key, value in expected_report.items():
              if report.get(key) != value:
                  raise SystemExit(f"publication report mismatch: {key}")
          if report.get("search") != {
              "source_mode": "approved-epub-mirror",
              "chunks": 1788,
              "pdf_pages": 210,
              "verified_mapping_percent": 100.0,
              "distinct_source_location_labels": 149,
          }:
              raise SystemExit("search extraction report mismatch")

          gate = json.loads((payload / "publication_gate.json").read_text(encoding="utf-8"))
          expected_gate = {
              "verdict": "GO",
              "approval": "user_approved_after_pdf_preview",
              "approved_pdf_sha256": os.environ["PDF_SHA256"],
              "pdf_pages": 210,
              "source_markers": 149,
              "front_markers": 9,
              "original_print_markers": 133,
              "appendix_markers": 6,
              "back_cover_markers": 1,
              "original_notes": 131,
              "tables": 9,
              "noncover_images": 19,
              "rendered_pages_checked": 210,
              "a11y_high": 0,
              "a11y_medium": 0,
              "a11y_low": 0,
              "proof_labels_count": 0,
          }
          for key, value in expected_gate.items():
              if gate.get(key) != value:
                  raise SystemExit(f"publication gate mismatch: {key}")
          if not all(gate.get(key) for key in (
              "independent_review",
              "complete_translation",
              "paragraph_boundaries_collated",
              "full_page_render_verified",
              "fonts_embedded",
              "unicode_maps_present",
          )):
              raise SystemExit("publication gate completion flag is missing")

          bibliography = json.loads((payload / "BIBLIOGRAPHY.json").read_text(encoding="utf-8"))
          publication = bibliography["publication"]
          working = bibliography["working_master"]
          scope = bibliography["translation_scope"]
          if publication.get("slug") != os.environ["SLUG"]:
              raise SystemExit("bibliography slug mismatch")
          if publication.get("rights", "").count("CC BY-NC-SA 4.0") < 2:
              raise SystemExit("bibliography share-alike license statement is incomplete")
          required_master = {
              "master_size": 14466394,
              "master_sha256": "570ca88b0139fe71e39b9f108ce3df833b842bec7004c4f60b089943cd433751",
              "source_location_markers": 149,
              "noncover_embedded_images": 19,
              "tables": 9,
              "footnotes": 131,
              "publicationStatus": "approved_for_publication",
          }
          for key, value in required_master.items():
              if working.get(key) != value:
                  raise SystemExit(f"working-master report mismatch: {key}")
          if not all(scope.get(key) for key in (
              "complete_translation",
              "original_physical_order_preserved",
              "paragraph_boundaries_collated",
              "independent_review",
              "full_page_render_verified",
          )):
              raise SystemExit("translation-scope completion flag is missing")

          asset_root = payload / "public" / os.environ["SLUG"]
          expected_assets = {
              os.environ["PDF_FILENAME"]: (int(os.environ["PDF_SIZE"]), os.environ["PDF_SHA256"]),
              os.environ["EPUB_FILENAME"]: (int(os.environ["EPUB_SIZE"]), os.environ["EPUB_SHA256"]),
              "cover.jpg": (int(os.environ["COVER_SIZE"]), os.environ["COVER_SHA256"]),
          }
          paths = {}
          for filename, (size, expected_digest) in expected_assets.items():
              path = asset_root / filename
              data = path.read_bytes()
              digest = hashlib.sha256(data).hexdigest()
              if len(data) != size or digest != expected_digest:
                  raise SystemExit(f"{filename}: exact-byte validation failed")
              paths[filename] = path

          pdf = paths[os.environ["PDF_FILENAME"]]
          info = subprocess.check_output(["pdfinfo", str(pdf)], text=True)
          if not re.search(r"^Pages:\s+210$", info, flags=re.MULTILINE):
              raise SystemExit("PDF page count mismatch")
          if "612 x 792 pts (letter)" not in info:
              raise SystemExit("PDF page size mismatch")
          if not re.search(r"^Tagged:\s+yes$", info, flags=re.MULTILINE):
              raise SystemExit("PDF is not tagged")

          layout_text = subprocess.check_output(["pdftotext", "-layout", str(pdf), "-"], text=True)
          lines = [re.sub(r"\s+", " ", line).strip() for line in layout_text.splitlines()]
          def marker_numbers(pattern):
              return [int(match.group(1)) for line in lines if (match := re.fullmatch(pattern, line))]
          front = marker_numbers(r"〔前付・底本 PDF p\. (\d+)〕")
          original = marker_numbers(r"〔原刊 p\. (\d+)〕")
          appendix = marker_numbers(r"〔付録・底本 PDF p\. (\d+)〕")
          back = marker_numbers(r"〔裏表紙・底本 PDF p\. (\d+)〕")
          if front != list(range(1, 10)):
              raise SystemExit(f"PDF front marker mismatch: {front}")
          if original != [15, *range(17, 149)]:
              raise SystemExit("PDF original-print marker sequence mismatch")
          if appendix != list(range(143, 149)):
              raise SystemExit(f"PDF appendix marker mismatch: {appendix}")
          if back != [149]:
              raise SystemExit(f"PDF back-cover marker mismatch: {back}")

          pdf_text = subprocess.check_output(["pdftotext", str(pdf), "-"], text=True)
          compact_pdf = re.sub(r"\s+", "", pdf_text)
          required_pdf_text = [
              "アナスタシオ・アキノの壮挙",
              "本訳について",
              "第IV部",
              "クンブレ・デル・カバジト",
              "用語集",
              "参考文献",
              "CCBYNC-SA4.0",
          ]
          if any(value not in compact_pdf for value in required_pdf_text):
              raise SystemExit("PDF required wording is missing")
          first_page = subprocess.check_output(
              ["pdftotext", "-f", "1", "-l", "1", str(pdf), "-"],
              text=True,
          )
          if "日本語版・校訂·2026" not in re.sub(r"\s+", "", first_page):
              raise SystemExit("approved cover edition line is missing")
          if any(value in pdf_text for value in ["校正用", "確認用", "公開版ではない"]):
              raise SystemExit("PDF contains proof-only wording")
          blank_pages = []
          for page_number in range(1, 211):
              page_text = subprocess.check_output(
                  ["pdftotext", "-f", str(page_number), "-l", str(page_number), str(pdf), "-"],
                  text=True,
              )
              if not re.sub(r"\s+", "", page_text):
                  blank_pages.append(page_number)
          if blank_pages:
              raise SystemExit(f"blank translation PDF pages: {blank_pages}")
          fonts = subprocess.check_output(["pdffonts", str(pdf)], text=True)
          font_rows = [line.split() for line in fonts.splitlines()[2:] if line.strip()]
          if not font_rows or any(len(row) < 6 or row[3] != "yes" or row[5] != "yes" for row in font_rows):
              raise SystemExit("PDF fonts are not all embedded with Unicode maps")
          if not all("Noto" in row[0] for row in font_rows):
              raise SystemExit("PDF contains a non-Noto embedded font")

          epub = paths[os.environ["EPUB_FILENAME"]]
          with zipfile.ZipFile(epub) as archive:
              if archive.testzip() is not None:
                  raise SystemExit("corrupt EPUB")
              infos = archive.infolist()
              if not infos or infos[0].filename != "mimetype" or infos[0].compress_type != zipfile.ZIP_STORED:
                  raise SystemExit("EPUB mimetype entry is invalid")
              if archive.read("mimetype") != b"application/epub+zip":
                  raise SystemExit("EPUB mimetype is invalid")
              container = ET.fromstring(archive.read("META-INF/container.xml"))
              rootfile = next(node for node in container.iter() if node.tag.endswith("rootfile"))
              package = ET.fromstring(archive.read(rootfile.attrib["full-path"]))
              if not package.attrib.get("version", "").startswith("3"):
                  raise SystemExit("EPUB package is not version 3")
              item_nodes = [node for node in package.iter() if node.tag.endswith("item")]
              if not any("cover-image" in node.attrib.get("properties", "").split() for node in item_nodes):
                  raise SystemExit("EPUB cover-image property is missing")
              if not any("nav" in node.attrib.get("properties", "").split() for node in item_nodes):
                  raise SystemExit("EPUB navigation document is missing")
              texts = []
              source_classes = 0
              source_labels = []
              images = []
              for name in archive.namelist():
                  if not name.endswith((".xhtml", ".html")):
                      continue
                  document = ET.fromstring(archive.read(name))
                  texts.append(" ".join("".join(document.itertext()).split()))
                  for node in document.iter():
                      if "source-page" in node.attrib.get("class", "").split():
                          source_classes += 1
                          source_labels.append("".join(node.itertext()))
                      if node.tag.endswith("img"):
                          images.append(node)
              full_text = "\n".join(texts)
              compact_epub = re.sub(r"\s+", "", full_text)
              compact_source_labels = "\n".join(
                  re.sub(r"\s+", "", label) for label in source_labels
              )
              def epub_markers(pattern):
                  return [int(value) for value in re.findall(pattern, compact_source_labels)]
              if epub_markers(r"〔前付・底本PDFp\.(\d+)〕") != list(range(1, 10)):
                  raise SystemExit("EPUB front marker sequence mismatch")
              if epub_markers(r"〔原刊p\.(\d+)〕") != [15, *range(17, 149)]:
                  raise SystemExit("EPUB original-print marker sequence mismatch")
              if epub_markers(r"〔付録・底本PDFp\.(\d+)〕") != list(range(143, 149)):
                  raise SystemExit("EPUB appendix marker sequence mismatch")
              if epub_markers(r"〔裏表紙・底本PDFp\.(\d+)〕") != [149]:
                  raise SystemExit("EPUB back-cover marker mismatch")
              if source_classes != 149:
                  raise SystemExit(f"EPUB source-location class mismatch: {source_classes}")
              if len(images) != 19:
                  raise SystemExit(f"EPUB image count mismatch: {len(images)}")
              if any(not image.attrib.get("alt", "").strip() for image in images):
                  raise SystemExit("EPUB image without alternative text")
              if len(re.findall(r"[\u3040-\u30ff\u3400-\u9fff]", full_text)) <= 120_000:
                  raise SystemExit("EPUB Japanese text volume is unexpectedly low")
              if any(value not in compact_epub for value in ["本訳について", "第IV部", "用語集", "参考文献"]):
                  raise SystemExit("EPUB required wording is missing")
              if any(value in full_text for value in ["校正用", "確認用", "公開版ではない"]):
                  raise SystemExit("EPUB contains proof-only wording")
              css = "\n".join(
                  archive.read(name).decode("utf-8")
                  for name in archive.namelist()
                  if name.endswith(".css")
              )
              if "text-align: left" not in css or "text-align: justify" in css:
                  raise SystemExit("EPUB alignment policy mismatch")
              indent_values = re.findall(r"text-indent\s*:\s*([^;}]+)", css)
              if any(not re.fullmatch(r"0(?:[A-Za-z%]+)?", value.strip()) for value in indent_values):
                  raise SystemExit("EPUB paragraph indentation policy mismatch")
          print("Approved PDF, EPUB, cover, bibliography, and publication gate are valid")
          PY

      - name: Apply the checksum-locked source changes
        shell: bash
        run: |
          set -euo pipefail
          payload="$RUNNER_TEMP/publication-payload/public_release_payload"
          python3 "$payload/apply_public_release.py" "$GITHUB_WORKSPACE" "$payload"
          node scripts/verify-master-archive.mjs
          node --check src/publications.mjs
          node --check scripts/search/verify-queries.mjs
          python3 -m py_compile scripts/search/extract-corpus.py scripts/validate-epubs.py
          git diff --check

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install build dependencies
        run: npm ci

      - name: Build and test the complete source change
        run: |
          npm run build
          npm test

      - name: Restore PDF and EPUB search inputs
        uses: actions/cache/restore@v4
        with:
          path: |
            .cache/fulltext-assets
            .cache/fulltext-ocr
          key: publish-barraza-fresh-assets-${{ hashFiles('assets-manifest.json') }}
          restore-keys: |
            fulltext-assets-

      - name: Ensure full-text extraction tools are available
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v pdftotext >/dev/null || ! command -v tesseract >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y poppler-utils tesseract-ocr
          fi

      - name: Seed and fetch checksum-verified full-text inputs
        shell: bash
        run: |
          set -euo pipefail
          payload="$RUNNER_TEMP/publication-payload/public_release_payload/public/$SLUG"
          destination=".cache/fulltext-assets/publications/$SLUG"
          mkdir -p "$destination"
          cp "$payload/$PDF_FILENAME" "$destination/$PDF_FILENAME"
          cp "$payload/$EPUB_FILENAME" "$destination/$EPUB_FILENAME"
          npm run fetch:search-assets

      - name: Build and verify the exact final full-text search index
        run: |
          npm run build:search
          npm run verify:search
          node - <<'JS'
          import { readFile } from "node:fs/promises";
          const meta = JSON.parse(await readFile("dist/search/search-meta.json", "utf8"));
          const map = JSON.parse(await readFile("dist/search/maps/barraza-anastasio-aquino-2001.json", "utf8"));
          if (meta.works !== 257 || meta.books !== 120 || meta.papers !== 137) {
            throw new Error("final search work counts are not expected");
          }
          const mappings = Object.values(map.blocks || {});
          const pages = new Set(mappings.map((entry) => entry[1]));
          if (
            map.slug !== "barraza-anastasio-aquino-2001" ||
            mappings.length !== 1788 ||
            pages.size !== 210 ||
            Math.min(...pages) !== 1 ||
            Math.max(...pages) !== 210
          ) {
            throw new Error("Barraza search page map is incomplete");
          }
          JS

      - name: Upload the checksum-locked release assets
        shell: bash
        run: |
          set -euo pipefail
          checksum_dir="$RUNNER_TEMP/release-checksums"
          asset_dir="$RUNNER_TEMP/publication-payload/public_release_payload/public/$SLUG"
          mkdir -p "$checksum_dir"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS.txt --dir "$checksum_dir"
          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path(os.environ["RUNNER_TEMP"]) / "release-checksums/SHA256SUMS.txt"
          additions = {
              os.environ["EPUB_FILENAME"]: os.environ["EPUB_SHA256"],
              os.environ["PDF_FILENAME"]: os.environ["PDF_SHA256"],
          }
          kept = []
          for line in path.read_text(encoding="utf-8").splitlines():
              fields = line.split()
              if fields and fields[-1] in additions:
                  continue
              kept.append(line)
          kept.extend(f"{digest}  {filename}" for filename, digest in sorted(additions.items()))
          path.write_text("\n".join(kept) + "\n", encoding="utf-8")
          PY
          gh release upload "$RELEASE_TAG" "$asset_dir/$PDF_FILENAME" "$asset_dir/$EPUB_FILENAME" "$checksum_dir/SHA256SUMS.txt" --repo "$GITHUB_REPOSITORY" --clobber

      - name: Download the public release assets back and verify
        shell: bash
        run: |
          set -euo pipefail
          verify_dir="$RUNNER_TEMP/release-verify"
          mkdir -p "$verify_dir"
          for filename in "$PDF_FILENAME" "$EPUB_FILENAME" SHA256SUMS.txt
          do
            gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$filename" --dir "$verify_dir"
          done
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "release-verify"
          expected = {
              os.environ["PDF_FILENAME"]: (int(os.environ["PDF_SIZE"]), os.environ["PDF_SHA256"]),
              os.environ["EPUB_FILENAME"]: (int(os.environ["EPUB_SIZE"]), os.environ["EPUB_SHA256"]),
          }
          checksums = set((root / "SHA256SUMS.txt").read_text(encoding="utf-8").splitlines())
          for filename, (size, digest) in expected.items():
              data = (root / filename).read_bytes()
              if len(data) != size or hashlib.sha256(data).hexdigest() != digest:
                  raise SystemExit(f"downloaded release asset mismatch: {filename}")
              if f"{digest}  {filename}" not in checksums:
                  raise SystemExit(f"SHA256SUMS entry mismatch: {filename}")
              print(f"release asset OK: {filename}")
          PY

      - name: Save the verified final full-text search index
        uses: actions/cache/save@v4
        with:
          path: dist/search
          key: fulltext-index-barraza-aquino-v1-${{ hashFiles('assets-manifest.json', 'master-archive.json', 'src/publications.mjs', 'scripts/search/build-index.mjs', 'scripts/search/create-manifest.mjs', 'scripts/search/extract-corpus.py', 'package-lock.json') }}

      - name: Commit the verified publication to a ready branch
        shell: bash
        run: |
          set -euo pipefail
          workflow=".github/workflows/publish-barraza-20260823.yml"
          rm "$workflow" "$TRIGGER_FILE"
          python3 - <<'PY'
          import subprocess

          expected = {
              ".github/workflows/pages.yml",
              ".github/workflows/publish-barraza-20260823.yml",
              ".github/barraza-publication-trigger-20260823",
              "REVISION_LOG.md",
              "assets-manifest.json",
              "master-archive.json",
              "static/publications/barraza-anastasio-aquino-2001/cover.jpg",
              "scripts/search/extract-corpus.py",
              "scripts/search/verify-index.mjs",
              "scripts/search/verify-queries.mjs",
              "scripts/validate-epubs.py",
              "src/publications.mjs",
              "tests/archive.test.mjs",
              "tests/test_search_extractor.py",
          }
          actual = set(
              subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines()
          )
          untracked = subprocess.check_output(
              ["git", "ls-files", "--others", "--exclude-standard"],
              text=True,
          ).splitlines()
          actual.update(path for path in untracked if not path.startswith("staging/"))
          if actual != expected:
              raise SystemExit(
                  "unexpected source diff: "
                  + f"missing={sorted(expected - actual)} extra={sorted(actual - expected)}"
              )
          PY
          if test "$(git rev-parse HEAD^)" != "$BASE_MAIN_COMMIT"; then
            echo "publication trigger parent is not the recorded main commit" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$READY_BRANCH"
          git add "$workflow" "$TRIGGER_FILE" .github/workflows/pages.yml REVISION_LOG.md assets-manifest.json master-archive.json "static/publications/$SLUG/cover.jpg" scripts/search/extract-corpus.py scripts/search/verify-index.mjs scripts/search/verify-queries.mjs scripts/validate-epubs.py src/publications.mjs tests/archive.test.mjs tests/test_search_extractor.py
          git commit -m "Publish Barraza Aquino complete Japanese translation" -m "Publish the approved 210-page PDF and verified EPUB with UTEC CC BY-NC-SA 4.0 attribution, private-master binding, 149 source-location labels, full render and accessibility gates, and exact full-text page mapping."
          git push origin "HEAD:refs/heads/$READY_BRANCH"

      - name: Remove the temporary payload branch
        shell: bash
        run: git push origin --delete "$STAGING_BRANCH"
