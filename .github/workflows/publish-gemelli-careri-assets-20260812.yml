name: Publish Gemelli Careri release assets

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-gemelli-careri-assets-20260812.yml

permissions:
  contents: write

concurrency:
  group: publications-current-release
  cancel-in-progress: false

