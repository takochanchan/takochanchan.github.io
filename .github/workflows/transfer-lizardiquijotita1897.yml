name: Transfer approved Lizardi 1897 publication files
on:
  push:
    branches: [agent/lizardi-quijotita1897-publish-20261121]
    paths: [.lizardiquijotita1897-public-request.json]

permissions:
  contents: read
concurrency:
  group: publication-release-transfer
  cancel-in-progress: false

jobs:
  test-and-transfer:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: transfer
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 5e6be02bca5239fc6c52cc496365bd25cfb55e35
          path: candidate
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate candidate ledgers and reconstruct approved bytes
        working-directory: transfer
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .lizardiquijotita1897-transfer.py stage "$RUNNER_TEMP/lizardiquijotita1897-assets" ../candidate
      - name: Publication build, regression tests and EPUB format check
        working-directory: candidate
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npm test
          python3 ../transfer/.lizardiquijotita1897-readback.py --expect ../transfer/.lizardiquijotita1897-expectations.json --html dist/publications/lizardi-la-quijotita-y-su-prima-1897/index.html
          target=dist/publications/lizardi-la-quijotita-y-su-prima-1897
          mkdir -p "$target"
          cp "$RUNNER_TEMP/lizardiquijotita1897-assets/lizardi-la-quijotita-y-su-prima-1897.epub" "$target/"
          python3 scripts/validate-epubs.py dist --slug lizardi-la-quijotita-y-su-prima-1897
      - name: Upload and re-download approved PDF, EPUB and checksum list
        working-directory: transfer
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .lizardiquijotita1897-transfer.py transfer "$RUNNER_TEMP/lizardiquijotita1897-assets" ../candidate
      - uses: actions/upload-artifact@v4
        with:
          name: lizardiquijotita1897-public-verification
          path: transfer/lizardiquijotita1897-public-verification.json
          if-no-files-found: error

