name: Publish Byam release assets

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-byam-release.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reassemble release assets
