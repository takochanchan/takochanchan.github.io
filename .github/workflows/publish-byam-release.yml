        run: |
          set -euo pipefail
          pdf=Byam_A_Sketch_of_the_State_of_Chiapas_Mexico_1897_Japanese_Complete_Translation.pdf
          epub=Byam_A_Sketch_of_the_State_of_Chiapas_Mexico_1897_Japanese_Complete_Translation.epub
          : > "$pdf"
          : > "$epub"

          for chunk in $PDF_CHUNKS; do
            gh api "repos/$GITHUB_REPOSITORY/git/blobs/$chunk" --jq .content | tr -d '\n' | base64 --decode >> "$pdf"
          done
          for chunk in $EPUB_CHUNKS; do
            gh api "repos/$GITHUB_REPOSITORY/git/blobs/$chunk" --jq .content | tr -d '\n' | base64 --decode >> "$epub"
          done

          echo "ee8011f85efd60eaaf7ab0436c5dbf0912a97a1be0e0edf2be732c53f2ab537c  $pdf" | sha256sum -c -
          echo "2d2a801840c66ee0683d0fda9807560ebc7c98b1d996a31ca8ebc290e07db678  $epub" | sha256sum -c -
          test "$(stat -c %s "$pdf")" = 24551598
          test "$(stat -c %s "$epub")" = 35544632

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload publications-current \
            Byam_A_Sketch_of_the_State_of_Chiapas_Mexico_1897_Japanese_Complete_Translation.pdf \
            Byam_A_Sketch_of_the_State_of_Chiapas_Mexico_1897_Japanese_Complete_Translation.epub \
            --clobber

      - name: Remove one-time workflow
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/publish-byam-release.yml
          git commit -m "Remove one-time Byam release workflow"

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 3))
          done
          exit 1
