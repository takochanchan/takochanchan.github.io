name: Verify How Eads search before site publication
on:
  push:
    branches: [agent/how-eads-publish-20260919]
    paths: ['.github/workflows/how-eads-verify.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wait for deployed shard and verify current catalogue
        run: |
          for attempt in $(seq 1 40); do
            if npm run verify:remote-search; then exit 0; fi
            sleep 15
          done
          exit 1
