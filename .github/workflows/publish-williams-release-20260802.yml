name: Publish Williams release assets once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-williams-release-20260802.yml

permissions:
  contents: write

concurrency:
  group: publications-current-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PDF_NAME: Mary_Wilhelmine_Williams_Anglo_American_Isthmian_Diplomacy_1916_Japanese_Complete_Translation.pdf
      PDF_SIZE: "5701472"
      PDF_SHA256: 7ff1a90df70a6e9ff71da1309395d091699f130946708833bcc3a5f36f5ef834
      PDF_BLOBS: "f7ee378b4bd9741afb66717c27c9f6928eded6e3 0fdcd9980ca67c1952e65150257181454cd56f67 a41b8ee9fbd9d63df44b9af4645721c75b188885 f0f7c39b5203054a3735377f6a79331c5adbdc1a d94ca562322db5436bbfa15e36a0f3d31eadba81 6d6abd02d9956aba377cf69d2ac4a6a42d9d0ed8 38fe392220c0109714690e5682b9ab73de47d5d7 b12ddd9dd9498ae77796ee9d5e1e384908d52b6c f90723e63b996cb4dc541de4eaa133d4a9228a7a 218af9914dc48ca56fe6115a32e293c55a36704a d670c7c86c0ea20c23dc70eafbea197f40756516 2396691727c77d3acbb9080498621be2c64b4cc3 bbeb95b46b2c5257920335e9fef045d8c5a9d432 dcfaf78016807bd046a06562f97ba33593ffd272 fd1a82b40ca99a79dffc1813d3080cf3a1abf17b ecabba7e3dfbb9559a5e4ced5e0f0e1cb669d323 654990a9cbccc18ff056d23a6be49fe406203b5a 8b8dd968136df43e2dfa62921f338abc4ff01985 4f1b755351b35888dcad65622d38243cf5d97cc6 aa9c7d08e81f4f2b584372b431acdebb9cfcac16 2e0287da21019e92eeb3f917924ba3ccdad214da 9006207d84f609a4467a3fd5c2d1bc5e5f48b254"
      EPUB_NAME: Mary_Wilhelmine_Williams_Anglo_American_Isthmian_Diplomacy_1916_Japanese_Complete_Translation.epub
      EPUB_SIZE: "1663675"
      EPUB_SHA256: 4b223eb787671f6fd1231a2d9dd292865451befbd6cd08dbc19998a8bd4c6011
      EPUB_BLOBS: "52e37ab71cd60543fa7bb88c1db3c195d9d9432f 4a4d2536dd17c920a67a72b6468821ed81665780 675ec771c52942bde49557ba32215a48d9b5d12b 2fb462a57342e514c6c9d29c8fa5f1803b82e954 11bd102556bca23396837897ed7e017c230dd468 d7bcdb3c22a57647690e0dd9087c0988739355ed f6e4705da39f2b030233ad7c410830f0864b7bf7"
    steps:
      - name: Install PDF inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Reassemble and verify approved assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/williams-assets
          for kind in PDF EPUB; do
            name_var="${kind}_NAME"
            size_var="${kind}_SIZE"
            digest_var="${kind}_SHA256"
            blobs_var="${kind}_BLOBS"
            name="${!name_var}"
            target="/tmp/williams-assets/$name"
            : > "$target"
            for blob in ${!blobs_var}; do
              gh api "repos/$GITHUB_REPOSITORY/git/blobs/$blob" --jq .content |
                tr -d '\n' | base64 --decode >> "$target"
            done
            echo "${!digest_var}  $target" | sha256sum -c -
            test "$(stat -c %s "$target")" = "${!size_var}"
          done
          test "$(pdfinfo "/tmp/williams-assets/$PDF_NAME" | awk '/^Pages:/ {print $2}')" = 318
          pdftotext -layout "/tmp/williams-assets/$PDF_NAME" /tmp/williams.txt
          grep -F "中米地峡をめぐる英米外交" /tmp/williams.txt
          grep -F "クレイトン＝ブルワー条約" /tmp/williams.txt
          grep -F "〔原刊 p. 356〕" /tmp/williams.txt
          python3 - <<'PY'
          import os, zipfile
          path='/tmp/williams-assets/' + os.environ['EPUB_NAME']
          with zipfile.ZipFile(path) as z:
              assert z.testzip() is None
              names=z.namelist()
              assert 'mimetype' in names
              text=''.join(
                  z.read(n).decode('utf-8')
                  for n in names
                  if n.endswith(('.xhtml','.html','.opf','.ncx'))
              ).replace('\xa0', ' ')
          assert '中米地峡をめぐる英米外交' in text
          assert 'クレイトン＝ブルワー条約' in text
          assert '〔原刊 p. 356〕' in text
          PY

      - name: Update shared checksums and upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/current /tmp/verified
          gh release download publications-current --pattern SHA256SUMS.txt --dir /tmp/current --repo "$GITHUB_REPOSITORY"
          grep -v -F "  $PDF_NAME" /tmp/current/SHA256SUMS.txt |
            grep -v -F "  $EPUB_NAME" > /tmp/SHA256SUMS.txt
          printf '%s  %s\n' "$PDF_SHA256" "$PDF_NAME" >> /tmp/SHA256SUMS.txt
          printf '%s  %s\n' "$EPUB_SHA256" "$EPUB_NAME" >> /tmp/SHA256SUMS.txt
          gh release upload publications-current "/tmp/williams-assets/$PDF_NAME" "/tmp/williams-assets/$EPUB_NAME" /tmp/SHA256SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"
          for kind in PDF EPUB; do
            name_var="${kind}_NAME"
            digest_var="${kind}_SHA256"
            size_var="${kind}_SIZE"
            name="${!name_var}"
            gh release download publications-current --pattern "$name" --dir /tmp/verified --repo "$GITHUB_REPOSITORY"
            echo "${!digest_var}  /tmp/verified/$name" | sha256sum -c -
            test "$(stat -c %s "/tmp/verified/$name")" = "${!size_var}"
          done
          gh release download publications-current --pattern SHA256SUMS.txt --dir /tmp/verified --repo "$GITHUB_REPOSITORY"
          grep -F "$PDF_SHA256  $PDF_NAME" /tmp/verified/SHA256SUMS.txt
          grep -F "$EPUB_SHA256  $EPUB_NAME" /tmp/verified/SHA256SUMS.txt

      - name: Remove one-time workflow
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          path=.github/workflows/publish-williams-release-20260802.yml
          sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/$path?ref=main" --jq .sha)"
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/contents/$path" -f message="Remove completed Williams release workflow" -f sha="$sha" -f branch=main
