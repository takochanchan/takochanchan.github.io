name: Publish Cortes y Larraz release assets

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-cortes-y-larraz-assets-20260810.yml

permissions:
  contents: write

concurrency:
  group: publications-current-release
  cancel-in-progress: false

