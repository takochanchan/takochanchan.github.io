name: Verify live Cermoise 1886 publication
on:
  push:
    branches: [main]
    paths: [src/cermoise-publication.mjs, .github/workflows/cermoise-verify-live.yml]
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Wait for this catalogue deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,os,subprocess,time
          for attempt in range(90):
              result=json.loads(subprocess.check_output(['gh','api','repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs?head_sha='+os.environ['GITHUB_SHA']]))
              runs=[r for r in result['workflow_runs'] if r['name']=='Deploy archive to GitHub Pages']
              if runs and runs[0]['status']=='completed':
                  assert runs[0]['conclusion']=='success', runs[0]['conclusion']
                  print('Pages succeeded',runs[0]['id'])
                  break
              time.sleep(10)
          else: raise SystemExit('Pages deployment timed out')
          PY
      - name: Install PDF inspection dependency
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Verify live bibliography and exact approved assets
        run: |
          python3 - <<'PY'
          import json,hashlib,urllib.request,tempfile,pathlib,zipfile,subprocess,re
          from html import unescape
          slug='cermoise-deux-ans-panama-1886'
          url='https://takochanchan.github.io/publications/'+slug+'/'
          with urllib.request.urlopen(url,timeout=60) as response:
              assert response.status==200
              html=response.read().decode()
          for text in ['パナマでの二年間','H・セルモワーズ','Cermoise_1886_Japanese_Complete_Translation.pdf','Cermoise_1886_Japanese_Complete_Translation.epub']:
              assert text in html, text
          overview=json.load(open('src/publication-overviews.json'))['records'][slug]
          plain=re.sub(r'\s+','',unescape(re.sub(r'<[^>]*>','',html)))
          for paragraph in overview.splitlines():
              assert re.sub(r'\s+','',paragraph) in plain, 'detailed overview'
          assert '<details' in html
          sums_url='https://github.com/takochanchan/takochanchan.github.io/releases/download/publications-current/SHA256SUMS.txt'
          sums=urllib.request.urlopen(sums_url,timeout=120).read().decode()
          assets=[a for a in json.load(open('assets-manifest.json'))['assets'] if a['path'].startswith('publications/'+slug+'/')]
          assert len(assets)==3
          root=pathlib.Path(tempfile.mkdtemp())
          for a in assets:
              p=root/pathlib.PurePosixPath(a['path']).name
              with urllib.request.urlopen(a['url'],timeout=120) as response,p.open('wb') as f:
                  assert response.status==200
                  while chunk:=response.read(1024*1024): f.write(chunk)
              assert p.stat().st_size==a['size']
              assert hashlib.sha256(p.read_bytes()).hexdigest()==a['sha256']
              if p.suffix in ['.pdf','.epub']:
                  assert a['sha256']+'  '+p.name in sums, p.name+' release checksum'
              if p.suffix=='.epub':
                  with zipfile.ZipFile(p) as z:
                      assert z.testzip() is None
                      assert z.read('mimetype')==b'application/epub+zip'
              if p.suffix=='.pdf':
                  info=subprocess.check_output(['pdfinfo',str(p)],text=True)
                  assert any(line.split()==['Pages:','232'] for line in info.splitlines())
              print('VERIFIED',p.name,a['size'],a['sha256'])
          print('Live Cermoise bibliography, detailed overview, 232-page PDF, EPUB, and cover verified.')
          PY
