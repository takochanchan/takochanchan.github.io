name: Transfer checksum-pinned Losa 1658 assets

on:
  push:
    branches: ["agent/losa-vida-gregorio-lopez-1658-transfer-20261107"]
    paths: [".publication-upload-requests/losa-vida-gregorio-lopez-1658.json"]
permissions:
  contents: write
concurrency:
  group: publication-release-transfer
  cancel-in-progress: false
jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install build dependencies
        run: npm ci --no-audit --no-fund
      - name: Build and test the publication catalogue
        run: npm run build && npm test
      - name: Reconstruct, upload, and verify publication bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .publication-transfer/transfer-losa-vida-gregorio-lopez-1658.py
      - uses: actions/upload-artifact@v4
        with:
          name: losa-release-byte-verification
          path: losa-release-verification.json
